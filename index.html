                        <div className="text-4xl">📨</div>
                        <p className="text-sm font-black text-slate-800">Waiting for {oppName}</p>
                        <p className="text-xs text-slate-500 max-w-sm mx-auto">They will study the chunk, pick the words you will face, and take your exam. Then it's your turn.</p>
                    </div>
                );
            } else if (phase === 'intro') {
                body = (
                    <div className="text-center py-6 space-y-3">
                        <div className="text-4xl">{needsPick ? '📖' : '📝'}</div>
                        <p className="text-sm font-black text-slate-800">{needsPick ? `${c.fromName} challenged you` : 'Your exam is ready'}</p>
                        <p className="text-xs text-slate-500 max-w-sm mx-auto">{mpFmtClock((c.studySec || 0) * 1000)} to study{needsPick ? `, then pick ${c.wordCount} words for ${c.fromName}` : ''}, then {examWords.length} questions in {mpFmtClock((c.examSec || 60) * 1000)}.</p>
                        <button onClick={() => setPhase((c.studySec || 0) > 0 ? 'study' : (needsPick ? 'pick' : 'exam'))} className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700">Start</button>
                    </div>
                );
            } else if (phase === 'study') {
                body = <ChStudy chunk={chunk} studySec={c.studySec || 60} onDone={() => setPhase(needsPick ? 'pick' : 'exam')} />;
            } else if (phase === 'pick') {
                body = (
                    <div className="space-y-3">
                        <div className="flex justify-between text-xs font-black text-slate-700"><span>Pick the words {c.fromName} will be tested on</span><span>{picks.length} / {c.wordCount}</span></div>
                        <MpChunkPicker chunk={chunk} wordCount={c.wordCount} picks={picks} setPicks={setPicks} locked={false} />
                        <button onClick={sendPicks} disabled={busy || picks.length !== c.wordCount} className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">{busy ? 'Sending…' : 'Send my words & start my exam →'}</button>
                    </div>
                );
            } else {
                body = questions.length ? <ChExam questions={questions} examSec={c.examSec || 120} onFinish={finish} /> : <p className="text-sm text-slate-500 text-center py-8">Couldn't build questions from these words.</p>;
            }
            return <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">{head}{body}</div>;
        }

        function MpChallenges({ uid, myName, myPhoto, books, allWords, activeBookId, chunkSize, usersMap, triggerToast, target, onClearTarget }) {
            const F = window.FB;
            const [ids, setIds] = useState([]);
            const [items, setItems] = useState({});
            const [screen, setScreen] = useState(target ? 'create' : 'list'); // list | create | run
            const [activeId, setActiveId] = useState(null);
            useEffect(() => { if (target) setScreen('create'); }, [target]);
            useEffect(() => {
                const u = F.dbOnValue(F.dbRef(F.rtdb, `userChallenges/${uid}`), (snap) => setIds(Object.keys(snap.val() || {})), (e) => console.error('challenge index', e));
                return () => u();
            }, [uid]);
            const idsKey = ids.slice().sort().join(',');
            useEffect(() => {
                const unsubs = ids.map(id => F.dbOnValue(F.dbRef(F.rtdb, `challenges/${id}`), (snap) => {
                    setItems(prev => { const n = { ...prev }; if (snap.exists()) n[id] = snap.val(); else delete n[id]; return n; });
                }, () => {}));
                return () => unsubs.forEach(u => u && u());
            }, [idsKey]);
            const remove = async (id, c) => {
                try {
                    await F.dbRemove(F.dbRef(F.rtdb, `userChallenges/${uid}/${id}`));
                    if (c) { const other = c.from === uid ? c.to : c.from; await F.dbRemove(F.dbRef(F.rtdb, `userChallenges/${other}/${id}`)).catch(() => {}); }
                    await F.dbRemove(F.dbRef(F.rtdb, `challenges/${id}`));
                } catch (e) { console.error(e); }
            };
            // tidy up finished duels after 3 days to keep the free database small
            useEffect(() => {
                Object.entries(items).forEach(([id, c]) => {
                    if (c && c.fromDone && c.toDone && Date.now() - (c.createdAt || 0) > 3 * 24 * 3600 * 1000) remove(id, c);
                });
            }, [items]);
            const list = Object.entries(items).map(([id, c]) => ({ id, c })).filter(x => x.c && (x.c.from === uid || x.c.to === uid)).sort((a, b) => (b.c.createdAt || 0) - (a.c.createdAt || 0));
            if (screen === 'create') return <ChallengeCreate uid={uid} myName={myName} myPhoto={myPhoto} books={books} allWords={allWords} activeBookId={activeBookId} chunkSize={chunkSize} usersMap={usersMap} target={target} triggerToast={triggerToast} onCancel={() => { onClearTarget(); setScreen('list'); }} onSent={() => { onClearTarget(); setScreen('list'); }} />;
            if (screen === 'run' && items[activeId]) return <ChallengeRun key={activeId} id={activeId} c={items[activeId]} uid={uid} triggerToast={triggerToast} onBack={() => setScreen('list')} />;
            const status = (c) => {
                const me = c.from === uid ? 'from' : 'to';
                const opp = me === 'from' ? c.toName : c.fromName;
                if (c[`${me}Done`] && c.fromDone && c.toDone) return { t: 'Finished — see result', tone: 'text-emerald-600', act: 'Result' };
                if (c[`${me}Done`]) return { t: `Waiting for ${opp} to finish`, tone: 'text-slate-400', act: 'View' };
                if (me === 'from' && !c.wordsForFrom) return { t: `Sent — waiting for ${opp} to study`, tone: 'text-slate-400', act: 'View' };
                if (me === 'to' && !c.wordsForFrom) return { t: 'Your turn: study, pick words, take the exam', tone: 'text-indigo-600', act: 'Start' };
                return { t: 'Your turn: study and take the exam', tone: 'text-indigo-600', act: 'Start' };
            };
            return (
                <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-3 shadow-sm">
                    <div className="flex items-center gap-2">
                        <h3 className="text-sm font-black text-slate-800 mr-auto">⚔️ Challenges <span className="text-slate-400 font-bold">· play any time, no need to be online together</span></h3>
                        <button onClick={() => setScreen('create')} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">+ New</button>
                    </div>
                    {list.length === 0 && <div className="py-8 text-center text-xs text-slate-400">No challenges yet. Press "+ New", or use ⚔️ next to someone in the Players tab.</div>}
                    <div className="divide-y divide-slate-100">
                        {list.map(({ id, c }) => {
                            const me = c.from === uid ? 'from' : 'to';
                            const st = status(c);
                            return (
                                <div key={id} className="flex items-center gap-3 py-2.5">
                                    <MpAvatar name={me === 'from' ? c.toName : c.fromName} photo={me === 'from' ? c.toPhoto : c.fromPhoto} />
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm font-extrabold text-slate-800 truncate">{me === 'from' ? `You → ${c.toName}` : `${c.fromName} → You`}</div>
                                        <div className={`text-[11px] font-semibold truncate ${st.tone}`}>{st.t} · {c.chunkLabel}</div>
                                    </div>
                                    <button onClick={() => { setActiveId(id); setScreen('run'); }} className="px-3 py-1.5 rounded-lg bg-indigo-100 text-indigo-700 text-xs font-bold hover:bg-indigo-200">{st.act}</button>
                                    <button onClick={() => remove(id, c)} title="Delete" className="px-2 py-1.5 text-slate-300 hover:text-rose-500 text-sm font-bold">🗑</button>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        function MultiplayerArena({ cloudUser, cloudAuthReady, onSignIn, nickname, books, allWords, activeBookId, triggerToast, chunkSize = 25 }) {
            const [fbReady, setFbReady] = useState(!!window.FB);
            const [conn, setConn] = useState(false);
            const [connWaited, setConnWaited] = useState(false);
            const offsetRef = useRef(0);
            const [roomCode, setRoomCode] = useState(null);
            const [room, setRoom] = useState(null);
            const [roomLoaded, setRoomLoaded] = useState(false);
            const [busy, setBusy] = useState(false);
            const [joinInput, setJoinInput] = useState('');
            const [mode, setMode] = useState('swap');
            const [style, setStyle] = useState('mixed');
            const [wordCount, setWordCount] = useState(10);
            const [maxPlayers, setMaxPlayers] = useState(10); // 2-20, chosen by the host
            const [timeLimit, setTimeLimit] = useState(120);
            const [myPicks, setMyPicks] = useState([]);
            // chunk / study settings for a new room
            const [bookId, setBookId] = useState(activeBookId);
            const [chunkIdx, setChunkIdx] = useState(-1);
            const [studySec, setStudySec] = useState(120);
            // public directory, leaderboard, invites
            const [view, setView] = useState('play');
            const [challengeTarget, setChallengeTarget] = useState(null); // opponent preselected via the ⚔️ button
            const [chatWith, setChatWith] = useState(null); // {id,name,photo} of the person I'm chatting with
            const [usersMap, setUsersMap] = useState({});
            const [invites, setInvites] = useState({});
            const [userSearch, setUserSearch] = useState('');

            const uid = cloudUser ? cloudUser.uid : null;
            const myName = ((nickname || '').trim() || (cloudUser && cloudUser.displayName) || 'Player').slice(0, 24);
            const myPhoto = (cloudUser && cloudUser.photoURL && cloudUser.photoURL.length <= 480) ? cloudUser.photoURL : '';
            const FB = window.FB;
            const rtdb = FB && FB.rtdb;
            const serverNow = () => Date.now() + offsetRef.current;
            const rr = (path) => FB.dbRef(rtdb, path);

            useEffect(() => {
                if (window.FB) { setFbReady(true); return; }
                const h = () => setFbReady(true);
                window.addEventListener('fb-ready', h, { once: true });
                return () => window.removeEventListener('fb-ready', h);
            }, []);

            // connection + clock offset
            useEffect(() => {
                if (!fbReady || !window.FB || !window.FB.rtdb || !cloudUser) return;
                const F = window.FB;
                const u1 = F.dbOnValue(F.dbRef(F.rtdb, '.info/connected'), (s) => setConn(!!s.val()));
                const u2 = F.dbOnValue(F.dbRef(F.rtdb, '.info/serverTimeOffset'), (s) => { offsetRef.current = s.val() || 0; });
                const t = setTimeout(() => setConnWaited(true), 7000);
                return () => { u1(); u2(); clearTimeout(t); };
            }, [fbReady, !!cloudUser]);

            // live room subscription
            useEffect(() => {
                if (!roomCode || !fbReady || !window.FB || !window.FB.rtdb) return;
                const F = window.FB;
                setRoomLoaded(false);
                const unsub = F.dbOnValue(F.dbRef(F.rtdb, `rooms/${roomCode}`), (snap) => {
                    setRoom(snap.val());
                    setRoomLoaded(true);
                }, (err) => {
                    console.error('Room listener failed:', err);
                    triggerToast('Could not read the room — check the Realtime Database rules.');
                });
                return () => unsub();
            }, [roomCode, fbReady]);

            // room closed by host
            useEffect(() => {
                if (roomCode && roomLoaded && room === null) {
                    triggerToast('The room was closed.');
                    leaveLocal();
                }
            }, [room, roomLoaded]);

            // keep presence correct (also after reconnects)
            useEffect(() => {
                if (!roomCode || !conn || !uid || !rtdb) return;
                const pr = rr(`rooms/${roomCode}/players/${uid}/online`);
                FB.dbOnDisconnect(pr).set(false).catch(() => {});
                FB.dbSet(pr, true).catch(() => {});
                // Cancel the "mark me offline" hook when I leave this room, so a
                // later disconnect can't leave a nameless ghost player behind.
                return () => { try { FB.dbOnDisconnect(pr).cancel().catch(() => {}); } catch (e) {} };
            }, [roomCode, conn, uid]);

            // new round -> reset my own player state (host pressed "Play again")
            useEffect(() => {
                if (!room || !room.meta || room.meta.status !== 'lobby' || !uid) return;
                const me = room.players && room.players[uid];
                if (me && me.done) {
                    FB.dbUpdate(rr(`rooms/${roomCode}/players/${uid}`), {
                        score: 0, answered: 0, done: false, finishedMs: null, ready: room.meta.mode === 'same',
                    }).catch(() => {});
                    if (room.meta.mode === 'swap' || room.meta.hostUid === uid) FB.dbRemove(rr(`rooms/${roomCode}/words/${uid}`)).catch(() => {});
                    setMyPicks([]);
                }
            }, [room && room.meta && room.meta.status, room && room.meta && room.meta.round]);

            // resume after a page refresh
            useEffect(() => {
                if (!conn || !uid || roomCode) return;
                let saved = null;
                try { saved = sessionStorage.getItem('wordsmart_mp_room'); } catch (e) {}
                if (saved) joinRoom(saved, true);
            }, [conn, uid]);

            const createChunks = useMemo(() => mpChunkList(allWords[bookId] || [], chunkSize), [allWords, bookId, chunkSize]);
            const maxWords = (chunkIdx >= 0 && createChunks[chunkIdx]) ? Math.max(3, Math.min(50, createChunks[chunkIdx].words.length)) : 50;
            useEffect(() => { if (wordCount > maxWords) setWordCount(maxWords); }, [maxWords]);
            useEffect(() => { setChunkIdx(-1); }, [bookId]);
            useEffect(() => { if (chunkIdx >= createChunks.length) setChunkIdx(-1); }, [createChunks.length]);

            // live list of everybody who joined the public directory
            useEffect(() => {
                if (!fbReady || !rtdb || !uid || !conn) return;
                const u = FB.dbOnValue(rr('users'), (snap) => setUsersMap(snap.val() || {}), (err) => console.error('users listener', err));
                return () => u();
            }, [fbReady, uid, conn]);
            // invites sent to me
            useEffect(() => {
                if (!fbReady || !rtdb || !uid || !conn) return;
                const u = FB.dbOnValue(rr(`invites/${uid}`), (snap) => setInvites(snap.val() || {}), (err) => console.error('invites listener', err));
                return () => u();
            }, [fbReady, uid, conn]);
            // pokes sent to me: show a toast for each fresh one, then delete them all
            // (this also cleans up anything older than 24h that piled up while offline)
            useEffect(() => {
                if (!fbReady || !rtdb || !uid || !conn) return;
                const u = FB.dbOnValue(rr(`pokes/${uid}`), (snap) => {
                    const entries = Object.entries(snap.val() || {});
                    if (!entries.length) return;
                    entries
                        .filter(([, pk]) => pk && Date.now() - (pk.at || 0) < 24 * 3600 * 1000)
                        .slice(0, 3)
                        .forEach(([, pk]) => triggerToast(`👋 ${pk.from} poked you — time to study!`));
                    entries.forEach(([fromUid]) => FB.dbRemove(rr(`pokes/${uid}/${fromUid}`)).catch(() => {}));
                }, (err) => console.error('pokes listener', err));
                return () => u();
            }, [fbReady, uid, conn]);
            const pokeCooldownRef = useRef({});
            const isPublic = !!(uid && usersMap[uid]);
            // keep my directory entry fresh + online dot correct
            useEffect(() => {
                if (!isPublic || !conn || !rtdb) return;
                const pr = rr(`users/${uid}/online`);
                FB.dbOnDisconnect(pr).set(false).catch(() => {});
                FB.dbUpdate(rr(`users/${uid}`), { online: true, lastSeen: Date.now(), name: myName, photo: myPhoto }).catch(() => {});
                return () => { try { FB.dbOnDisconnect(pr).cancel().catch(() => {}); } catch (e) {} };
            }, [isPublic, conn, uid, myName, myPhoto]);

            const leaveLocal = () => {
                try { sessionStorage.removeItem('wordsmart_mp_room'); } catch (e) {}
                setRoomCode(null); setRoom(null); setRoomLoaded(false); setMyPicks([]);
            };

            const createRoom = async () => {
                if (!uid || !rtdb || busy) return;
                setBusy(true);
                try {
                    let code = null;
                    for (let i = 0; i < 6; i++) {
                        const c = mpMakeCode();
                        const snap = await FB.dbGet(rr(`rooms/${c}/meta`));
                        if (!snap.exists()) { code = c; break; }
                    }
                    if (!code) throw new Error('Could not find a free room code, try again.');
                    const chunkObj = chunkIdx >= 0 ? createChunks[chunkIdx] : null;
                    const metaObj = {
                        hostUid: uid, hostName: myName, mode, style, wordCount, timeLimit, maxPlayers,
                        status: 'lobby', round: 1, createdAt: Date.now(),
                    };
                    if (chunkObj) {
                        metaObj.bookName = String((books.find(b => b.id === bookId) || {}).name || '').slice(0, 40);
                        metaObj.chunkLabel = chunkObj.label;
                        metaObj.chunkIndex = chunkObj.index;
                        metaObj.studySec = studySec;
                    }
                    await FB.dbSet(rr(`rooms/${code}/meta`), metaObj);
                    await FB.dbSet(rr(`rooms/${code}/players/${uid}`), {
                        name: myName, photo: myPhoto, online: true, ready: mode === 'same', score: 0, answered: 0, done: false, joinedAt: Date.now(),
                    });
                    if (chunkObj) await FB.dbSet(rr(`rooms/${code}/chunk`), chunkObj.words.map(mpSlimWord));
                    try { sessionStorage.setItem('wordsmart_mp_room', code); } catch (e) {}
                    setRoom(null); setMyPicks([]); setRoomCode(code);
                } catch (e) {
                    console.error(e);
                    triggerToast(`Could not create the room: ${e && e.message ? e.message : 'unknown error'}`);
                } finally { setBusy(false); }
            };

            const joinRoom = async (rawCode, resume = false) => {
                const code = String(rawCode || '').trim().toUpperCase();
                if (!uid || !rtdb || !code) return;
                setBusy(true);
                try {
                    const snap = await FB.dbGet(rr(`rooms/${code}`));
                    const val = snap.val();
                    if (!val || !val.meta) {
                        if (!resume) triggerToast('No room found with that code.');
                        try { sessionStorage.removeItem('wordsmart_mp_room'); } catch (e) {}
                        return;
                    }
                    const already = val.players && val.players[uid];
                    if (!already) {
                        if (val.meta.status !== 'lobby') { triggerToast('That game has already started.'); return; }
                        const cap = (val.meta && val.meta.maxPlayers) || MP_MAX_PLAYERS;
                        if (Object.keys(val.players || {}).length >= cap) { triggerToast(`That room is full (${cap} players max).`); return; }
                        await FB.dbSet(rr(`rooms/${code}/players/${uid}`), {
                            name: myName, photo: myPhoto, online: true, ready: val.meta.mode === 'same', score: 0, answered: 0, done: false, joinedAt: Date.now(),
                        });
                    }
                    try { sessionStorage.setItem('wordsmart_mp_room', code); } catch (e) {}
                    setRoom(null); setMyPicks([]); setRoomCode(code);
                } catch (e) {
                    console.error(e);
                    triggerToast(`Could not join: ${e && e.message ? e.message : 'unknown error'}`);
                } finally { setBusy(false); }
            };

            const leaveRoom = async () => {
                const code = roomCode;
                const isHost = room && room.meta && room.meta.hostUid === uid;
                if (code && rtdb && uid) { try { FB.dbOnDisconnect(rr(`rooms/${code}/players/${uid}/online`)).cancel().catch(() => {}); } catch (e) {} }
                leaveLocal();
                if (!code || !rtdb) return;
                try {
                    if (isHost) await FB.dbRemove(rr(`rooms/${code}`));
                    else {
                        await FB.dbRemove(rr(`rooms/${code}/players/${uid}`));
                        await FB.dbRemove(rr(`rooms/${code}/words/${uid}`));
                    }
                } catch (e) { console.error(e); }
            };

            const updateMe = (fields) => {
                if (!roomCode || !uid || !rtdb) return;
                FB.dbUpdate(rr(`rooms/${roomCode}/players/${uid}`), fields).catch((e) => console.error('update failed', e));
            };

            const lockWords = async () => {
                if (!room || myPicks.length !== room.meta.wordCount) return;
                try {
                    await FB.dbSet(rr(`rooms/${roomCode}/words/${uid}`), myPicks);
                    await FB.dbUpdate(rr(`rooms/${roomCode}/players/${uid}`), { ready: true });
                } catch (e) { triggerToast('Could not save your words. Please try again.'); }
            };
            const unlockWords = async () => {
                try {
                    await FB.dbRemove(rr(`rooms/${roomCode}/words/${uid}`));
                    await FB.dbUpdate(rr(`rooms/${roomCode}/players/${uid}`), { ready: false });
                } catch (e) { triggerToast('Could not unlock your words.'); }
            };

            const startGame = async () => {
                if (!room) return;
                const startAt = serverNow() + 4500;
                try {
                    await FB.dbUpdate(rr(`rooms/${roomCode}/meta`), {
                        status: 'playing', startAt, endAt: startAt + room.meta.timeLimit * 1000,
                    });
                } catch (e) { triggerToast('Could not start the game.'); }
            };
            const startStudy = async () => {
                if (!room) return;
                try {
                    await FB.dbUpdate(rr(`rooms/${roomCode}/meta`), { status: 'study', studyEndAt: serverNow() + (room.meta.studySec || 60) * 1000 });
                } catch (e) { triggerToast('Could not start the study phase.'); }
            };
            const skipStudy = () => { FB.dbUpdate(rr(`rooms/${roomCode}/meta`), { studyEndAt: serverNow() }).catch(() => {}); };
            // time is up: lock whatever I picked, filling the gaps from the chunk
            const autoLockWords = async (picks, chunk) => {
                const need = room.meta.wordCount;
                let final = (picks || []).slice(0, need);
                if (final.length < need) {
                    const have = new Set(final.map(p => p.w.toLowerCase()));
                    final = [...final, ...mpShuffle(chunk.filter(w => !have.has(w.w.toLowerCase())), Math.random).slice(0, need - final.length)];
                }
                if (!final.length) return;
                setMyPicks(final);
                try {
                    await FB.dbSet(rr(`rooms/${roomCode}/words/${uid}`), final);
                    await FB.dbUpdate(rr(`rooms/${roomCode}/players/${uid}`), { ready: true });
                } catch (e) { console.error(e); }
            };

            // public directory + invites
            const goPublic = async () => {
                try {
                    const snap = await FB.dbGet(rr(`users/${uid}`));
                    if (snap.exists()) await FB.dbUpdate(rr(`users/${uid}`), { name: myName, photo: myPhoto, online: true, lastSeen: Date.now() });
                    else await FB.dbSet(rr(`users/${uid}`), { name: myName, photo: myPhoto, online: true, lastSeen: Date.now(), points: 0, played: 0, wins: 0, losses: 0, joinedAt: Date.now() });
                    triggerToast('You are now listed in the public players list.');
                } catch (e) { console.error(e); triggerToast('Could not join the list — re-publish the database rules.'); }
            };
            const leavePublic = async () => { try { await FB.dbRemove(rr(`users/${uid}`)); } catch (e) { console.error(e); } };
            const sendInvite = async (target) => {
                if (!roomCode) return;
                try {
                    await FB.dbSet(rr(`invites/${target.id}/${uid}`), { from: myName, photo: myPhoto, code: roomCode, at: Date.now() });
                    triggerToast(`Invite sent to ${target.name}.`);
                } catch (e) { console.error(e); triggerToast('Could not send the invite.'); }
            };
            const sendPoke = async (target) => {
                const last = pokeCooldownRef.current[target.id] || 0;
                if (Date.now() - last < 30000) { triggerToast('Easy! You can poke them again in a few seconds.'); return; }
                pokeCooldownRef.current[target.id] = Date.now();
                try {
                    await FB.dbSet(rr(`pokes/${target.id}/${uid}`), { from: myName, photo: myPhoto, at: Date.now() });
                    triggerToast(`👋 Poked ${target.name}.`);
                } catch (e) { console.error(e); triggerToast('Could not send the poke.'); }
            };
            const dismissInvite = (fromUid) => { FB.dbRemove(rr(`invites/${uid}/${fromUid}`)).catch(() => {}); };
            const acceptInvite = async (fromUid, code) => {
                if (roomCode) { triggerToast('Leave your current room first.'); return; }
                await joinRoom(code);
                dismissInvite(fromUid);
            };
            // points + win/loss record, once per finished game (only if I'm in the public list)
            const awardResults = async (ranking, round) => {
                if (!uid || !rtdb) return;
                const key = `mp_award_${roomCode}_${round}`;
                try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
                const me = ranking.find(r => r.uid === uid);
                if (!me) return;
                try {
                    const snap = await FB.dbGet(rr(`users/${uid}`));
                    if (!snap.exists()) return;
                    const cur = snap.val();
                    const multi = ranking.length >= 2;
                    const win = multi && me.rank === 1;
                    const pts = me.score * 10 + (win ? 30 : 0) + 5;
                    await FB.dbUpdate(rr(`users/${uid}`), {
                        points: (cur.points || 0) + pts, played: (cur.played || 0) + 1,
                        wins: (cur.wins || 0) + (win ? 1 : 0), losses: (cur.losses || 0) + (multi && !win ? 1 : 0),
                    });
                    triggerToast(`+${pts} points added to the leaderboard!`);
                } catch (e) { console.error(e); }
            };

            const playAgain = async () => {
                try {
                    await FB.dbUpdate(rr(`rooms/${roomCode}/meta`), {
                        status: 'lobby', round: (room.meta.round || 1) + 1, startAt: null, endAt: null, studyEndAt: null,
                    });
                } catch (e) { triggerToast('Could not reset the room.'); }
            };
            const copyCode = () => {
                try { navigator.clipboard.writeText(roomCode); triggerToast(`Room code ${roomCode} copied!`); }
                catch (e) { triggerToast(`Room code: ${roomCode}`); }
            };

            // ---------------- gates ----------------
            const shell = (children) => <div className="space-y-5 tab-panel-enter">{children}{chatWith && uid && <MpChat uid={uid} other={chatWith} onClose={() => setChatWith(null)} />}</div>;
            const header = (
                <div className="flex items-center justify-between gap-3 flex-wrap">
                    <h2 className="text-xl font-black text-slate-800 flex items-center gap-2">🌐 Multiplayer Arena</h2>
                    {cloudUser && (
                        <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${conn ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                            {conn ? '● Connected' : '○ Connecting…'}
                        </span>
                    )}
                </div>
            );

            if (!fbReady) return shell(<>{header}<div className="bg-white border border-slate-200 rounded-2xl p-8 text-center text-sm text-slate-500">Loading Firebase…</div></>);
            if (!rtdb) return shell(<>{header}<div className="bg-amber-50 border border-amber-200 rounded-2xl p-6 text-sm text-amber-800">Realtime Database could not be loaded. Check your internet connection and the database URL in the Firebase section at the top of the file.</div></>);
            if (!cloudAuthReady) return shell(<>{header}<div className="bg-white border border-slate-200 rounded-2xl p-8 text-center text-sm text-slate-500">Checking your account…</div></>);
            if (!cloudUser) {
                return shell(<>{header}
                    <div className="bg-white border border-slate-200 rounded-3xl p-10 text-center shadow-sm">
                        <div className="text-5xl">🔐</div>
                        <h3 className="text-lg font-black text-slate-800 mt-3">Sign in to play with friends</h3>
                        <p className="text-sm text-slate-500 mt-1 max-w-md mx-auto">Rooms need to know who's who. Sign in with Google — your name and photo show up on the scoreboard, nothing else is shared.</p>
                        <button onClick={onSignIn} className="mt-5 px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700">Sign in with Google</button>
                    </div>
                </>);
            }

            // ---------------- home (no room yet) ----------------
            if (!roomCode) {
                const liveInvites = Object.entries(invites || {}).map(([id, v]) => ({ id, ...v })).filter(v => v && v.code && Date.now() - (v.at || 0) < 30 * 60 * 1000);
                const usersList = Object.entries(usersMap || {}).map(([id, u]) => ({ id, ...u }));
                const joinCta = isPublic ? (
                    <div className="flex items-center justify-between gap-2 rounded-xl bg-emerald-50 border border-emerald-200 px-3 py-2 text-xs">
                        <span className="font-bold text-emerald-700">✅ You're on the public list — others can see and invite you.</span>
                        <button onClick={leavePublic} className="underline text-emerald-700/70 font-bold shrink-0">Hide me</button>
                    </div>
                ) : (
                    <div className="rounded-xl bg-indigo-50 border border-indigo-200 px-3 py-3 text-xs flex items-center justify-between gap-3 flex-wrap">
                        <span className="font-semibold text-indigo-800">Join the public list to appear here, earn leaderboard points and receive invites. Only your name and photo are shared.</span>
                        <button onClick={goPublic} className="px-4 py-2 rounded-lg bg-indigo-600 text-white font-bold hover:bg-indigo-700">Make me visible</button>
                    </div>
                );
                const perPlayer = mode === 'swap' ? `Each player puts in ${wordCount} words; with 4 players that's ${wordCount * 3} questions each.` : `${wordCount} questions, same for everybody.`;
                return shell(<>{header}
                    {connWaited && !conn && (
                        <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-xs text-amber-800 leading-relaxed">
                            <b>Can't reach the Realtime Database.</b> In the Firebase console open <b>Build → Realtime Database → Create database</b>, then check that the database URL in the Firebase section at the top of this file matches the one shown there.
                        </div>
                    )}
                    {liveInvites.length > 0 && (
                        <div className="space-y-2">
                            {liveInvites.map(iv => (
                                <div key={iv.id} className="flex items-center gap-3 rounded-2xl border border-indigo-200 bg-indigo-50 px-4 py-3">
                                    <MpAvatar name={iv.from} photo={iv.photo} />
                                    <div className="flex-1 min-w-0 text-sm text-slate-700"><b>{iv.from}</b> invited you to room <b className="tracking-widest">{iv.code}</b></div>
                                    <button onClick={() => acceptInvite(iv.id, iv.code)} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold hover:bg-emerald-700">Join</button>
                                    <button onClick={() => dismissInvite(iv.id)} className="px-2 py-2 text-slate-400 hover:text-slate-600 text-sm font-bold" aria-label="Dismiss">✕</button>
                                </div>
                            ))}
                        </div>
                    )}
                    <div className="flex gap-1.5 flex-wrap">
                        {[['play', '🎮 Play'], ['players', `👥 Players (${usersList.length})`], ['challenges', '⚔️ Challenges'], ['board', '🏆 Leaderboard']].map(([k, l]) => (
                            <button key={k} onClick={() => setView(k)} className={`px-4 py-2 rounded-xl text-xs font-extrabold border transition-all ${view === k ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>{l}</button>
                        ))}
                    </div>
                    {view === 'challenges' && (
                        <MpChallenges uid={uid} myName={myName} myPhoto={myPhoto} books={books} allWords={allWords} activeBookId={activeBookId} chunkSize={chunkSize} usersMap={usersMap} triggerToast={triggerToast} target={challengeTarget} onClearTarget={() => setChallengeTarget(null)} />
                    )}
                    {view === 'players' && (
                        <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-3 shadow-sm">
                            <div className="flex items-center gap-2 flex-wrap">
                                <h3 className="text-sm font-black text-slate-800 mr-auto">👥 Public players <span className="text-slate-400 font-bold">· {usersList.length} registered · {usersList.filter(u => u.online).length} online</span></h3>
                                <input value={userSearch} onChange={(e) => setUserSearch(e.target.value)} placeholder="Search players…" className="px-3 py-2 rounded-lg border border-slate-300 text-xs w-44" />
                            </div>
                            {joinCta}
                            {!roomCode && <p className="text-[11px] text-slate-400">To invite someone, create a room first — the room lobby then shows an Invite list. You can 👋 poke anyone any time.</p>}
                            <div className="divide-y divide-slate-100 max-h-[32rem] overflow-y-auto">
                                {usersList.filter(u => !userSearch.trim() || String(u.name || '').toLowerCase().includes(userSearch.trim().toLowerCase()))
                                    .sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0) || (b.points || 0) - (a.points || 0)).map(u => (
                                    <div key={u.id} className="flex items-center gap-3 py-2.5">
                                        <div className="relative"><MpAvatar name={u.name} photo={u.photo} /><span className={`absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white ${u.online ? 'bg-emerald-500' : 'bg-slate-300'}`} /></div>
                                        <div className="flex-1 min-w-0">
                                            <div className="text-sm font-extrabold text-slate-800 truncate">{u.name}{u.id === uid ? ' (you)' : ''}</div>
                                            <div className="text-[11px] font-semibold text-slate-400">{u.points || 0} pts · {u.wins || 0}W {u.losses || 0}L · {u.played || 0} played</div>
                                        </div>
                                        {u.id !== uid && (
                                            <button onClick={() => sendInvite(u)} disabled={!roomCode} title={roomCode ? 'Invite to my room' : 'Create a room first'} className="px-3 py-1.5 rounded-lg bg-indigo-100 text-indigo-700 text-xs font-bold hover:bg-indigo-200 disabled:opacity-40 disabled:cursor-not-allowed">✉ Invite</button>
                                        )}
                                        {u.id !== uid && (
                                            <button onClick={() => sendPoke(u)} title="Nudge them to study" className="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-700 text-xs font-bold hover:bg-amber-200">👋 Poke</button>
                                        )}
                                        {u.id !== uid && (
                                            <button onClick={() => setChatWith({ id: u.id, name: u.name, photo: u.photo })} title="Send a short message" className="px-3 py-1.5 rounded-lg bg-sky-100 text-sky-700 text-xs font-bold hover:bg-sky-200">💬 Chat</button>
                                        )}
                                        {u.id !== uid && (
                                            <button onClick={() => { setChallengeTarget({ id: u.id, name: u.name, photo: u.photo }); setView('challenges'); }} title="Challenge to an exam (no need to be online together)" className="px-3 py-1.5 rounded-lg bg-rose-100 text-rose-700 text-xs font-bold hover:bg-rose-200">⚔️ Challenge</button>
                                        )}
                                    </div>
                                ))}
                                {usersList.length === 0 && <div className="py-8 text-center text-xs text-slate-400">Nobody has joined the public list yet — be the first!</div>}
                            </div>
                        </div>
                    )}
                    {view === 'board' && (() => {
                        const ranked = usersList.slice().sort((a, b) => (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0));
                        const medal = { 0: '🥇', 1: '🥈', 2: '🥉' };
                        return (
                            <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-3 shadow-sm">
                                <h3 className="text-sm font-black text-slate-800">🏆 Leaderboard <span className="text-slate-400 font-bold">· points from multiplayer games (10 per correct answer, +30 win bonus)</span></h3>
                                {joinCta}
                                <div className="divide-y divide-slate-100 max-h-[32rem] overflow-y-auto">
                                    {ranked.slice(0, 50).map((u, i) => (
                                        <div key={u.id} className={`flex items-center gap-3 py-2.5 px-2 rounded-lg ${u.id === uid ? 'bg-indigo-50' : ''}`}>
                                            <div className="w-8 text-center text-sm font-black text-slate-500">{medal[i] || i + 1}</div>
                                            <MpAvatar name={u.name} photo={u.photo} />
                                            <div className="flex-1 min-w-0">
                                                <div className="text-sm font-extrabold text-slate-800 truncate">{u.name}{u.id === uid ? ' (you)' : ''}</div>
                                                <div className="text-[11px] font-semibold text-slate-400">{u.wins || 0} wins · {u.losses || 0} losses · {u.played || 0} games</div>
                                            </div>
                                            <div className="text-right"><div className="text-base font-black text-slate-800">{u.points || 0}</div><div className="text-[10px] font-bold text-slate-400">POINTS</div></div>
                                        </div>
                                    ))}
                                    {ranked.length === 0 && <div className="py-8 text-center text-xs text-slate-400">No one on the board yet. Join the public list and play a game!</div>}
                                </div>
                            </div>
                        );
                    })()}
                    <div className={`grid md:grid-cols-[1.4fr_1fr] gap-4 ${view === 'play' ? '' : 'hidden'}`}>
                        <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
                            <h3 className="text-sm font-black text-slate-800">➕ Create a room</h3>
                            <div className="grid sm:grid-cols-2 gap-2">
                                {MP_MODES.map(m => (
                                    <button key={m.id} onClick={() => setMode(m.id)} className={`text-left p-3 rounded-xl border-2 transition-all ${mode === m.id ? 'border-indigo-500 bg-indigo-50' : 'border-slate-200 hover:border-indigo-300'}`}>
                                        <div className="text-sm font-black text-slate-800">{m.icon} {m.label}</div>
                                        <div className="text-[11px] text-slate-500 mt-0.5 leading-snug">{m.desc}</div>
                                    </button>
                                ))}
                            </div>
                            <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 space-y-2.5">
                                <div className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400">📚 Material (optional)</div>
                                <div className="grid sm:grid-cols-2 gap-2">
                                    <select value={bookId} onChange={(e) => setBookId(e.target.value)} className="px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 bg-white">
                                        {books.map(b => <option key={b.id} value={b.id}>{b.name} ({(allWords[b.id] || []).length})</option>)}
                                    </select>
                                    <select value={chunkIdx} onChange={(e) => setChunkIdx(Number(e.target.value))} className="px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 bg-white">
                                        <option value={-1}>Any words (no chunk)</option>
                                        {createChunks.map(c => <option key={c.index} value={c.index}>{c.label} · {c.words.length} words</option>)}
                                    </select>
                                </div>
                                {chunkIdx >= 0 ? (
                                    <div>
                                        <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Study time before the game</span><span className="text-indigo-600">{studySec === 0 ? 'Off' : mpFmtClock(studySec * 1000)}</span></div>
                                        <input type="range" min="0" max="300" step="15" value={studySec} onChange={(e) => setStudySec(Number(e.target.value))} className="w-full accent-indigo-600" />
                                        <p className="text-[11px] text-slate-400">{studySec > 0 ? 'Everyone reads this chunk (and picks their words) for that long — then the game starts by itself. Questions and wrong options come only from the chunk.' : 'No study time: words are picked from the chunk in the lobby and the game starts when everyone is ready.'}</p>
                                    </div>
                                ) : (
                                    <p className="text-[11px] text-slate-400">Pick a chunk to give everyone the same material to study — or leave it and players choose words from any of their lists.</p>
                                )}
                            </div>
                            <div>
                                <div className="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 mb-1.5">Question style</div>
                                <div className="flex flex-wrap gap-1.5">
                                    {MP_STYLES.map(s => (
                                        <button key={s.id} onClick={() => setStyle(s.id)} title={s.desc} className={`px-3 py-1.5 rounded-full text-xs font-bold border ${style === s.id ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'}`}>{s.label}</button>
                                    ))}
                                </div>
                            </div>
                            <div className="grid sm:grid-cols-2 gap-4">
                                <div>
                                    <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>{mode === 'swap' ? 'Words per player' : 'Number of words'}</span><span className="text-indigo-600">{wordCount}</span></div>
                                    <input type="range" min="3" max={maxWords} value={wordCount} onChange={(e) => setWordCount(Number(e.target.value))} className="w-full accent-indigo-600" />
                                </div>
                                <div>
                                    <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Time limit</span><span className="text-indigo-600">{mpFmtClock(timeLimit * 1000)}</span></div>
                                    <input type="range" min="30" max="600" step="15" value={timeLimit} onChange={(e) => setTimeLimit(Number(e.target.value))} className="w-full accent-indigo-600" />
                                </div>
                            </div>
                            <div>
                                <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Max players in the room</span><span className="text-indigo-600">{maxPlayers}</span></div>
                                <input type="range" min="2" max="20" value={maxPlayers} onChange={(e) => setMaxPlayers(Number(e.target.value))} className="w-full accent-indigo-600" />
                            </div>
                            <p className="text-[11px] text-slate-400">{perPlayer}</p>
                            <button onClick={createRoom} disabled={busy || !conn} className="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-50">{busy ? 'Creating…' : 'Create room'}</button>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-3 shadow-sm h-fit">
                            <h3 className="text-sm font-black text-slate-800">🔑 Join with a code</h3>
                            <input
                                value={joinInput}
                                onChange={(e) => setJoinInput(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5))}
                                onKeyDown={(e) => { if (e.key === 'Enter') joinRoom(joinInput); }}
                                placeholder="ABCDE"
                                className="w-full text-center text-3xl font-black tracking-[0.4em] py-3 rounded-xl border-2 border-slate-200 focus:border-indigo-500 outline-none text-slate-800 bg-white"
                            />
                            <button onClick={() => joinRoom(joinInput)} disabled={busy || !conn || joinInput.length < 5} className="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-sm hover:bg-emerald-700 disabled:opacity-50">Join room</button>
                            <p className="text-[11px] text-slate-400">You'll play as <b className="text-slate-600">{myName}</b>. Change your nickname from your profile.</p>
                        </div>
                    </div>
                </>);
            }

            // ---------------- inside a room ----------------
            if (!room || !room.meta) return shell(<>{header}<div className="bg-white border border-slate-200 rounded-2xl p-8 text-center text-sm text-slate-500">Entering room {roomCode}…</div></>);

            const meta = room.meta;
            const isHost = meta.hostUid === uid;
            const players = room.players || {};
            const playerList = Object.entries(players).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
            const lockedWords = Object.values((room.words && room.words[uid]) || {});
            const iAmLocked = lockedWords.length > 0;
            const onlinePlayers = playerList.filter(p => p.online !== false);
            const hostWordsLocked = Object.values((room.words && room.words[meta.hostUid]) || {}).length === meta.wordCount;
            const everyoneReady = meta.mode === 'same' ? hostWordsLocked : onlinePlayers.every(p => p.ready);
            const chunkWords = Object.values(room.chunk || {});
            const studyFirst = chunkWords.length > 0 && (meta.studySec || 0) > 0;
            const canStart = isHost && onlinePlayers.length >= 2 && (studyFirst || everyoneReady);
            const styleLabel = (MP_STYLES.find(s => s.id === meta.style) || {}).label || 'Mixed';
            const modeInfo = MP_MODES.find(m => m.id === meta.mode) || MP_MODES[0];

            if (meta.status === 'playing' && meta.startAt && meta.endAt) {
                return shell(<>{header}
                    <MpPlay key={`${roomCode}-${meta.round}`} code={roomCode} room={room} uid={uid} serverNow={serverNow} onUpdateMe={updateMe} onPlayAgain={playAgain} onLeave={leaveRoom} isHost={isHost} onResults={(rk) => awardResults(rk, meta.round)} />
                </>);
            }

            if (meta.status === 'study' && meta.studyEndAt) {
                return shell(<>{header}
                    <MpStudy
                        key={`study-${roomCode}-${meta.round}`}
                        room={room} isHost={isHost} serverNow={serverNow}
                        canPick={meta.mode === 'swap' || isHost}
                        myPicks={myPicks} setMyPicks={setMyPicks}
                        iAmLocked={iAmLocked} lockedWords={lockedWords}
                        onAutoLock={autoLockWords} onLock={lockWords} onUnlock={unlockWords}
                        onStartGame={startGame} onSkip={skipStudy} onLeave={leaveRoom}
                    />
                </>);
            }

            const hostOnline = !players[meta.hostUid] || players[meta.hostUid].online !== false;
            return shell(<>{header}
                <div className="rounded-3xl p-5 bg-gradient-to-br from-slate-900 to-indigo-950 text-white shadow-xl flex items-center justify-between gap-4 flex-wrap">
                    <div>
                        <div className="text-[11px] font-bold uppercase tracking-widest text-indigo-300">Room code</div>
                        <button onClick={copyCode} title="Click to copy" className="text-5xl font-black tracking-[0.25em] mt-1 hover:text-indigo-200 transition-colors">{roomCode}</button>
                        <div className="text-[11px] text-indigo-200/70 mt-1">Share this code with your friends · tap to copy</div>
                    </div>
                    <div className="text-xs space-y-1 text-indigo-100/90">
                        <div><b>{modeInfo.icon} {modeInfo.label}</b> · {styleLabel}</div>
                        <div>{meta.wordCount} {meta.mode === 'swap' ? 'words per player' : 'words'} · {mpFmtClock(meta.timeLimit * 1000)} on the clock</div>
                        <div>Host: {meta.hostName}</div>
                        {meta.chunkLabel && <div>📚 {meta.bookName ? `${meta.bookName} · ` : ''}{meta.chunkLabel}{(meta.studySec || 0) > 0 ? ` · ${mpFmtClock(meta.studySec * 1000)} study` : ''}</div>}
                    </div>
                </div>
                {!hostOnline && <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800 font-semibold">The host went offline. If they don't come back, leave and create a new room.</div>}
                <div className="grid lg:grid-cols-[1fr_1.3fr] gap-4">
                    <div className="bg-white border border-slate-200 rounded-2xl p-4 h-fit">
                        <div className="flex items-center justify-between mb-2">
                            <h3 className="text-sm font-black text-slate-800">Players</h3>
                            <span className="text-[11px] font-bold text-slate-400">{playerList.length}/{meta.maxPlayers || MP_MAX_PLAYERS}</span>
                        </div>
                        <div className="space-y-1.5">
                            {playerList.map(p => (
                                <div key={p.id} className={`flex items-center gap-2.5 rounded-xl px-2.5 py-2 ${p.id === uid ? 'bg-indigo-50' : 'bg-slate-50'} ${p.online === false ? 'opacity-40' : ''}`}>
                                    <MpAvatar name={p.name} photo={p.photo} />
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm font-extrabold text-slate-800 truncate">{p.name}{p.id === uid ? ' (you)' : ''}</div>
                                        <div className="text-[10px] font-bold text-slate-400">{p.id === meta.hostUid ? '👑 Host' : 'Player'}{p.online === false ? ' · offline' : ''}</div>
                                    </div>
                                    <span className={`text-[10px] font-black px-2 py-1 rounded-full ${p.ready ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>{p.ready ? 'READY' : 'PICKING…'}</span>
                                </div>
                            ))}
                        </div>
                        {(() => {
                            const inRoom = new Set(playerList.map(pl => pl.id));
                            const invitable = Object.entries(usersMap || {}).map(([id, u]) => ({ id, ...u }))
                                .filter(u => !inRoom.has(u.id))
                                .filter(u => !userSearch.trim() || String(u.name || '').toLowerCase().includes(userSearch.trim().toLowerCase()))
                                .sort((a, b) => (b.online ? 1 : 0) - (a.online ? 1 : 0));
                            return (
                                <div className="mt-4 pt-3 border-t border-slate-100 space-y-2">
                                    <div className="flex items-center justify-between gap-2">
                                        <h4 className="text-xs font-black text-slate-800">✉ Invite players</h4>
                                        <span className="text-[10px] font-bold text-slate-400">{invitable.filter(u => u.online).length} online</span>
                                    </div>
                                    <input value={userSearch} onChange={(e) => setUserSearch(e.target.value)} placeholder="Search players…" className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs" />
                                    <div className="max-h-56 overflow-y-auto space-y-1">
                                        {invitable.map(u => (
                                            <div key={u.id} className="flex items-center gap-2 rounded-xl bg-slate-50 px-2 py-1.5">
                                                <div className="relative"><MpAvatar name={u.name} photo={u.photo} size={28} /><span className={`absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full border-2 border-white ${u.online ? 'bg-emerald-500' : 'bg-slate-300'}`} /></div>
                                                <div className="flex-1 min-w-0 text-xs font-extrabold text-slate-800 truncate">{u.name}</div>
                                                <button onClick={() => sendInvite(u)} className="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700 text-[11px] font-bold hover:bg-indigo-200">✉ Invite</button>
                                                <button onClick={() => sendPoke(u)} className="px-2 py-1 rounded-lg bg-amber-100 text-amber-700 text-[11px] font-bold hover:bg-amber-200" title="Nudge to study">👋</button>
                                                <button onClick={() => setChatWith({ id: u.id, name: u.name, photo: u.photo })} className="px-2 py-1 rounded-lg bg-sky-100 text-sky-700 text-[11px] font-bold hover:bg-sky-200" title="Message">💬</button>
                                            </div>
                                        ))}
                                        {invitable.length === 0 && <div className="py-4 text-center text-[11px] text-slate-400">Nobody else is on the public list yet. Ask friends to open Multiplayer → Players → "Make me visible", or share the room code.</div>}
                                    </div>
                                </div>
                            );
                        })()}
                    </div>
                    <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                        {studyFirst ? (
                            <div className="text-center py-8 space-y-2">
                                <div className="text-4xl">📖</div>
                                <p className="text-sm font-black text-slate-800">Study phase comes first</p>
                                <p className="text-xs text-slate-500 max-w-sm mx-auto">{meta.bookName ? `${meta.bookName} · ` : ''}{meta.chunkLabel} · {chunkWords.length} words. When the host starts, everyone gets {mpFmtClock(meta.studySec * 1000)} to read the chunk{meta.mode === 'swap' ? ' and pick the words the others will face' : (isHost ? ' and pick the words for the game' : ' while the host picks the words')}. The game then begins automatically.</p>
                            </div>
                        ) : meta.mode === 'swap' || isHost ? (
                            <>
                                <div className="flex items-center justify-between gap-2 flex-wrap">
                                    <h3 className="text-sm font-black text-slate-800">{meta.mode === 'swap' ? 'Pick the words others will face' : 'Pick the words for everyone'}</h3>
                                    <span className={`text-xs font-black px-2.5 py-1 rounded-full ${(iAmLocked ? lockedWords.length : myPicks.length) === meta.wordCount ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-600'}`}>{iAmLocked ? lockedWords.length : myPicks.length} / {meta.wordCount}</span>
                                </div>
                                {iAmLocked ? (
                                    <div className="rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-center">
                                        <div className="text-2xl">✅</div>
                                        <div className="text-sm font-black text-emerald-800 mt-1">Words locked in</div>
                                        <div className="text-[11px] text-emerald-700/80 mt-0.5 line-clamp-2">{lockedWords.map(w => w.w).join(' · ')}</div>
                                        <button onClick={unlockWords} className="mt-3 px-4 py-1.5 rounded-lg bg-white border border-emerald-300 text-emerald-700 text-xs font-bold hover:bg-emerald-100">Edit my words</button>
                                    </div>
                                ) : (
                                    <>
                                        {chunkWords.length > 0 ? <MpChunkPicker chunk={chunkWords} wordCount={meta.wordCount} picks={myPicks} setPicks={setMyPicks} locked={false} /> : <MpWordPicker books={books} allWords={allWords} defaultBookId={activeBookId} wordCount={meta.wordCount} picks={myPicks} setPicks={setMyPicks} locked={false} />}
                                        <button onClick={lockWords} disabled={myPicks.length !== meta.wordCount} className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">🔒 Lock in my words</button>
                                    </>
                                )}
                            </>
                        ) : (
                            <div className="text-center py-10">
                                <div className="text-4xl">⏳</div>
                                <p className="text-sm font-bold text-slate-700 mt-2">{hostWordsLocked ? 'Words are set!' : 'The host is picking the words…'}</p>
                                <p className="text-xs text-slate-400 mt-1">You'll all get the same questions once the host starts.</p>
                            </div>
                        )}
                    </div>
                </div>
                <div className="flex gap-2 flex-wrap">
                    {isHost ? (
                        <button onClick={studyFirst ? startStudy : startGame} disabled={!canStart} className="flex-1 min-w-[180px] py-3.5 rounded-xl bg-emerald-600 text-white font-black text-sm hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed">
                            {canStart ? (studyFirst ? '📖 Start study phase' : '🚀 Start game') : (onlinePlayers.length < 2 ? 'Waiting for at least 2 players…' : 'Waiting for everyone to be ready…')}
                        </button>
                    ) : (
                        <div className="flex-1 min-w-[180px] py-3.5 rounded-xl bg-slate-100 text-slate-500 font-bold text-xs text-center">Waiting for the host to start…</div>
                    )}
                    <button onClick={leaveRoom} className="px-5 py-3.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-100">{isHost ? 'Close room' : 'Leave room'}</button>
                </div>
            </>);
        }

        function App() {
            // BOOKS LIST STATE
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('wordsmart_custom_books_list');
                return saved ? JSON.parse(saved) : DEFAULT_BOOKS;
            });

            // ACTIVE SELECTED BOOK ID
            const [selectedBookId, setSelectedBookId] = useState(() => {
                return localStorage.getItem('wordsmart_active_book_id') || 'ws1';
            });

            // ALL WORDS STORED BY BOOK ID
            const [allWords, setAllWords] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_words_map');
                if (saved) return JSON.parse(saved);

                const savedWS1 = localStorage.getItem('wordsmart_data_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_data_ws2');
                return {
                    ws1: savedWS1 ? JSON.parse(savedWS1) : INITIAL_WS1_WORDS,
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                };
            });

            // Always-current mirror of `allWords`, kept in sync by the effect
            // below. Import counting (added/updated/promoted) reads and merges
            // against THIS ref instead of relying on React's setState updater
            // callback to have already run by the time the summary toast is
            // built — that timing isn't guaranteed, which was why multi-word
            // imports could correctly add the words but still report "0 added,
            // 0 updated". Manually keeping this ref current (both here and
            // right inside the import function itself) makes the count always
            // match reality regardless of render timing.
            const allWordsRef = useRef(allWords);
            useEffect(() => { allWordsRef.current = allWords; }, [allWords]);

            // One-time repair: earlier bulk imports could have created duplicate IDs,
            // which broke filtering/rendering for large word lists. Fix any leftover
            // duplicates in already-saved data, once, on load.
            useEffect(() => {
                setAllWords(prev => {
                    let changed = false;
                    const repaired = {};
                    for (const bookId in prev) {
                        const seen = new Set();
                        repaired[bookId] = (prev[bookId] || []).map((w, idx) => {
                            if (w.id == null || seen.has(w.id)) {
                                changed = true;
                                const newId = generateUniqueWordId();
                                seen.add(newId);
                                return { ...w, id: newId };
                            }
                            seen.add(w.id);
                            return w;
                        });
                    }
                    return changed ? repaired : prev;
                });
            }, []);

            const [allFamiliarity, setAllFamiliarity] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_familiarity_map');
                if (saved) return JSON.parse(saved);

                const savedMastered = localStorage.getItem('wordsmart_all_mastered_map');
                if (savedMastered) return migrateMasteredToFamiliarity(JSON.parse(savedMastered));

                const savedWS1 = localStorage.getItem('wordsmart_mastered_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_mastered_ws2');
                return migrateMasteredToFamiliarity({
                    ws1: savedWS1 ? JSON.parse(savedWS1) : [],
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                });
            });

            // TRASH BIN STORED BY BOOK ID
            const [allTrash, setAllTrash] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_trash_map');
                if (saved) return JSON.parse(saved);

                const savedWS1 = localStorage.getItem('wordsmart_trash_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_trash_ws2');
                return {
                    ws1: savedWS1 ? JSON.parse(savedWS1) : [],
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                };
            });

            // Tracks whether the one-time load from IndexedDB (below) has
            // finished, so the words-data.json auto-fetch (which only runs
            // for genuinely first-time visitors) waits for it instead of
            // racing it.
            const [idbDataChecked, setIdbDataChecked] = useState(false);
            const idbHadDataRef = useRef(false);

            // LOAD allWords / allFamiliarity / allTrash FROM INDEXEDDB
            // The three useState() calls above read from localStorage so the
            // very first paint has something to show immediately (and so
            // anyone on the old localStorage-only version still sees their
            // data). Right after mount, this effect checks IndexedDB — the
            // real, larger-capacity home for this data — and if it already
            // has a saved copy (from a previous session on this same
            // updated app), that copy wins, since it's the most complete
            // one. If IndexedDB is empty (first run of this update), nothing
            // changes here — the localStorage-sourced state above is kept,
            // and the save effect further down migrates it into IndexedDB.
            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const [idbWords, idbFam, idbTrash] = await Promise.all([
                            wsIdbGet('allWords'),
                            wsIdbGet('allFamiliarity'),
                            wsIdbGet('allTrash'),
                        ]);
                        if (cancelled) return;
                        if (idbWords && typeof idbWords === 'object') {
                            setAllWords(idbWords);
                            idbHadDataRef.current = true;
                        }
                        if (idbFam && typeof idbFam === 'object') setAllFamiliarity(idbFam);
                        if (idbTrash && typeof idbTrash === 'object') setAllTrash(idbTrash);
                    } catch (e) {
                        // IndexedDB unavailable (private browsing in some
                        // browsers, very old browsers, etc.) — fall back to
                        // whatever was already loaded from localStorage above.
                        console.error('Could not read saved words from IndexedDB; using localStorage data instead.', e);
                    } finally {
                        if (!cancelled) setIdbDataChecked(true);
                    }
                })();
                return () => { cancelled = true; };
            }, []);

            // AUTO-FETCH PUBLISHED DEFAULT DATA (words-data.json)
            // First-time visitors — anyone whose browser has NO saved
            // Vocabulation data yet — automatically pull whichever books/words
            // you've published to `words-data.json` in this same repo, right
            // next to index.html. That way, anyone opening your GitHub Pages
            // link sees your latest words without importing anything.
            //
            // Returning visitors (this browser already has saved data/progress,
            // including this device) are left completely untouched — this only
            // ever fires once, before anything is ever written to localStorage.
            //
            // TO PUBLISH NEW WORDS/PAGES: in the app, go to Data Management and
            // click "💾 Export Backup". Rename the downloaded file to exactly
            // words-data.json, then upload/replace it in your GitHub repo next
            // to index.html and commit. No further code changes ever needed —
            // just repeat this whenever you add more words or pages.
            useEffect(() => {
                // Wait for the IndexedDB check above to finish, since on a
                // returning visitor the words may live ONLY in IndexedDB
                // (localStorage's copy gets cleared once it's migrated) —
                // checking localStorage alone would wrongly look empty.
                if (!idbDataChecked) return;

                const hasLocalData = idbHadDataRef.current
                    || localStorage.getItem('wordsmart_all_words_map')
                    || localStorage.getItem('wordsmart_custom_books_list')
                    || localStorage.getItem('wordsmart_data_ws1')
                    || localStorage.getItem('wordsmart_data_ws2');
                if (hasLocalData) return;

                fetch('words-data.json', { cache: 'no-store' })
                    .then(res => (res.ok ? res.json() : null))
                    .then(payload => {
                        if (!payload || typeof payload !== 'object') return;
                        const importedBooks = Array.isArray(payload.books) ? payload.books : null;
                        const importedWords = payload.allWords && typeof payload.allWords === 'object' ? payload.allWords : null;
                        if (!importedBooks || !importedWords) return;

                        setBooks(importedBooks);
                        setAllWords(importedWords);
                        if (payload.allFamiliarity && typeof payload.allFamiliarity === 'object') {
                            setAllFamiliarity(payload.allFamiliarity);
                        }
                        if (payload.allTrash && typeof payload.allTrash === 'object') {
                            setAllTrash(payload.allTrash);
                        }
                        const fallbackBookId = importedBooks.find(b => b?.id)?.id;
                        if (fallbackBookId) setSelectedBookId(fallbackBookId);
                    })
                    .catch(() => {
                        // No words-data.json published yet (or this is a local
                        // file:// open where fetch can't work) — silently keep
                        // the built-in defaults already loaded above.
                    });
            }, [idbDataChecked]);

            // BANGLA TOGGLE SWITCH
            const [showBangla, setShowBangla] = useState(() => {
                const saved = localStorage.getItem('wordsmart_show_bangla');
                return saved !== null ? JSON.parse(saved) : true;
            });

            // PRACTICE QUIZ SOUND TOGGLE
            const [quizSoundOn, setQuizSoundOn] = useState(() => {
                const saved = localStorage.getItem('wordsmart_quiz_sound');
                return saved !== null ? JSON.parse(saved) : true;
            });
            useEffect(() => { localStorage.setItem('wordsmart_quiz_sound', JSON.stringify(quizSoundOn)); }, [quizSoundOn]);

            // GLOBAL SOUND MASTER (controls ALL app sounds)
            const [globalSound, setGlobalSound] = useState(() => {
                const saved = localStorage.getItem('wordsmart_global_sound');
                return saved !== null ? JSON.parse(saved) : true;
            });
            useEffect(() => { localStorage.setItem('wordsmart_global_sound', JSON.stringify(globalSound)); }, [globalSound]);

            // When globalSound changes, enforce it across per-area toggles
            useEffect(() => { setQuizSoundOn(globalSound); }, [globalSound]);

            const [appTheme, setAppTheme] = useState(() => {
                const saved = localStorage.getItem('wordsmart_app_theme');
                return (saved && saved !== 'aurora') ? saved : 'light';
            });

            const [shortcuts, setShortcuts] = useState(() => {
                const saved = localStorage.getItem('wordsmart_shortcuts');
                return saved ? { ...DEFAULT_SHORTCUTS, ...JSON.parse(saved) } : DEFAULT_SHORTCUTS;
            });
            const [listeningForShortcut, setListeningForShortcut] = useState(null); // 'submit' | 'replay' | 'exit' | null
            useEffect(() => { localStorage.setItem('wordsmart_shortcuts', JSON.stringify(shortcuts)); }, [shortcuts]);
            useEffect(() => {
                if (!listeningForShortcut) return;
                const capture = (e) => {
                    e.preventDefault();
                    let combo = e.code === 'Space' ? 'Space' : (e.key.length === 1 ? e.key.toUpperCase() : e.key);
                    if (e.ctrlKey && combo !== 'Control') combo = 'Ctrl+' + combo;
                    if (e.shiftKey && combo !== 'Shift') combo = 'Shift+' + combo;
                    if (e.altKey && combo !== 'Alt') combo = 'Alt+' + combo;
                    setShortcuts(prev => ({ ...prev, [listeningForShortcut]: combo }));
                    setListeningForShortcut(null);
                };
                window.addEventListener('keydown', capture, { once: true });
                return () => window.removeEventListener('keydown', capture);
            }, [listeningForShortcut]);

            // Global shortcut handling for screens outside the Game tab
            // (flashcard flip in Study, submit in Quiz). Game-tab shortcuts
            // (submit/replay/exit while in Focus Mode) are handled inside
            // ModernVocabGame itself since that's where the relevant buttons live.
            useEffect(() => {
                const matches = (e, combo) => {
                    if (!combo) return false;
                    const parts = combo.split('+').map(p => p.trim());
                    const keyPart = parts[parts.length - 1];
                    const wantCtrl = parts.includes('Ctrl');
                    const wantShift = parts.includes('Shift');
                    const wantAlt = parts.includes('Alt');
                    if (wantCtrl !== e.ctrlKey || wantShift !== e.shiftKey || wantAlt !== e.altKey) return false;
                    if (keyPart === 'Space') return e.code === 'Space';
                    return e.key === keyPart;
                };
                const handleGlobalKeyDown = (e) => {
                    if (listeningForShortcut) return; // don't fire shortcuts while rebinding
                    const tag = document.activeElement?.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                    if (matches(e, shortcuts.replay)) {
                        const flip = document.querySelector('[data-flip-btn]');
                        if (flip) { e.preventDefault(); flip.click(); }
                    }
                    if (matches(e, shortcuts.submit)) {
                        const submitBtn = document.querySelector('[data-submit-btn]');
                        if (submitBtn && !submitBtn.disabled) submitBtn.click();
                    }
                    if (matches(e, shortcuts.soundToggle)) {
                        e.preventDefault();
                        setGlobalSound(s => !s);
                    }
                    if (matches(e, shortcuts.flashNext)) {
                        const nextBtn = document.querySelector('[data-flash-next]');
