            const baseSize = compact ? 'w-8 h-8' : 'w-9 h-9';
            const neutral = isNightMode
                ? 'bg-slate-900 text-slate-400 border-slate-600 hover:bg-slate-800 hover:text-slate-200'
                : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-100 hover:text-slate-600';
            return (
                <div
                    className={`inline-flex items-center gap-0.5 ${compact ? '' : 'p-0.5 rounded-lg bg-slate-50 border border-slate-100'}`}
                    onClick={(e) => e.stopPropagation()}
                    onPointerDown={(e) => e.stopPropagation()}
                    onPointerUp={(e) => e.stopPropagation()}
                >{items.map((item) => (
                        <button
                            key={item.id}
                            type="button"
                            title={item.title}
                            onClick={() => onSet(item.id)}
                            className={`${baseSize} flex items-center justify-center rounded-lg border-2 transition-all leading-none ${
                                level === item.id ? item.active : neutral
                            }`}
                        >
                            <span className={`fam-icon font-normal ${item.id === 'familiar' ? 'fam-icon-full' : ''}`} aria-hidden="true">{item.icon}</span>
                        </button>
                    ))}
                </div>
            );
        };

        const familiarityCardBorder = (level) => {
            if (level === 'familiar') return 'border-emerald-200 bg-emerald-50/20 border-l-4 border-l-emerald-500';
            if (level === 'semi') return 'fam-card-semi border-amber-200 bg-amber-50/20 border-l-4 border-l-amber-400';
            return 'border-slate-200 bg-white border-l-4 border-l-slate-300';
        };

        // Sound engine using Web Audio API (supports forced-play for quiz)
        const SoundEngine = (() => {
            let ctx = null;
            let enabled = false;
            const getCtx = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx;
            };
            const playTone = (freq, type, duration, vol=0.18, force=false) => {
                if (!enabled && !force) return;
                try {
                    const ac = getCtx();
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.connect(gain); gain.connect(ac.destination);
                    osc.type = type; osc.frequency.setValueAtTime(freq, ac.currentTime);
                    gain.gain.setValueAtTime(vol, ac.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
                    osc.start(ac.currentTime); osc.stop(ac.currentTime + duration);
                } catch(e){}
            };
            return {
                setEnabled: (v) => { enabled = v; },
                isEnabled: () => enabled,
                correct: (force=false) => { playTone(523, 'sine', 0.12, 0.18, force); setTimeout(()=>playTone(659,'sine',0.15,0.18,force),80); setTimeout(()=>playTone(784,'sine',0.2,0.18,force),160); },
                // Gentle descending "try again" cue instead of a harsh buzzer/rumble
                wrong:   (force=false) => { playTone(392, 'triangle', 0.14, 0.12, force); setTimeout(()=>playTone(311, 'triangle', 0.18, 0.1, force), 90); },
                combo:   (force=false) => { playTone(880, 'sine', 0.08, 0.12, force); setTimeout(()=>playTone(1046,'sine',0.12,0.15,force),60); },
                levelUp: (force=false) => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.18,force),i*90)); },
                tick:    (force=false) => { playTone(440, 'square', 0.05, 0.05, force); }
            };
        })();

        function ModernVocabGame({ userXP = 0, userLevel = 1, streak = 0, todayLearned = 0, dailyGoal = 10, wordPool, showBangla, triggerToast, onVictoryXP, appTheme, onThemeChange, shortcuts, globalSound, speechAccent = 'us', fieldVisibility = DEFAULT_FIELD_VISIBILITY, familiarityMap = null, onSetFamiliarity = null, onGameFinished = null, onReviewMissed = null, reviewActive = false, reviewCount = 0, onExitReview = null, mistakeBankCount = 0, onOpenMistakeBank = null }) {
            const [gameMode, setGameMode] = useState('menu'); // 'menu','classic','speed','match','fillin','truefalse','synant'
            const [gameState, setGameState] = useState('idle'); // 'idle','playing','summary','paused'
            const [score, setScore] = useState(0);
            const [combo, setCombo] = useState(0);
            const [maxCombo, setMaxCombo] = useState(0);
            const [lives, setLives] = useState(5);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [options, setOptions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [feedbackType, setFeedbackType] = useState(null); // 'correct','wrong'
            const [xpEarned, setXpEarned] = useState(0);
            const [missedWords, setMissedWords] = useState([]);
            const [questionsAnswered, setQuestionsAnswered] = useState(0);
            const [isImmersive, setIsImmersive] = useState(false);
            const [gameTheme, setGameTheme] = useState(appTheme || 'midnight');
            const [soundOn, setSoundOn] = useState(false);
            // Respect the global sound master when provided
            useEffect(() => { if (typeof globalSound !== 'undefined') setSoundOn(globalSound); }, [globalSound]);
            const [showLevelUp, setShowLevelUp] = useState(false);
            const [xpPopVal, setXpPopVal] = useState(null);
            const [shakeWrong, setShakeWrong] = useState(false);

            // "Show full word" reveal card — available after answering, in Classic Battle,
            // Fill-in-the-Blank, True/False, and the Synonym/Antonym game.
            const [revealWord, setRevealWord] = useState(false);

            // Speed Round — isolated timer to avoid full-panel flicker each second
            const [speedTimerActive, setSpeedTimerActive] = useState(false);
            const [speedTimeLeft, setSpeedTimeLeft] = useState(60);
            const speedTimerRef = useRef(null);
            const speedBadgeRef = useRef(null);
            const speedBadgeImmersiveRef = useRef(null);
            const speedProgressRef = useRef(null);
            const endGameRef = useRef(null);

            // Question navigation history (all game modes)
            const [nav, setNav] = useState({ list: [], idx: -1 });
            const [slideDir, setSlideDir] = useState('next');

            // Report the finished round up to the App once, when we land on the
            // summary screen — records missed words into the cross-session
            // mistake bank and logs the attempt into game history.
            const reportedRef = useRef(false);
            useEffect(() => {
                if (gameState === 'summary') {
                    if (!reportedRef.current && onGameFinished) {
                        reportedRef.current = true;
                        onGameFinished({ mode: gameMode, score, questionsAnswered, missedWords, maxCombo, isReview: reviewActive });
                    }
                } else {
                    reportedRef.current = false;
                }
            }, [gameState]);

            // Word Match
            const [matchWords, setMatchWords] = useState([]);
            const [matchMeanings, setMatchMeanings] = useState([]);
            const [selectedMatchWord, setSelectedMatchWord] = useState(null);
            const [selectedMatchMeaning, setSelectedMatchMeaning] = useState(null);
            const [matchedPairs, setMatchedPairs] = useState([]);
            const [matchWrongPair, setMatchWrongPair] = useState(null);

            // Fill in blank
            const [fillOptions, setFillOptions] = useState([]);
            const [fillQuestion, setFillQuestion] = useState(null);

            // True / False
            const [tfQuestion, setTfQuestion] = useState(null);
            // REVERSE: show the meaning, pick the word (Classic Battle + Speed Round).
            const [reverseMode, setReverseMode] = useState(() => localStorage.getItem('wordsmart_wq_reverse') === '1');
            useEffect(() => { try { localStorage.setItem('wordsmart_wq_reverse', reverseMode ? '1' : '0'); } catch (e) {} }, [reverseMode]);

            // Synonym / Antonym game (replaces the old Word Scramble)
            const [synAntQuestion, setSynAntQuestion] = useState(null);
            const [synAntOptions, setSynAntOptions] = useState([]);

            const containerRef = useRef(null);

            const makeSnapshot = () => ({
                mode: gameMode,
                currentQuestion, options,
                fillQuestion, fillOptions,
                tfQuestion,
                synAntQuestion, synAntOptions,
                matchWords, matchMeanings, matchedPairs,
                selectedAnswer, feedbackType,
                score, combo, lives, questionsAnswered
            });

            const restoreSnapshot = (snap) => {
                if (!snap) return;
                setCurrentQuestion(snap.currentQuestion || null);
                setOptions(snap.options || []);
                setFillQuestion(snap.fillQuestion || null);
                setFillOptions(snap.fillOptions || []);
                setTfQuestion(snap.tfQuestion || null);
                setSynAntQuestion(snap.synAntQuestion || null);
                setSynAntOptions(snap.synAntOptions || []);
                setMatchWords(snap.matchWords || []);
                setMatchMeanings(snap.matchMeanings || []);
                setMatchedPairs(snap.matchedPairs || []);
                setSelectedAnswer(snap.selectedAnswer ?? null);
                setFeedbackType(snap.feedbackType || null);
                setScore(snap.score ?? 0);
                setCombo(snap.combo ?? 0);
                setLives(snap.lives ?? 5);
                setQuestionsAnswered(snap.questionsAnswered ?? 0);
                setSelectedMatchWord(null);
                setSelectedMatchMeaning(null);
                setMatchWrongPair(null);
            };

            const pushNav = (snap) => {
                setNav(n => {
                    const list = [...n.list.slice(0, n.idx + 1), snap];
                    return { list, idx: list.length - 1 };
                });
            };

            const goNavPrev = () => {
                setNav(n => {
                    if (n.idx <= 0) return n;
                    setSlideDir('prev');
                    restoreSnapshot(n.list[n.idx - 1]);
                    return { ...n, idx: n.idx - 1 };
                });
            };

            const goNavNext = () => {
                setNav(n => {
                    if (n.idx < n.list.length - 1) {
                        setSlideDir('next');
                        restoreSnapshot(n.list[n.idx + 1]);
                        return { ...n, idx: n.idx + 1 };
                    }
                    return n;
                });
            };

            const slideCls = slideDir === 'prev' ? 'slide-prev' : 'slide-next';

            const GameNav = ({ nextDisabled = false, prevDisabled = false, onNextExtra }) => (
                <div className="flex justify-between gap-3 pt-1">
                    <button type="button" onClick={goNavPrev} disabled={prevDisabled || nav.idx <= 0}
                        className="flex-1 py-2.5 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl shadow-sm hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all text-sm">
                        ← Previous
                    </button>
                    <button type="button" onClick={() => { if (nav.idx < nav.list.length - 1) goNavNext(); else onNextExtra?.(); }} disabled={nextDisabled}
                        className="flex-1 py-2.5 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all text-sm">
                        Next →
                    </button>
                </div>
            );

            useEffect(() => { SoundEngine.setEnabled(soundOn); }, [soundOn]);
            useEffect(() => { if (appTheme) setGameTheme(appTheme); }, [appTheme]);

            const getPool = useCallback(() => {
                if (!wordPool || wordPool.length < 4) return [];
                return wordPool;
            }, [wordPool]);

            // If the selected chunk (or any filter) changes the actual set of words, return to
            // the menu so a round that was already running with the OLD chunk's questions
            // doesn't keep going. Signature uses ids only, so familiarity updates mid-game
            // don't trigger a reset.
            const poolSignature = useMemo(
                () => (wordPool || []).map(w => w.id).sort().join('|'),
                [wordPool]
            );
            const lastPoolSignatureRef = useRef(poolSignature);
            useEffect(() => {
                if (lastPoolSignatureRef.current === poolSignature) return;
                lastPoolSignatureRef.current = poolSignature;
                clearInterval(speedTimerRef.current);
                setSpeedTimerActive(false);
                setGameState('idle');
                setGameMode('menu');
            }, [poolSignature]);

            const makeQuestion = useCallback((pool) => {
                if (!pool || pool.length < 4) return null;
                const target = pool[Math.floor(Math.random() * pool.length)];
                const distractors = pool.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                return { target, options: [...distractors, target].sort(() => 0.5 - Math.random()) };
            }, []);

            // Picks a target word that has at least one synonym or antonym, then asks
            // the user to identify a real synonym or antonym of it among 4 options.
            const startSynAnt = (pool, pushHistory = true) => {
                const p = pool || getPool();
                const eligible = p.filter(w => (w.synonyms && w.synonyms.length) || (w.antonyms && w.antonyms.length));
                if (!eligible.length) {
                    triggerToast("No words with synonyms/antonyms yet — add some via Word Manager or Add Word!");
                    setGameMode('menu'); setGameState('idle');
                    return;
                }
                const target = eligible[Math.floor(Math.random() * eligible.length)];
                const hasSyn = target.synonyms && target.synonyms.length > 0;
                const hasAnt = target.antonyms && target.antonyms.length > 0;
                const askSynonym = hasSyn && hasAnt ? Math.random() > 0.5 : hasSyn;
                const relatedList = askSynonym ? target.synonyms : target.antonyms;
                const correctEntry = relatedList[Math.floor(Math.random() * relatedList.length)];

                const usedWords = new Set([String(target.word).toLowerCase(), String(correctEntry.word).toLowerCase()]);
                const distractorPool = p.filter(w => !usedWords.has(String(w.word).toLowerCase()));
                const distractors = distractorPool.sort(() => 0.5 - Math.random()).slice(0, 3).map(w => ({ id: w.id, word: w.word }));
                const correctOption = { id: `correct-${target.id}-${askSynonym ? 'syn' : 'ant'}`, word: correctEntry.word };
                const shuffledOptions = [...distractors, correctOption].sort(() => 0.5 - Math.random());

                setSynAntQuestion({ target, askSynonym, correctEntry, correctId: correctOption.id });
                setSynAntOptions(shuffledOptions);
                setSelectedAnswer(null); setFeedbackType(null); setRevealWord(false);
                if (pushHistory) setTimeout(() => pushNav(makeSnapshot()), 0);
            };

            const startMatchRound = (pool, pushHistory = true) => {
                const sample = (pool || getPool()).sort(() => 0.5 - Math.random()).slice(0, 6);
                const words = sample.sort(() => 0.5 - Math.random());
                const meanings = sample.map(w=>({id:w.id, meaning:w.meaning_en || w.meaning})).sort(() => 0.5 - Math.random());
                setMatchWords(words);
                setMatchMeanings(meanings);
                setMatchedPairs([]); setSelectedMatchWord(null); setSelectedMatchMeaning(null); setMatchWrongPair(null);
                if (pushHistory) setTimeout(() => pushNav(makeSnapshot()), 0);
            };

            const startFillIn = (pool, pushHistory = true) => {
                const p = pool || getPool();
                const withSentence = p.filter(w => w.sentence && w.sentence.toLowerCase().includes(String(w.word || '').toLowerCase()));
                const target = (withSentence.length ? withSentence : p)[Math.floor(Math.random() * (withSentence.length || p.length))];
                const distractors = p.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const blankedSentence = target.sentence
                    ? target.sentence.replace(new RegExp(target.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '_____')
                    : `What is the meaning of "${target.word}"?`;
                setFillQuestion({ target, sentence: blankedSentence });
                setFillOptions([...distractors.map(w=>({id:w.id, word:w.word})), {id:target.id, word:target.word}].sort(()=>0.5-Math.random()));
                setSelectedAnswer(null); setFeedbackType(null); setRevealWord(false);
                if (pushHistory) setTimeout(() => pushNav(makeSnapshot()), 0);
            };

            const startTrueFalse = (pool, pushHistory = true) => {
                const p = pool || getPool();
                const target = p[Math.floor(Math.random() * p.length)];
                const isTrue = Math.random() > 0.45;
                let shownMeaning = target.meaning_en || target.meaning;
                let shownWord = null; // set only in Reverse mode: the meaning is fixed and the WORD shown may be wrong
                const other = isTrue ? null : p.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random())[0];
                if (reverseMode) {
                    shownWord = isTrue ? target.word : ((other && other.word) || target.word);
                } else if (!isTrue) {
                    shownMeaning = (other && (other.meaning_en || other.meaning)) || shownMeaning;
                }
                setTfQuestion({ target, shownMeaning, shownWord, isTrue });
                setSelectedAnswer(null); setFeedbackType(null); setRevealWord(false);
                if (pushHistory) setTimeout(() => pushNav(makeSnapshot()), 0);
            };

            const loadClassicQuestion = (pool, pushHistory = true) => {
                const q = makeQuestion(pool);
                if (q) {
                    setCurrentQuestion(q.target);
                    setOptions(q.options);
                    setSelectedAnswer(null);
                    setFeedbackType(null);
                    setRevealWord(false);
                    if (pushHistory) setTimeout(() => pushNav(makeSnapshot()), 0);
                }
            };

            const startGame = (mode) => {
                const pool = getPool();
                if (!pool.length) { triggerToast("Need at least 4 words to play!"); return; }
                setGameMode(mode);
                setGameState('playing');
                setScore(0); setCombo(0); setMaxCombo(0); setXpEarned(0);
                setMissedWords([]); setQuestionsAnswered(0);
                setSelectedAnswer(null); setFeedbackType(null);
                setRevealWord(false);
                setNav({ list: [], idx: -1 });
                setSlideDir('next');
                clearInterval(speedTimerRef.current);

                if (mode === 'classic') {
                    setLives(5);
                    loadClassicQuestion(pool);
                } else if (mode === 'speed') {
                    setLives(999);
                    setSpeedTimeLeft(60);
                    setSpeedTimerActive(true);
                    loadClassicQuestion(pool);
                } else if (mode === 'match') {
                    startMatchRound(pool);
                } else if (mode === 'fillin') {
                    setLives(5);
                    startFillIn(pool);
                } else if (mode === 'truefalse') {
                    setLives(5);
                    startTrueFalse(pool);
                } else if (mode === 'synant') {
                    setLives(5);
                    startSynAnt(pool);
                }
            };

            const endGame = () => {
                setGameState('summary');
                setSpeedTimerActive(false);
                clearInterval(speedTimerRef.current);
            };
            endGameRef.current = endGame;

            // Speed timer — paints the badge/progress DOM directly every tick.
            // No setState in the interval, so the game panel does NOT re-render each second.
            const speedTimeLeftRef = useRef(60);
            const paintSpeedTimer = (val) => {
                const urgent = val <= 10;
                const label = `⏱ ${val}s`;
                if (speedBadgeImmersiveRef.current) {
                    speedBadgeImmersiveRef.current.textContent = label;
                    speedBadgeImmersiveRef.current.classList.toggle('bg-red-50', urgent);
                    speedBadgeImmersiveRef.current.classList.toggle('text-red-600', urgent);
                    speedBadgeImmersiveRef.current.classList.toggle('border-red-300', urgent);
                    speedBadgeImmersiveRef.current.classList.toggle('bg-sky-50', !urgent);
                    speedBadgeImmersiveRef.current.classList.toggle('text-sky-700', !urgent);
                    speedBadgeImmersiveRef.current.classList.toggle('border-sky-200', !urgent);
                }
                if (speedBadgeRef.current) {
                    speedBadgeRef.current.textContent = label;
                    speedBadgeRef.current.classList.toggle('bg-red-50', urgent);
                    speedBadgeRef.current.classList.toggle('text-red-600', urgent);
                    speedBadgeRef.current.classList.toggle('border-red-300', urgent);
                    speedBadgeRef.current.classList.toggle('bg-amber-50', !urgent);
                    speedBadgeRef.current.classList.toggle('text-amber-700', !urgent);
                    speedBadgeRef.current.classList.toggle('border-amber-200', !urgent);
                }
                if (speedProgressRef.current) {
                    speedProgressRef.current.style.width = `${(val / 60) * 100}%`;
                    speedProgressRef.current.classList.toggle('bg-red-500', urgent);
                    speedProgressRef.current.classList.toggle('bg-sky-500', !urgent);
                }
            };
            // Re-paint after any render (e.g. answering a question re-renders the panel
            // for unrelated reasons) so the badges never show a stale number.
            useEffect(() => { paintSpeedTimer(speedTimeLeftRef.current); });

            useEffect(() => {
                if (gameMode !== 'speed' || gameState !== 'playing' || !speedTimerActive) return;
                speedTimeLeftRef.current = 60;
                setSpeedTimeLeft(60);
                paintSpeedTimer(60);
                speedTimerRef.current = setInterval(() => {
                    const next = speedTimeLeftRef.current <= 1 ? 0 : speedTimeLeftRef.current - 1;
                    speedTimeLeftRef.current = next;
                    paintSpeedTimer(next);
                    if (next <= 0) {
                        clearInterval(speedTimerRef.current);
                        endGameRef.current?.();
                        return;
                    }
                    if (next <= 10) SoundEngine.tick();
                }, 1000);
                return () => clearInterval(speedTimerRef.current);
            }, [gameMode, gameState, speedTimerActive]);

            const awardXP = (amount) => {
                setXpEarned(prev => prev + amount);
                setXpPopVal('+' + amount + ' XP');
                if (onVictoryXP) onVictoryXP(amount);
                setTimeout(() => setXpPopVal(null), 900);
            };

            const applyAnswerPreview = (event, isCorrect) => {
                const el = event?.currentTarget;
                if (!el) return;
                el.style.transition = 'background-color 0.2s ease-in-out, border-color 0.2s ease-in-out';
                el.style.willChange = 'background-color, border-color';
                el.style.backgroundColor = isCorrect ? '#16a34a' : '#dc2626';
                el.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';
                el.style.color = '#ffffff';
            };

            const handleAnswer = (chosenOpt, event) => {
                if (selectedAnswer !== null) return;
                const pool = getPool();
                const isCorrect = chosenOpt.id === currentQuestion.id;
                applyAnswerPreview(event, isCorrect);

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        setSelectedAnswer(chosenOpt.id);
                        if (isCorrect) {
                            setFeedbackType('correct');
                            SoundEngine.correct();
                            const newCombo = combo + 1;
                            setCombo(newCombo);
                            if (newCombo > maxCombo) setMaxCombo(newCombo);
                            if (newCombo > 0 && newCombo % 3 === 0) SoundEngine.combo();
                            const xp = 10 + (newCombo >= 3 ? newCombo * 3 : 0);
                            awardXP(xp);
                            setScore(prev => prev + xp);
                            setQuestionsAnswered(prev => prev + 1);
                            if (gameMode === 'classic' && questionsAnswered + 1 >= 10) {
                                setTimeout(() => endGame(), 1200);
                            }
                        } else {
                            setFeedbackType('wrong');
                            setShakeWrong(true);
                            setTimeout(() => setShakeWrong(false), 500);
                            SoundEngine.wrong();
                            setCombo(0);
                            setMissedWords(prev => [...prev, currentQuestion]);
                            setQuestionsAnswered(prev => prev + 1);
                            const newLives = lives - 1;
                            setLives(newLives);
                            if (newLives <= 0 || (gameMode === 'classic' && questionsAnswered + 1 >= 10)) {
                                setTimeout(() => endGame(), 1200);
                            }
                        }
                    }, 10);
                });
            };

            const handleFillAnswer = (chosenOpt, event) => {
                if (selectedAnswer !== null) return;
                const isCorrect = chosenOpt.id === fillQuestion.target.id;
                applyAnswerPreview(event, isCorrect);

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        setSelectedAnswer(chosenOpt.id);
                        if (isCorrect) {
                            setFeedbackType('correct'); SoundEngine.correct();
                            const newCombo = combo + 1; setCombo(newCombo);
                            if (newCombo > maxCombo) setMaxCombo(newCombo);
                            awardXP(12 + (newCombo >= 3 ? newCombo * 3 : 0));
                            setScore(prev => prev + 12); setQuestionsAnswered(prev => prev + 1);
                        } else {
                            setFeedbackType('wrong'); SoundEngine.wrong();
                            setCombo(0); setMissedWords(prev => [...prev, fillQuestion.target]);
                            setQuestionsAnswered(prev => prev + 1);
                            const newLives = lives - 1; setLives(newLives);
                            if (newLives <= 0) { setTimeout(()=>endGame(), 900); }
                        }
                    }, 10);
                });
            };

            const continueFillIn = () => {
                if (lives <= 0) { endGame(); return; }
                setSlideDir('next');
                startFillIn(getPool());
            };

            const handleTfAnswer = (guessTrue, event) => {
                if (selectedAnswer !== null || !tfQuestion) return;
                const isCorrect = guessTrue === tfQuestion.isTrue;
                applyAnswerPreview(event, isCorrect);

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        setSelectedAnswer(guessTrue ? 'true' : 'false');
                        if (isCorrect) {
                            setFeedbackType('correct'); SoundEngine.correct();
                            const newCombo = combo + 1; setCombo(newCombo);
                            if (newCombo > maxCombo) setMaxCombo(newCombo);
                            awardXP(10 + (newCombo >= 3 ? newCombo * 2 : 0));
                            setScore(prev => prev + 10); setQuestionsAnswered(prev => prev + 1);
                        } else {
                            setFeedbackType('wrong'); SoundEngine.wrong();
                            setCombo(0); setMissedWords(prev => [...prev, tfQuestion.target]);
                            setQuestionsAnswered(prev => prev + 1);
                            const newLives = lives - 1; setLives(newLives);
                            if (newLives <= 0) setTimeout(() => endGame(), 1100);
                        }
                    }, 10);
                });
            };

            const handleSynAntAnswer = (chosen, event) => {
                if (selectedAnswer !== null || !synAntQuestion) return;
                const isCorrect = chosen.id === synAntQuestion.correctId;
                applyAnswerPreview(event, isCorrect);

                requestAnimationFrame(() => {
                    setTimeout(() => {
                        setSelectedAnswer(chosen.id);
                        if (isCorrect) {
                            setFeedbackType('correct'); SoundEngine.correct();
                            const newCombo = combo + 1; setCombo(newCombo);
                            if (newCombo > maxCombo) setMaxCombo(newCombo);
                            awardXP(12 + (newCombo >= 3 ? newCombo * 3 : 0));
                            setScore(prev => prev + 12); setQuestionsAnswered(prev => prev + 1);
                        } else {
                            setFeedbackType('wrong'); SoundEngine.wrong();
                            setCombo(0); setMissedWords(prev => [...prev, synAntQuestion.target]);
                            setQuestionsAnswered(prev => prev + 1);
                            const newLives = lives - 1; setLives(newLives);
                            if (newLives <= 0) setTimeout(() => endGame(), 1100);
                        }
                    }, 10);
                });
            };

            // Word Match logic
            const handleMatchWord = (w) => {
                if (matchedPairs.includes(w.id)) return;
                setSelectedMatchWord(w);
                if (selectedMatchMeaning) checkMatchPair(w, selectedMatchMeaning);
            };
            const handleMatchMeaning = (m) => {
                if (matchedPairs.includes(m.id)) return;
                setSelectedMatchMeaning(m);
                if (selectedMatchWord) checkMatchPair(selectedMatchWord, m);
            };
            const checkMatchPair = (word, meaning) => {
                if (word.id === meaning.id) {
                    SoundEngine.correct();
                    const newPairs = [...matchedPairs, word.id];
                    setMatchedPairs(newPairs);
                    awardXP(15); setScore(prev => prev + 15); setCombo(prev => { const n=prev+1; if(n>maxCombo)setMaxCombo(n); return n; });
                    setSelectedMatchWord(null); setSelectedMatchMeaning(null);
                    if (newPairs.length === matchWords.length) {
                        setTimeout(() => {
                            SoundEngine.levelUp();
                            setSlideDir('next');
                            startMatchRound(getPool());
                        }, 800);
                    }
                } else {
                    SoundEngine.wrong();
                    setMatchWrongPair({ word: word.id, meaning: meaning.id });
                    setCombo(0);
                    setTimeout(() => { setMatchWrongPair(null); setSelectedMatchWord(null); setSelectedMatchMeaning(null); }, 700);
                }
            };

            const toggleFocusMode = () => {
                setIsImmersive(prev => !prev);
            };
            useEffect(() => {
                const keys = shortcuts || DEFAULT_SHORTCUTS;
                const matches = (e, combo) => {
                    if (!combo) return false;
                    const parts = combo.split('+').map(p => p.trim());
                    const keyPart = parts[parts.length - 1];
                    const wantCtrl = parts.includes('Ctrl');
                    const wantShift = parts.includes('Shift');
                    const wantAlt = parts.includes('Alt');
                    if (wantCtrl !== e.ctrlKey || wantShift !== e.shiftKey || wantAlt !== e.altKey) return false;
                    if (keyPart === 'Space') return e.code === 'Space';
                    return e.key === keyPart;
                };
                const handleKeyDown = (e) => {
                    const tag = document.activeElement?.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                    if (matches(e, keys.exit) && isImmersive) setIsImmersive(false);
                    if (matches(e, keys.submit)) { const btn = document.querySelector('[data-submit-btn]'); btn?.click(); }
                    if (matches(e, keys.replay)) { e.preventDefault(); const btn = document.querySelector('[data-audio-btn]'); btn?.click(); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isImmersive, shortcuts]);

            const activeTheme = {
                shell: 'focus-overlay text-[color:var(--text-primary)]',
                card: 'bg-[color:var(--surface-0)] border-[color:var(--border-c)] text-[color:var(--text-primary)]',
                button: 'bg-[color:var(--surface-2)] text-[color:var(--text-primary)] border-[color:var(--border-c)] hover:opacity-80',
                muted: 'text-[color:var(--text-muted)]'
            };

            const wrapClass = isImmersive
                ? `fixed inset-0 z-[60] overflow-auto p-4 sm:p-8 ${activeTheme.shell} transition-all ease-in-out duration-200`
                : '';

            const SoundToggle = ({ className = '' }) => (
                <button
                    type="button"
                    title={soundOn ? 'Sound on' : 'Sound off'}
                    onClick={() => setSoundOn(s => !s)}
                    className={`w-9 h-9 inline-flex items-center justify-center rounded-xl text-sm border transition-all ${soundOn ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-slate-100 text-slate-500 border-slate-200'} ${className}`}
                >
                    <span aria-hidden="true">{soundOn ? '🔊' : '🔇'}</span>
                </button>
            );

            const ThemeMini = () => (
                <div className={`flex items-center gap-1 rounded-xl border p-1 ${isImmersive ? 'border-[color:var(--border-c)] bg-[color:var(--surface-2)]' : 'border-[color:var(--border-c)] bg-[color:var(--surface-2)] shadow-sm'}`}>
                    {['midnight','light'].map((themeId) => (
                       <button key={themeId} onClick={() => { setGameTheme(themeId); onThemeChange?.(themeId); }} className={`px-2 py-1 rounded-lg text-[10px] font-bold capitalize ${gameTheme === themeId ? 'bg-indigo-600 text-white' : isImmersive ? 'text-[color:var(--text-primary)] hover:bg-[color:var(--surface-0)]' : 'text-[color:var(--text-primary)] hover:bg-[color:var(--surface-0)]'}`}>
                            {themeId === 'midnight' ? '🌙' : '☀️'}
                        </button>
                    ))}
                </div>
            );

            const FocusControls = () => (
                <div className="flex items-center gap-2 flex-wrap">
                    <SoundToggle />
                    <ThemeMini />
                    {!isImmersive && (
                        <button
                            type="button"
                            onClick={toggleFocusMode}
                            title="Focus mode"
                            className="px-3 py-1.5 rounded-xl text-xs font-bold border transition-all bg-slate-100 hover:bg-slate-200 text-slate-600 border-slate-200"
                        >
                            🖥️ Focus
                        </button>
                    )}
                    {isImmersive && (
                        <button
                            type="button"
                            onClick={() => setIsImmersive(false)}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold border bg-[color:var(--surface-2)] text-[color:var(--text-primary)] border-[color:var(--border-c)] shadow-sm hover:opacity-90"
                        >
                            ✕ Exit
                        </button>
                    )}
                </div>
            );

            const LivesBar = ({count}) => (
                <div className="flex gap-1 items-center">
                    {Array.from({length:5}).map((_,i) => (
                        <span key={i} className={`text-lg transition-all ${i < count ? 'opacity-100' : 'opacity-20 grayscale'}`}>❤️</span>
                    ))}
                </div>
            );

            const ComboBar = () => combo >= 2 ? (
                <div className={`flex items-center justify-center gap-2 py-1 px-3 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-black ${combo>=3?'combo-flash':''}`}>
                    🔥 {combo}x COMBO {combo>=5?'🔥':''}
                </div>
            ) : null;

            // FocusShell is created ONCE (via useRef) and always reads the latest game
            // data through focusShellDataRef instead of closing over it directly. This
            // gives it a stable component identity across re-renders — previously it was
            // redefined as a brand-new function on every ModernVocabGame render (e.g. every
            // time a familiarity button was clicked anywhere on screen), which made React
            // tear down and rebuild the entire subtree inside it, silently resetting any
            // local state within (such as the "show full word family" dropdown's open/closed
            // state in WordRevealContent). Keeping the same function reference across renders
            // prevents that remount while still always showing current score/lives/etc.
            const focusShellDataRef = useRef();
            focusShellDataRef.current = { containerRef, wrapClass, isImmersive, gameState, score, lives, gameMode, speedBadgeImmersiveRef, FocusControls, setGameState, setGameMode, speedTimerRef, setSpeedTimerActive };
            const FocusShell = useRef(({ children, className = '' }) => {
                const d = focusShellDataRef.current;
                return (
                    <div ref={d.containerRef} className={`${d.wrapClass} ${className}`}>
                        {d.isImmersive ? (
                            <div className="focus-stage space-y-4 py-2">
                                <div className="flex items-center justify-between gap-3 flex-wrap pb-2 border-b border-[color:var(--border-c)]">
                                    <div className="flex items-center gap-3 flex-wrap">
                                        <div className="text-sm font-black opacity-80">Word Quest · Focus</div>
                                        {d.gameState === 'playing' && (
                                            <div className="flex items-center gap-2 text-xs font-bold">
                                                <span className="px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200">⭐ {d.score}</span>
                                                {d.gameMode !== 'match' && d.gameMode !== 'speed' && d.lives < 900 && (
                                                    <span className="px-2 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-200">❤️ {d.lives}</span>
                                                )}
                                                {d.gameMode === 'speed' && (
                                                    <span ref={d.speedBadgeImmersiveRef} className="speed-timer-badge px-2 py-1 rounded-lg border bg-sky-50 text-sky-700 border-sky-200">⏱ 60s</span>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <d.FocusControls />
                                        {d.gameState === 'playing' && (
                                            <button
                                                type="button"
                                                onClick={() => { d.setGameState('idle'); d.setGameMode('menu'); clearInterval(d.speedTimerRef.current); d.setSpeedTimerActive(false); }}
                                                className="px-3 py-1.5 rounded-xl text-xs font-bold border bg-slate-900 text-white border-slate-700 hover:opacity-90"
                                            >
                                                ← Back
                                            </button>
                                        )}
                                    </div>
                                </div>
                                {children}
                            </div>
                        ) : children}
                    </div>
                );
            }).current;

            // MENU
            if (gameState === 'idle') return (
                <FocusShell className={!isImmersive ? 'space-y-6 tab-panel-enter' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-3">
                            <h2 className={`text-xl font-black flex items-center gap-2 ${appTheme === 'light' ? 'text-slate-800' : 'text-white'}`}>🎮 Word Quest</h2>
                            {/* Streak + Daily Goal card — replaces the old Level/XP badge.
                                Left: a flame with the current day-streak. Right: today's
                                word goal with a progress bar. */}
                            {(() => {
                                const goal = Math.max(1, dailyGoal || 1);
                                const done = Math.max(0, todayLearned || 0);
                                const pct = Math.min(100, Math.round((done / goal) * 100));
                                const reached = done >= goal;
                                const light = appTheme === 'light';
                                return (
                                    <div
                                        className={`flex items-stretch rounded-2xl overflow-hidden border min-w-[250px] ${light ? 'bg-white border-slate-200 shadow-sm' : 'bg-white/5 border-white/15'}`}
                                        title={`${streak || 0}-day streak · ${done}/${goal} words today`}
                                    >
                                        <div className={`flex flex-col items-center justify-center px-3.5 py-2 ${streak > 0 ? 'bg-gradient-to-b from-orange-400 to-rose-500 text-white' : (light ? 'bg-slate-100 text-slate-400' : 'bg-white/10 text-white/40')}`}>
                                            <span className="text-lg leading-none">🔥</span>
                                            <span className="text-base font-black leading-none mt-1">{streak || 0}</span>
                                            <span className="text-[8px] font-extrabold uppercase tracking-widest opacity-90 mt-0.5">day{streak === 1 ? '' : 's'}</span>
                                        </div>
                                        <div className="flex-1 px-3 py-2 flex flex-col justify-center gap-1.5">
                                            <div className="flex items-center justify-between gap-3">
                                                <span className={`text-[10px] font-extrabold uppercase tracking-wider ${light ? 'text-slate-500' : 'text-white/60'}`}>Today's goal</span>
                                                <span className={`text-[11px] font-black ${reached ? 'text-emerald-500' : (light ? 'text-slate-700' : 'text-white')}`}>{done}/{goal} words</span>
                                            </div>
                                            <div className={`h-2 rounded-full overflow-hidden ${light ? 'bg-slate-200' : 'bg-white/15'}`}>
                                                <div className={`h-full rounded-full transition-all duration-500 ${reached ? 'bg-emerald-500' : 'bg-gradient-to-r from-amber-400 to-orange-500'}`} style={{ width: `${pct}%` }} />
                                            </div>
                                            <span className={`text-[10px] font-semibold ${light ? 'text-slate-400' : 'text-white/45'}`}>
                                                {reached ? '🎉 Goal reached — keep the flame alive!' : `${goal - done} more to hit today's goal`}
                                            </span>
                                        </div>
                                    </div>
                                );
                            })()}
                            <FocusControls />
                        </div>
                    )}
                    {isImmersive && (
                        <h2 className="text-2xl font-black text-center mb-2">🎮 Choose a challenge</h2>
                    )}

                    {!isImmersive && (
                        reviewActive ? (
                            <div className="flex items-center justify-between gap-3 bg-rose-50 border border-rose-200 rounded-xl px-4 py-2.5 flex-wrap">
                                <span className="text-xs font-bold text-rose-700">📝 Review mode — pick any mode below to retry your {reviewCount} missed word{reviewCount === 1 ? '' : 's'}</span>
                                <button onClick={onExitReview} className="text-[11px] font-bold text-rose-500 hover:text-rose-700 underline">Exit Review</button>
                            </div>
                        ) : (
                            <div className="flex items-center gap-2 flex-wrap">
                                <button
                                    onClick={() => onOpenMistakeBank && onOpenMistakeBank('mistakes')}
                                    disabled={mistakeBankCount === 0}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all disabled:opacity-40 disabled:cursor-not-allowed ${appTheme === 'light' ? 'bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100' : 'bg-rose-500/10 text-rose-300 border-rose-500/30 hover:bg-rose-500/20'}`}
                                >
                                    📉 Mistakes ({mistakeBankCount})
                                </button>
                                <button
                                    onClick={() => onOpenMistakeBank && onOpenMistakeBank('history')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${appTheme === 'light' ? 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100' : 'bg-white/5 text-white/70 border-white/15 hover:bg-white/10'}`}
                                >
                                    📜 History
                                </button>
                            </div>
                        )
                    )}

                    {!isImmersive && (
                        <label className={`flex items-center justify-between gap-3 rounded-xl px-4 py-2.5 border cursor-pointer ${appTheme === 'light' ? 'bg-white border-slate-200' : 'bg-white/5 border-white/15'}`}>
                            <span className={`text-xs font-bold ${appTheme === 'light' ? 'text-slate-700' : 'text-white/80'}`}>🔁 Reverse mode <span className="font-medium opacity-70">— see the meaning, pick the word (Classic, Speed &amp; True/False)</span></span>
                            <input type="checkbox" checked={reverseMode} onChange={(e) => setReverseMode(e.target.checked)} className="w-4 h-4 shrink-0" />
                        </label>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {[
                            { mode:'classic', icon:'⚔️', title:'Classic Battle', desc:'Answer 10 questions with 5 lives. Combo for bonus XP!', color:'from-indigo-500 to-blue-700' },
                            { mode:'speed', icon:'⚡', title:'Speed Round', desc:'Answer as many as you can in 60 seconds!', color: 'from-indigo-600 to-slate-700' },
                            { mode:'match', icon:'🔗', title:'Word Match', desc:'Match words to their meanings, Quizlet style!', color:'from-emerald-600 to-teal-700' },
                            { mode:'fillin', icon:'✏️', title:'Fill in the Blank', desc:'A sentence appears — pick the missing word!', color:'from-purple-600 to-violet-700' },
                            { mode:'truefalse', icon:'✅', title:'True or False', desc:'Decide if the meaning shown for a word is correct!', color:'from-slate-600 to-slate-800' },
                            { mode:'synant', icon:'🔀', title:'Synonym / Antonym', desc:'Pick the correct synonym or antonym of the word!', color:'from-fuchsia-600 to-pink-700' },
                        ].map(m => (
                            <button key={m.mode} onClick={()=>startGame(m.mode)} className={`bg-gradient-to-br ${m.color} text-white rounded-2xl p-5 text-left shadow-lg hover:scale-[1.02] active:scale-95 transition-all space-y-1`}>
                                <div className="text-2xl">{m.icon}</div>
                                <div className="font-black text-base">{m.title}</div>
                                <div className="text-xs opacity-80">{m.desc}</div>
                            </button>
                        ))}
                    </div>
                    {wordPool && wordPool.length < 4 && (
                        <div className="text-center py-6 bg-amber-50 rounded-xl border border-amber-200 text-amber-700 text-sm font-semibold">⚠️ Add at least 4 words to start playing!</div>
                    )}
                </FocusShell>
            );

            // SUMMARY SCREEN
            if (gameState === 'summary') return (
                <FocusShell className={!isImmersive ? 'space-y-6 tab-panel-enter max-w-lg mx-auto' : 'tab-panel-enter'}>
                    <div className="bg-gradient-to-br from-indigo-900 to-slate-900 rounded-2xl p-8 text-white text-center space-y-4 shadow-xl">
                        <div className="text-5xl victory-bounce inline-block">🎉</div>
                        <h2 className="text-2xl font-black">Round Complete!</h2>
                        <div className="grid grid-cols-3 gap-3 text-center">
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-amber-300">{score}</div><div className="text-xs opacity-70">Score</div></div>
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-emerald-300">{xpEarned}</div><div className="text-xs opacity-70">XP Earned</div></div>
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-purple-300">{maxCombo}x</div><div className="text-xs opacity-70">Best Combo</div></div>
                        </div>
                        <div className="bg-white/10 rounded-xl p-3 text-left space-y-1">
                            <div className="text-xs font-bold uppercase tracking-wider opacity-60 mb-2">Session Stats</div>
                            <div className="flex justify-between text-sm"><span>Questions Answered</span><span className="font-bold">{questionsAnswered}</span></div>
                            <div className="flex justify-between text-sm"><span>Words Missed</span><span className={`font-bold ${missedWords.length>0?'text-red-300':'text-emerald-300'}`}>{missedWords.length}</span></div>
                            <div className="flex justify-between text-sm"><span>Accuracy</span><span className="font-bold">{questionsAnswered>0?Math.round(((questionsAnswered-missedWords.length)/questionsAnswered)*100):0}%</span></div>
                        </div>
                        {missedWords.length > 0 && (
                            <div className="bg-red-900/30 rounded-xl p-3 text-left border border-red-500/20">
                                <div className="text-xs font-bold text-red-300 mb-2">📝 Review These Words:</div>
                                <div className="flex flex-wrap gap-1">{missedWords.slice(0,8).map(w=><span key={w.id} className="text-xs bg-red-800/40 text-red-200 px-2 py-0.5 rounded-full">{w.word}</span>)}</div>
                            </div>
                        )}
                    </div>
                    <div className="flex gap-3">
                        <button onClick={()=>startGame(gameMode)} className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow transition-all">🔄 Play Again</button>
                        <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-all">🏠 Main Menu</button>
                    </div>
                    {missedWords.length > 0 && onReviewMissed && (
                        <button
                            onClick={() => { onReviewMissed(missedWords); setGameState('idle'); setGameMode('menu'); }}
                            className="w-full py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl transition-all text-sm"
                        >
                            📝 Retry These {missedWords.length} Missed Word{missedWords.length === 1 ? '' : 's'}
                        </button>
                    )}
                </FocusShell>
            );

            // WORD MATCH MODE
            if (gameMode === 'match' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-4' : ''}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <div className="flex items-center gap-3">
                                <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                                <span className="text-sm font-black text-emerald-700">🔗 Word Match</span>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score} pts</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}
                    <div className="bg-gradient-to-br from-emerald-600 to-teal-700 rounded-2xl p-5 text-white text-center space-y-2 shadow-xl">
                        <div className="text-xs font-bold text-emerald-100 uppercase tracking-wider">Tap a word, then tap its matching meaning</div>
                        <div className="w-full bg-white/20 rounded-full h-2 overflow-hidden">
                            <div className="h-full bg-white transition-all duration-500" style={{ width: `${matchWords.length ? (matchedPairs.length / matchWords.length) * 100 : 0}%` }} />
                        </div>
                        <div className="text-[11px] font-bold text-emerald-100">{matchedPairs.length} / {matchWords.length} matched</div>
                    </div>
                    <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-2">
                            <div className="text-xs font-bold text-emerald-600 uppercase tracking-wider text-center">Words</div>
                            {matchWords.map(w => {
                                const isMatched = matchedPairs.includes(w.id);
                                const isSelected = selectedMatchWord?.id === w.id;
                                const isWrong = matchWrongPair?.word === w.id;
                                return (
                                    <button key={w.id} disabled={isMatched} onClick={()=>handleMatchWord(w)}
                                        className={`match-tile w-full p-3 rounded-xl text-sm font-bold border text-left shadow-sm transition-colors duration-70 ${isMatched?'bg-emerald-100 text-emerald-700 border-emerald-300 opacity-70':isWrong?'bg-orange-100 text-orange-700 border-orange-300':isSelected?'bg-emerald-600 text-white border-emerald-400':'bg-white text-slate-800 border-slate-200 hover:border-emerald-400 hover:bg-slate-50'}`}>
                                        <span className="line-clamp-2">{isMatched?'✓ ':''}{w.word}</span>
                                    </button>
                                );
                            })}
                        </div>
                        <div className="space-y-2">
                            <div className="text-xs font-bold text-teal-600 uppercase tracking-wider text-center">Meanings</div>
                            {matchMeanings.map(m => {
                                const isMatched = matchedPairs.includes(m.id);
                                const isSelected = selectedMatchMeaning?.id === m.id;
                                const isWrong = matchWrongPair?.meaning === m.id;
                                return (
                                    <button key={m.id} disabled={isMatched} onClick={()=>handleMatchMeaning(m)}
                                        className={`match-tile w-full p-3 rounded-xl text-xs border text-left shadow-sm transition-colors duration-70 ${isMatched?'bg-emerald-100 text-emerald-700 border-emerald-300 opacity-70':isWrong?'bg-orange-100 text-orange-700 border-orange-300':isSelected?'bg-teal-600 text-white border-teal-400':'bg-white text-slate-700 border-slate-200 hover:border-teal-400 hover:bg-slate-50'}`}>
                                        <span className="line-clamp-3">{isMatched?'✓ ':''}{m.meaning}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    <GameNav onNextExtra={() => { setSlideDir('next'); startMatchRound(getPool()); }} />
                    {xpPopVal && <div className="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // FILL IN THE BLANK MODE
            if (gameMode === 'fillin' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 max-w-xl mx-auto' : ''}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}
                    {fillQuestion && (
                        <div className={`space-y-4 answer-card-container relative ${slideCls}`} key={`fill-${nav.idx}`}>
                            <div className="bg-gradient-to-br from-purple-600 to-violet-700 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl">
                                <div className="text-xs font-bold text-purple-100 uppercase tracking-wider">Fill in the blank:</div>
                                <p className="text-base font-normal text-white/90 leading-relaxed italic">"{fillQuestion.sentence}"</p>
                                {selectedAnswer !== null && (
                                    <div className="flex justify-center">
                                        <SpeakPair text={fillQuestion.target.sentence || fillQuestion.target.word} notify={triggerToast} accent={speechAccent} variant="onDark" isSentence={!!fillQuestion.target.sentence} primaryAudioBtn />
                                    </div>
                                )}

                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {fillOptions.map((opt,i) => {
                                    const isSelected = selectedAnswer === opt.id;
                                    const isCorrect = opt.id === fillQuestion.target.id;
                                    let style = 'wq-opt-default bg-white text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-500 hover:text-indigo-900 hover:font-semibold';
                                    if (selectedAnswer !== null) {
                                        if (isCorrect) style = 'quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                                        else if (isSelected) style = 'quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold';
                                    }
                                    return <button key={i} disabled={selectedAnswer!==null} onClick={(e)=>handleFillAnswer(opt, e)} className={`answer-option-btn p-3.5 rounded-xl border text-sm font-semibold ${style}`}>{opt.word}</button>;
                                })}
                            </div>
                            {selectedAnswer !== null && (
                                <ShowFullWordToggle
                                    revealed={revealWord}
                                    onToggle={() => setRevealWord(v => !v)}
                                    {...getFamilyReveal(fillQuestion.target)}
                                    accent={speechAccent}
                                    notify={triggerToast}
                                    showBangla={showBangla}
                                    fieldVisibility={fieldVisibility}
                                    famMap={familiarityMap}
                                    onSetFamiliarity={onSetFamiliarity}
                                />
                            )}
                            <GameNav nextDisabled={selectedAnswer === null} onNextExtra={continueFillIn} />
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // TRUE OR FALSE
            if (gameMode === 'truefalse' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 max-w-xl mx-auto' : ''}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border bg-slate-100 text-slate-500 border-slate-200`}>🖥️</button>
                            </div>
                        </div>
                    )}
                    {tfQuestion && (
                        <div className={`space-y-4 answer-card-container relative ${slideCls}`} key={`tf-${nav.idx}`}>
                            <div className="bg-gradient-to-br from-slate-600 to-slate-800 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl">
                                <div className="text-xs font-bold text-slate-200 uppercase tracking-wider">True or False?</div>
                                {tfQuestion.shownWord ? (
                                    <>
                                        <h2 className="text-xl font-black leading-snug">{tfQuestion.shownMeaning}</h2>
                                        <p className="text-base font-medium bg-white/15 rounded-xl px-4 py-3 border border-white/20">is the word “{tfQuestion.shownWord}”</p>
                                        {feedbackType === 'wrong' && selectedAnswer === 'true' && !tfQuestion.isTrue && (
                                            <div className="text-sm font-bold text-slate-200">Correct word: {tfQuestion.target.word}</div>
                                        )}
                                    </>
                                ) : (
                                    <>
                                        <h2 className="text-3xl font-black">{tfQuestion.target.word}</h2>
                                        <div className="flex justify-center">
                                            <SpeakPair text={tfQuestion.target.word} notify={triggerToast} accent={speechAccent} variant="onDark" primaryAudioBtn />
                                        </div>
                                        <p className="text-base font-medium bg-white/15 rounded-xl px-4 py-3 border border-white/20">means: “{tfQuestion.shownMeaning}”</p>
                                        {feedbackType === 'wrong' && selectedAnswer === 'true' && !tfQuestion.isTrue && (
                                            <div className="text-sm font-bold text-slate-200">Correct meaning: {tfQuestion.target.meaning_en || tfQuestion.target.meaning}</div>
                                        )}
                                    </>
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {[
                                    { id: true, label: 'True', style: 'from-emerald-500 to-emerald-600' },
                                    { id: false, label: 'False', style: 'from-orange-500 to-amber-600' }
                                ].map(opt => {
                                    const picked = selectedAnswer !== null && ((selectedAnswer === 'true') === opt.id);
                                    const reveal = selectedAnswer !== null;
                                    const correctPick = opt.id === tfQuestion.isTrue;
                                    let cls = `bg-gradient-to-br ${opt.style} text-white border-transparent`;
                                    if (reveal) {
                                        if (correctPick) cls = 'quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                                        else if (picked) cls = 'quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold';
                                        else cls = 'bg-slate-100 text-slate-400 border-slate-200';
                                    }
                                    return (
                                        <button key={String(opt.id)} disabled={selectedAnswer!==null} onClick={(e) => handleTfAnswer(opt.id, e)} className={`answer-option-btn py-4 rounded-xl border text-base font-black ${cls}`}>
                                            {opt.label}
                                        </button>
                                    );
                                })}
                            </div>
                            {selectedAnswer !== null && (
                                <ShowFullWordToggle
                                    revealed={revealWord}
                                    onToggle={() => setRevealWord(v => !v)}
                                    {...getFamilyReveal(tfQuestion.target)}
                                    accent={speechAccent}
                                    notify={triggerToast}
                                    showBangla={showBangla}
                                    fieldVisibility={fieldVisibility}
                                    famMap={familiarityMap}
                                    onSetFamiliarity={onSetFamiliarity}
                                />
                            )}
                            <GameNav nextDisabled={selectedAnswer === null} onNextExtra={() => { setSlideDir('next'); startTrueFalse(getPool()); }} />
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // SYNONYM / ANTONYM
            if (gameMode === 'synant' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 max-w-xl mx-auto' : ''}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border bg-slate-100 text-slate-500 border-slate-200`}>🖥️</button>
                            </div>
                        </div>
                    )}
                    {synAntQuestion && (
                        <div className={`space-y-4 answer-card-container relative ${slideCls}`} key={`synant-${nav.idx}`}>
                            <div className="bg-gradient-to-br from-fuchsia-600 to-pink-700 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl">
                                <div className="text-xs font-bold text-fuchsia-100 uppercase tracking-wider">
                                    Which word is a {synAntQuestion.askSynonym ? 'SYNONYM' : 'ANTONYM'} of...
                                </div>
                                <h2 className="text-3xl font-black tracking-wide">{synAntQuestion.target.word}</h2>
                                <div className="flex justify-center">
                                    <SpeakPair text={synAntQuestion.target.word} notify={triggerToast} accent={speechAccent} variant="onDark" primaryAudioBtn />
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {synAntOptions.map((opt,i) => {
                                    const isSelected = selectedAnswer === opt.id;
                                    const isCorrect = opt.id === synAntQuestion.correctId;
                                    let style = 'wq-opt-default bg-white text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-500 hover:text-indigo-900 hover:font-semibold';
                                    if (selectedAnswer !== null) {
                                        if (isCorrect) style = 'quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                                        else if (isSelected) style = 'quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold';
                                    }
                                    return <button key={i} disabled={selectedAnswer!==null} onClick={(e)=>handleSynAntAnswer(opt, e)} className={`answer-option-btn p-3.5 rounded-xl border text-sm font-semibold ${style}`}>{opt.word}</button>;
                                })}
                            </div>
                            {selectedAnswer !== null && (
                                <ShowFullWordToggle
                                    revealed={revealWord}
                                    onToggle={() => setRevealWord(v => !v)}
                                    item={synAntQuestion.target}
                                    focusEntry={synAntQuestion.correctEntry}
                                    focusTone={synAntQuestion.askSynonym ? 'syn' : 'ant'}
                                    accent={speechAccent}
                                    notify={triggerToast}
                                    showBangla={showBangla}
                                    fieldVisibility={fieldVisibility}
                                    famMap={familiarityMap}
                                    onSetFamiliarity={onSetFamiliarity}
                                />
                            )}
                            <GameNav nextDisabled={selectedAnswer === null} onNextExtra={() => { setSlideDir('next'); startSynAnt(getPool()); }} />
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // CLASSIC & SPEED ROUND PLAYING
            return (
                <FocusShell className={!isImmersive ? `space-y-4 max-w-2xl mx-auto ${gameMode === 'speed' ? 'speed-round-container' : ''}` : (gameMode === 'speed' ? 'speed-round-container' : '')}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');clearInterval(speedTimerRef.current);setSpeedTimerActive(false);}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">

                                    <div ref={speedBadgeRef} className="speed-timer-badge flex items-center gap-1 text-sm font-black px-3 py-1 rounded-xl border bg-amber-50 text-amber-700 border-amber-200">
                                        ⏱ 60s
                                    </div>
                                )}
                                <ComboBar/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}

                    {gameMode === 'speed' && (
