                        <div className="speed-progress-track w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div ref={speedProgressRef} className="h-2 rounded-full bg-sky-500" style={{width:'100%', transition:'width 1s linear'}}></div>
                        </div>
                    )}

                    {currentQuestion && (
                        <div className={`answer-card-container relative ${slideCls}`} key={`q-${nav.idx}`}>
                        <div className={`bg-gradient-to-br rounded-2xl p-6 text-white text-center space-y-3 shadow-xl ${
                                        gameMode === 'classic'
                                            ? 'from-indigo-600 to-blue-700'
                                            : 'from-indigo-900 to-slate-900'
                                    }`}>
                            <div className="text-xs font-bold text-indigo-300 uppercase tracking-widest">
                                {gameMode === 'classic' ? `⚔️ Classic Battle — Q${questionsAnswered+1}/10` : '⚡ Speed Round — What does this mean?'}
                            </div>
                                {reverseMode ? (
                                    <>
                                        <h2 className="text-xl md:text-2xl font-black leading-snug">{currentQuestion.meaning_en || currentQuestion.meaning}</h2>
                                        {showBangla && (currentQuestion.meaning_bn || currentQuestion.bangla) && <div className="text-sm opacity-80 font-medium">{currentQuestion.meaning_bn || currentQuestion.bangla}</div>}
                                        <div className="text-[11px] opacity-70">Which word means this?</div>
                                    </>
                                ) : (
                                    <>
                                        <h2 className="text-3xl md:text-4xl font-black tracking-wide">{currentQuestion.word}</h2>
                                        <div className="flex justify-center">
                                            <SpeakPair text={currentQuestion.word} notify={triggerToast} accent={speechAccent} variant="onDark" primaryAudioBtn />
                                        </div>
                                    </>
                                )}
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mt-3">
                            {options.map((opt, idx) => {
                                const isSelected = selectedAnswer === opt.id;
                                const isCorrect = opt.id === currentQuestion.id;
                                let style = 'wq-opt-default bg-white text-slate-700 border-slate-200 hover:bg-indigo-50 hover:border-indigo-500 hover:text-indigo-900 hover:font-semibold';
                                if (selectedAnswer !== null) {
                                    if (isCorrect) style = 'quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                                    else if (isSelected) style = 'quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold';
                                }
                                return (
                                    <button key={idx} disabled={selectedAnswer !== null} onClick={(e) => handleAnswer(opt, e)}
                                        className={`answer-option-btn p-4 rounded-xl border text-sm text-left flex flex-col gap-1 ${style}`}>
                                        {reverseMode ? (
                                            <span className="font-bold text-base">{opt.word}</span>
                                        ) : (
                                            <>
                                                <span className="font-semibold">{opt.meaning_en || opt.meaning}</span>
                                                {showBangla && (opt.meaning_bn || opt.bangla) && <span className="text-xs opacity-75 font-medium">{opt.meaning_bn || opt.bangla}</span>}
                                            </>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                        {selectedAnswer !== null && (
                            <ShowFullWordToggle
                                revealed={revealWord}
                                onToggle={() => setRevealWord(v => !v)}
                                {...getFamilyReveal(currentQuestion)}
                                accent={speechAccent}
                                notify={triggerToast}
                                showBangla={showBangla}
                                fieldVisibility={fieldVisibility}
                                famMap={familiarityMap}
                                onSetFamiliarity={onSetFamiliarity}
                            />
                        )}
                        <GameNav nextDisabled={selectedAnswer === null} onNextExtra={() => { setSlideDir('next'); loadClassicQuestion(getPool()); }} />
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );
        }

        // Monotonically increasing word-ID generator. Using a single counter
        // (instead of `Date.now() * 10000 + idx`, which restarts idx at 0 for
        // every import call) guarantees every word gets a unique numeric id
        // even when several imports happen in the same millisecond — e.g.
        // importing multiple JSON files back-to-back, or adding a word right
        // after a bulk import. Seeded from Date.now() so it still sorts after
        // any older ids already saved from a previous session.
        let __wsNextWordId = Date.now() * 10000;
        const generateUniqueWordId = () => {
            __wsNextWordId += 1;
            return __wsNextWordId;
        };

        // ============================================================
        // INDEXEDDB STORAGE (for allWords / allFamiliarity / allTrash)
        // ------------------------------------------------------------
        // These three are the only pieces of data that can realistically
        // grow into the many-MB range (hundreds or thousands of words).
        // localStorage caps out around 5-10MB per site, which a large
        // vocabulary can exceed — causing silent save failures. IndexedDB
        // has no such small fixed ceiling (browsers typically allow it to
        // grow to a meaningful chunk of free disk space), so it's the
        // storage engine for just these three keys. Everything else in the
        // app (settings, theme, XP, books list, etc.) is small and stays
        // in localStorage exactly as before.
        //
        // This is a tiny promise-based wrapper around the native IndexedDB
        // API, storing each of the three datasets as one value under one
        // key in a single object store — simplest possible shape, easy to
        // reason about, no need for indexes or multiple stores.
        // ============================================================
        const WS_IDB_NAME = 'wordsmart_db';
        const WS_IDB_VERSION = 1;
        const WS_IDB_STORE = 'kv';

        function wsIdbOpen() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    reject(new Error('IndexedDB is not available in this browser.'));
                    return;
                }
                const req = indexedDB.open(WS_IDB_NAME, WS_IDB_VERSION);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(WS_IDB_STORE)) {
                        db.createObjectStore(WS_IDB_STORE);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error || new Error('Failed to open IndexedDB.'));
            });
        }

        async function wsIdbGet(key) {
            const db = await wsIdbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(WS_IDB_STORE, 'readonly');
                const store = tx.objectStore(WS_IDB_STORE);
                const req = store.get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error || new Error(`Failed to read "${key}" from IndexedDB.`));
            });
        }

        async function wsIdbSet(key, value) {
            const db = await wsIdbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(WS_IDB_STORE, 'readwrite');
                tx.objectStore(WS_IDB_STORE).put(value, key);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error || new Error(`Failed to write "${key}" to IndexedDB.`));
            });
        }

        // Catches any error thrown while rendering the app (anywhere below it)
        // and shows a visible message + Reload button instead of a blank white
        // page. React has no built-in recovery from a render-time crash — it
        // just unmounts the whole tree — so without this, any bug anywhere in
        // the app (bad import data, a stray undefined, etc.) looks exactly
        // like "the page is broken" with zero information about why.
        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { error: null };
            }
            static getDerivedStateFromError(error) {
                return { error };
            }
            componentDidCatch(error, info) {
                console.error('Vocabulation Companion crashed:', error, info);
            }
            render() {
                if (this.state.error) {
                    return (
                        <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px', background: '#f8fafc', fontFamily: 'sans-serif' }}>
                            <div style={{ maxWidth: '560px', background: '#fff', border: '1px solid #e2e8f0', borderRadius: '16px', padding: '28px', boxShadow: '0 4px 20px rgba(0,0,0,0.06)' }}>
                                <h1 style={{ fontSize: '18px', fontWeight: 800, color: '#1e293b', margin: '0 0 8px' }}>⚠️ Something went wrong</h1>
                                <p style={{ fontSize: '13px', color: '#64748b', margin: '0 0 14px', lineHeight: 1.5 }}>
                                    The app hit an error while rendering, instead of just going blank. Your saved words are safe in this browser's storage — reloading should bring everything back.
                                </p>
                                <pre style={{ fontSize: '11px', color: '#b91c1c', background: '#fef2f2', border: '1px solid #fecaca', borderRadius: '10px', padding: '10px', overflowX: 'auto', whiteSpace: 'pre-wrap', wordBreak: 'break-word', margin: '0 0 16px' }}>
                                    {String((this.state.error && this.state.error.message) || this.state.error)}
                                </pre>
                                <button
                                    onClick={() => window.location.reload()}
                                    style={{ background: '#4f46e5', color: '#fff', border: 'none', borderRadius: '10px', padding: '10px 18px', fontWeight: 700, fontSize: '13px', cursor: 'pointer' }}
                                >
                                    🔄 Reload
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // ============================================================
        // MULTIPLAYER ARENA
        // Live rooms on Firebase Realtime Database. Everything is client-side:
        // GitHub Pages serves this file, Firebase keeps every player's screen in
        // sync. Data layout (all under rooms/<CODE>):
        //   meta    { hostUid, hostName, mode, style, wordCount, timeLimit, status, round, startAt, endAt }
        //   players { <uid>: { name, photo, online, ready, score, answered, done, finishedMs } }
        //   words   { <uid>: [ { w, m, b, e, s, a } ... ] }   (slim copies of the words a player put in)
        // ============================================================
        const MP_CODE_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
        const MP_MAX_PLAYERS = 10;
        const MP_STYLES = [
            { id: 'mixed', label: 'Mixed', desc: 'A bit of everything' },
            { id: 'meaning', label: 'Classic', desc: 'See the word, pick the meaning' },
            { id: 'word', label: 'Reverse', desc: 'See the meaning, pick the word' },
            { id: 'fill', label: 'Fill in the Blank', desc: 'Complete the sentence' },
            { id: 'synant', label: 'Synonym / Antonym', desc: 'Pick the synonym or opposite' },
        ];
        const MP_MODES = [
            { id: 'swap', icon: '🔀', label: 'Word Swap', desc: 'Everyone picks words from their own list. You face everybody else\'s words.' },
            { id: 'same', icon: '🏁', label: 'Same Words', desc: 'The host picks the words and everyone races through the same set.' },
        ];

        function mpMakeCode() {
            let c = '';
            for (let i = 0; i < 5; i++) c += MP_CODE_ALPHABET[Math.floor(Math.random() * MP_CODE_ALPHABET.length)];
            return c;
        }
        function mpHash(str) {
            let h = 1779033703 ^ str.length;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            return (h ^ (h >>> 16)) >>> 0;
        }
        function mpRng(seedStr) {
            let a = mpHash(seedStr);
            return function () {
                a |= 0; a = (a + 0x6D2B79F5) | 0;
                let t = Math.imul(a ^ (a >>> 15), 1 | a);
                t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
        }
        function mpShuffle(arr, rnd) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(rnd() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }
        const mpEscapeRe = (s) => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        // Small copy of a word: only what the game needs, so room data stays tiny.
        function mpSlimWord(w) {
            const names = (list) => (Array.isArray(list) ? list : [])
                .map(x => (typeof x === 'string' ? x : (x && (x.word || x.text)) || ''))
                .map(x => String(x).trim().slice(0, 70)).filter(Boolean).slice(0, 3);
            // Lengths are capped to stay inside the database security rules.
            return {
                w: String(w.word || '').trim().slice(0, 70),
                m: String(w.meaning_en || w.meaning || '').trim().slice(0, 350),
                b: String(w.meaning_bn || w.bangla || '').trim().slice(0, 350),
                e: String(w.example_main || w.sentence || '').trim().slice(0, 450),
                s: names(w.synonyms),
                a: names(w.antonyms),
            };
        }

        // Turns a pool of slim words into multiple-choice questions. Seeded, so the
        // same player always gets the same questions/options on every re-render.
        function mpBuildQuestions(pool, style, seedStr, extra) {
            const rnd = mpRng(seedStr);
            const items = mpShuffle((pool || []).filter(p => p && p.w), rnd);
            // Wrong options may also come from the rest of the room's chunk (so they look plausible)
            const distractItems = [...items, ...(extra || []).filter(e => e && e.w && !items.some(i => i.w === e.w))];
            const types = ['meaning', 'word', 'fill', 'synant'];
            const out = [];
            const pickDistractors = (cands, exclude, n) => {
                const seen = new Set(exclude.map(x => String(x).toLowerCase()));
                const uniq = [];
                mpShuffle(cands, rnd).forEach(c => {
                    const k = String(c || '').trim();
                    if (!k || seen.has(k.toLowerCase())) return;
                    seen.add(k.toLowerCase());
                    uniq.push(k);
                });
                return uniq.slice(0, n);
            };
            items.forEach((p, i) => {
                const others = distractItems.filter(o => o.w !== p.w);
                const syn = (p.s || []).filter(Boolean);
                const ant = (p.a || []).filter(Boolean);
                const canFill = !!p.e && new RegExp(mpEscapeRe(p.w), 'i').test(p.e);
                let type = style === 'mixed' ? types[i % types.length] : style;
                if (type === 'fill' && !canFill) type = 'meaning';
                if (type === 'synant' && !syn.length && !ant.length) type = 'meaning';
                if ((type === 'meaning' || type === 'word') && !p.m) {
                    if (canFill) type = 'fill'; else return;
                }
                let prompt, sub, answer, distractors;
                if (type === 'meaning') {
                    prompt = p.w; sub = 'What does it mean?'; answer = p.m;
                    distractors = pickDistractors(others.map(o => o.m), [answer], 3);
                } else if (type === 'word') {
                    prompt = p.m; sub = 'Which word matches this meaning?'; answer = p.w;
                    distractors = pickDistractors(others.map(o => o.w), [answer], 3);
                } else if (type === 'fill') {
                    prompt = p.e.replace(new RegExp(mpEscapeRe(p.w), 'i'), '_____'); sub = 'Which word fits the blank?'; answer = p.w;
                    distractors = pickDistractors(others.map(o => o.w), [answer], 3);
                } else {
                    const useAnt = ant.length && (!syn.length || rnd() < 0.5);
                    const src = useAnt ? ant : syn;
                    answer = src[Math.floor(rnd() * src.length)];
                    prompt = p.w; sub = useAnt ? 'Pick the OPPOSITE (antonym)' : 'Pick the SYNONYM';
                    distractors = pickDistractors(others.map(o => o.w), [answer, p.w, ...syn, ...ant], 3);
                }
                const options = mpShuffle([answer, ...distractors], rnd);
                if (options.length < 2) return;
                out.push({ id: out.length, type, prompt, sub, options, answer });
            });
            return out;
        }

        function mpRank(players, limitMs) {
            const rows = Object.entries(players || {}).map(([uid, p]) => ({
                uid, name: p.name || 'Player', photo: p.photo || '', score: p.score || 0, answered: p.answered || 0,
                finishedMs: typeof p.finishedMs === 'number' ? p.finishedMs : limitMs + 1, done: !!p.done, online: p.online !== false,
            }));
            rows.sort((a, b) => (b.score - a.score) || (a.finishedMs - b.finishedMs) || a.name.localeCompare(b.name));
            let rank = 0;
            rows.forEach((r, i) => {
                const prev = rows[i - 1];
                if (!prev || prev.score !== r.score || prev.finishedMs !== r.finishedMs) rank = i + 1;
                r.rank = rank;
            });
            return rows;
        }
        const mpOrdinal = (n) => ({ 1: '1st', 2: '2nd', 3: '3rd' }[n] || `${n}th`);
        const mpFmtClock = (ms) => {
            const s = Math.max(0, Math.ceil(ms / 1000));
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        };
        const mpFmtTime = (ms) => `${(ms / 1000).toFixed(1)}s`;

        function MpAvatar({ name, photo, size = 32 }) {
            const colors = ['bg-indigo-500', 'bg-rose-500', 'bg-emerald-500', 'bg-amber-500', 'bg-sky-500', 'bg-fuchsia-500', 'bg-teal-500', 'bg-orange-500'];
            const c = colors[mpHash(String(name || '?')) % colors.length];
            if (photo) return <img src={photo} alt="" referrerPolicy="no-referrer" style={{ width: size, height: size }} className="rounded-full object-cover shrink-0" />;
            return (
                <div style={{ width: size, height: size, fontSize: size * 0.42 }} className={`${c} text-white rounded-full flex items-center justify-center font-black shrink-0`}>
                    {String(name || '?').trim().charAt(0).toUpperCase()}
                </div>
            );
        }

        // ---------- The in-game screen (countdown -> questions -> results) ----------
        function MpPlay({ code, room, uid, serverNow, onUpdateMe, onPlayAgain, onLeave, isHost, onResults }) {
            const meta = room.meta;
            const limitMs = (meta.timeLimit || 60) * 1000;
            const startAt = meta.startAt;
            const endAt = meta.endAt;

            const pool = useMemo(() => {
                const words = room.words || {};
                const out = [];
                if (meta.mode === 'same') {
                    Object.values(words[meta.hostUid] || {}).forEach(w => out.push(w));
                } else {
                    Object.keys(words).forEach(owner => {
                        if (owner === uid) return;
                        Object.values(words[owner] || {}).forEach(w => out.push(w));
                    });
                }
                return out;
            }, [meta.mode, meta.hostUid, uid, JSON.stringify(room.words || {})]);

            const chunkWords = useMemo(() => Object.values(room.chunk || {}), [JSON.stringify(room.chunk || {})]);
            const questions = useMemo(
                () => mpBuildQuestions(pool, meta.style || 'mixed', `${code}-${meta.round}-${uid}`, chunkWords),
                [pool, meta.style, meta.round, code, uid, chunkWords]
            );

            const [now, setNow] = useState(serverNow());
            const [idx, setIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [picked, setPicked] = useState(null);
            const doneRef = useRef(false);
            const advanceRef = useRef(null);

            useEffect(() => {
                const t = setInterval(() => setNow(serverNow()), 250);
                return () => { clearInterval(t); if (advanceRef.current) clearTimeout(advanceRef.current); };
            }, []);

            const started = now >= startAt;
            const finishedAll = idx >= questions.length;
            const timeUp = now >= endAt;

            useEffect(() => {
                if (doneRef.current || !started) return;
                if (!(finishedAll || timeUp)) return;
                doneRef.current = true;
                const finishedMs = finishedAll ? Math.max(0, Math.min(now, endAt) - startAt) : limitMs;
                onUpdateMe({ score, answered: idx, done: true, finishedMs });
            }, [now, idx, started]);

            const answer = (opt) => {
                if (picked !== null || timeUp || finishedAll || !started) return;
                const q = questions[idx];
                const right = opt === q.answer;
                const newScore = right ? score + 1 : score;
                setPicked(opt);
                if (right) setScore(newScore);
                onUpdateMe({ score: newScore, answered: idx + 1 });
                advanceRef.current = setTimeout(() => { setPicked(null); setIdx(i => i + 1); }, right ? 450 : 900);
            };

            const players = room.players || {};
            const ranking = mpRank(players, limitMs);
            const onlineRows = ranking.filter(r => r.online);
            const allDone = onlineRows.length > 0 && onlineRows.every(r => r.done);
            const resultsReady = started && (allDone || now > endAt + 2500);

            // tell the parent once, so points / wins can be recorded on my public profile
            const resultsFiredRef = useRef(false);
            useEffect(() => {
                if (resultsReady && !resultsFiredRef.current) {
                    resultsFiredRef.current = true;
                    if (onResults) onResults(ranking);
                }
            }, [resultsReady]);

            // ---- results ----
            if (resultsReady) {
                const total = ranking.length;
                const podium = ranking.filter(r => r.rank <= 3);
                const label = (r) => r.rank === 1 ? '🏆 Winner' : (r.rank === 2 ? (total > 2 ? '🥈 Runner-up' : 'Lost') : (r.rank === 3 ? '🥉 Third' : `${mpOrdinal(r.rank)} place`));
                const medal = { 1: '🥇', 2: '🥈', 3: '🥉' };
                return (
                    <div className="space-y-5">
                        <div className="rounded-3xl p-6 text-center bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white shadow-xl">
                            <div className="text-xs font-bold uppercase tracking-widest opacity-80">Game over</div>
                            <h3 className="text-2xl font-black mt-1">Final standings</h3>
                            <div className="flex items-end justify-center gap-3 mt-6 flex-wrap">
                                {[ranking.find(r => r.rank === 2), ranking.find(r => r.rank === 1), ranking.find(r => r.rank === 3)].filter(Boolean).map(r => (
                                    <div key={r.uid} className={`flex flex-col items-center rounded-2xl px-4 py-3 bg-white/15 backdrop-blur ${r.rank === 1 ? 'pb-6 scale-110' : ''}`}>
                                        <div className="text-2xl">{medal[r.rank]}</div>
                                        <MpAvatar name={r.name} photo={r.photo} size={r.rank === 1 ? 52 : 40} />
                                        <div className="text-sm font-black mt-1 max-w-[110px] truncate">{r.name}</div>
                                        <div className="text-xs font-bold opacity-90">{r.score} correct</div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl divide-y divide-slate-100 overflow-hidden">
                            {ranking.map(r => (
                                <div key={r.uid} className={`flex items-center gap-3 px-4 py-3 ${r.uid === uid ? 'bg-indigo-50' : ''}`}>
                                    <div className="w-8 text-center text-sm font-black text-slate-500">{mpOrdinal(r.rank)}</div>
                                    <MpAvatar name={r.name} photo={r.photo} />
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm font-extrabold text-slate-800 truncate">{r.name}{r.uid === uid ? ' (you)' : ''}</div>
                                        <div className="text-[11px] font-semibold text-slate-400">{label(r)}</div>
                                    </div>
                                    <div className="text-right">
                                        <div className="text-base font-black text-slate-800">{r.score}<span className="text-xs font-bold text-slate-400"> / {r.answered}</span></div>
                                        <div className="text-[10px] font-semibold text-slate-400">{r.done && r.finishedMs <= limitMs ? (r.finishedMs >= limitMs ? 'time up' : mpFmtTime(r.finishedMs)) : 'time up'}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="flex gap-2 flex-wrap">
                            {isHost ? (
                                <button onClick={onPlayAgain} className="flex-1 min-w-[160px] py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700">🔁 Play again (back to lobby)</button>
                            ) : (
                                <div className="flex-1 min-w-[160px] py-3 rounded-xl bg-slate-100 text-slate-500 font-semibold text-xs text-center">Waiting for the host to start another round…</div>
                            )}
                            <button onClick={onLeave} className="px-5 py-3 rounded-xl border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-100">Leave room</button>
                        </div>
                    </div>
                );
            }

            // ---- countdown ----
            if (!started) {
                const secs = Math.max(1, Math.ceil((startAt - now) / 1000));
                return (
                    <div className="rounded-3xl bg-slate-900 text-white p-12 text-center shadow-xl">
                        <div className="text-xs font-bold uppercase tracking-widest text-indigo-300">Get ready</div>
                        <div className="text-8xl font-black mt-3 tabular-nums">{secs}</div>
                        <div className="text-sm text-slate-400 mt-3">{questions.length} questions · {mpFmtClock(limitMs)} on the clock</div>
                    </div>
                );
            }

            // ---- no questions could be built ----
            if (questions.length === 0) {
                return (
                    <div className="bg-white border border-slate-200 rounded-2xl p-8 text-center">
                        <div className="text-3xl">🤔</div>
                        <p className="text-sm font-bold text-slate-700 mt-2">Not enough words to build questions.</p>
                        <p className="text-xs text-slate-400 mt-1">Words need meanings, and there must be at least two of them.</p>
                        <button onClick={onLeave} className="mt-4 px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">Leave room</button>
                    </div>
                );
            }

            // ---- waiting for others after finishing ----
            if (finishedAll || timeUp) {
                return (
                    <div className="bg-white border border-slate-200 rounded-2xl p-10 text-center">
                        <div className="text-4xl">{timeUp && !finishedAll ? '⏰' : '✅'}</div>
                        <h3 className="text-lg font-black text-slate-800 mt-2">{timeUp && !finishedAll ? "Time's up!" : 'All done!'}</h3>
                        <p className="text-sm text-slate-500 mt-1">You got <b>{score}</b> right. Waiting for the others to finish…</p>
                        <div className="mt-4 flex justify-center gap-1.5 flex-wrap">
                            {ranking.map(r => (
                                <span key={r.uid} className={`px-2.5 py-1 rounded-full text-[11px] font-bold ${r.done || !r.online ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>{r.name} {r.done ? '✓' : (r.online ? '…' : '(left)')}</span>
                            ))}
                        </div>
                    </div>
                );
            }

            // ---- the question ----
            const q = questions[idx];
            const remaining = Math.max(0, endAt - now);
            const pct = Math.max(0, Math.min(100, (remaining / limitMs) * 100));
            const urgent = remaining < 10000;
            return (
                <div className="grid lg:grid-cols-[1fr_260px] gap-4">
                    <div className="space-y-3">
                        <div className="bg-white border border-slate-200 rounded-2xl p-3">
                            <div className="flex items-center justify-between text-xs font-extrabold">
                                <span className="text-slate-500">Question {idx + 1} / {questions.length}</span>
                                <span className={`tabular-nums text-base ${urgent ? 'text-rose-600 animate-pulse' : 'text-slate-800'}`}>⏱ {mpFmtClock(remaining)}</span>
                                <span className="text-emerald-600">✔ {score}</span>
                            </div>
                            <div className="h-2 rounded-full bg-slate-200 mt-2 overflow-hidden">
                                <div className={`h-full transition-all duration-300 ${urgent ? 'bg-rose-500' : 'bg-indigo-500'}`} style={{ width: `${pct}%` }} />
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-3xl p-6 shadow-sm">
                            <div className="text-[11px] font-extrabold uppercase tracking-widest text-indigo-500">{q.sub}</div>
                            <div className={`font-black text-slate-900 mt-2 ${q.type === 'meaning' || q.type === 'synant' ? 'text-4xl' : 'text-xl leading-snug'}`}>{q.prompt}</div>
                            <div className="grid sm:grid-cols-2 gap-2.5 mt-5">
                                {q.options.map((opt, i) => {
                                    const isRight = picked !== null && opt === q.answer;
                                    const isWrong = picked === opt && opt !== q.answer;
                                    return (
                                        <button
                                            key={i}
                                            disabled={picked !== null}
                                            onClick={() => answer(opt)}
                                            className={`text-left px-4 py-3 rounded-xl border-2 text-sm font-bold transition-all ${isRight ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : isWrong ? 'bg-rose-50 border-rose-500 text-rose-800' : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-400 hover:bg-indigo-50'}`}
                                        >
                                            <span className="text-slate-400 mr-2">{String.fromCharCode(65 + i)}</span>{opt}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                    <div className="bg-white border border-slate-200 rounded-2xl p-3 h-fit">
                        <div className="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 mb-2">Live scoreboard</div>
                        <div className="space-y-1.5">
                            {ranking.map(r => (
                                <div key={r.uid} className={`flex items-center gap-2 rounded-lg px-2 py-1.5 ${r.uid === uid ? 'bg-indigo-50' : ''} ${r.online ? '' : 'opacity-40'}`}>
                                    <span className="w-5 text-[11px] font-black text-slate-400">{r.rank}</span>
                                    <MpAvatar name={r.name} photo={r.photo} size={22} />
                                    <span className="flex-1 min-w-0 truncate text-xs font-bold text-slate-700">{r.name}</span>
                                    <span className="text-xs font-black text-slate-800">{r.uid === uid ? score : r.score}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // ---------- Word picker used in the lobby ----------
        function MpWordPicker({ books, allWords, defaultBookId, wordCount, picks, setPicks, locked }) {
            const [bookId, setBookId] = useState(defaultBookId || (books[0] && books[0].id));
            const [search, setSearch] = useState('');
            const [openId, setOpenId] = useState(null);
            const list = (allWords[bookId] || []);
            const keyOf = (w) => String(w.word || '').trim().toLowerCase();
            const relatedNames = (rel) => (Array.isArray(rel) ? rel : [])
                .map(x => (typeof x === 'string' ? x : (x && (x.word || x.text)) || ''))
                .map(x => String(x).trim()).filter(Boolean).slice(0, 3);
            const picked = new Set(picks.map(p => p.w.toLowerCase()));
            const q = search.trim().toLowerCase();
            const shown = list.filter(w => w.word && (!q || String(w.word).toLowerCase().includes(q))).slice(0, 80);
            const toggle = (w) => {
                if (locked) return;
                const k = keyOf(w);
                if (picked.has(k)) setPicks(picks.filter(p => p.w.toLowerCase() !== k));
                else if (picks.length < wordCount) setPicks([...picks, mpSlimWord(w)]);
            };
            const randomFill = () => {
                if (locked) return;
                const have = new Set(picks.map(p => p.w.toLowerCase()));
                const candidates = list.filter(w => w.word && !have.has(keyOf(w)) && (w.meaning_en || w.meaning));
                const rnd = Math.random;
                const need = wordCount - picks.length;
                setPicks([...picks, ...mpShuffle(candidates, rnd).slice(0, need).map(mpSlimWord)]);
            };
            return (
                <div className="space-y-2">
                    <div className="flex gap-2 flex-wrap">
                        <select value={bookId} onChange={(e) => setBookId(e.target.value)} disabled={locked} className="px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 bg-white">
                            {books.map(b => <option key={b.id} value={b.id}>{b.name} ({(allWords[b.id] || []).length})</option>)}
                        </select>
                        <input value={search} onChange={(e) => setSearch(e.target.value)} disabled={locked} placeholder="Search words…" className="flex-1 min-w-[120px] px-3 py-2 rounded-lg border border-slate-300 text-xs text-slate-700 bg-white" />
                        <button onClick={randomFill} disabled={locked || picks.length >= wordCount} className="px-3 py-2 rounded-lg bg-amber-100 text-amber-800 text-xs font-bold hover:bg-amber-200 disabled:opacity-40">🎲 Random fill</button>
                        <button onClick={() => setPicks([])} disabled={locked || !picks.length} className="px-3 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200 disabled:opacity-40">Clear</button>
                    </div>
                    <div className="max-h-56 overflow-y-auto rounded-xl border border-slate-200 bg-white divide-y divide-slate-100">
                        {shown.length === 0 && <div className="p-4 text-xs text-slate-400 text-center">No words here.</div>}
                        {shown.map((w, i) => {
                            const on = picked.has(keyOf(w));
                            const isOpen = openId === (w.id || i);
                            const syn = relatedNames(w.synonyms);
                            const ant = relatedNames(w.antonyms);
                            const meaning = w.meaning_en || w.meaning || '';
                            return (
                                <div key={`${w.id}-${i}`} className={on ? 'bg-indigo-50' : ''}>
                                    <div className={`w-full flex items-center gap-2 px-3 py-2 text-xs transition-colors ${!on ? 'hover:bg-slate-50' : ''}`}>
                                        <button type="button" onClick={() => toggle(w)} disabled={locked || (!on && picks.length >= wordCount)} className="flex items-center gap-2 flex-1 min-w-0 text-left disabled:opacity-60">
                                            <span className={`w-4 h-4 rounded border flex items-center justify-center text-[10px] font-black shrink-0 ${on ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300'}`}>{on ? '✓' : ''}</span>
                                            <span className="font-extrabold text-slate-800 shrink-0">{w.word}</span>
                                            <span className="text-slate-400 truncate">{meaning}</span>
                                        </button>
                                        <button type="button" onClick={() => setOpenId(isOpen ? null : (w.id || i))} className="shrink-0 text-slate-400 hover:text-indigo-600 text-[11px] font-bold px-1.5 py-0.5" title="Show full detail">
                                            {isOpen ? '▲' : '▾'}
                                        </button>
                                    </div>
                                    {isOpen && (
                                        <div className="px-3 pb-2.5 -mt-0.5 text-[11px] space-y-1">
                                            {w.meaning_bn && <div className="font-semibold text-indigo-700">{w.meaning_bn}</div>}
                                            {meaning && <div className="text-slate-600">{meaning}</div>}
                                            {w.example_main && <div className="italic text-slate-400">“{w.example_main}”</div>}
                                            {syn.length > 0 && <div className="text-emerald-700"><b>Synonyms:</b> {syn.join(', ')}</div>}
                                            {ant.length > 0 && <div className="text-rose-600"><b>Antonyms:</b> {ant.join(', ')}</div>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    {list.length > 80 && !q && <div className="text-[10px] text-slate-400">Showing the first 80 — use search to find others.</div>}
                </div>
            );
        }

        // ---------- Chunks (same definition as the Word List: A→Z, sliced by chunk size) ----------
        function mpChunkList(words, size) {
            const sorted = (words || []).filter(w => w && w.word).slice().sort((a, b) => String(a.word).localeCompare(String(b.word)));
            const out = [];
            const n = Math.max(1, size || 25);
            for (let i = 0; i < sorted.length; i += n) {
                out.push({ index: out.length, label: `Chunk ${out.length + 1} (${i + 1}–${Math.min(i + n, sorted.length)})`, words: sorted.slice(i, i + n) });
            }
            return out;
        }

        // Picker for rooms that have a chunk: choose only from the chunk's (already slim) words.
        // Tapping the row toggles the pick; a separate ▾ button expands full detail
        // (meaning, example, synonyms, antonyms) in place — picking a word here never
        // means YOU get tested on it (you're choosing it for the other person's exam),
        // so showing everything up front is safe and just helps you pick good words.
        function MpChunkPicker({ chunk, wordCount, picks, setPicks, locked }) {
            const [openWord, setOpenWord] = useState(null);
            const picked = new Set(picks.map(p => p.w.toLowerCase()));
            const toggle = (w) => {
                if (locked) return;
                const k = w.w.toLowerCase();
                if (picked.has(k)) setPicks(picks.filter(p => p.w.toLowerCase() !== k));
                else if (picks.length < wordCount) setPicks([...picks, w]);
            };
            const randomFill = () => {
                if (locked) return;
                const rest = chunk.filter(w => !picked.has(w.w.toLowerCase()));
                setPicks([...picks, ...mpShuffle(rest, Math.random).slice(0, wordCount - picks.length)]);
            };
            return (
                <div className="space-y-2">
                    <div className="flex gap-2 flex-wrap items-center">
                        <span className="text-[11px] font-bold text-slate-400 mr-auto">Tap a word to pick it · ▾ to see full detail</span>
                        <button onClick={randomFill} disabled={locked || picks.length >= wordCount} className="px-3 py-1.5 rounded-lg bg-amber-100 text-amber-800 text-xs font-bold hover:bg-amber-200 disabled:opacity-40">🎲 Fill randomly</button>
                        <button onClick={() => setPicks([])} disabled={locked || !picks.length} className="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold hover:bg-slate-200 disabled:opacity-40">Clear</button>
                    </div>
                    <div className="max-h-64 overflow-y-auto rounded-xl border border-slate-200 bg-white divide-y divide-slate-100">
                        {chunk.map((w, i) => {
                            const on = picked.has(w.w.toLowerCase());
                            const isOpen = openWord === w.w;
                            const syn = Object.values(w.s || {}).filter(Boolean);
                            const ant = Object.values(w.a || {}).filter(Boolean);
                            return (
                                <div key={i} className={on ? 'bg-indigo-50' : ''}>
                                    <div className={`w-full flex items-center gap-2 px-3 py-2 text-xs ${!on ? 'hover:bg-slate-50' : ''}`}>
                                        <button type="button" onClick={() => toggle(w)} disabled={locked || (!on && picks.length >= wordCount)} className="flex items-center gap-2 flex-1 min-w-0 text-left disabled:opacity-50">
                                            <span className={`w-4 h-4 rounded border flex items-center justify-center text-[10px] font-black shrink-0 ${on ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300'}`}>{on ? '✓' : ''}</span>
                                            <span className="font-extrabold text-slate-800 shrink-0">{w.w}</span>
                                            <span className="text-slate-400 truncate">{w.m || ''}</span>
                                        </button>
                                        <button type="button" onClick={() => setOpenWord(isOpen ? null : w.w)} className="shrink-0 text-slate-400 hover:text-indigo-600 text-[11px] font-bold px-1.5 py-0.5" title="Show full detail">
                                            {isOpen ? '▲' : '▾'}
                                        </button>
                                    </div>
                                    {isOpen && (
                                        <div className="px-3 pb-2.5 -mt-0.5 text-[11px] space-y-1">
                                            {w.b && <div className="font-semibold text-indigo-700">{w.b}</div>}
                                            {w.m && <div className="text-slate-600">{w.m}</div>}
                                            {w.e && <div className="italic text-slate-400">“{w.e}”</div>}
                                            {syn.length > 0 && <div className="text-emerald-700"><b>Synonyms:</b> {syn.join(', ')}</div>}
                                            {ant.length > 0 && <div className="text-rose-600"><b>Antonyms:</b> {ant.join(', ')}</div>}
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // ---------- Study phase: everyone reads the chunk (and picks words) before the game starts ----------
        function MpStudy({ room, isHost, serverNow, canPick, myPicks, setMyPicks, iAmLocked, lockedWords, onAutoLock, onLock, onUnlock, onStartGame, onSkip, onLeave }) {
            const meta = room.meta;
            const chunk = useMemo(() => Object.values(room.chunk || {}), [JSON.stringify(room.chunk || {})]);
            const [now, setNow] = useState(serverNow());
            const [open, setOpen] = useState(null);
            const [q, setQ] = useState('');
            const firedLock = useRef(false);
            const firedStart = useRef(false);
            useEffect(() => { const t = setInterval(() => setNow(serverNow()), 250); return () => clearInterval(t); }, []);
            const endAt = meta.studyEndAt || now;
            const remaining = Math.max(0, endAt - now);
            const total = Math.max(1000, (meta.studySec || 60) * 1000);
            const online = Object.values(room.players || {}).filter(p => p.online !== false);
            const hostLocked = Object.values((room.words && room.words[meta.hostUid]) || {}).length === meta.wordCount;
            const allReady = online.length > 0 && (meta.mode === 'same' ? hostLocked : online.every(p => p.ready));
            const over = remaining <= 0;

            // when the clock runs out, lock my picks (filling any gaps at random)
            useEffect(() => {
                if (!over || firedLock.current) return;
                firedLock.current = true;
                if (canPick && !iAmLocked) onAutoLock(myPicks, chunk);
            }, [over]);
            // host moves everyone on once everybody is locked (or after a short grace period)
            useEffect(() => {
                if (!isHost || firedStart.current || !over) return;
                if (allReady || now > endAt + 4500) { firedStart.current = true; onStartGame(); }
            }, [now, allReady, over]);

            const shown = chunk.filter(w => !q.trim() || w.w.toLowerCase().includes(q.trim().toLowerCase()));
            const urgent = remaining < 10000;
            return (
                <div className="space-y-4">
                    <div className="rounded-3xl p-5 bg-gradient-to-br from-sky-600 via-indigo-600 to-violet-700 text-white shadow-xl">
                        <div className="flex items-center justify-between gap-3 flex-wrap">
                            <div>
                                <div className="text-[11px] font-bold uppercase tracking-widest text-sky-100/80">📖 Study phase</div>
                                <div className="text-lg font-black">{meta.bookName ? `${meta.bookName} · ` : ''}{meta.chunkLabel || 'Chunk'}</div>
                                <div className="text-xs text-sky-100/80">{canPick ? `Read the words — and pick ${meta.wordCount} ${meta.mode === 'swap' ? 'for the others to face' : 'for everyone'}. Unfinished picks are filled randomly.` : 'Read and memorise — the host is choosing the words for the game.'}</div>
                            </div>
                            <div className="text-right">
                                <div className={`text-4xl font-black tabular-nums ${urgent ? 'animate-pulse text-rose-200' : ''}`}>{mpFmtClock(remaining)}</div>
                                {isHost && !over && <button onClick={onSkip} className="mt-1 text-[11px] font-bold underline text-sky-100 hover:text-white">Skip the rest</button>}
                            </div>
                        </div>
                        <div className="h-2 rounded-full bg-white/20 mt-3 overflow-hidden"><div className="h-full bg-white transition-all duration-300" style={{ width: `${Math.max(0, Math.min(100, (remaining / total) * 100))}%` }} /></div>
                        {over && <div className="text-xs font-bold mt-2 text-sky-100">Time's up — getting the game ready…</div>}
                    </div>
                    <div className={`grid gap-4 ${canPick ? 'lg:grid-cols-[1.2fr_1fr]' : ''}`}>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-2">
                            <div className="flex items-center gap-2">
                                <h3 className="text-sm font-black text-slate-800 mr-auto">The chunk ({chunk.length} words)</h3>
                                <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search…" className="px-3 py-1.5 rounded-lg border border-slate-300 text-xs w-32" />
                            </div>
                            <div className="max-h-[28rem] overflow-y-auto rounded-xl border border-slate-200 divide-y divide-slate-100">
                                {shown.map((w, i) => {
                                    const isOpen = open === w.w;
                                    const syn = Object.values(w.s || {}).filter(Boolean);
                                    const ant = Object.values(w.a || {}).filter(Boolean);
                                    return (
                                        <div key={i}>
                                            <div className="w-full flex items-center gap-2 px-3 py-2 text-xs hover:bg-slate-50">
                                                <button type="button" onClick={() => setOpen(isOpen ? null : w.w)} className="flex items-center gap-2 flex-1 min-w-0 text-left">
                                                    <span className="font-extrabold text-slate-800 shrink-0">{w.w}</span>
                                                    <span className="text-slate-400 truncate">{w.m}</span>
                                                </button>
                                                <button type="button" onClick={() => setOpen(isOpen ? null : w.w)} className="shrink-0 text-slate-400 hover:text-indigo-600 text-[11px] font-bold px-1.5 py-0.5" title="Show full detail">
                                                    {isOpen ? '▲' : '▾'}
                                                </button>
                                            </div>
                                            {isOpen && (
                                                <div className="px-3 pb-2.5 -mt-0.5 text-[11px] space-y-1">
                                                    {w.b && <div className="font-semibold text-indigo-700">{w.b}</div>}
                                                    {w.m && <div className="text-slate-600">{w.m}</div>}
                                                    {w.e && <div className="italic text-slate-400">“{w.e}”</div>}
                                                    {syn.length > 0 && <div className="text-emerald-700"><b>Synonyms:</b> {syn.join(', ')}</div>}
                                                    {ant.length > 0 && <div className="text-rose-600"><b>Antonyms:</b> {ant.join(', ')}</div>}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                        {canPick && (
                            <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3 h-fit">
                                <div className="flex items-center justify-between gap-2">
                                    <h3 className="text-sm font-black text-slate-800">{meta.mode === 'swap' ? 'Your picks' : 'Pick the words'}</h3>
                                    <span className={`text-xs font-black px-2.5 py-1 rounded-full ${(iAmLocked ? lockedWords.length : myPicks.length) === meta.wordCount ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}`}>{iAmLocked ? lockedWords.length : myPicks.length} / {meta.wordCount}</span>
                                </div>
                                {iAmLocked ? (
                                    <div className="rounded-xl bg-emerald-50 border border-emerald-200 p-4 text-center">
                                        <div className="text-2xl">✅</div>
                                        <div className="text-sm font-black text-emerald-800 mt-1">Locked in</div>
                                        <div className="text-[11px] text-emerald-700/80 mt-0.5 line-clamp-2">{lockedWords.map(w => w.w).join(' · ')}</div>
                                        {!over && <button onClick={onUnlock} className="mt-3 px-4 py-1.5 rounded-lg bg-white border border-emerald-300 text-emerald-700 text-xs font-bold hover:bg-emerald-100">Edit my words</button>}
                                    </div>
                                ) : (
                                    <>
                                        <MpChunkPicker chunk={chunk} wordCount={meta.wordCount} picks={myPicks} setPicks={setMyPicks} locked={over} />
                                        <button onClick={onLock} disabled={myPicks.length !== meta.wordCount || over} className="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">🔒 Lock in {meta.wordCount} words</button>
                                    </>
                                )}
                            </div>
                        )}
                    </div>
                    <div className="flex gap-2 justify-end">
                        <button onClick={onLeave} className="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-sm hover:bg-slate-100">{isHost ? 'Close room' : 'Leave room'}</button>
                    </div>
                </div>
            );
        }

        // ---------- The Multiplayer tab ----------
        // ------------------------------------------------------------
        // MpChat: tiny 1-to-1 chat. Messages live at chats/<uidA_uidB>/<id>
        // and are deleted by the app once they are older than 24 hours
        // (Firebase's free plan has no server-side expiry, so every client
        // that opens a chat prunes the old ones).
        // ------------------------------------------------------------
        function MpChat({ uid, other, onClose }) {
            const F = window.FB;
            const pairKey = [uid, other.id].sort().join('_');
            const path = `chats/${pairKey}`;
            const [msgs, setMsgs] = useState([]);
            const [text, setText] = useState('');
            const bottomRef = useRef(null);
            useEffect(() => {
                if (!F || !F.rtdb) return;
                const u = F.dbOnValue(F.dbRef(F.rtdb, path), (snap) => {
                    const cutoff = Date.now() - 24 * 3600 * 1000;
                    const live = [];
                    Object.entries(snap.val() || {}).forEach(([id, m]) => {
                        if (!m || (m.at || 0) < cutoff) F.dbRemove(F.dbRef(F.rtdb, `${path}/${id}`)).catch(() => {});
                        else live.push({ id, ...m });
                    });
                    live.sort((a, b) => a.at - b.at);
                    setMsgs(live);
                }, (e) => console.error('chat listener', e));
                return () => u();
            }, [path]);
            useEffect(() => { if (bottomRef.current) bottomRef.current.scrollIntoView({ block: 'end' }); }, [msgs.length]);
            const send = async () => {
                const t = text.trim().slice(0, 200);
                if (!t) return;
                setText('');
                try { await F.dbSet(F.dbRef(F.rtdb, `${path}/${Date.now()}_${String(uid).slice(0, 6)}`), { from: uid, text: t, at: Date.now() }); }
                catch (e) { console.error(e); }
            };
            const clearAll = () => { msgs.forEach(m => F.dbRemove(F.dbRef(F.rtdb, `${path}/${m.id}`)).catch(() => {})); };
            return (
                <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-end sm:items-center justify-center p-3" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
                    <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl flex flex-col max-h-[80vh]">
                        <div className="flex items-center gap-2.5 px-4 py-3 border-b border-slate-100">
                            <MpAvatar name={other.name} photo={other.photo} size={30} />
                            <div className="flex-1 min-w-0">
                                <div className="text-sm font-black text-slate-800 truncate">{other.name}</div>
                                <div className="text-[10px] text-slate-400 font-semibold">Messages disappear after 24 hours</div>
                            </div>
                            {msgs.length > 0 && <button onClick={clearAll} className="text-[10px] font-bold text-slate-400 hover:text-rose-500">Clear</button>}
                            <button onClick={onClose} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 text-sm font-bold">✕</button>
                        </div>
                        <div className="flex-1 overflow-y-auto px-4 py-3 space-y-1.5 min-h-[10rem]">
                            {msgs.length === 0 && <p className="text-center text-xs text-slate-400 py-8">No messages yet. Say hi 👋</p>}
                            {msgs.map(m => (
                                <div key={m.id} className={`flex ${m.from === uid ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[80%] px-3 py-1.5 rounded-2xl text-sm break-words ${m.from === uid ? 'bg-indigo-600 text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm'}`}>{m.text}</div>
                                </div>
                            ))}
                            <div ref={bottomRef} />
                        </div>
                        <div className="flex gap-2 p-3 border-t border-slate-100">
                            <input value={text} maxLength={200} onChange={(e) => setText(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') send(); }} placeholder="Type a short message…" className="flex-1 min-w-0 px-3 py-2 rounded-xl border border-slate-300 text-sm" />
                            <button onClick={send} disabled={!text.trim()} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold hover:bg-indigo-700 disabled:opacity-40">Send</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ------------------------------------------------------------
        // CHALLENGES: asynchronous duels (nobody has to be online together).
        //   A picks a chunk + the words B will face, sets study/exam time, sends.
        //   B studies the chunk, picks the words A will face, takes A's exam.
        //   A later studies and takes B's exam. Scores stay hidden until both finish.
        // Data: challenges/<id> (+ userChallenges/<uid>/<id> = true as each person's inbox)
        // ------------------------------------------------------------
        const mpToArr = (x) => Array.isArray(x) ? x.filter(Boolean) : Object.values(x || {});

        function ChStudy({ chunk, studySec, onDone }) {
            const [left, setLeft] = useState(studySec);
            const [q, setQ] = useState('');
            useEffect(() => {
                const t = setInterval(() => setLeft(l => l - 1), 1000);
                return () => clearInterval(t);
            }, []);
            useEffect(() => { if (left <= 0) onDone(); }, [left]);
            const shown = chunk.filter(w => !q.trim() || String(w.w).toLowerCase().includes(q.trim().toLowerCase()) || String(w.m || '').toLowerCase().includes(q.trim().toLowerCase()));
            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-2">
                        <span className="text-sm font-black text-slate-800 mr-auto">📖 Study time</span>
                        <span className="px-3 py-1 rounded-full bg-sky-100 text-sky-700 text-xs font-black">{mpFmtClock(Math.max(0, left) * 1000)}</span>
                        <button onClick={onDone} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700">I'm ready →</button>
                    </div>
                    <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search the words…" className="w-full px-3 py-2 rounded-lg border border-slate-300 text-xs" />
                    <div className="max-h-[26rem] overflow-y-auto divide-y divide-slate-100 rounded-xl border border-slate-200">
                        {shown.map((w, i) => (
                            <div key={i} className="px-3 py-2">
                                <div className="text-sm font-black text-slate-800">{w.w}</div>
                                <div className="text-xs text-slate-600">{w.m}{w.b ? ` · ${w.b}` : ''}</div>
                                {w.e && <div className="text-[11px] text-slate-400 italic mt-0.5">{w.e}</div>}
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function ChExam({ questions, examSec, onFinish }) {
            const [qi, setQi] = useState(0);
            const [score, setScore] = useState(0);
            const [picked, setPicked] = useState(null);
            const [endAt] = useState(() => Date.now() + examSec * 1000);
            const [left, setLeft] = useState(examSec);
            const doneRef = useRef(false);
            const scoreRef = useRef(0);
            const finish = () => { if (doneRef.current) return; doneRef.current = true; onFinish(scoreRef.current); };
            useEffect(() => {
                const t = setInterval(() => {
                    const l = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
                    setLeft(l);
                    if (l <= 0) finish();
                }, 500);
                return () => clearInterval(t);
            }, []);
            const q = questions[qi];
            const choose = (opt) => {
                if (picked !== null || !q) return;
                setPicked(opt);
                if (opt === q.answer) { scoreRef.current += 1; setScore(s => s + 1); }
                setTimeout(() => {
                    if (qi + 1 >= questions.length) finish();
                    else { setQi(qi + 1); setPicked(null); }
                }, 700);
            };
            if (!q) return null;
            return (
                <div className="space-y-3">
                    <div className="flex items-center gap-2 text-xs font-black">
                        <span className="text-slate-500 mr-auto">Question {qi + 1} / {questions.length}</span>
                        <span className="px-3 py-1 rounded-full bg-amber-100 text-amber-700">{mpFmtClock(left * 1000)}</span>
                    </div>
                    <div className="rounded-2xl bg-gradient-to-br from-indigo-600 to-blue-700 text-white p-5 text-center space-y-1">
                        <div className="text-[11px] font-bold uppercase tracking-wider text-indigo-200">{q.sub}</div>
                        <div className={`font-black leading-snug ${q.type === 'meaning' || q.type === 'synant' ? 'text-3xl' : 'text-lg'}`}>{q.prompt}</div>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-2">
                        {q.options.map((o, i) => {
                            let cls = 'bg-white border-slate-200 hover:bg-indigo-50';
                            if (picked !== null) {
                                if (o === q.answer) cls = 'bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
                                else if (o === picked) cls = 'bg-red-100 border-red-500 text-red-900 font-bold';
                                else cls = 'bg-white border-slate-200 opacity-60';
                            }
                            return <button key={i} disabled={picked !== null} onClick={() => choose(o)} className={`p-3 rounded-xl border text-sm text-left transition-all ${cls}`}>{o}</button>;
                        })}
                    </div>
                </div>
            );
        }

        function ChallengeCreate({ uid, myName, myPhoto, books, allWords, activeBookId, chunkSize, usersMap, target, onCancel, onSent, triggerToast }) {
            const F = window.FB;
            const [oppId, setOppId] = useState(target ? target.id : '');
            const [bookId, setBookId] = useState(activeBookId);
            const [chunkIdx, setChunkIdx] = useState(0);
            const [wordCount, setWordCount] = useState(10);
            const [studySec, setStudySec] = useState(120);
            const [examSec, setExamSec] = useState(180);
            const [style, setStyle] = useState('mixed');
            const [picks, setPicks] = useState([]);
            const [busy, setBusy] = useState(false);
            const chunks = useMemo(() => mpChunkList(allWords[bookId] || [], chunkSize), [allWords, bookId, chunkSize]);
            const chunk = chunks[chunkIdx] || null;
            const slim = useMemo(() => (chunk ? chunk.words.map(mpSlimWord) : []), [chunk]);
            const maxWords = Math.max(3, Math.min(50, slim.length));
            useEffect(() => { setPicks([]); }, [bookId, chunkIdx]);
            useEffect(() => { if (wordCount > maxWords) setWordCount(maxWords); setPicks(p => p.slice(0, Math.min(wordCount, maxWords))); }, [maxWords, wordCount]);
            const opponents = Object.entries(usersMap || {}).map(([id, u]) => ({ id, ...u })).filter(u => u.id !== uid);
            if (target && !opponents.some(o => o.id === target.id)) opponents.unshift(target);
            const send = async () => {
                const opp = opponents.find(o => o.id === oppId);
                if (!opp) { triggerToast('Pick who to challenge.'); return; }
                if (!chunk || slim.length < 3) { triggerToast('That chunk has too few words.'); return; }
                if (picks.length !== wordCount) { triggerToast(`Pick exactly ${wordCount} words.`); return; }
                setBusy(true);
                try {
                    const id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
                    await F.dbSet(F.dbRef(F.rtdb, `challenges/${id}`), {
                        from: uid, to: opp.id, fromName: myName, toName: String(opp.name || 'Player').slice(0, 30),
                        fromPhoto: myPhoto || '', toPhoto: String(opp.photo || '').slice(0, 500),
                        bookName: String((books.find(b => b.id === bookId) || {}).name || '').slice(0, 40),
                        chunkLabel: chunk.label, style, wordCount, studySec, examSec, status: 'open', createdAt: Date.now(),
                        chunk: slim, wordsForTo: picks,
                    });
                    await F.dbSet(F.dbRef(F.rtdb, `userChallenges/${uid}/${id}`), true);
                    await F.dbSet(F.dbRef(F.rtdb, `userChallenges/${opp.id}/${id}`), true);
                    triggerToast(`⚔️ Challenge sent to ${opp.name}.`);
                    onSent();
                } catch (e) { console.error(e); triggerToast('Could not send the challenge.'); }
                setBusy(false);
            };
            const sel = "px-3 py-2 rounded-lg border border-slate-300 text-xs font-bold text-slate-700 bg-white w-full";
            return (
                <div className="bg-white border border-slate-200 rounded-3xl p-5 space-y-4 shadow-sm">
                    <div className="flex items-center gap-2">
                        <h3 className="text-sm font-black text-slate-800 mr-auto">⚔️ New challenge</h3>
                        <button onClick={onCancel} className="text-xs font-bold text-slate-400 hover:text-slate-600">Cancel</button>
                    </div>
                    <select value={oppId} onChange={(e) => setOppId(e.target.value)} className={sel}>
                        <option value="">Who do you want to challenge?</option>
                        {opponents.map(o => <option key={o.id} value={o.id}>{o.name}{o.online ? ' • online' : ''}</option>)}
                    </select>
                    <div className="grid sm:grid-cols-2 gap-2">
                        <select value={bookId} onChange={(e) => { setBookId(e.target.value); setChunkIdx(0); }} className={sel}>
                            {books.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                        </select>
                        <select value={chunkIdx} onChange={(e) => setChunkIdx(Number(e.target.value))} className={sel}>
                            {chunks.map(c => <option key={c.index} value={c.index}>{c.label}</option>)}
                        </select>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-4">
                        <div>
                            <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Words they face</span><span className="text-indigo-600">{wordCount}</span></div>
                            <input type="range" min="3" max={maxWords} value={Math.min(wordCount, maxWords)} onChange={(e) => setWordCount(Number(e.target.value))} className="w-full accent-indigo-600" />
                        </div>
                        <div>
                            <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Study time</span><span className="text-indigo-600">{mpFmtClock(studySec * 1000)}</span></div>
                            <input type="range" min="30" max="600" step="30" value={studySec} onChange={(e) => setStudySec(Number(e.target.value))} className="w-full accent-indigo-600" />
                        </div>
                        <div>
                            <div className="flex justify-between text-[11px] font-extrabold uppercase tracking-wider text-slate-400"><span>Exam time</span><span className="text-indigo-600">{mpFmtClock(examSec * 1000)}</span></div>
                            <input type="range" min="30" max="900" step="15" value={examSec} onChange={(e) => setExamSec(Number(e.target.value))} className="w-full accent-indigo-600" />
                        </div>
                        <select value={style} onChange={(e) => setStyle(e.target.value)} className={sel}>
                            {MP_STYLES.map(s => <option key={s.id} value={s.id}>{s.label} — {s.desc}</option>)}
                        </select>
                    </div>
                    <div className="rounded-2xl border border-slate-200 bg-slate-50 p-3 space-y-2">
                        <div className="flex justify-between text-xs font-black text-slate-700"><span>Pick the words they will be tested on</span><span>{picks.length} / {wordCount}</span></div>
                        <MpChunkPicker chunk={slim} wordCount={wordCount} picks={picks} setPicks={setPicks} locked={false} />
                    </div>
                    <button onClick={send} disabled={busy || picks.length !== wordCount || !oppId} className="w-full py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm hover:bg-indigo-700 disabled:opacity-40">{busy ? 'Sending…' : '⚔️ Send challenge'}</button>
                </div>
            );
        }

        function ChallengeRun({ id, c, uid, onBack, triggerToast }) {
            const F = window.FB;
            const me = c.from === uid ? 'from' : 'to';
            const oppName = me === 'from' ? c.toName : c.fromName;
            const chunk = mpToArr(c.chunk);
            const examWords = mpToArr(me === 'to' ? c.wordsForTo : c.wordsForFrom);
            const needsPick = me === 'to' && !c.wordsForFrom;
            const myDone = !!c[`${me}Done`];
            const [phase, setPhase] = useState('intro'); // intro | study | pick | exam
            const [picks, setPicks] = useState([]);
            const [busy, setBusy] = useState(false);
            const questions = useMemo(() => mpBuildQuestions(examWords, c.style || 'mixed', `${id}_${uid}`, chunk), [id, uid, c.wordsForTo, c.wordsForFrom]);
            const finish = async (score) => {
                try { await F.dbUpdate(F.dbRef(F.rtdb, `challenges/${id}`), { [`${me}Score`]: score, [`${me}Total`]: questions.length, [`${me}Done`]: true }); }
                catch (e) { console.error(e); triggerToast('Could not save your score — check your connection.'); }
            };
            const sendPicks = async () => {
                setBusy(true);
                try { await F.dbUpdate(F.dbRef(F.rtdb, `challenges/${id}`), { wordsForFrom: picks }); setPhase('exam'); }
                catch (e) { console.error(e); triggerToast('Could not send your words.'); }
                setBusy(false);
            };
            const head = (
                <div className="flex items-center gap-2">
                    <button onClick={onBack} className="text-xs font-bold text-slate-500 hover:text-slate-800">← Back</button>
                    <span className="text-sm font-black text-slate-800 truncate">⚔️ vs {oppName}</span>
                    <span className="text-[11px] text-slate-400 font-semibold truncate">{c.bookName ? `${c.bookName} · ` : ''}{c.chunkLabel}</span>
                </div>
            );
            let body;
            if (myDone) {
                const bothDone = !!(c.fromDone && c.toDone);
                const mine = c[`${me}Score`], mineT = c[`${me}Total`];
                const other = me === 'from' ? 'to' : 'from';
                if (!bothDone) body = (
                    <div className="text-center py-10 space-y-2">
                        <div className="text-4xl">⏳</div>
                        <p className="text-sm font-black text-slate-800">You're done!</p>
                        <p className="text-xs text-slate-500">Scores stay hidden until {oppName} finishes too. Check back later.</p>
                    </div>
                ); else {
                    const a = mine || 0, b = c[`${other}Score`] || 0;
                    body = (
                        <div className="text-center py-6 space-y-3">
                            <div className="text-4xl">{a > b ? '🏆' : a < b ? '😅' : '🤝'}</div>
                            <p className="text-lg font-black text-slate-800">{a > b ? 'You won!' : a < b ? `${oppName} won` : "It's a tie"}</p>
                            <div className="flex justify-center gap-3">
                                <div className="rounded-xl bg-indigo-50 px-4 py-3"><div className="text-[11px] font-bold text-slate-400">You</div><div className="text-2xl font-black text-indigo-700">{a}/{mineT}</div></div>
                                <div className="rounded-xl bg-slate-50 px-4 py-3"><div className="text-[11px] font-bold text-slate-400">{oppName}</div><div className="text-2xl font-black text-slate-700">{b}/{c[`${other}Total`]}</div></div>
                            </div>
                        </div>
                    );
                }
            } else if (me === 'from' && !c.wordsForFrom) {
                body = (
                    <div className="text-center py-10 space-y-2">
