                                                    <div className="flex-1 min-w-0 space-y-1">
                                                        {fieldVisibility.context_main && playablePool[cardIndex].context_main && (
                                                            <p className="text-xs text-slate-500">{playablePool[cardIndex].context_main}</p>
                                                        )}
                                                        {fieldVisibility.example_main && (playablePool[cardIndex].example_main || playablePool[cardIndex].sentence) && (
                                                            <p className="text-slate-600 italic">"{playablePool[cardIndex].example_main || playablePool[cardIndex].sentence}"</p>
                                                        )}
                                                    </div>
                                                    {fieldVisibility.example_main && (playablePool[cardIndex].example_main || playablePool[cardIndex].sentence) && (
                                                        <SpeakPair text={playablePool[cardIndex].example_main || playablePool[cardIndex].sentence} notify={triggerToast} accent={speechAccent} isSentence className="shrink-0" />
                                                    )}
                                                </div>
                                            )}
                                            {/* Level 2 (nested dropdown, top-right icon below): the rest of the
                                                word family — synonyms/antonyms. If this card is itself showing
                                                a synonym/antonym (flattened from its main word into the
                                                playable pool), it has no syn/ant list of its own — so we pull
                                                the full family (main word + its synonyms + antonyms) from the
                                                main word it belongs to (familyOf) instead. For an ordinary main
                                                word, this behaves exactly as before (no main word is already
                                                shown, so it isn't repeated here). */}
                                            {cardDetailsExpanded && (() => {
                                                const cur = playablePool[cardIndex];
                                                const isRelated = !!(cur.relatedTone && cur.familyOf);
                                                const famSource = isRelated ? cur.familyOf : cur;
                                                const famSyns = fieldVisibility.synonyms ? (famSource.synonyms || []) : [];
                                                const famAnts = fieldVisibility.antonyms ? (famSource.antonyms || []) : [];
                                                const hasNote = fieldVisibility.note && (cur.meaning_en_detailed || cur.note);
                                                const hasFamily = isRelated || famSyns.length > 0 || famAnts.length > 0;
                                                return (
                                                    <>
                                                    {hasNote && (
                                                        <div className="bg-amber-50 border border-amber-100 rounded-xl p-2.5 text-left">
                                                            <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider block mb-0.5">Note</span>
                                                            <p className="text-xs text-slate-600 italic whitespace-pre-line">{renderNoteRich(cur.meaning_en_detailed || cur.note)}</p>
                                                        </div>
                                                    )}
                                                    {hasFamily && (
                                                        <div className="text-left space-y-2" onClick={(e) => e.stopPropagation()}>
                                                            {isRelated && (
                                                                <div>
                                                                    <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wider block mb-1">Word</span>
                                                                    <div className="space-y-2.5">
                                                                        <RelatedWordBlock
                                                                            entry={mainWordAsEntry(famSource)}
                                                                            tone="main"
                                                                            accent={speechAccent}
                                                                            notify={triggerToast}
                                                                            famLevel={getWordFamiliarityLevel(currentFamiliarityMap, famSource.id)}
                                                                            onSetFamiliarity={(level) => setWordFamiliarity(famSource.id, level)}
                                                                        />
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {famSyns.length > 0 && (
                                                                <div>
                                                                    <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1">Synonyms</span>
                                                                    <div className="space-y-2.5">
                                                                        {famSyns.map((s, i) => {
                                                                            const entryId = getRelatedEntryId(famSource.id, 'syn', i, s);
                                                                            return (
                                                                                <RelatedWordBlock
                                                                                    key={entryId}
                                                                                    entry={s}
                                                                                    tone="syn"
                                                                                    accent={speechAccent}
                                                                                    notify={triggerToast}
                                                                                    famLevel={getWordFamiliarityLevel(currentFamiliarityMap, entryId)}
                                                                                    onSetFamiliarity={(level) => setWordFamiliarity(entryId, level)}
                                                                                />
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            )}
                                                            {famAnts.length > 0 && (
                                                                <div>
                                                                    <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider block mb-1">Antonyms</span>
                                                                    <div className="space-y-2.5">
                                                                        {famAnts.map((a, i) => {
                                                                            const entryId = getRelatedEntryId(famSource.id, 'ant', i, a);
                                                                            return (
                                                                                <RelatedWordBlock
                                                                                    key={entryId}
                                                                                    entry={a}
                                                                                    tone="ant"
                                                                                    accent={speechAccent}
                                                                                    notify={triggerToast}
                                                                                    famLevel={getWordFamiliarityLevel(currentFamiliarityMap, entryId)}
                                                                                    onSetFamiliarity={(level) => setWordFamiliarity(entryId, level)}
                                                                                />
                                                                            );
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                    {!hasNote && !hasFamily && (
                                                        <div className="rounded-2xl p-4 border border-dashed border-slate-200 text-center">
                                                            <p className="text-xs text-slate-400">No synonyms or antonyms saved for this word yet.</p>
                                                        </div>
                                                    )}
                                                    </>
                                                );
                                            })()}
                                        </div>
                                        <div className="text-xs text-slate-400">Click to flip back · slide for next</div>
                                    </div>
                                </div>

                                {isFlipped && cardDetailsExpanded && (
                                    <div
                                        onMouseDown={startCardResize}
                                        onTouchStart={startCardResize}
                                        onClick={(e) => e.stopPropagation()}
                                        onPointerDown={(e) => e.stopPropagation()}
                                        title="Drag to resize card"
                                        className="absolute left-1/2 -translate-x-1/2 -bottom-2.5 w-14 h-5 rounded-full bg-white border border-slate-300 shadow-sm flex items-center justify-center cursor-row-resize hover:border-indigo-400 z-10"
                                    >
                                        <div className="w-6 h-1 rounded-full bg-slate-300"></div>
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-between items-center gap-4">
                                <button
                                    data-flash-prev
                                    onClick={() => { setCardSlideDir('prev'); setIsFlipped(false); setCardIndex((prev) => (prev > 0 ? prev - 1 : playablePool.length - 1)); }}
                                    className="flex-1 py-3 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl shadow-sm hover:bg-slate-50 active:scale-95 transition-all"
                                >
                                    ← Previous
                                </button>
                                <FamiliarityPicker
                                    level={getFamiliarity(playablePool[cardIndex].id)}
                                    onSet={(level) => setWordFamiliarity(playablePool[cardIndex].id, level)}
                                />
                                <button
                                    data-flash-next
                                    onClick={() => { setCardSlideDir('next'); setIsFlipped(false); setCardIndex((prev) => (prev < playablePool.length - 1 ? prev + 1 : 0)); }}
                                    className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                                >
                                    Next →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODE 3: PRACTICE QUIZ VIEW */}
                    {activeTab === 'quiz' && quizPhase === 'setup' && (
                        <div className="max-w-xl mx-auto space-y-5">
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-6 space-y-5">
                                <div>
                                    <h2 className="text-xl font-extrabold text-slate-900">Practice Quiz Setup</h2>
                                    <p className="text-xs text-slate-500 mt-1">Choose how you want to be quizzed on {activeBook.name}.</p>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Question Type <span className="font-normal normal-case text-slate-400">(select one or more)</span></label>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                        {QUIZ_TYPE_OPTIONS.map(t => {
                                            const checked = quizTypes.includes(t.id);
                                            return (
                                                <button
                                                    key={t.id}
                                                    onClick={() => toggleQuizType(t.id)}
                                                    className={`flex items-center gap-2 px-3 py-2.5 rounded-xl text-xs font-bold border transition-all text-left ${
                                                        checked
                                                            ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm'
                                                            : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                                    }`}
                                                >
                                                    <span className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 ${checked ? 'bg-white border-white' : 'border-slate-300'}`}>
                                                        {checked && (
                                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="w-3 h-3 text-indigo-600">
                                                                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
                                                            </svg>
                                                        )}
                                                    </span>
                                                    {t.label}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    {quizTypes.length > 1 && (
                                        <p className="text-[11px] text-slate-400 mt-1.5">Questions will be randomly mixed across your {quizTypes.length} selected types.</p>
                                    )}
                                    {(quizTypes.includes('synonym') || quizTypes.includes('antonym')) && (
                                        <p className="text-[11px] text-amber-600 mt-1.5">Only words with synonym/antonym data will be used for those types — add some via Word Manager if your quiz comes up short.</p>
                                    )}
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Number of Questions</label>
                                    <div className="flex flex-wrap items-center gap-2">
                                        {['5', '10', '15', '20', 'all'].map(c => (
                                            <button
                                                key={c}
                                                onClick={() => setQuizQuestionCount(c)}
                                                className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${
                                                    quizQuestionCount === c
                                                        ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm'
                                                        : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                {c === 'all' ? 'All' : c}
                                            </button>
                                        ))}
                                        <span className="text-xs text-slate-400">or</span>
                                        <input
                                            type="number"
                                            min="1"
                                            max="100"
                                            placeholder="Custom #"
                                            value={!['5', '10', '15', '20', 'all'].includes(quizQuestionCount) ? quizQuestionCount : ''}
                                            onChange={(e) => setQuizQuestionCount(e.target.value.replace(/[^0-9]/g, ''))}
                                            className="w-24 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Timer</label>
                                    <div className="flex flex-wrap gap-2 mb-2">
                                        {[
                                            { id: 'off', label: 'No timer' },
                                            { id: 'perQuestion', label: 'Per Question' },
                                            { id: 'overall', label: 'Overall' },
                                        ].map(m => (
                                            <button
                                                key={m.id}
                                                onClick={() => setQuizTimerMode(m.id)}
                                                className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all ${
                                                    quizTimerMode === m.id
                                                        ? 'bg-indigo-600 text-white border-indigo-500 shadow-sm'
                                                        : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                {m.label}
                                            </button>
                                        ))}
                                    </div>
                                    {quizTimerMode !== 'off' && (
                                        <div className="flex items-center gap-2">
                                            <input
                                                type="number"
                                                min="1"
                                                max="180"
                                                step="0.5"
                                                value={quizTimerMinutes || ''}
                                                onChange={(e) => setQuizTimerMinutes(Math.max(0, Number(e.target.value) || 0))}
                                                className="w-24 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                            <span className="text-xs text-slate-500">
                                                minutes{quizTimerMode === 'perQuestion'
                                                    ? ' total, split evenly across all questions'
                                                    : ' for the whole quiz — not divided per question'}
                                            </span>
                                        </div>
                                    )}
                                </div>

                                <button
                                    onClick={() => {
                                        buildAndStartQuiz();
                                        setTimeout(() => {
                                            const scrollTarget = quizCardRef.current?.parentElement || quizCardRef.current;
                                            scrollTarget?.scrollIntoView({ behavior: 'smooth', block: 'end' });
                                        }, 300);
                                    }}
                                    className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                                >
                                    Start Quiz →
                                </button>
                            </div>

                            {/* MISTAKE REVIEW + HISTORY */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-6 flex items-center justify-between gap-4 flex-wrap">
                                <div>
                                    <h3 className="text-sm font-extrabold text-slate-900 flex items-center gap-1.5">📉 Mistake Review</h3>
                                    <p className="text-xs text-slate-500 mt-0.5">
                                        {quizMistakeWords.length > 0
                                            ? `${quizMistakeWords.length} word${quizMistakeWords.length === 1 ? '' : 's'} you've gotten wrong in past quizzes.`
                                            : "No mistakes tracked yet — they'll show up here after you miss a question."}
                                    </p>
                                </div>
                                <div className="flex gap-2">
                                    <button
                                        onClick={() => { setQuizMistakeSelection(null); setQuizReviewTab('mistakes'); setShowQuizReviewModal(true); }}
                                        disabled={quizMistakeWords.length === 0}
                                        className="px-4 py-2 rounded-xl text-xs font-bold bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 disabled:opacity-40 disabled:cursor-not-allowed transition-all"
                                    >
                                        Review Mistakes
                                    </button>
                                    <button
                                        onClick={() => { setQuizReviewTab('history'); setShowQuizReviewModal(true); }}
                                        className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-50 text-slate-600 border border-slate-200 hover:bg-slate-100 transition-all"
                                    >
                                        📜 History
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {activeTab === 'quiz' && quizPhase === 'playing' && quizQuestions.length > 0 && (() => {
                        const q = quizQuestions[quizQuestionIndex];
                        const ansState = quizAnswers[quizQuestionIndex] || {};
                        const answerId = ansState.answerId ?? null;
                        const submitted = !!ansState.submitted;
                        const meaningText = q.target.meaning_en || q.target.meaning || '';
                        const banglaText = q.target.meaning_bn || q.target.bangla || '';
                        const exampleText = q.target.example_main || q.target.sentence || '';
                        const typeLabel = { quiz: 'Meaning Quiz', fillin: 'Fill in the Blank', synonym: 'Synonym', antonym: 'Antonym', truefalse: 'True / False' }[q.qType];

                        return (
                            <div className="max-w-2xl mx-auto space-y-6 scroll-mb-3">
                                <div ref={quizCardRef} className="quiz-card-container bg-white rounded-2xl border border-slate-200 shadow-md p-6 space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4 border-slate-100 gap-3 flex-wrap">
                                        <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">
                                            Q{quizQuestionIndex + 1}/{quizQuestions.length} · {typeLabel}
                                        </span>
                                        <div className="flex items-center gap-2">
                                            {quizTimeLeft !== null && (
                                                <span className={`text-xs font-bold px-3 py-1 rounded-full border ${quizTimeLeft <= 5 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                                                    ⏱ {quizTimeLeft}s
                                                </span>
                                            )}
                                            {quizTimerMode === 'overall' && quizOverallTimeLeft !== null && (
                                                <span className={`text-xs font-bold px-3 py-1 rounded-full border ${quizOverallTimeLeft <= 30 ? 'bg-red-50 text-red-600 border-red-200' : 'bg-slate-50 text-slate-600 border-slate-200'}`}>
                                                    ⏱ {Math.floor(quizOverallTimeLeft / 60)}:{String(quizOverallTimeLeft % 60).padStart(2, '0')} left
                                                </span>
                                            )}
                                            <button
                                                type="button"
                                                onClick={() => setQuizSoundOn(s => !s)}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border transition-all ${quizSoundOn ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-slate-50 text-slate-500 border-slate-200'}`}
                                                title={quizSoundOn ? 'Sound ON' : 'Sound OFF'}
                                            >
                                                {quizSoundOn ? '🔊' : '🔇'}
                                            </button>
                                            <span className="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200">
                                                Score: {quizScore}
                                            </span>
                                            {submitted && (
                                                <ExpandToggleIcon expanded={revealWord} onClick={() => {
                                                    const willOpen = !revealWord;
                                                    setRevealWord(v => !v);
                                                    if (willOpen) {
                                                        setTimeout(() => {
                                                            const scrollTarget = quizCardRef.current?.parentElement || quizCardRef.current;
                                                            scrollTarget?.scrollIntoView({ behavior: 'smooth', block: 'end' });
                                                        }, 380);
                                                    }
                                                }} />
                                            )}
                                            <button
                                                type="button"
                                                onClick={() => setQuizPhase('setup')}
                                                title="Exit quiz"
                                                className="px-2.5 py-1 rounded-lg text-[11px] font-bold border bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100 transition-all"
                                            >
                                                ✕ Exit
                                            </button>
                                        </div>
                                    </div>

                                    {/* ===== QUESTION PROMPT (varies by type) ===== */}
                                    {q.qType === 'quiz' && (
                                        <div className="space-y-3">
                                            <p className="text-xs text-slate-500 font-semibold uppercase">What is the correct meaning of:</p>
                                            <div className="flex items-center gap-2">
                                                <h2 className="text-3xl font-extrabold text-slate-900">{q.target.word}</h2>
                                                {q.target.phonetics && (
                                                    <span className="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-1 rounded">[{q.target.phonetics}]</span>
                                                )}
                                                <SpeakPair text={q.target.word} notify={triggerToast} accent={speechAccent} />
                                            </div>
                                        </div>
                                    )}

                                    {q.qType === 'reverse' && (
                                        <div className="space-y-2">
                                            <p className="text-xs text-slate-500 font-semibold uppercase">Which word means:</p>
                                            <h2 className="text-xl font-extrabold text-slate-900 leading-snug">{q.target.meaning_en || q.target.meaning}</h2>
                                            {showBangla && (q.target.meaning_bn || q.target.bangla) && (
                                                <p className="text-sm font-semibold text-slate-500">{q.target.meaning_bn || q.target.bangla}</p>
                                            )}
                                        </div>
                                    )}

                                    {q.qType === 'fillin' && (
                                        <div className="space-y-3">
                                            <p className="text-xs text-slate-500 font-semibold uppercase">Fill in the blank:</p>
                                            <div className="flex items-center justify-between gap-2 bg-slate-50 p-3 rounded-xl border border-slate-100">
                                                <p className="flex-1 min-w-0 text-base font-normal text-slate-700 leading-relaxed italic text-left">"{q.sentence}"</p>
                                                {submitted && (
                                                    <SpeakPair text={exampleText || q.target.word} notify={triggerToast} accent={speechAccent} isSentence={!!exampleText} className="shrink-0" />
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {(q.qType === 'synonym' || q.qType === 'antonym') && (
                                        <div className="space-y-3">
                                            <p className="text-xs text-slate-500 font-semibold uppercase">
                                                Which word is a {q.qType === 'synonym' ? 'SYNONYM' : 'ANTONYM'} of:
                                            </p>
                                            <div className="flex items-center gap-2">
                                                <h2 className="text-3xl font-extrabold text-slate-900">{q.target.word}</h2>
                                                {q.target.phonetics && (
                                                    <span className="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-1 rounded">[{q.target.phonetics}]</span>
                                                )}
                                                <SpeakPair text={q.target.word} notify={triggerToast} accent={speechAccent} />
                                            </div>
                                        </div>
                                    )}

                                    {q.qType === 'truefalse' && (
                                        <div className="space-y-3">
                                            <p className="text-xs text-slate-500 font-semibold uppercase">True or False?</p>
                                            <div className="flex items-center gap-2">
                                                <h2 className="text-3xl font-extrabold text-slate-900">{q.target.word}</h2>
                                                {q.target.phonetics && (
                                                    <span className="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-1 rounded">[{q.target.phonetics}]</span>
                                                )}
                                                <SpeakPair text={q.target.word} notify={triggerToast} accent={speechAccent} />
                                            </div>
                                            <p className="text-base font-medium bg-slate-50 rounded-xl px-4 py-3 border border-slate-100">means: "{q.shownMeaning}"</p>
                                        </div>
                                    )}

                                    {/* ===== ANSWER OPTIONS (varies by type) ===== */}
                                    {(q.qType === 'quiz' || q.qType === 'reverse' || q.qType === 'fillin' || q.qType === 'synonym' || q.qType === 'antonym') && (
                                        <div className="space-y-3">
                                            {q.options.map((opt, idx) => {
                                                const isTarget = q.qType === 'quiz' || q.qType === 'reverse' || q.qType === 'fillin'
                                                    ? opt.id === q.target.id
                                                    : opt.id === q.correctId;
                                                let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100";
                                                if (submitted) {
                                                    if (isTarget) btnStyle = "quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold";
                                                    else if (answerId === opt.id) btnStyle = "quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold";
                                                } else if (answerId === opt.id) {
                                                    btnStyle = "quiz-opt-selected bg-indigo-50 border-indigo-500 text-indigo-900 font-semibold";
                                                }
                                                return (
                                                    <button
                                                        key={idx}
                                                        disabled={submitted}
                                                        onClick={() => selectQuizAnswer(opt.id)}
                                                        className={`w-full text-left p-4 rounded-xl border text-sm transition-all flex flex-col gap-1 ${btnStyle}`}
                                                    >
                                                        <div className="flex justify-between items-center">
                                                            <span className="font-semibold text-current">
                                                                {q.qType === 'quiz' ? (opt.meaning_en || opt.meaning) : opt.word}
                                                            </span>
                                                            {q.qType === 'quiz' && showBangla && (opt.meaning_bn || opt.bangla) && (
                                                                <span className="text-xs font-bold text-current">{opt.meaning_bn || opt.bangla}</span>
                                                            )}
                                                        </div>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    {q.qType === 'truefalse' && (
                                        <div className="grid grid-cols-2 gap-3">
                                            {[
                                                { id: true, label: 'True' },
                                                { id: false, label: 'False' },
                                            ].map(opt => {
                                                let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100";
                                                if (submitted) {
                                                    if (opt.id === q.isTrue) btnStyle = "quiz-opt-correct bg-emerald-100 border-emerald-500 text-emerald-800 font-bold";
                                                    else if (answerId === opt.id) btnStyle = "quiz-opt-wrong bg-red-100 border-red-500 text-red-900 font-bold";
                                                } else if (answerId === opt.id) {
                                                    btnStyle = "quiz-opt-selected bg-indigo-50 border-indigo-500 text-indigo-900 font-semibold";
                                                }
                                                return (
                                                    <button
                                                        key={String(opt.id)}
                                                        disabled={submitted}
                                                        onClick={() => selectQuizAnswer(opt.id)}
                                                        className={`py-4 rounded-xl border text-base font-black transition-all ${btnStyle}`}
                                                    >
                                                        {opt.label}
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    )}

                                    <div className={`grid transition-[grid-template-rows] duration-300 ease-in-out ${(submitted && revealWord) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'}`}>
                                        <div className="overflow-hidden">
                                            {submitted && (
                                                <WordRevealContent
                                                    {...((q.qType === 'synonym' || q.qType === 'antonym')
                                                        ? { item: q.target, focusEntry: q.correctEntry, focusTone: q.qType === 'synonym' ? 'syn' : 'ant' }
                                                        : getFamilyReveal(q.target))}
                                                    accent={speechAccent}
                                                    notify={triggerToast}
                                                    showBangla={showBangla}
                                                    fieldVisibility={fieldVisibility}
                                                    famMap={currentFamiliarityMap}
                                                    onSetFamiliarity={setWordFamiliarity}
                                                />
                                            )}
                                        </div>
                                    </div>

                                    {!submitted ? (
                                        <button
                                            data-submit-btn
                                            disabled={answerId === null || answerId === undefined}
                                            onClick={submitCurrentQuizAnswer}
                                            className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl disabled:opacity-50 hover:bg-indigo-700 transition-all"
                                        >
                                            Submit Answer
                                        </button>
                                    ) : quizQuestionIndex < quizQuestions.length - 1 ? (
                                        <button
                                            onClick={() => { setQuizQuestionIndex(prev => prev + 1); setRevealWord(false); }}
                                            className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-all"
                                        >
                                            Next Question →
                                        </button>
                                    ) : (
                                        <button
                                            onClick={finishQuiz}
                                            className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-all"
                                        >
                                            Finish Quiz 🎉
                                        </button>
                                    )}
                                </div>

                                {/* ===== INTERACTIVE SCRUBBER — drag or click a dot to jump to that question ===== */}
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 space-y-3">
                                    <input
                                        type="range"
                                        min={0}
                                        max={quizQuestions.length - 1}
                                        step={1}
                                        value={quizQuestionIndex}
                                        onChange={(e) => { setQuizQuestionIndex(Number(e.target.value)); setRevealWord(false); }}
                                        className="w-full accent-indigo-600 cursor-pointer"
                                    />
                                    <div className="flex items-center justify-center flex-wrap gap-1.5">
                                        {quizQuestions.map((qq, i) => {
                                            const a = quizAnswers[i];
                                            const isCurrent = i === quizQuestionIndex;
                                            let dotCls = 'bg-slate-200 text-slate-500 hover:bg-slate-300';
                                            if (a && a.submitted) {
                                                dotCls = isQuizAnswerCorrect(qq, a.answerId) ? 'bg-emerald-500 text-white' : 'bg-red-400 text-white';
                                            }
                                            return (
                                                <button
                                                    key={i}
                                                    onClick={() => { setQuizQuestionIndex(i); setRevealWord(false); }}
                                                    title={`Question ${i + 1}`}
                                                    className={`w-6 h-6 rounded-full text-[10px] font-bold flex items-center justify-center transition-all ${dotCls} ${isCurrent ? 'ring-2 ring-indigo-500 ring-offset-1' : ''}`}
                                                >
                                                    {i + 1}
                                                </button>
                                            );
                                        })}
                                    </div>
                                    <p className="text-center text-[11px] text-slate-400">{quizAnsweredCount} of {quizQuestions.length} answered</p>
                                </div>
                            </div>
                        );
                    })()}

                    {activeTab === 'quiz' && quizPhase === 'done' && (() => {
                        const lastAttempt = quizHistory[0];
                        const lastMistakeWords = lastAttempt ? resolveMistakeWords(
                            Object.fromEntries((lastAttempt.mistakeIds || []).map(id => [id, { count: 1, last: lastAttempt.date }]))
                        ) : [];
                        return (
                        <div className="max-w-xl mx-auto space-y-4">
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-8 text-center space-y-4">
                                <h2 className="text-3xl font-extrabold text-slate-900">Quiz Completed! 🎉</h2>
                                <p className="text-slate-600 text-base">
                                    Your final score: <span className="font-bold text-indigo-600 text-xl">{quizScore} / {quizQuestions.length}</span>
                                </p>
                                <div className="flex flex-col sm:flex-row gap-3 justify-center pt-2">
                                    <button
                                        onClick={() => buildAndStartQuiz()}
                                        className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all"
                                    >
                                        Retake (same settings)
                                    </button>
                                    <button
                                        onClick={() => setQuizPhase('setup')}
                                        className="px-6 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl border border-slate-200 hover:bg-slate-200 transition-all"
                                    >
                                        Change Settings
                                    </button>
                                </div>
                            </div>

                            {lastMistakeWords.length > 0 && (
                                <div className="bg-white rounded-2xl border border-rose-200 shadow-md p-6 space-y-3">
                                    <h3 className="text-sm font-extrabold text-slate-900">You missed {lastMistakeWords.length} word{lastMistakeWords.length === 1 ? '' : 's'} this time</h3>
                                    <div className="flex flex-wrap gap-1.5">
                                        {lastMistakeWords.map(w => (
                                            <span key={w.id} className="text-xs bg-rose-50 text-rose-700 border border-rose-200 px-2.5 py-1 rounded-full font-semibold">{w.word}</span>
                                        ))}
                                    </div>
                                    <button
                                        onClick={() => buildAndStartQuiz(lastMistakeWords)}
                                        className="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-700 transition-all text-sm"
                                    >
                                        Retake Just These Mistakes →
                                    </button>
                                </div>
                            )}
                        </div>
                        );
                    })()}

                    {/* MODE 4: MODERN GAME MODE */}
                    {activeTab === 'game' && (
                        <ModernVocabGame
                            userXP={userXP}
                            userLevel={userLevel}
                            streak={currentStreak}
                            todayLearned={todaysActivity.learned}
                            dailyGoal={dailyGoal}
                            wordPool={gameWordPool}
                            showBangla={showBangla}
                            triggerToast={triggerToast}
                            onVictoryXP={addXP}
                            appTheme={appTheme}
                            onThemeChange={setAppTheme}
                            shortcuts={shortcuts}
                            globalSound={globalSound}
                            speechAccent={speechAccent}
                            fieldVisibility={fieldVisibility}
                            familiarityMap={currentFamiliarityMap}
                            onSetFamiliarity={setWordFamiliarity}
                            onGameFinished={handleGameFinished}
                            onReviewMissed={startGameReview}
                            reviewActive={!!gameReviewPool}
                            reviewCount={gameReviewCount}
                            onExitReview={exitGameReview}
                            mistakeBankCount={gameMistakeWords.length}
                            onOpenMistakeBank={(tab) => { setGameReviewTab(tab || 'mistakes'); setGameMistakeSelection(null); setShowGameReviewModal(true); }}
                        />
                    )}

                    {/* MODE 4b: MULTIPLAYER (stays mounted once opened so a live room keeps its connection while you browse other tabs) */}
                    {(activeTab === 'multi' || mpVisited) && (
                        <div style={{ display: activeTab === 'multi' ? 'block' : 'none' }}>
                            <MultiplayerArena
                                cloudUser={cloudUser}
                                cloudAuthReady={cloudAuthReady}
                                onSignIn={signInWithGoogle}
                                nickname={nickname}
                                books={books}
                                allWords={allWords}
                                activeBookId={activeBook.id}
                                triggerToast={triggerToast}
                                chunkSize={chunkSize}
                            />
                        </div>
                    )}

                    {/* MODE 5: STATS & STREAK */}
                    {activeTab === 'stats' && (
                        <div className="space-y-6">
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <h2 className="text-lg font-black text-slate-800 flex items-center gap-2">📊 Your Progress</h2>
                                <p className="text-xs text-slate-400 mt-1">Streaks, daily activity, and a full breakdown of how your vocabulary is growing.</p>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="rounded-2xl p-4 border border-orange-200" style={{ background: 'linear-gradient(135deg,#fff1ea,#fff7e6)' }}>
                                    <div className="text-2xl">🔥</div>
                                    <div className="text-2xl font-black text-slate-800 mt-1">{currentStreak} <span className="text-xs font-bold text-slate-500">days</span></div>
                                    <div className="text-[10px] font-bold text-orange-500 uppercase tracking-wider">Current Streak</div>
                                </div>
                                <div className="rounded-2xl p-4 border border-amber-200" style={{ background: 'linear-gradient(135deg,#fff8e1,#fffdf2)' }}>
                                    <div className="text-2xl">🏅</div>
                                    <div className="text-2xl font-black text-slate-800 mt-1">{bestStreak} <span className="text-xs font-bold text-slate-500">days</span></div>
                                    <div className="text-[10px] font-bold text-amber-500 uppercase tracking-wider">Best Streak</div>
                                </div>
                                <div className="rounded-2xl p-4 border border-emerald-200" style={{ background: 'linear-gradient(135deg,#e9fbf3,#f2fdf8)' }}>
                                    <div className="text-2xl">✨</div>
                                    <div className="text-2xl font-black text-slate-800 mt-1">{todaysActivity.learned} <span className="text-xs font-bold text-slate-500">words</span></div>
                                    <div className="text-[10px] font-bold text-emerald-500 uppercase tracking-wider">Learned Today</div>
                                </div>
                                <div className="rounded-2xl p-4 border border-indigo-200" style={{ background: 'linear-gradient(135deg,#eee9fe,#f5f2ff)' }}>
                                    <div className="text-2xl">📚</div>
                                    <div className="text-2xl font-black text-slate-800 mt-1">{familiarityCounts.familiar} <span className="text-xs font-bold text-slate-500">of {currentWords.length}</span></div>
                                    <div className="text-[10px] font-bold text-indigo-500 uppercase tracking-wider">Total Familiar</div>
                                </div>
                            </div>

                            {/* DAILY TARGET & HISTORY */}
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <div className="flex items-center justify-between flex-wrap gap-2">
                                    <h3 className="text-sm font-black text-slate-700 flex items-center gap-2">🎯 Daily Target</h3>
                                    <button type="button" onClick={openDailyGoalSettings} className="text-[11px] font-bold text-indigo-600 hover:underline">Target: {dailyGoal} words/day · change</button>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <div className="rounded-xl border border-emerald-200 bg-emerald-50/60 p-3">
                                        <div className="text-[10px] font-bold text-emerald-600 uppercase tracking-wider">Today</div>
                                        <div className="text-xl font-black text-slate-800 mt-0.5">{todaysActivity.learned} <span className="text-xs font-bold text-slate-400">/ {dailyGoal} words</span></div>
                                        <div className="h-2 mt-1.5 rounded-full bg-white border border-emerald-200 overflow-hidden">
                                            <div className={`h-full transition-all duration-500 ${todaysActivity.learned >= dailyGoal ? 'bg-emerald-500' : 'bg-amber-400'}`} style={{ width: `${Math.min(100, (todaysActivity.learned / dailyGoal) * 100)}%` }} />
                                        </div>
                                        <div className="text-[10px] font-semibold text-slate-400 mt-1">{todaysActivity.xp} XP today</div>
                                    </div>
                                    <div className="rounded-xl border border-indigo-200 bg-indigo-50/60 p-3">
                                        <div className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">Last 7 days</div>
                                        <div className="text-xl font-black text-slate-800 mt-0.5">{periodStats.weekLearned} <span className="text-xs font-bold text-slate-400">words</span></div>
                                        <div className="text-[10px] font-semibold text-slate-400 mt-1">{periodStats.weekXp} XP · goal met {periodStats.week.filter(d => d.learned >= dailyGoal).length}/7 days</div>
                                    </div>
                                    <div className="rounded-xl border border-amber-200 bg-amber-50/60 p-3">
                                        <div className="text-[10px] font-bold text-amber-600 uppercase tracking-wider">Last 30 days</div>
                                        <div className="text-xl font-black text-slate-800 mt-0.5">{periodStats.monthLearned} <span className="text-xs font-bold text-slate-400">words</span></div>
                                        <div className="text-[10px] font-semibold text-slate-400 mt-1">{periodStats.monthXp} XP · avg {(periodStats.monthLearned / 30).toFixed(1)}/day</div>
                                    </div>
                                </div>

                                {/* Last 7 days bars — tap a bar to see that day */}
                                {(() => {
                                    const maxVal = Math.max(dailyGoal, ...periodStats.week.map(d => d.learned), 1);
                                    return (
                                        <div className="flex items-end gap-2 h-28 pt-2">
                                            {periodStats.week.map(d => {
                                                const met = d.learned >= dailyGoal;
                                                const picked = statsSelectedDate === d.key;
                                                return (
                                                    <button key={d.key} type="button" onClick={() => setStatsSelectedDate(d.key)} title={`${d.key}: ${d.learned} words`} className="flex-1 h-full flex flex-col items-center justify-end gap-1 group">
                                                        <span className="text-[10px] font-bold text-slate-500">{d.learned}</span>
                                                        <div className="w-full flex-1 flex items-end">
                                                            <div className={`w-full rounded-t-md transition-all duration-500 ${met ? 'bg-emerald-500' : d.learned > 0 ? 'bg-amber-400' : 'bg-slate-200'} ${picked ? 'ring-2 ring-indigo-500 ring-offset-1' : ''}`} style={{ height: `${Math.max(4, (d.learned / maxVal) * 100)}%` }} />
                                                        </div>
                                                        <span className={`text-[10px] font-bold ${picked ? 'text-indigo-600' : 'text-slate-400'}`}>{d.date.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    );
                                })()}

                                {/* Pick any date */}
                                {(() => {
                                    const picked = activityLog[statsSelectedDate] || {};
                                    const learned = picked.learned || 0;
                                    const xp = picked.xp || 0;
                                    const pretty = (() => { const [y, m, d] = statsSelectedDate.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' }); })();
                                    return (
                                        <div className="flex flex-col sm:flex-row sm:items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 p-3">
                                            <label className="flex items-center gap-2 text-xs font-bold text-slate-500">
                                                📅 Pick a date
                                                <input type="date" value={statsSelectedDate} max={todayKey()} onChange={(e) => e.target.value && setStatsSelectedDate(e.target.value)} className="px-2 py-1 rounded-lg border border-slate-300 bg-white text-xs font-bold text-slate-700" />
                                            </label>
                                            <div className="flex-1 text-xs font-semibold text-slate-600 sm:text-right">
                                                <span className="text-slate-400">{pretty}:</span> <b className="text-slate-800">{learned} words learned</b> · {xp} XP ·{' '}
                                                <span className={learned >= dailyGoal ? 'text-emerald-600 font-bold' : 'text-slate-400'}>{learned >= dailyGoal ? '✓ goal met' : `goal ${dailyGoal} not met`}</span>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>

                            {currentStreak === 0 && (
                                <div className="border border-dashed border-indigo-200 rounded-2xl p-3 text-center text-xs font-semibold text-indigo-500 bg-indigo-50/50">
                                    No active streak yet — mark a word as "Familiar" or earn XP today to light the flame 🔥
                                </div>
                            )}

                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                {/* STUDY CALENDAR */}
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="text-sm font-black text-slate-700 flex items-center gap-2">📅 Study Calendar</h3>
                                        <div className="flex items-center gap-3">
                                            <button onClick={() => setStatsCalendarOffset(p => p - 1)} className="text-slate-400 hover:text-indigo-600">‹</button>
                                            <span className="text-xs font-bold text-slate-600">{statsCalendarData.label}</span>
                                            <button onClick={() => setStatsCalendarOffset(p => p + 1)} className="text-slate-400 hover:text-indigo-600">›</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400 mb-1">
                                        {['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((d, i) => <div key={i}>{d}</div>)}
                                    </div>
                                    <div className="grid grid-cols-7 gap-1">
                                        {statsCalendarData.cells.map((day, i) => {
                                            if (day === null) return <div key={i} />;
                                            const key = `${statsCalendarData.year}-${String(statsCalendarData.month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                                            const isToday = key === todayKey();
                                            const active = activeDateSet.has(key);
                                            return (
                                                <button type="button" key={i} onClick={() => setStatsSelectedDate(key)} className={`aspect-square rounded-lg flex items-center justify-center text-[11px] font-bold border ${isToday ? 'border-indigo-500 text-indigo-600' : 'border-slate-100 text-slate-500'} ${active ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-slate-50'} ${statsSelectedDate === key ? 'ring-2 ring-indigo-500 ring-offset-1' : ''} cursor-pointer`}>
                                                    {day}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>

                                {/* LAST 14 WEEKS HEATMAP */}
                                <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="text-sm font-black text-slate-700 flex items-center gap-2">📈 Last 14 Weeks</h3>
                                        <span className="text-[10px] font-bold text-slate-400">{activityHeatmap.activeDaysTotal} active days total</span>
                                    </div>
                                    <div className="flex gap-1 overflow-x-auto pb-2">
                                        {activityHeatmap.weeks.map((week, wi) => (
                                            <div key={wi} className="flex flex-col gap-1">
                                                {week.map((day, di) => (
                                                    <div
                                                        key={di}
                                                        title={`${day.key}${day.future ? '' : `: level ${day.level}`}`}
                                                        className="w-3 h-3 rounded-sm"
                                                        style={{
                                                            background: day.future ? 'transparent' : ['#f1f5f9', '#c9f4de', '#7be3ac', '#34c77e', '#0e9f5e'][day.level]
                                                        }}
                                                    />
                                                ))}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex items-center justify-end gap-1 text-[10px] text-slate-400 mt-1">
                                        <span>Less</span>
                                        {['#f1f5f9', '#c9f4de', '#7be3ac', '#34c77e', '#0e9f5e'].map((c, i) => (
                                            <div key={i} className="w-3 h-3 rounded-sm" style={{ background: c }} />
                                        ))}
                                        <span>More</span>
                                    </div>

                                    <div className="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-100 text-center">
                                        <div>
                                            <div className="text-xl font-black text-slate-800">{todaysActivity.xp}</div>
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">XP Today</div>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black text-slate-800">{userXP}</div>
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Total XP</div>
                                        </div>
                                        <div>
                                            <div className="text-xl font-black text-slate-800">{userLevel}</div>
                                            <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Level</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* MASTERY BREAKDOWN */}
                            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 className="text-sm font-black text-slate-700 flex items-center gap-2 mb-4">🎯 "{activeBook.name}" Mastery Breakdown</h3>
                                <div className="space-y-3">
                                    {[
                                        { label: 'Familiar', count: familiarityCounts.familiar, color: '#10b981' },
                                        { label: 'Semi-familiar', count: familiarityCounts.semi, color: '#f59e0b' },
                                        { label: 'Unfamiliar', count: familiarityCounts.unfamiliar, color: '#64748b' }
                                    ].map((row, i) => {
                                        const total = currentWords.length || 1;
                                        const pct = Math.round((row.count / total) * 100);
                                        return (
                                            <div key={i} className="flex items-center gap-3">
                                                <div className="w-28 text-xs font-bold text-slate-500 shrink-0">{row.label}</div>
                                                <div className="flex-1 h-2.5 bg-slate-100 rounded-full overflow-hidden">
                                                    <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, background: row.color }} />
                                                </div>
                                                <div className="w-20 text-right text-xs font-bold text-slate-600 shrink-0">{row.count} ({pct}%)</div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODE 5: MANAGE PAGES, RESTORE TRASH & UNIFIED JSON IMPORT */}
                    {activeTab === 'manage' && (
                        <div className="space-y-4">
                            {/* APPEARANCE — one compact row: theme + sound switch */}
                            <div className={`rounded-2xl border shadow-sm p-4 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'} flex flex-col md:flex-row md:items-center gap-3 md:gap-6`}>
                                <h2 className="text-lg font-extrabold flex items-center gap-2 shrink-0"><span>🎨</span> Appearance</h2>
                                <div className="flex flex-wrap items-center gap-3 flex-1 md:justify-end">
                                    <div className={`inline-flex p-1 rounded-xl border gap-1 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : 'bg-slate-800/60 border-slate-700'}`}>
                                        {['midnight', 'light'].map(themeOption => (
                                            <button
                                                key={themeOption}
                                                type="button"
                                                onClick={() => setAppTheme(themeOption)}
                                                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all ${appTheme === themeOption ? 'bg-indigo-600 text-white shadow' : appTheme === 'light' ? 'text-slate-600 hover:bg-slate-200' : 'text-slate-300 hover:bg-white/10'}`}
                                            >
                                                {themeOption === 'midnight' ? '🌙 Midnight' : '☀️ Light'}
                                            </button>
                                        ))}
                                    </div>
                                    <div className="w-full sm:w-64" title="Master sound switch: when OFF, all gameplay and quiz sounds are muted.">
                                        <ToggleRow label="All Sounds" checked={globalSound} onToggle={() => setGlobalSound(v => !v)} appTheme={appTheme} />
                                    </div>
                                </div>
                            </div>

                            {/* PRONUNCIATION VOICES — selects and Test buttons share a row */}
                            <div className={`rounded-2xl border shadow-sm p-4 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'} space-y-2.5`}>
                                <div className="flex items-start justify-between gap-3 flex-wrap">
                                    <div>
                                        <h2 className="text-lg font-extrabold flex items-center gap-2"><span>🔊</span> Pronunciation Voices</h2>
                                        <p className="text-[11px] mt-0.5 opacity-70">Pick a US/UK voice or leave it on Auto. Chrome adds Google voices while online; Edge adds Microsoft Neural voices.</p>
                                    </div>
                                    <button type="button" onClick={() => updateVoicePrefs({ usVoiceURI: null, ukVoiceURI: null })} className="text-[11px] font-bold opacity-70 hover:opacity-100 underline shrink-0">Reset both to auto</button>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    {[
                                        { label: 'US', accent: 'us', opts: usVoiceOptions, prefKey: 'usVoiceURI' },
                                        { label: 'UK', accent: 'uk', opts: ukVoiceOptions, prefKey: 'ukVoiceURI' },
                                    ].map(v => (
                                        <div key={v.accent} className="space-y-1">
                                            <label className="text-[11px] font-semibold opacity-80">{v.label} English ({v.opts.length} voices)</label>
                                            <div className="flex items-center gap-2">
                                                <select
                                                    value={voicePrefs[v.prefKey] || ''}
                                                    onChange={(e) => updateVoicePrefs({ [v.prefKey]: e.target.value || null })}
                                                    className="flex-1 min-w-0 px-3 py-2 rounded-xl text-xs font-medium border focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                >
                                                    <option value="">Auto (best quality match)</option>
                                                    {v.opts.map(o => (
                                                        <option key={o.voiceURI} value={o.voiceURI}>{SpeechEngine.formatVoiceLabel(o)}</option>
                                                    ))}
                                                </select>
                                                <button type="button" onClick={() => speakWord(`Hello, this is a test of the ${v.label} voice.`, v.accent, triggerToast)} className={`px-3 py-2 rounded-xl text-xs font-bold border shrink-0 ${appTheme === 'light' ? 'bg-white border-slate-200 hover:bg-slate-50' : 'bg-slate-800/70 border-slate-600 hover:bg-slate-700'}`}>▶ Test {v.label}</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* DAILY GOAL + CHUNK SIZE — side by side on wide screens */}
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <div id="daily-goal-card" className={`rounded-2xl border shadow-sm p-4 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'} space-y-3`}>
                                    <div>
                                        <h2 className="text-lg font-extrabold flex items-center gap-2"><span>🎯</span> Daily Word Goal</h2>
                                        <p className="text-[11px] mt-0.5 opacity-70">New words you mark Familiar each day. Shown at the top and tracked in Stats &amp; Streak.</p>
                                    </div>
                                    <div className="flex items-center gap-3">
