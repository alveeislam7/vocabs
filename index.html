            // missed into the mistake bank, and logs the attempt into history
            // so "what quiz did I do and when" is answerable later.
            const finishQuiz = () => {
                const mistaken = [];
                let scoreNow = 0;
                quizQuestions.forEach((q, idx) => {
                    const a = quizAnswers[idx];
                    if (a && a.submitted) {
                        if (isQuizAnswerCorrect(q, a.answerId)) scoreNow++;
                        else if (q.target) mistaken.push(q.target);
                    }
                });
                recordMistakes(setQuizMistakes, mistaken);
                setQuizHistory(prev => [
                    {
                        id: Date.now(),
                        date: Date.now(),
                        total: quizQuestions.length,
                        score: scoreNow,
                        types: quizTypes,
                        isReview: !!quizReviewPool,
                        bookTitle: books.find(b => b.id === selectedBookId)?.title || 'Book',
                        mistakeWords: mistaken.map(w => w.word),
                        mistakeIds: mistaken.map(w => w.id),
                    },
                    ...prev,
                ].slice(0, 50));
                setQuizPhase('done');
            };

            // Reset to the setup screen whenever the quiz tab is (re)entered or the pool changes
            useEffect(() => {
                if (activeTab === 'quiz') setQuizPhase('setup');
            }, [activeTab, selectedChunks, selectedBookId, filterFamiliarities]);

            // Per-question countdown timer (only in 'perQuestion' timer mode)
            useEffect(() => {
                if (quizPhase !== 'playing' || !quizQuestions.length) { setQuizTimeLeft(null); return; }
                if (quizTimerMode !== 'perQuestion' || !quizPerQuestionSeconds) { setQuizTimeLeft(null); return; }
                const current = quizAnswers[quizQuestionIndex];
                if (current && current.submitted) { setQuizTimeLeft(null); return; }
                setQuizTimeLeft(quizPerQuestionSeconds);
                const interval = setInterval(() => {
                    setQuizTimeLeft(prev => {
                        if (prev === null) return null;
                        if (prev <= 1) { clearInterval(interval); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(interval);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [quizPhase, quizQuestionIndex, quizTimerMode, quizPerQuestionSeconds, quizQuestions.length, quizAnswers[quizQuestionIndex]?.submitted]);

            useEffect(() => {
                if (quizTimeLeft === 0) submitCurrentQuizAnswer();
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [quizTimeLeft]);

            // Overall quiz countdown (only in 'overall' timer mode) — one timer for the whole quiz session
            useEffect(() => {
                if (quizPhase !== 'playing' || !quizQuestions.length) return;
                if (quizTimerMode !== 'overall' || quizOverallTimeLeft === null) return;
                if (quizOverallTimeLeft <= 0) return;
                const interval = setInterval(() => {
                    setQuizOverallTimeLeft(prev => {
                        if (prev === null) return null;
                        if (prev <= 1) { clearInterval(interval); return 0; }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(interval);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [quizPhase, quizTimerMode, quizQuestions.length, quizOverallTimeLeft === null]);

            useEffect(() => {
                if (quizPhase === 'playing' && quizTimerMode === 'overall' && quizOverallTimeLeft === 0) {
                    submitCurrentQuizAnswer();
                    setTimeout(finishQuiz, 0);
                }
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [quizOverallTimeLeft]);

            useEffect(() => {
                if (cardIndex >= playablePool.length) setCardIndex(0);
            }, [playablePool.length]);

            useEffect(() => {
                setSelectedChunks([]);
                setSelectedLetter('ALL');
            }, [selectedBookId]);

            useEffect(() => {
                if (activeTab === 'flashcards' && playablePool[cardIndex] && autoAudio) {
                    speakWord(playablePool[cardIndex].word, speechAccent, triggerToast);
                }
                setIsFlipped(false);
                setCardDetailsExpanded(false);
            }, [cardIndex, activeTab, selectedChunks, selectedBookId]);

            // Unified Bulk JSON Import supporting the current rich schema, with fallback for older flat-field exports
            const handleBulkImport = () => {
                try {
                    const parsed = JSON.parse(importText);
                    importPayloadIntoActiveBook(parsed, { source: 'JSON' });
                    setImportText('');
                } catch (e) {
                    triggerToast("JSON syntax error! Please check formatting.");
                }
            };

            const handleImportBackupFile = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        importPayloadIntoActiveBook(parsed, { source: 'Backup file' });
                    } catch (err) {
                        triggerToast("The selected file is not a valid backup JSON file.");
                    } finally {
                        event.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            const readFileAsText = (file) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsText(file);
            });

            const handleImportJsonFile = async (event) => {
                const files = Array.from(event.target.files || []);
                if (!files.length) return;

                // Single file: keep the original, immediate per-file toast wording.
                if (files.length === 1) {
                    try {
                        const text = await readFileAsText(files[0]);
                        const parsed = JSON.parse(text);
                        importPayloadIntoActiveBook(parsed, { source: 'JSON file' });
                    } catch (err) {
                        triggerToast("The selected file is not valid JSON word data.");
                    } finally {
                        event.target.value = '';
                    }
                    return;
                }

                // Multiple files: import each in turn, then show one combined summary toast.
                let totalAdded = 0, totalUpdated = 0, totalPromoted = 0, failedCount = 0, restoredCount = 0;
                for (const file of files) {
                    try {
                        const text = await readFileAsText(file);
                        const parsed = JSON.parse(text);
                        const result = importPayloadIntoActiveBook(parsed, { source: 'JSON file', silent: true });
                        if (result?.restored) {
                            restoredCount++;
                        } else {
                            totalAdded += result?.addedCount || 0;
                            totalUpdated += result?.updatedCount || 0;
                            totalPromoted += result?.promotedCount || 0;
                        }
                    } catch (err) {
                        failedCount++;
                    }
                }
                event.target.value = '';

                const parts = [];
                if (totalAdded || totalUpdated || totalPromoted) {
                    const promotedNote = totalPromoted > 0 ? `, ${totalPromoted} synonym/antonym word${totalPromoted > 1 ? 's' : ''} promoted` : '';
                    parts.push(`${totalAdded} added, ${totalUpdated} updated${promotedNote}`);
                }
                if (restoredCount > 0) parts.push(`${restoredCount} backup file${restoredCount > 1 ? 's' : ''} restored`);
                if (failedCount > 0) parts.push(`${failedCount} file${failedCount > 1 ? 's' : ''} failed`);
                triggerToast(`${files.length} JSON files imported! ${parts.join(', ')}.`);
            };

            // Export Backup
            const handleExportBackup = () => {
                const backupObj = {
                    books,
                    allWords,
                    allFamiliarity,
                    allMastered: migrateMasteredToFamiliarity(
                        Object.fromEntries(
                            Object.entries(allFamiliarity).map(([bookId, map]) => [
                                bookId,
                                Object.entries(map || {})
                                    .filter(([, v]) => v === 'familiar')
                                    .map(([id]) => Number(id))
                            ])
                        )
                    ),
                    allTrash,
                    userXP,
                    exportDate: new Date().toISOString()
                };
                const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", jsonStr);
                downloadAnchor.setAttribute("download", `Vocabulation_Backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                triggerToast("Backup exported successfully!");
            };

            // Export just the active companion's words as plain JSON — the same shape
            // the Import JSON box accepts, so it round-trips cleanly (e.g. to hand off
            // to someone else, or re-import into a different companion).
            const handleExportJson = () => {
                const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentWords, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", jsonStr);
                const safeName = activeBook.name.replace(/[^a-z0-9]+/gi, '_');
                downloadAnchor.setAttribute("download", `${safeName}_words_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                triggerToast(`Exported ${currentWords.length} words from "${activeBook.name}"!`);
            };

            // Calculate Level from XP
            const userLevel = Math.floor(userXP / 100) + 1;

            // ===================== WORD CARD =====================
            // The single source-of-truth "full word card" — used in the Word List,
            // and reused later (Step 4) for the "show full word" button inside games.
            const WordCard = ({ item, famLevel, showActions = true, detailMode = false }) => {
                const isExpanded = expandedWordCardIds.includes(item.id);

                // Group coloring: the outer card is only tinted by familiarity level
                // when the main word AND every synonym/antonym entry underneath it
                // share the exact same level. Otherwise it stays neutral, while the
                // main word's own familiarity buttons still only ever affect its own status.
                const groupEntryIds = [
                    ...(item.synonyms || []).map((s, i) => getRelatedEntryId(item.id, 'syn', i, s)),
                    ...(item.antonyms || []).map((a, i) => getRelatedEntryId(item.id, 'ant', i, a))
                ];
                const groupLevels = [famLevel, ...groupEntryIds.map(id => getWordFamiliarityLevel(currentFamiliarityMap, id))];
                const groupLevel = groupLevels.every(l => l === groupLevels[0]) ? groupLevels[0] : null;
                const outerCardClassName = groupLevel ? familiarityCardBorder(groupLevel) : familiarityCardBorder('unfamiliar');

                const editDeleteActions = showActions ? (
                    <>
                        <button
                            onClick={() => setEditingWord({
                                ...item,
                                meaning_en: item.meaning_en || item.meaning || '',
                                meaning_bn: item.meaning_bn || item.bangla || '',
                                example_main: item.example_main || item.sentence || '',
                                meaning_en_detailed: item.meaning_en_detailed || '',
                                context_main: item.context_main || '',
                                synonyms: item.synonyms || [],
                                antonyms: item.antonyms || []
                            })}
                            className="p-1 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center active:scale-95"
                            title="Edit word details"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                            </svg>
                        </button>

                        <button
                            onClick={() => setDeleteTargetId(item.id)}
                            className="p-1 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center active:scale-95"
                            title="Delete word"
                        >
                            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 01-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                            </svg>
                        </button>
                    </>
                ) : null;

                const actions = showActions ? (
                    <>
                        <FamiliarityPicker
                            level={famLevel}
                            onSet={(level) => setWordFamiliarity(item.id, level)}
                            compact
                        />
                        {editDeleteActions}
                    </>
                ) : null;

                return (
                    <WordCardShell
                        item={item}
                        accent={speechAccent}
                        notify={triggerToast}
                        showBangla={showBangla}
                        expanded={isExpanded}
                        onToggleExpand={() => toggleCardExpand(item.id)}
                        actions={actions}
                        editDeleteActions={editDeleteActions}
                        cardClassName={outerCardClassName}
                        fieldVisibility={fieldVisibility}
                        relatedFamiliarityMap={showActions ? currentFamiliarityMap : null}
                        onSetRelatedFamiliarity={showActions ? setWordFamiliarity : null}
                        detailMode={detailMode}
                    />
                );
            };

            return (
                <div className="min-h-screen">
                    <div className="max-w-[1600px] mx-auto px-4 py-6 relative">
                    {}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-sm font-medium flex items-center gap-2 animate-bounce">
                            <span>💡</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* MODAL: GEMINI PROMPT TEMPLATE GUIDE */}
                    {showGeminiPromptModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                    <span className="text-current">📋</span> AI Prompt Template
                                </h3>
                                <p className="text-xs text-slate-600">
                                    Copy and paste this prompt to your AI tool along with your book PDF. It will output JSON in the new schema (meaning, context, example, up to 3 synonyms/antonyms each) that you can paste straight into the Word Manager's Import box below. You can edit this prompt anytime.
                                </p>
                                {isEditingPrompt ? (
                                    <textarea
                                        value={promptTemplate}
                                        onChange={(e) => setPromptTemplate(e.target.value)}
                                        className="w-full bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-xl border border-slate-800 h-60"
                                    />
                                ) : (
                                    <div className="bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-xl border border-slate-800 relative group overflow-x-auto max-h-60">
                                        <pre className="whitespace-pre-wrap">{promptTemplate}</pre>
                                    </div>
                                )}
                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                const el = document.createElement('textarea');
                                                el.value = promptTemplate;
                                                document.body.appendChild(el);
                                                el.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(el);
                                                triggerToast("Prompt copied to clipboard!");
                                            }}
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl flex items-center gap-1.5"
                                        >
                                            <span>📋 Copy Prompt</span>
                                        </button>
                                        <button
                                            onClick={() => setIsEditingPrompt(v => !v)}
                                            className="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded-xl flex items-center gap-1.5"
                                        >
                                            {isEditingPrompt ? '✓ Save' : '✏️ Edit'}
                                        </button>
                                        {promptTemplate !== DEFAULT_PROMPT_TEMPLATE && (
                                            <button
                                                onClick={() => setPromptTemplate(DEFAULT_PROMPT_TEMPLATE)}
                                                className="px-3 py-2 text-slate-500 hover:text-slate-700 text-xs font-semibold rounded-xl"
                                            >
                                                Reset
                                            </button>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => setShowGeminiPromptModal(false)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: PROFILE */}
                    {showProfileModal && cloudUser && (
                        <div
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={(e) => { if (e.target === e.currentTarget) setShowProfileModal(false); }}
                        >
                            <div className="bg-white rounded-2xl max-w-sm w-full shadow-2xl overflow-hidden">
                                {/* HEADER */}
                                <div className="bg-gradient-to-br from-indigo-600 to-purple-700 px-6 pt-6 pb-8 text-white relative">
                                    <button
                                        type="button"
                                        onClick={() => setShowProfileModal(false)}
                                        className="absolute top-3 right-3 w-7 h-7 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center text-sm font-bold"
                                        title="Close"
                                    >
                                        ✕
                                    </button>
                                    <div className="flex items-center gap-3">
                                        {cloudUser.photoURL ? (
                                            <img src={cloudUser.photoURL} alt="" className="w-14 h-14 rounded-full border-2 border-white/40" referrerPolicy="no-referrer" />
                                        ) : (
                                            <span className="w-14 h-14 rounded-full bg-white/20 flex items-center justify-center text-xl font-bold border-2 border-white/40">
                                                {(displayName || '?')[0].toUpperCase()}
                                            </span>
                                        )}
                                        <div className="min-w-0">
                                            <div className="text-lg font-black truncate">{displayName}</div>
                                            <div className="text-xs text-indigo-100/80 truncate">{cloudUser.email}</div>
                                        </div>
                                    </div>
                                </div>

                                {/* BODY */}
                                <div className="p-6 space-y-5 max-h-[65vh] overflow-y-auto">
                                    {/* EDITABLE NICKNAME */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Display Name / Nickname</label>
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={nicknameDraft}
                                                onChange={(e) => setNicknameDraft(e.target.value)}
                                                placeholder={cloudUser.displayName || 'Your name'}
                                                maxLength={40}
                                                className="flex-1 min-w-0 px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                            <button
                                                type="button"
                                                onClick={() => { setNickname(nicknameDraft.trim()); triggerToast('Name updated ✓'); }}
                                                className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shrink-0"
                                            >
                                                Save
                                            </button>
                                        </div>
                                        <p className="text-[11px] text-slate-400 mt-1">This is shown around the app instead of your Google name. Leave blank to use "{cloudUser.displayName || cloudUser.email}".</p>
                                    </div>

                                    {/* ACCOUNT INFO */}
                                    <div className="bg-slate-50 rounded-xl p-3 space-y-2 border border-slate-100">
                                        <div className="flex items-center justify-between text-xs">
                                            <span className="text-slate-500 font-semibold">Email</span>
                                            <span className="text-slate-800 font-bold truncate max-w-[180px]">{cloudUser.email}</span>
                                        </div>
                                        <div className="flex items-center justify-between text-xs">
                                            <span className="text-slate-500 font-semibold">Cloud Sync</span>
                                            <span className={`font-bold flex items-center gap-1.5 ${cloudSyncStatus === 'error' ? 'text-rose-500' : 'text-emerald-600'}`}>
                                                <span className={`w-1.5 h-1.5 rounded-full ${
                                                    cloudSyncStatus === 'error' ? 'bg-rose-400' :
                                                    (cloudSyncStatus === 'saving' || cloudSyncStatus === 'loading') ? 'bg-amber-400 animate-pulse' :
                                                    'bg-emerald-400'
                                                }`}></span>
                                                {cloudSyncStatus === 'error' ? 'Sync error' : cloudSyncStatus === 'saving' ? 'Saving…' : cloudSyncStatus === 'loading' ? 'Loading…' : 'Synced'}
                                            </span>
                                        </div>
                                    </div>

                                    {/* PROGRESS SNAPSHOT (pulled from Word Manager / Stats) */}
                                    <div>
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Your Progress</div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div className="bg-indigo-50 rounded-xl p-3 border border-indigo-100">
                                                <div className="text-[10px] font-bold text-indigo-400 uppercase">Level</div>
                                                <div className="text-lg font-black text-indigo-900">{userLevel} <span className="text-[10px] font-semibold text-indigo-400">({userXP} XP)</span></div>
                                            </div>
                                            <div className="bg-orange-50 rounded-xl p-3 border border-orange-100">
                                                <div className="text-[10px] font-bold text-orange-400 uppercase">Streak</div>
                                                <div className="text-lg font-black text-orange-900">🔥 {currentStreak} <span className="text-[10px] font-semibold text-orange-400">best {bestStreak}</span></div>
                                            </div>
                                            <div className="bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                                                <div className="text-[10px] font-bold text-emerald-400 uppercase">Books</div>
                                                <div className="text-lg font-black text-emerald-900">{books.length}</div>
                                            </div>
                                            <div className="bg-purple-50 rounded-xl p-3 border border-purple-100">
                                                <div className="text-[10px] font-bold text-purple-400 uppercase">Total Words</div>
                                                <div className="text-lg font-black text-purple-900">{Object.values(allWords).reduce((sum, arr) => sum + (Array.isArray(arr) ? arr.length : 0), 0)}</div>
                                            </div>
                                        </div>
                                        <button
                                            type="button"
                                            onClick={() => { setShowProfileModal(false); setActiveTab('manage'); }}
                                            className="mt-2 w-full text-center text-xs font-bold text-indigo-600 hover:text-indigo-800 py-1.5"
                                        >
                                            Manage books & words in Word Manager →
                                        </button>
                                    </div>
                                </div>

                                {/* FOOTER: LOG OUT */}
                                <div className="px-6 pb-6 pt-1 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => { setShowProfileModal(false); signOutOfCloud(); }}
                                        className="w-full mt-4 px-4 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 text-sm font-bold rounded-xl border border-rose-200 transition-colors"
                                    >
                                        ⏻ Log Out
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: QUIZ MISTAKE REVIEW + HISTORY */}
                    {showQuizReviewModal && (
                        <div
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={(e) => { if (e.target === e.currentTarget) setShowQuizReviewModal(false); }}
                        >
                            <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="px-6 pt-5 pb-3 border-b border-slate-100 flex items-center justify-between shrink-0">
                                    <h3 className="text-lg font-extrabold text-slate-900">📝 Practice Quiz</h3>
                                    <button type="button" onClick={() => setShowQuizReviewModal(false)} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-sm font-bold text-slate-500">✕</button>
                                </div>
                                <div className="px-6 pt-3 flex gap-2 shrink-0">
                                    {[['mistakes', `Mistakes (${quizMistakeWords.length})`], ['history', `History (${quizHistory.length})`]].map(([id, label]) => (
                                        <button
                                            key={id}
                                            onClick={() => setQuizReviewTab(id)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${quizReviewTab === id ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                        >
                                            {label}
                                        </button>
                                    ))}
                                </div>

                                <div className="p-6 overflow-y-auto flex-1 space-y-2">
                                    {quizReviewTab === 'mistakes' ? (
                                        quizMistakeWords.length === 0 ? (
                                            <p className="text-sm text-slate-400 text-center py-8">No mistakes tracked yet.</p>
                                        ) : (
                                            quizMistakeWords.map(w => {
                                                const sel = quizMistakeSelection;
                                                const isChecked = sel === null || sel.includes(w.id);
                                                return (
                                                    <label key={w.id} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
                                                        <span className="flex items-center gap-2 min-w-0">
                                                            <input
                                                                type="checkbox"
                                                                checked={isChecked}
                                                                onChange={() => {
                                                                    setQuizMistakeSelection(prev => {
                                                                        const base = prev === null ? quizMistakeWords.map(x => x.id) : prev;
                                                                        return base.includes(w.id) ? base.filter(id => id !== w.id) : [...base, w.id];
                                                                    });
                                                                }}
                                                                className="shrink-0"
                                                            />
                                                            <span className="text-sm font-semibold text-slate-800 truncate">{w.word}</span>
                                                        </span>
                                                        <span className="text-[11px] text-rose-500 font-bold shrink-0">missed ×{w.__missCount}</span>
                                                    </label>
                                                );
                                            })
                                        )
                                    ) : (
                                        quizHistory.length === 0 ? (
                                            <p className="text-sm text-slate-400 text-center py-8">No quiz attempts yet.</p>
                                        ) : (
                                            quizHistory.map((h, i) => (
                                                <div key={h.id} className="flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border border-slate-100">
                                                    <div className="min-w-0">
                                                        <div className="text-xs font-bold text-slate-800">
                                                            Quiz #{quizHistory.length - i} {h.isReview && <span className="text-rose-500">(Review)</span>}
                                                        </div>
                                                        <div className="text-[11px] text-slate-400">{new Date(h.date).toLocaleString()} · {h.types.join(', ')}</div>
                                                    </div>
                                                    <span className={`text-xs font-black shrink-0 ${h.score === h.total ? 'text-emerald-600' : 'text-slate-700'}`}>{h.score}/{h.total}</span>
                                                </div>
                                            ))
                                        )
                                    )}
                                </div>

                                {quizReviewTab === 'mistakes' && quizMistakeWords.length > 0 && (
                                    <div className="px-6 pb-6 pt-2 border-t border-slate-100 shrink-0">
                                        <button
                                            onClick={() => {
                                                const sel = quizMistakeSelection;
                                                const chosen = sel === null ? quizMistakeWords : quizMistakeWords.filter(w => sel.includes(w.id));
                                                if (!chosen.length) { triggerToast('Select at least one word.'); return; }
                                                setShowQuizReviewModal(false);
                                                buildAndStartQuiz(chosen);
                                            }}
                                            className="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-700 transition-all text-sm"
                                        >
                                            ▶ Start Review Quiz
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: WORD QUEST MISTAKE REVIEW + HISTORY */}
                    {showGameReviewModal && (
                        <div
                            className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4"
                            onClick={(e) => { if (e.target === e.currentTarget) setShowGameReviewModal(false); }}
                        >
                            <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                                <div className="px-6 pt-5 pb-3 border-b border-slate-100 flex items-center justify-between shrink-0">
                                    <h3 className="text-lg font-extrabold text-slate-900">🎮 Word Quest</h3>
                                    <button type="button" onClick={() => setShowGameReviewModal(false)} className="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-sm font-bold text-slate-500">✕</button>
                                </div>
                                <div className="px-6 pt-3 flex gap-2 shrink-0">
                                    {[['mistakes', `Mistakes (${gameMistakeWords.length})`], ['history', `History (${gameHistory.length})`]].map(([id, label]) => (
                                        <button
                                            key={id}
                                            onClick={() => setGameReviewTab(id)}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-all ${gameReviewTab === id ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-50 text-slate-600 border-slate-200'}`}
                                        >
                                            {label}
                                        </button>
                                    ))}
                                </div>

                                <div className="p-6 overflow-y-auto flex-1 space-y-2">
                                    {gameReviewTab === 'mistakes' ? (
                                        gameMistakeWords.length === 0 ? (
                                            <p className="text-sm text-slate-400 text-center py-8">No missed words tracked yet.</p>
                                        ) : (
                                            gameMistakeWords.map(w => {
                                                const sel = gameMistakeSelection;
                                                const isChecked = sel === null || sel.includes(w.id);
                                                return (
                                                    <label key={w.id} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl border border-slate-100 hover:bg-slate-50 cursor-pointer">
                                                        <span className="flex items-center gap-2 min-w-0">
                                                            <input
                                                                type="checkbox"
                                                                checked={isChecked}
                                                                onChange={() => {
                                                                    setGameMistakeSelection(prev => {
                                                                        const base = prev === null ? gameMistakeWords.map(x => x.id) : prev;
                                                                        return base.includes(w.id) ? base.filter(id => id !== w.id) : [...base, w.id];
                                                                    });
                                                                }}
                                                                className="shrink-0"
                                                            />
                                                            <span className="text-sm font-semibold text-slate-800 truncate">{w.word}</span>
                                                        </span>
                                                        <span className="text-[11px] text-rose-500 font-bold shrink-0">missed ×{w.__missCount}</span>
                                                    </label>
                                                );
                                            })
                                        )
                                    ) : (
                                        gameHistory.length === 0 ? (
                                            <p className="text-sm text-slate-400 text-center py-8">No Word Quest rounds played yet.</p>
                                        ) : (
                                            gameHistory.map((h, i) => (
                                                <div key={h.id} className="flex items-center justify-between gap-2 px-3 py-2.5 rounded-xl border border-slate-100">
                                                    <div className="min-w-0">
                                                        <div className="text-xs font-bold text-slate-800">
                                                            Round #{gameHistory.length - i} · {h.mode} {h.isReview && <span className="text-rose-500">(Review)</span>}
                                                        </div>
                                                        <div className="text-[11px] text-slate-400">{new Date(h.date).toLocaleString()} · {h.questionsAnswered} answered · {h.missed} missed</div>
                                                    </div>
                                                    <span className="text-xs font-black shrink-0 text-indigo-600">{h.score} pts</span>
                                                </div>
                                            ))
                                        )
                                    )}
                                </div>

                                {gameReviewTab === 'mistakes' && gameMistakeWords.length > 0 && (
                                    <div className="px-6 pb-6 pt-2 border-t border-slate-100 shrink-0">
                                        <button
                                            onClick={() => {
                                                const sel = gameMistakeSelection;
                                                const chosen = sel === null ? gameMistakeWords : gameMistakeWords.filter(w => sel.includes(w.id));
                                                if (!chosen.length) { triggerToast('Select at least one word.'); return; }
                                                setShowGameReviewModal(false);
                                                startGameReview(chosen);
                                            }}
                                            className="w-full py-2.5 bg-rose-600 text-white font-bold rounded-xl hover:bg-rose-700 transition-all text-sm"
                                        >
                                            ▶ Enter Review Mode
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD NEW PAGE / BOOK */}
                    {showAddPageModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleAddPage} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>📄</span> Add New Vocabulary Page
                                </h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Page / Book Title</label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="e.g., GRE Verbal, WordSmart III, TOEFL..."
                                        value={newPageName}
                                        onChange={(e) => setNewPageName(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Target Word Count (Capacity Goal)</label>
                                    <input
                                        type="number"
                                        min="10"
                                        max="5000"
                                        value={newPageTarget}
                                        onChange={(e) => setNewPageTarget(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => setShowAddPageModal(false)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                    >
                                        Create Page
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL: EDIT PAGE DETAILS */}
                    {editingPageObj && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleSavePageEdit} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>✏️</span> Edit Page Details
                                </h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Page / Book Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={editingPageObj.name}
                                        onChange={(e) => setEditingPageObj({ ...editingPageObj, name: e.target.value })}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Target Word Count Goal</label>
                                    <input
                                        type="number"
                                        min="10"
                                        max="5000"
                                        value={editingPageObj.targetCount}
                                        onChange={(e) => setEditingPageObj({ ...editingPageObj, targetCount: e.target.value })}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                    {books.length > 1 ? (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                handleDeletePage(editingPageObj.id);
                                                setEditingPageObj(null);
                                            }}
                                            className="text-xs text-red-600 hover:underline font-semibold"
                                        >
                                            Delete Page
                                        </button>
                                    ) : <div></div>}
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setEditingPageObj(null)}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                        >
                                            Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL: ADD NEW WORD */}
                    {showAddWordModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form 
                                onSubmit={handleAddWord}
                                className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto"
                            >
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>➕</span> Add New Word to "{activeBook.name}"
                                </h3>
                                <div className="space-y-3 text-sm">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Word *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="e.g. Abate"
                                            value={newWordData.word}
                                            onChange={(e) => setNewWordData({ ...newWordData, word: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phonetics / Pronunciation</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. [uh-BAYT]"
                                            value={newWordData.phonetics}
                                            onChange={(e) => setNewWordData({ ...newWordData, phonetics: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-mono text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Bangla Meaning (বাংলা অর্থ)</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. হ্রাস পাওয়া / কমানো"
                                            value={newWordData.meaning_bn}
                                            onChange={(e) => setNewWordData({ ...newWordData, meaning_bn: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">English Meaning *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="e.g. To reduce (comma-separate if more than one sense)"
                                            value={newWordData.meaning_en}
                                            onChange={(e) => setNewWordData({ ...newWordData, meaning_en: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Note (your own, optional)</label>
                                        <NoteEditor
                                            rows={2}
                                            placeholder="e.g. To become less intense, severe, or widespread."
                                            value={newWordData.meaning_en_detailed}
                                            onChange={(val) => setNewWordData({ ...newWordData, meaning_en_detailed: val })}
                                            borderClass="border-slate-300"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Use Context</label>
                                        <textarea
                                            rows="2"
                                            placeholder="e.g. Used primarily for intense forces like storms, winds, pain, or public nuisances."
                                            value={newWordData.context_main}
                                            onChange={(e) => setNewWordData({ ...newWordData, context_main: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Sentence Example</label>
                                        <textarea
                                            rows="2"
                                            placeholder="e.g. The storm finally abated after three days."
                                            value={newWordData.example_main}
                                            onChange={(e) => setNewWordData({ ...newWordData, example_main: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>

                                    {/* SYNONYMS (0-3) */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-bold text-emerald-600 uppercase tracking-wider">Synonyms (up to 3, optional)</span>
                                            {newWordData.synonyms.length < 3 && (
                                                <button
                                                    type="button"
                                                    onClick={() => addRelatedWordRow('synonyms')}
                                                    className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg"
                                                >
                                                    + Add Synonym
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            {newWordData.synonyms.map((row, idx) => (
                                                <div key={idx} className="p-2 bg-emerald-50/40 border border-emerald-200 rounded-xl space-y-1.5 relative">
                                                    <button
                                                        type="button"
                                                        onClick={() => removeRelatedWordRow('synonyms', idx)}
                                                        className="absolute top-1.5 right-1.5 text-slate-400 hover:text-red-500 text-xs px-1"
                                                    >✕</button>
                                                    <input
                                                        type="text"
                                                        placeholder="Synonym word"
                                                        value={row.word}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'word', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs font-semibold pr-6"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Phonetics of this synonym"
                                                        value={row.phonetics || ''}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'phonetics', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs font-mono"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Bangla meaning of this synonym"
                                                        value={row.meaning_bn || ''}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'meaning_bn', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="English meaning of this synonym"
                                                        value={row.meaning_en || ''}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'meaning_en', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Use context of this synonym"
                                                        value={row.context}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'context', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Sentence example of this synonym"
                                                        value={row.sentence}
                                                        onChange={(e) => updateRelatedWordRow('synonyms', idx, 'sentence', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <NoteEditor
                                                        rows={2}
                                                        placeholder="Note (your own, optional)"
                                                        value={row.note || ''}
                                                        onChange={(val) => updateRelatedWordRow('synonyms', idx, 'note', val)}
                                                        borderClass="border-emerald-200"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ANTONYMS (0-3) */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-bold text-rose-600 uppercase tracking-wider">Antonyms (up to 3, optional)</span>
                                            {newWordData.antonyms.length < 3 && (
                                                <button
                                                    type="button"
                                                    onClick={() => addRelatedWordRow('antonyms')}
                                                    className="text-[11px] font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded-lg"
                                                >
                                                    + Add Antonym
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            {newWordData.antonyms.map((row, idx) => (
                                                <div key={idx} className="p-2 bg-rose-50/40 border border-rose-200 rounded-xl space-y-1.5 relative">
                                                    <button
                                                        type="button"
                                                        onClick={() => removeRelatedWordRow('antonyms', idx)}
                                                        className="absolute top-1.5 right-1.5 text-slate-400 hover:text-red-500 text-xs px-1"
                                                    >✕</button>
                                                    <input
                                                        type="text"
                                                        placeholder="Antonym word"
                                                        value={row.word}
                                                        onChange={(e) => updateRelatedWordRow('antonyms', idx, 'word', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs font-semibold pr-6"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Phonetics of this antonym"
                                                        value={row.phonetics || ''}
                                                        onChange={(e) => updateRelatedWordRow('antonyms', idx, 'phonetics', e.target.value)}

                    {/* SOFT DELETE MODAL */}

                                <div className="flex justify-end gap-3 pt-2">
                                    <button
                                        onClick={() => setDeleteTargetId(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"

                    )}

                    {/* EDIT WORD MODAL */}
                    {editingWord && (

                                onSubmit={(e) => {

                                <div className="space-y-3 text-sm">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Word</label>
                                        <input
                                            type="text"
                                            required
                                            value={editingWord.word}
                                            onChange={(e) => setEditingWord({ ...editingWord, word: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phonetics / Pronunciation</label>
                                        <input
                                            type="text"
                                            value={editingWord.phonetics || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, phonetics: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-mono text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Bangla Meaning (বাংলা অর্থ)</label>

                                            type="text"
                                            value={editingWord.meaning_bn || ''}

                                        />

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">English Meaning *</label>
                                        <input
                                            type="text"
                                            required
                                            value={editingWord.meaning_en || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, meaning_en: e.target.value })}

                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Note (your own, optional)</label>
                                        <NoteEditor
                                            rows={2}
                                            value={editingWord.meaning_en_detailed || ''}
                                            onChange={(val) => setEditingWord({ ...editingWord, meaning_en_detailed: val })}

                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Use Context</label>
