                                    className={`flex-1 min-w-[120px] py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 flex flex-col items-center justify-center ${
                                        activeTab === tab.id
                                            ? 'keep-white bg-white text-indigo-900 shadow-lg scale-[1.02]'
                                            : 'bg-indigo-950/40 text-indigo-100 hover:bg-indigo-800/60 border border-indigo-400/20'
                                    }`}
                                >
                                    <span>{tab.label}</span>
                                    <span className="text-[10px] opacity-75 font-normal">{tab.desc}</span>
                                </button>
                            ))}
                        </div>
                    </header>

                    {/* GLOBAL CHUNK SELECTOR & SHUFFLE BAR */}
                    {activeTab !== 'manage' && (
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                                <span className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1">
                                    <span>📦</span> 25-Word Chunk:
                                </span>
                                <select
                                    value={selectedChunk}
                                    onChange={(e) => {
                                        const val = e.target.value;
                                        setSelectedChunk(val === 'ALL' ? 'ALL' : parseInt(val));
                                        setCardIndex(0);
                                    }}
                                    className="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                >
                                    <option value="ALL">All Words ({currentWords.length} words)</option>
                                    {chunksList.map(chunk => (
                                        <option key={chunk.index} value={chunk.index}>
                                            {chunk.label}
                                        </option>
                                    ))}
                                </select>
                                <span className="text-xs font-bold text-slate-600 uppercase tracking-wider flex items-center gap-1 ml-1">
                                    <span>○</span> Familiarity:
                                </span>
                                <select
                                    value={filterFamiliarity}
                                    onChange={(e) => setFilterFamiliarity(e.target.value)}
                                    className="px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-bold text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 familiarity-select"
                                    title="Filter by familiarity across all study tabs"
                                >
                                    <option value="all">All words ({currentWords.length})</option>
                                    <option value="unfamiliar">○ Unfamiliar ({familiarityCounts.unfamiliar})</option>
                                    <option value="semi">◐ Semi-familiar ({familiarityCounts.semi})</option>
                                    <option value="familiar">● Familiar ({familiarityCounts.familiar})</option>
                                </select>
                            </div>

                            {/* ADD WORD & SHUFFLE TOGGLE */}
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                                <button
                                    onClick={() => setShowAddWordModal(true)}
                                    className="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-sm transition-all flex items-center gap-1.5 active:scale-95"
                                >
                                    <span>➕</span>
                                    <span>Add Word</span>
                                </button>

                                <button
                                    onClick={() => {
                                        setIsShuffled(!isShuffled);
                                        setShuffleSeed(prev => prev + 1);
                                        triggerToast(isShuffled ? "Sorted back to original order." : "Randomized word order!");
                                    }}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition-all ${
                                        isShuffled
                                            ? 'bg-purple-600 text-white border-purple-600 shadow-sm'
                                            : 'bg-slate-50 text-slate-700 border-slate-300 hover:bg-slate-100'
                                    }`}
                                >
                                    <span>🔀</span>
                                    <span>{isShuffled ? 'Shuffled ON' : 'Shuffle Order'}</span>
                                </button>

                                <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2.5 py-1.5 rounded-xl border border-slate-200">
                                    Showing: {filteredWords.length} words
                                </span>
                            </div>
                        </div>
                    )}

                    {/* MODE 1: WORD LIST VIEW */}
                    {activeTab === 'list' && (
                        <div className="space-y-4 tab-panel-enter">
                            {/* SEARCH & FILTERS */}
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                <div className="flex flex-col md:flex-row gap-3">
                                    <div className="relative flex-1">
                                        <input
                                            type="text"
                                            placeholder={showBangla ? "Search word, English meaning, or Bengali (বাংলা)..." : "Search word or English meaning..."}
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                        <svg className="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    </div>
                                </div>

                                {/* ALPHABET FILTER */}
                                <div className="flex flex-wrap gap-1 pt-2 border-t border-slate-100">
                                    {alphabet.map(letter => (
                                        <button
                                            key={letter}
                                            onClick={() => setSelectedLetter(letter)}
                                            className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-colors ${
                                                selectedLetter === letter
                                                    ? 'bg-indigo-600 text-white'
                                                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            {letter}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* WORD CARDS GRID */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {filteredWords.map((item) => {
                                    const famLevel = getFamiliarity(item.id);
                                    return (
                                        <div key={item.id} className={`bg-white rounded-2xl p-5 border shadow-sm transition-all hover:shadow-md relative group ${familiarityCardBorder(famLevel)}`}>
                                            <div className="flex justify-between items-start gap-2">
                                                <div className="flex-1 min-w-0">
                                                    <div className="flex items-center flex-wrap gap-2">
                                                        <h3 className="text-xl font-bold text-slate-900">{item.word}</h3>
                                                        <SpeakPair text={item.word} notify={triggerToast} />
                                                        {item.phonetics && (
                                                            <span className="text-xs font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                                                                [{item.phonetics}]
                                                            </span>
                                                        )}
                                                        {isVariantMode && (
                                                            <span className="text-[10px] font-bold text-indigo-400 align-super" title="Alternate/variant version available">ALT</span>
                                                        )}
                                                    </div>
                                                    {showBangla && item.bangla && (
                                                        <p className="text-xs font-semibold text-emerald-700 mt-1">{item.bangla}</p>
                                                    )}
                                                </div>

                                                <div className="flex items-center gap-1.5 shrink-0">
                                                    <FamiliarityPicker
                                                        level={famLevel}
                                                        onSet={(level) => setWordFamiliarity(item.id, level)}
                                                        compact
                                                    />

                                                    <button
                                                        onClick={() => setEditingWord({ ...item })}
                                                        className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center active:scale-95"
                                                        title="Edit word details"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                                                        </svg>
                                                    </button>

                                                    <button
                                                        onClick={() => setDeleteTargetId(item.id)}
                                                        className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center active:scale-95"
                                                        title="Delete word"
                                                    >
                                                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 01-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                                        </svg>
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="mt-3 space-y-1.5 text-sm">
                                                <div>
                                                    <span className="font-semibold text-slate-700">Meaning: </span>
                                                    <span className="text-slate-600">{item.meaning}</span>
                                                </div>
                                                {item.sentence && (
                                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-slate-600 italic flex flex-wrap items-start justify-between gap-2 sentence-example">
                                                        <span>"{item.sentence}"</span>
                                                        <SpeakPair text={item.sentence} notify={triggerToast} isSentence className="shrink-0" />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {filteredWords.length === 0 && (
                                <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 space-y-2">
                                    <p className="text-slate-500 text-base font-semibold">No vocabulary words found matching your selection.</p>
                                    <p className="text-xs text-slate-400">Try adding words or selecting a different chunk or page.</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODE 2: FLASHCARDS VIEW */}
                    {activeTab === 'flashcards' && filteredWords.length > 0 && (
                        <div className="max-w-xl mx-auto space-y-6">
                            <div className="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-sm">
                                <div className="flex items-center gap-3">
                                    <label className="flex items-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-700">
                                        <input
                                            type="checkbox"
                                            checked={autoAudio}
                                            onChange={(e) => setAutoAudio(e.target.checked)}
                                            className="rounded text-indigo-600 focus:ring-indigo-500"
                                        />
                                        Auto Audio
                                    </label>
                                    <div className="flex items-center gap-1 border-l pl-3 border-slate-200 text-xs">
                                        <span className="text-slate-500">Auto:</span>
                                        <button
                                            onClick={() => setSelectedAccent('us')}
                                            className={`px-2 py-0.5 rounded font-semibold ${selectedAccent === 'us' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            🇺🇸 US
                                        </button>
                                        <button
                                            onClick={() => setSelectedAccent('uk')}
                                            className={`px-2 py-0.5 rounded font-semibold ${selectedAccent === 'uk' ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-600'}`}
                                        >
                                            🇬🇧 UK
                                        </button>
                                    </div>
                                </div>
                                <span className="text-xs font-semibold text-slate-500">
                                    Card {cardIndex + 1} of {filteredWords.length} · click flip · drag slide
                                </span>
                            </div>

                            {/* FLIP CARD — click flips, horizontal drag goes next/prev */}
                            <div 
                                data-flip-btn
                                onClick={() => {
                                    if (flashDragRef.current.swiped) {
                                        flashDragRef.current.swiped = false;
                                        return;
                                    }
                                    setIsFlipped(!isFlipped);
                                }}
                                onPointerDown={(e) => {
                                    flashDragRef.current = { active: true, startX: e.clientX, dx: 0, swiped: false };
                                    e.currentTarget.setPointerCapture?.(e.pointerId);
                                }}
                                onPointerMove={(e) => {
                                    if (!flashDragRef.current.active) return;
                                    flashDragRef.current.dx = e.clientX - flashDragRef.current.startX;
                                }}
                                onPointerUp={() => {
                                    const dx = flashDragRef.current.dx || 0;
                                    flashDragRef.current.active = false;
                                    if (Math.abs(dx) >= 60) {
                                        flashDragRef.current.swiped = true;
                                        if (dx < 0) {
                                            setCardIndex((prev) => (prev < filteredWords.length - 1 ? prev + 1 : 0));
                                        } else {
                                            setCardIndex((prev) => (prev > 0 ? prev - 1 : filteredWords.length - 1));
                                        }
                                        setIsFlipped(false);
                                    }
                                    flashDragRef.current.dx = 0;
                                }}
                                onPointerCancel={() => { flashDragRef.current = { active: false, startX: 0, dx: 0, swiped: false }; }}
                                className="relative w-full h-80 cursor-pointer perspective-1000 touch-pan-y select-none"
                            >
                                <div className={`card-inner w-full h-full relative rounded-2xl shadow-xl transition-all duration-500 ${isFlipped ? 'card-flipped' : ''}`}>
                                    <div className="card-front absolute inset-0 bg-gradient-to-br from-indigo-800 to-slate-900 rounded-2xl p-8 text-white flex flex-col justify-between items-center text-center shadow-lg">
                                        <div className="w-full flex justify-between items-center text-xs opacity-80">
                                            <span>Click to flip · slide for next</span>
                                            <span>{activeBook.name}</span>
                                        </div>
                                        <div className="space-y-3">
                                            <h2 className="text-4xl font-extrabold tracking-wide">{filteredWords[cardIndex].word}</h2>
                                            {filteredWords[cardIndex].phonetics && (
                                                <p className="text-indigo-200 font-mono text-base bg-indigo-900/40 px-3 py-1 rounded-full border border-indigo-400/30 inline-block">
                                                    [{filteredWords[cardIndex].phonetics}]
                                                </p>
                                            )}
                                        </div>
                                        <div className="flex gap-2" onClick={(e) => e.stopPropagation()}>
                                            <SpeakPair text={filteredWords[cardIndex].word} notify={triggerToast} variant="onDark" primaryAudioBtn />
                                        </div>
                                    </div>

                                    <div className="card-back absolute inset-0 bg-white border-2 border-indigo-500 rounded-2xl p-8 text-slate-800 flex flex-col justify-between items-center text-center shadow-lg">
                                        <div className="w-full flex justify-between items-center text-xs text-slate-400">
                                            <span>Meaning & Usage</span>
                                            {showBangla && <span className="text-emerald-600 font-bold">বাংলা অর্থ</span>}
                                        </div>
                                        <div className="space-y-3">
                                            {showBangla && filteredWords[cardIndex].bangla && (
                                                <p className="text-2xl font-bold text-emerald-700">{filteredWords[cardIndex].bangla}</p>
                                            )}
                                            <p className="text-lg font-medium text-slate-700">{filteredWords[cardIndex].meaning}</p>
                                            {filteredWords[cardIndex].sentence && (
                                                <div className="italic text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2 sentence-example">
                                                    <p>"{filteredWords[cardIndex].sentence}"</p>
                                                    <SpeakPair text={filteredWords[cardIndex].sentence} notify={triggerToast} isSentence className="justify-center" />
                                                </div>
                                            )}
                                        </div>
                                        <div className="text-xs text-slate-400">Click to flip back · slide for next</div>
                                    </div>
                                </div>
                            </div>

                            <div className="flex justify-between items-center gap-4">
                                <button
                                    onClick={() => setCardIndex((prev) => (prev > 0 ? prev - 1 : filteredWords.length - 1))}
                                    className="flex-1 py-3 bg-white border border-slate-200 text-slate-700 font-bold rounded-xl shadow-sm hover:bg-slate-50 active:scale-95 transition-all"
                                >
                                    ← Previous
                                </button>
                                <FamiliarityPicker
                                    level={getFamiliarity(filteredWords[cardIndex].id)}
                                    onSet={(level) => setWordFamiliarity(filteredWords[cardIndex].id, level)}
                                />
                                <button
                                    onClick={() => setCardIndex((prev) => (prev < filteredWords.length - 1 ? prev + 1 : 0))}
                                    className="flex-1 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                                >
                                    Next →
                                </button>
                            </div>
                        </div>
                    )}

                    {/* MODE 3: PRACTICE QUIZ VIEW */}
                    {activeTab === 'quiz' && quizQuestions.length > 0 && (
                        <div className="max-w-2xl mx-auto space-y-6">
                            {quizQuestionIndex < quizQuestions.length ? (
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-6 space-y-6">
                                    <div className="flex justify-between items-center border-b pb-4 border-slate-100 gap-3 flex-wrap">
                                        <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">
                                            Question {quizQuestionIndex + 1} of {quizQuestions.length}
                                        </span>
                                        <div className="flex items-center gap-2">
                                            <button
                                                type="button"
                                                onClick={() => setShowQuizSentence(v => !v)}
                                                className={`px-2.5 py-1 rounded-lg text-[11px] font-bold border transition-all ${showQuizSentence ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-slate-50 text-slate-500 border-slate-200'}`}
                                                title="Show or hide example sentence"
                                            >
                                                {showQuizSentence ? 'Sentence ON' : 'Sentence OFF'}
                                            </button>
                                            <span className="text-xs font-semibold bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full border border-emerald-200">
                                                Score: {quizScore}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <p className="text-xs text-slate-500 font-semibold uppercase">What is the correct meaning of:</p>
                                        <div className="flex items-center gap-3">
                                            <h2 className="text-3xl font-extrabold text-slate-900">
                                                {quizQuestions[quizQuestionIndex].target.word}
                                            </h2>
                                            {quizQuestions[quizQuestionIndex].target.phonetics && (
                                                <span className="text-xs font-mono bg-slate-100 text-slate-600 px-2 py-1 rounded">
                                                    [{quizQuestions[quizQuestionIndex].target.phonetics}]
                                                </span>
                                            )}
                                        </div>

                                        <div className="flex flex-wrap items-center gap-2 pt-1">
                                            <SpeakPair text={quizQuestions[quizQuestionIndex].target.word} notify={triggerToast} />
                                        </div>
                                        {showQuizSentence && quizQuestions[quizQuestionIndex].target.sentence && (
                                            <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-slate-600 italic flex flex-wrap items-start justify-between gap-2 sentence-example">
                                                <span>"{quizQuestions[quizQuestionIndex].target.sentence}"</span>
                                                <SpeakPair text={quizQuestions[quizQuestionIndex].target.sentence} notify={triggerToast} isSentence className="shrink-0" />
                                            </div>
                                        )}
                                    </div>

                                    <div className="space-y-3">
                                        {quizQuestions[quizQuestionIndex].options.map((opt, idx) => {
                                            const isTarget = opt.id === quizQuestions[quizQuestionIndex].target.id;
                                            let btnStyle = "bg-slate-50 border-slate-200 text-slate-800 hover:bg-slate-100";

                                            if (quizSubmitted) {
                                                if (isTarget) btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold";
                                                else if (userQuizAnswer === opt.id) btnStyle = "bg-red-100 border-red-500 text-red-900";
                                            } else if (userQuizAnswer === opt.id) {
                                                btnStyle = "bg-indigo-50 border-indigo-500 text-indigo-900 font-bold";
                                            }

                                            return (
                                                <button
                                                    key={idx}
                                                    disabled={quizSubmitted}
                                                    onClick={() => setUserQuizAnswer(opt.id)}
                                                    className={`w-full text-left p-4 rounded-xl border text-sm transition-all flex flex-col gap-1 ${btnStyle}`}
                                                >
                                                    <div className="flex justify-between items-center">
                                                        <span className="font-semibold">{opt.meaning}</span>
                                                        {showBangla && opt.bangla && (
                                                            <span className="text-xs text-emerald-700 font-bold">{opt.bangla}</span>
                                                        )}
                                                    </div>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {!quizSubmitted ? (
                                        <button
                                            data-submit-btn
                                            disabled={!userQuizAnswer}
                                            onClick={() => {
                                                setQuizSubmitted(true);
                                                if (userQuizAnswer === quizQuestions[quizQuestionIndex].target.id) {
                                                    setQuizScore(prev => prev + 1);
                                                    addXP(15);
                                                }
                                            }}
                                            className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl disabled:opacity-50 hover:bg-indigo-700 transition-all"
                                        >
                                            Submit Answer
                                        </button>
                                    ) : (
                                        <button
                                            onClick={() => {
                                                setQuizQuestionIndex(prev => prev + 1);
                                                setUserQuizAnswer(null);
                                                setQuizSubmitted(false);
                                            }}
                                            className="w-full py-3 bg-emerald-600 text-white font-bold rounded-xl hover:bg-emerald-700 transition-all"
                                        >
                                            Next Question →
                                        </button>
                                    )}
                                </div>
                            ) : (
                                <div className="bg-white rounded-2xl border border-slate-200 shadow-md p-8 text-center space-y-4">
                                    <h2 className="text-3xl font-extrabold text-slate-900">Quiz Completed! 🎉</h2>
                                    <p className="text-slate-600 text-base">
                                        Your final score: <span className="font-bold text-indigo-600 text-xl">{quizScore} / {quizQuestions.length}</span>
                                    </p>
                                    <button
                                        onClick={startQuiz}
                                        className="px-6 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-md hover:bg-indigo-700 transition-all"
                                    >
                                        Retake Quiz
                                    </button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODE 4: MODERN GAME MODE */}
                    {activeTab === 'game' && (
                        <ModernVocabGame
                            wordPool={filteredWords.length >= 4 ? filteredWords : currentWords}
                            showBangla={showBangla}
                            triggerToast={triggerToast}
                            onVictoryXP={addXP}
                            isVariantMode={isVariantMode}
                            appTheme={appTheme}
                            onThemeChange={setAppTheme}
                            shortcuts={shortcuts}
                        />
                    )}

                    {/* MODE 5: MANAGE PAGES, RESTORE TRASH & UNIFIED JSON IMPORT */}
                    {activeTab === 'manage' && (
                        <div className="space-y-6">
                            <div className={`rounded-2xl border shadow-sm p-6 space-y-4 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'}`}>
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 border-slate-100/70">
                                    <div>
                                        <h2 className="text-xl font-extrabold flex items-center gap-2">
                                            <span>⚙️</span> Settings
                                        </h2>
                                        <p className="text-xs mt-0.5 opacity-80">Adjust the interface theme and quick preferences for study and game sessions.</p>
                                    </div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div className={`rounded-xl border p-3 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20' : 'bg-slate-800/60 border-slate-700'}`}>
                                        <div className="text-xs font-bold uppercase tracking-wider opacity-70 mb-2">App Theme</div>
                                        <div className="flex flex-wrap gap-2">
                                            {['midnight','light'].map(themeOption => (
                                                <button key={themeOption} onClick={() => setAppTheme(themeOption)} className={`px-3 py-2 rounded-xl text-xs font-bold capitalize border transition-all ${appTheme === themeOption ? 'bg-indigo-600 text-white border-indigo-500' : appTheme === 'light' ? 'bg-white text-slate-700 border-slate-200' : 'bg-slate-800/70 text-slate-100 border-slate-600'}`}>
                                                    {themeOption === 'midnight' ? '🌙 Midnight' : themeOption === 'light' ? '☀️ Light' : '🌈 Aurora'}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div className={`rounded-xl border p-3 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20' : 'bg-slate-800/60 border-slate-700'}`}>
                                        <div className="text-xs font-bold uppercase tracking-wider opacity-70 mb-2">Quick Preferences</div>
                                        <button onClick={() => setShowBangla(!showBangla)} className={`w-full px-3 py-2 rounded-xl text-xs font-bold border transition-all ${showBangla ? 'bg-emerald-600 text-white border-emerald-500' : appTheme === 'light' ? 'bg-white text-slate-700 border-slate-200' : 'bg-slate-800/70 text-slate-100 border-slate-600'}`}>
                                            {showBangla ? '✓ Bangla meanings ON' : '○ Bangla meanings OFF'}
                                        </button>
                                    </div>
                                    <div className={`rounded-xl border p-3 md:col-span-2 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20' : 'bg-slate-800/60 border-slate-700'}`}>
                                        <div className="text-xs font-bold uppercase tracking-wider opacity-70 mb-2">🔊 Pronunciation voices</div>
                                        <p className="text-[11px] opacity-70 mb-3">Lists every English voice your browser exposes (Google, Microsoft, Apple, and others). Pick US/UK male or female when available — Chrome often includes Google US/UK voices while online; Edge adds Microsoft Neural voices.</p>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="space-y-1.5">
                                                <label className="text-[11px] font-semibold opacity-80">US English ({usVoiceOptions.length} voices)</label>
                                                <select
                                                    value={voicePrefs.usVoiceURI || ''}
                                                    onChange={(e) => updateVoicePrefs({ usVoiceURI: e.target.value || null })}
                                                    className="w-full px-3 py-2 rounded-xl text-xs font-medium border focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                >
                                                    <option value="">Auto (best quality match)</option>
                                                    {usVoiceOptions.map(v => (
                                                        <option key={v.voiceURI} value={v.voiceURI}>{SpeechEngine.formatVoiceLabel(v)}</option>
                                                    ))}
                                                </select>
                                                <button type="button" onClick={() => speakWord('Hello, this is a test of the US voice.', 'us', triggerToast)} className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${appTheme === 'light' ? 'bg-white border-slate-200' : 'bg-slate-800/70 border-slate-600'}`}>Test US</button>
                                            </div>
                                            <div className="space-y-1.5">
                                                <label className="text-[11px] font-semibold opacity-80">UK English ({ukVoiceOptions.length} voices)</label>
                                                <select
                                                    value={voicePrefs.ukVoiceURI || ''}
                                                    onChange={(e) => updateVoicePrefs({ ukVoiceURI: e.target.value || null })}
                                                    className="w-full px-3 py-2 rounded-xl text-xs font-medium border focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                                >
                                                    <option value="">Auto (best quality match)</option>
                                                    {ukVoiceOptions.map(v => (
                                                        <option key={v.voiceURI} value={v.voiceURI}>{SpeechEngine.formatVoiceLabel(v)}</option>
                                                    ))}
                                                </select>
                                                <button type="button" onClick={() => speakWord('Hello, this is a test of the UK voice.', 'uk', triggerToast)} className={`px-2 py-1 rounded-lg text-[10px] font-bold border ${appTheme === 'light' ? 'bg-white border-slate-200' : 'bg-slate-800/70 border-slate-600'}`}>Test UK</button>
                                            </div>
                                        </div>
                                        <button type="button" onClick={() => updateVoicePrefs({ usVoiceURI: null, ukVoiceURI: null })} className="mt-3 text-[11px] font-bold opacity-70 hover:opacity-100 underline">Reset both to auto</button>
                                    </div>
                                    <div className={`rounded-xl border p-3 md:col-span-2 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20' : 'bg-slate-800/60 border-slate-700'}`}>
                                        <div className="text-xs font-bold uppercase tracking-wider opacity-70 mb-2">⌨️ Keyboard Shortcuts (Game Mode)</div>
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                            {[
                                                { key: 'submit', label: 'Submit answer' },
                                                { key: 'replay', label: 'Replay audio / flip card' },
                                                { key: 'exit', label: 'Exit focus mode' },
                                            ].map(({ key, label }) => (
                                                <div key={key} className="flex flex-col gap-1">
                                                    <span className="text-[11px] opacity-70">{label}</span>
                                                    <button
                                                        onClick={() => setListeningForShortcut(key)}
                                                        className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all ${listeningForShortcut === key ? 'bg-amber-500 text-white border-amber-400 animate-pulse' : appTheme === 'light' ? 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100' : 'bg-slate-800/70 text-slate-100 border-slate-600 hover:bg-slate-700'}`}
                                                    >
                                                        {listeningForShortcut === key ? 'Press a key…' : (shortcuts[key] === 'Space' ? 'Spacebar' : shortcuts[key])}
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex items-center justify-between mt-2">
                                            <span className="text-[11px] opacity-60">Click a shortcut, then press the key you want to use.</span>
                                            <button onClick={() => setShortcuts(DEFAULT_SHORTCUTS)} className="text-[11px] font-bold opacity-70 hover:opacity-100 underline">Reset to defaults</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* PAGES / BOOKS MANAGEMENT BOARD */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 border-slate-100">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <span>📚</span> Custom Pages & Books Manager
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Rename existing pages, set capacity goals, or create brand-new study lists.
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowAddPageModal(true)}
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                    >
                                        ➕ Add New Page
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {books.map(b => {
                                        const count = (allWords[b.id] || []).length;
                                        const isSelected = selectedBookId === b.id;
                                        return (
                                            <div key={b.id} className={`p-4 rounded-xl border transition-all ${isSelected ? 'border-indigo-500 bg-indigo-50/30 shadow-sm' : 'border-slate-200 bg-slate-50'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="font-bold text-slate-900 text-base">{b.name}</h4>
                                                        <p className="text-xs text-slate-500 mt-0.5">{count} words ({b.targetCount ? `Goal: ${b.targetCount}` : 'Custom'})</p>
                                                    </div>
                                                    <button
                                                        onClick={() => setEditingPageObj({ ...b })}
                                                        className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center"
                                                        title="Edit page name"
                                                    >
                                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                                                        </svg>
                                                    </button>
                                                </div>

                                                <div className="mt-3 flex justify-between items-center border-t pt-2 border-slate-200/60">
                                                    <button
                                                        onClick={() => { setSelectedBookId(b.id); setActiveTab('list'); }}
                                                        className={`text-xs font-bold ${isSelected ? 'text-indigo-600' : 'text-slate-600 hover:text-indigo-600'}`}
                                                    >
                                                        {isSelected ? '✓ Currently Selected' : 'Switch to Page →'}
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* UNIFIED BULK JSON IMPORT TOOL */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900">
                                            Import JSON Data to "{activeBook.name}"
                                        </h2>
                                        <p className="text-xs text-slate-600 mt-1">
                                            Currently holding <span className="font-bold text-indigo-600">{currentWords.length}</span> active words. Paste a combined JSON with standard and variant fields.
                                        </p>
                                    </div>

                                    <div className="flex flex-wrap items-center gap-2">
                                        <button
                                            onClick={() => setShowGeminiPromptModal(true)}
                                            className="px-3.5 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <span>📋 Prompt Template</span>
                                        </button>
                                        <button
                                            onClick={handleExportBackup}
                                            className="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <span>💾 Backup File</span>
                                        </button>
                                        <button
                                            onClick={() => importBackupInputRef.current?.click()}
                                            className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <span>📥 Import Backup</span>
                                        </button>
                                        <button
                                            onClick={() => importJsonInputRef.current?.click()}
                                            className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <span>📄 Import JSON File</span>
                                        </button>
                                    </div>
                                </div>

                                <input
                                    ref={importBackupInputRef}
                                    type="file"
                                    accept="application/json,.json"
                                    className="hidden"
                                    onChange={handleImportBackupFile}
                                />
                                <input
                                    ref={importJsonInputRef}
                                    type="file"
                                    accept="application/json,.json"
                                    className="hidden"
                                    onChange={handleImportJsonFile}
                                />

                                <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Unified JSON Input (Single combined format):</h3>
                                    </div>
                                    <textarea
                                        rows="7"
                                        value={importText}
                                        onChange={(e) => setImportText(e.target.value)}
                                        placeholder={`[\n  {\n    "word": "Food",\n    "phonetics": "fuod",\n    "meaning": "what we can eat",\n    "bangla": "খাদ্য",\n    "sentence": "He needs some food.",\n    "variantMeaning": "nourishment or sustenance",\n    "variantBangla": "আহার",\n    "variantSentence": "Good food sustains healthy growth."\n  }\n]`}
                                        className="w-full font-mono text-xs p-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    ></textarea>
                                    <div className="flex justify-between items-center">
                                        <button
                                            onClick={handleBulkImport}
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                        >
                                            Import / Smart-Merge into "{activeBook.name}"
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* TRASH BIN RESTORE SECTION */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 border-slate-100">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <span>🗑️</span> Trash Bin for "{activeBook.name}" ({currentTrash.length})
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Deleted words for this page are safely held here.
                                        </p>
                                    </div>

                                    {currentTrash.length > 0 && (
                                        <button
                                            onClick={restoreAllTrash}
                                            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                        >
                                            Restore All Words
                                        </button>
                                    )}
                                </div>

                                {currentTrash.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-60 overflow-y-auto pr-1">
                                        {currentTrash.map(item => (
                                            <div key={item.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                                                <div>
                                                    <span className="font-bold text-sm text-slate-800">{item.word}</span>
                                                    <p className="text-[11px] text-slate-500 truncate max-w-[150px]">{item.meaning}</p>
                                                </div>
                                                <div className="flex gap-1">
                                                    <button
                                                        onClick={() => restoreFromTrash(item.id)}
                                                        className="px-2 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[11px] font-bold rounded-lg border border-emerald-300"
                                                        title="Restore Word"
                                                    >
                                                        ↺ Restore
                                                    </button>
                                                    <button
                                                        onClick={() => purgeFromTrash(item.id)}
                                                        className="p-1 text-slate-400 hover:text-red-600 rounded-lg text-xs"
                                                        title="Permanently Delete"
                                                    >
                                                        ❌
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200 text-xs text-slate-500">
                                        Trash bin is empty for "{activeBook.name}".
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
