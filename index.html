                        if (nextBtn) { e.preventDefault(); nextBtn.click(); }
                    }
                    if (matches(e, shortcuts.flashPrev)) {
                        const prevBtn = document.querySelector('[data-flash-prev]');
                        if (prevBtn) { e.preventDefault(); prevBtn.click(); }
                    }
                };
                window.addEventListener('keydown', handleGlobalKeyDown);
                return () => window.removeEventListener('keydown', handleGlobalKeyDown);
            }, [shortcuts, listeningForShortcut]);

            // GAMIFICATION & LEVELING STATE
            const [userXP, setUserXP] = useState(() => {
                const saved = localStorage.getItem('wordsmart_user_xp');
                return saved ? parseInt(saved, 10) : 0;
            });

            // Track which word IDs have ever given mastery XP (to prevent double-award)
            const [familiarXpGiven, setFamiliarXpGiven] = useState(() => {
                const saved = localStorage.getItem('wordsmart_familiar_xp_given') || localStorage.getItem('wordsmart_mastery_xp_given');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('wordsmart_familiar_xp_given', JSON.stringify(familiarXpGiven));
            }, [familiarXpGiven]);

            // DAILY ACTIVITY LOG (for streaks & progress stats)
            const [activityLog, setActivityLog] = useState(() => {
                try { return JSON.parse(localStorage.getItem('wordsmart_activity_log') || '{}'); } catch (e) { return {}; }
            });
            useEffect(() => {
                localStorage.setItem('wordsmart_activity_log', JSON.stringify(activityLog));
            }, [activityLog]);
            const todayKey = () => localDateKey();

            // ============================================================
            // MISTAKE TRACKING + HISTORY — shared pattern for Practice Quiz
            // and Word Quest. Mistakes are keyed by word id (ids are globally
            // unique) with a running miss-count; history is a capped log of
            // past attempts so "what quiz did I do and when" is answerable.
            // ============================================================
            const [quizMistakes, setQuizMistakes] = useState(() => {
                try { return JSON.parse(localStorage.getItem('wordsmart_quiz_mistakes') || '{}'); } catch (e) { return {}; }
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_quiz_mistakes', JSON.stringify(quizMistakes)); } catch (e) {} }, [quizMistakes]);
            const [quizHistory, setQuizHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('wordsmart_quiz_history') || '[]'); } catch (e) { return []; }
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_quiz_history', JSON.stringify(quizHistory)); } catch (e) {} }, [quizHistory]);

            const [gameMistakes, setGameMistakes] = useState(() => {
                try { return JSON.parse(localStorage.getItem('wordsmart_game_mistakes') || '{}'); } catch (e) { return {}; }
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_game_mistakes', JSON.stringify(gameMistakes)); } catch (e) {} }, [gameMistakes]);
            const [gameHistory, setGameHistory] = useState(() => {
                try { return JSON.parse(localStorage.getItem('wordsmart_game_history') || '[]'); } catch (e) { return []; }
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_game_history', JSON.stringify(gameHistory)); } catch (e) {} }, [gameHistory]);

            // Resolve a mistakes map {wordId: {count,last}} into live word objects
            // by scanning every book's word list (a word may have moved books,
            // been edited, or been deleted since it was missed).
            const allWordsFlat = useMemo(() => Object.values(allWords).flat(), [allWords]);
            const resolveMistakeWords = (mistakesMap) => {
                const byId = new Map(allWordsFlat.map(w => [w.id, w]));
                return Object.entries(mistakesMap)
                    .map(([id, meta]) => {
                        const w = byId.get(Number(id)) || byId.get(id);
                        if (!w) return null;
                        return { ...w, __missCount: meta.count || 1, __lastMissed: meta.last || 0 };
                    })
                    .filter(Boolean)
                    .sort((a, b) => b.__lastMissed - a.__lastMissed);
            };
            const quizMistakeWords = useMemo(() => resolveMistakeWords(quizMistakes), [quizMistakes, allWordsFlat]);
            const gameMistakeWords = useMemo(() => resolveMistakeWords(gameMistakes), [gameMistakes, allWordsFlat]);

            const recordMistakes = (setMistakesFn, words) => {
                if (!words || !words.length) return;
                setMistakesFn(prev => {
                    const next = { ...prev };
                    words.forEach(w => {
                        if (!w || w.id === undefined) return;
                        const existing = next[w.id] || { count: 0 };
                        next[w.id] = { count: existing.count + 1, last: Date.now() };
                    });
                    return next;
                });
            };

            // Which specific mistake words the person picked to be re-tested on
            // (null = use the whole mistake bank / not in review mode).
            const [quizReviewPool, setQuizReviewPool] = useState(null);
            const [showQuizReviewModal, setShowQuizReviewModal] = useState(false);
            const [showGameReviewModal, setShowGameReviewModal] = useState(false);
            const [quizReviewTab, setQuizReviewTab] = useState('mistakes'); // 'mistakes' | 'history'
            const [gameReviewTab, setGameReviewTab] = useState('mistakes');
            const [quizMistakeSelection, setQuizMistakeSelection] = useState(null); // null = "all selected"
            const [gameMistakeSelection, setGameMistakeSelection] = useState(null);
            // DAILY WORD GOAL — new words marked Familiar per day (set in Word Manager)
            const MIN_DAILY_GOAL = 1, MAX_DAILY_GOAL = 100;
            const [dailyGoal, setDailyGoal] = useState(() => {
                try {
                    const n = parseInt(localStorage.getItem('wordsmart_daily_goal'), 10);
                    if (Number.isFinite(n)) return Math.min(MAX_DAILY_GOAL, Math.max(MIN_DAILY_GOAL, n));
                } catch (e) {}
                return 10;
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_daily_goal', String(dailyGoal)); } catch (e) {} }, [dailyGoal]);
            const updateDailyGoal = (val) => setDailyGoal(Math.min(MAX_DAILY_GOAL, Math.max(MIN_DAILY_GOAL, parseInt(val, 10) || 10)));
            const openDailyGoalSettings = () => {
                setActiveTab('manage');
                setTimeout(() => document.getElementById('daily-goal-card')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
            };
            const logActivity = (xpAmount = 0, learnedAmount = 0) => {
                const key = todayKey();
                setActivityLog(prev => {
                    const day = prev[key] || { xp: 0, learned: 0 };
                    return { ...prev, [key]: { xp: day.xp + xpAmount, learned: day.learned + learnedAmount } };
                });
            };

            const [voicePrefs, setVoicePrefsState] = useState(() => SpeechEngine.loadVoicePrefs());
            const [voiceListTick, setVoiceListTick] = useState(0);

            useEffect(() => {
                const onVoices = () => {
                    SpeechEngine.refreshVoices();
                    setVoiceListTick(t => t + 1);
                };
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.addEventListener('voiceschanged', onVoices);
                    onVoices();
                }
                return () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    }
                };
            }, []);

            const updateVoicePrefs = (partial) => {
                SpeechEngine.setVoicePrefs(partial);
                setVoicePrefsState(SpeechEngine.getVoicePrefs());
            };

            const usVoiceOptions = useMemo(() => SpeechEngine.voicesForLang('en-US'), [voiceListTick]);
            const ukVoiceOptions = useMemo(() => SpeechEngine.voicesForLang('en-GB'), [voiceListTick]);

            // TAB & NAVIGATION STATE
            const [activeTab, setActiveTab] = useState('list');
            const [searchQuery, setSearchQuery] = useState('');
            // Multi-select: empty array = no filter (show every status)
            const [filterFamiliarities, setFilterFamiliarities] = useState([]);
            const [selectedLetter, setSelectedLetter] = useState('ALL');
            // SORT: 'default' keeps original list order. Name sorts alphabetically;
            // date uses each word's id, which is timestamp-based, so it doubles as
            // "date added" without needing a separate stored field.
            const [sortBy, setSortBy] = useState('name-asc');

            // MEMORIZATION CHUNKS SYSTEM (25 words per chunk)
            // Multi-select: empty array = all chunks. Values are chunk indexes (0-based).
            const [selectedChunks, setSelectedChunks] = useState([]);
            // Words per chunk — adjustable in Word Manager (5–50), remembered between visits.
            const MIN_CHUNK_SIZE = 5, MAX_CHUNK_SIZE = 50;
            const [chunkSize, setChunkSize] = useState(() => {
                try {
                    const n = parseInt(localStorage.getItem('wordsmart_chunk_size'), 10);
                    if (Number.isFinite(n)) return Math.min(MAX_CHUNK_SIZE, Math.max(MIN_CHUNK_SIZE, n));
                } catch (e) {}
                return 25;
            });
            useEffect(() => { try { localStorage.setItem('wordsmart_chunk_size', String(chunkSize)); } catch (e) {} }, [chunkSize]);
            const CHUNK_SIZE = chunkSize;
            const updateChunkSize = (val) => {
                const n = Math.min(MAX_CHUNK_SIZE, Math.max(MIN_CHUNK_SIZE, parseInt(val, 10) || 25));
                setChunkSize(n);
                setSelectedChunks([]); // chunk numbers shift when the size changes, so go back to "all"
                setCardIndex(0);
            };

            const normalizeText = (value) => {
                if (value == null) return '';
                return String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
            };

            const resetListFilters = useCallback(() => {
                setSelectedChunks([]);
                setSelectedLetter('ALL');
                setCardIndex(0);
            }, []);

            const [importRefreshToken, setImportRefreshToken] = useState(0);
            const bumpImportRefresh = useCallback(() => {
                setImportRefreshToken(prev => prev + 1);
            }, []);

            const toSafeText = (value, fallback = '') => {
                const text = value == null ? '' : String(value).trim();
                return text || fallback;
            };

            // Normalizes a synonym/antonym list from imported/pasted JSON into
            // a clean array of up to 3 { word, context, sentence } entries.
            // existingList (optional): when re-importing into a word that already
            // exists, matching entries (by word text) keep their existing id so their
            // familiarity status isn't silently reset by every re-import.
            const normalizeRelatedList = (list, existingList) => {
                if (!Array.isArray(list)) return null;
                const existingByWord = new Map(
                    (existingList || []).map(e => [normalizeText(e && e.word), e && e.id]).filter(([k, v]) => k && v)
                );
                return list
                    .filter(x => x && toSafeText(x.word || x.text))
                    .slice(0, 3)
                    .map(x => ({
                        id: (x && x.id) || existingByWord.get(normalizeText(x.word || x.text)) || genRelatedId(),
                        word: toSafeText(x.word || x.text),
                        phonetics: toSafeText(x.phonetics || ''),
                        meaning_bn: toSafeText(x.meaning_bn || x.bangla || ''),
                        meaning_en: toSafeText(x.meaning_en || x.meaning || ''),
                        context: toSafeText(x.context || x.use_context || x.usage || ''),
                        sentence: toSafeText(x.sentence || x.example || x.example_sentence || ''),
                        note: toSafeText(x.note || '')
                    }));
            };

            // Synonyms/antonyms are NOT promoted into standalone words anymore — they must
            // stay nested under their parent word only, everywhere (Add Word, Edit Word,
            // Bulk Import). This is now a no-op kept only so every call site below (which
            // still expects a { words, promotedCount } shape) keeps working untouched.

                        try { localStorage.removeItem('wordsmart_all_words_map'); } catch (e) { /* ignore */ }
                    })
                    .catch((e) => {
                        if (cancelled) return;
                        console.error('Could not save words to IndexedDB, falling back to localStorage:', e);
                        try {
                            localStorage.setItem('wordsmart_all_words_map', JSON.stringify(allWords));
                        } catch (e2) {
                            console.error('Could not save words to localStorage either:', e2);
                            triggerToast("⚠️ Couldn't save — your word list may be too large for browser storage. Export a backup now so nothing is lost!");
                        }
                    });
                return () => { cancelled = true; };
            }, [allWords, idbDataChecked]);

            useEffect(() => {
                if (!idbDataChecked) return;
                let cancelled = false;
                wsIdbSet('allFamiliarity', allFamiliarity)
                    .then(() => {
                        if (cancelled) return;
                        try { localStorage.removeItem('wordsmart_all_familiarity_map'); } catch (e) { /* ignore */ }
                    })
                    .catch((e) => {
                        if (cancelled) return;
                        console.error('Could not save familiarity data to IndexedDB, falling back to localStorage:', e);
                        try {
                            localStorage.setItem('wordsmart_all_familiarity_map', JSON.stringify(allFamiliarity));
                        } catch (e2) {
                            console.error('Could not save familiarity data to localStorage either:', e2);
                        }
                    });
                return () => { cancelled = true; };
            }, [allFamiliarity, idbDataChecked]);

            useEffect(() => {
                if (!idbDataChecked) return;
                let cancelled = false;
                wsIdbSet('allTrash', allTrash)
                    .then(() => {
                        if (cancelled) return;
                        try { localStorage.removeItem('wordsmart_all_trash_map'); } catch (e) { /* ignore */ }
                    })
                    .catch((e) => {
                        if (cancelled) return;
                        console.error('Could not save trash data to IndexedDB, falling back to localStorage:', e);
                        try {
                            localStorage.setItem('wordsmart_all_trash_map', JSON.stringify(allTrash));
                        } catch (e2) {
                            console.error('Could not save trash data to localStorage either:', e2);
                        }
                    });
                return () => { cancelled = true; };
            }, [allTrash, idbDataChecked]);

            useEffect(() => {
                localStorage.setItem('wordsmart_show_bangla', JSON.stringify(showBangla));
            }, [showBangla]);
            useEffect(() => { localStorage.setItem('wordsmart_app_theme', appTheme); }, [appTheme]);
            // Drive the global theme CSS variables from a single attribute on <html> so
            // normal screens, settings, and the Focus Mode overlay always match exactly.
            useEffect(() => { document.documentElement.setAttribute('data-theme', appTheme); }, [appTheme]);

            useEffect(() => {
                localStorage.setItem('wordsmart_user_xp', userXP.toString());
            }, [userXP]);

            // ============================================================
            // CLOUD SYNC (Firebase Auth + Firestore)
            // Signing in with Google pulls your saved data in from your own
            // account (or, the very first time, uploads what's currently in
            // this browser as the start of that account's cloud data) — so
            // the same words/progress follow you to any other device or
            // browser. Everything keeps saving to localStorage exactly as
            // before too, so the app still works fully offline / signed out.
            // ============================================================
            const [cloudUser, setCloudUser] = useState(null);           // Firebase user object, or null when signed out
            const [cloudAuthReady, setCloudAuthReady] = useState(false); // true once we know for sure whether someone's signed in
            const [cloudSyncStatus, setCloudSyncStatus] = useState('idle'); // 'idle' | 'loading' | 'saving' | 'saved' | 'error'

            // PROFILE: a local nickname that overrides the Google account name
            // everywhere in the app (since we can't rename someone's actual
            // Google profile). Persists locally per-browser; independent of
            // sign-in state so it even works while signed out.
            const [nickname, setNickname] = useState(() => localStorage.getItem('wordsmart_nickname') || '');
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [nicknameDraft, setNicknameDraft] = useState('');
            const [mpVisited, setMpVisited] = useState(false);
            useEffect(() => { if (activeTab === 'multi') setMpVisited(true); }, [activeTab]);
            useEffect(() => {
                if (nickname) localStorage.setItem('wordsmart_nickname', nickname);
                else localStorage.removeItem('wordsmart_nickname');
            }, [nickname]);

            // ============================================================
            // GLOBAL NOTIFICATIONS (🔔 bell in the header) — lightweight,
            // read-only listeners so pokes / room invites / challenges-needing-
            // attention show up no matter which tab you're on, not just while
            // the Multiplayer tab happens to be mounted. These are separate
            // from MultiplayerArena's own listeners (which still handle the
            // interactive poke-toast and the invites list exactly as before);
            // this just powers the badge count + a small dropdown. Dismissing
            // an invite or a poke from here is a plain RTDB write — the same
            // one MultiplayerArena itself does — so nothing stays double-counted.
            // ============================================================
            const [notifFbReady, setNotifFbReady] = useState(!!window.FB);
            useEffect(() => {
                if (window.FB) { setNotifFbReady(true); return; }
                const h = () => setNotifFbReady(true);
                window.addEventListener('fb-ready', h, { once: true });
                return () => window.removeEventListener('fb-ready', h);
            }, []);
            const [showNotifPanel, setShowNotifPanel] = useState(false);
            const [notifInvites, setNotifInvites] = useState({});
            const [notifPokes, setNotifPokes] = useState({});
            const [notifChallengeIds, setNotifChallengeIds] = useState([]);
            const [notifChallengeMap, setNotifChallengeMap] = useState({});
            useEffect(() => {
                if (!notifFbReady || !window.FB || !window.FB.rtdb || !cloudUser) {
                    setNotifInvites({}); setNotifPokes({}); setNotifChallengeIds([]); setNotifChallengeMap({});
                    return;
                }
                const F = window.FB;
                const uid = cloudUser.uid;
                const u1 = F.dbOnValue(F.dbRef(F.rtdb, `invites/${uid}`), (snap) => setNotifInvites(snap.val() || {}), () => {});
                const u2 = F.dbOnValue(F.dbRef(F.rtdb, `pokes/${uid}`), (snap) => setNotifPokes(snap.val() || {}), () => {});
                const u3 = F.dbOnValue(F.dbRef(F.rtdb, `userChallenges/${uid}`), (snap) => setNotifChallengeIds(Object.keys(snap.val() || {})), () => {});
                return () => { u1(); u2(); u3(); };
            }, [notifFbReady, cloudUser && cloudUser.uid]);
            // One small listener per challenge id I'm part of, so the badge
            // can tell "waiting on them" apart from "it's your move".
            useEffect(() => {
                if (!notifFbReady || !window.FB || !window.FB.rtdb || !cloudUser || !notifChallengeIds.length) {
                    setNotifChallengeMap({});
                    return;
                }
                const F = window.FB;
                const unsubs = notifChallengeIds.map(id => F.dbOnValue(F.dbRef(F.rtdb, `challenges/${id}`), (snap) => {
                    setNotifChallengeMap(prev => ({ ...prev, [id]: snap.val() }));
                }, () => {}));
                return () => unsubs.forEach(u => u());
            }, [notifFbReady, cloudUser && cloudUser.uid, notifChallengeIds.join(',')]);
            // A challenge needs your attention when: you haven't finished your
            // exam yet, OR you're the sender and the other person has picked
            // your words back (so your exam is now actually takeable), OR both
            // sides are done and the result is sitting there to be viewed
            // (clearing it, via the existing Challenges tab, removes it from
            // this count for good — no extra "seen" tracking needed).
            const notifActionableChallengeCount = useMemo(() => {
                if (!cloudUser) return 0;
                const uid = cloudUser.uid;
                let n = 0;
                Object.values(notifChallengeMap).forEach((c) => {
                    if (!c) return;
                    if (c.to === uid && !c.toDone) n++;
                    else if (c.from === uid && !c.fromDone && Object.keys(c.wordsForFrom || {}).length > 0) n++;
                    else if (c.fromDone && c.toDone) n++;
                });
                return n;
            }, [notifChallengeMap, cloudUser]);
            const notifTotalCount = Object.keys(notifInvites).length + Object.keys(notifPokes).length + notifActionableChallengeCount;

            // What to actually display as "the user's name" anywhere in the app.
            const displayName = nickname.trim() || cloudUser?.displayName || (cloudUser?.email ? cloudUser.email.split('@')[0] : 'Guest');
            // true for the brief moment we're writing a just-downloaded cloud
            // snapshot INTO local state, so the save-effect below knows not to
            // immediately bounce that same data straight back up to Firestore.
            const applyingCloudDataRef = useRef(false);
            // true only once the initial load-or-create for the CURRENTLY signed-in
            // user has finished — the save-effect refuses to push anything until
            // then, so a slow network can't let a stale local snapshot race ahead
            // of the real cloud data and overwrite it.
            const cloudPulledRef = useRef(false);
            // The set of Firestore "bookWords" chunk-document IDs that currently exist
            // for this user, as of the last load or save — used so a save that shrinks
            // a book (fewer chunks needed) knows which now-stale chunk docs to delete.
            const cloudChunkIdsRef = useRef(new Set());

            // Wait for the Firebase bootstrap <script type="module"> (in <head>) to
            // finish, then start listening for sign-in/out state changes.
            useEffect(() => {
                let unsubscribe = () => {};
                const start = () => {
                    const { auth, onAuthStateChanged } = window.FB;
                    unsubscribe = onAuthStateChanged(auth, (firebaseUser) => {
                        setCloudUser(firebaseUser);
                        setCloudAuthReady(true);
                    });
                };
                if (window.FB) start();
                else window.addEventListener('fb-ready', start, { once: true });
                return () => {
                    window.removeEventListener('fb-ready', start);
                    unsubscribe();
                };
            }, []);

            // Reset the one-time "have we loaded this user's cloud data yet?"
            // flag whenever who's signed in changes (sign in, sign out, switch account).
            useEffect(() => { cloudPulledRef.current = false; }, [cloudUser]);

            const signInWithGoogle = () => {
                if (!window.FB) return;
                const { auth, provider, signInWithPopup } = window.FB;
                signInWithPopup(auth, provider).catch((err) => {
                    console.error(err);
                    triggerToast('Sign-in failed — please try again.');
                });
            };

            const signOutOfCloud = () => {
                if (!window.FB) return;
                const { auth, signOut } = window.FB;
                signOut(auth).then(() => {
                    triggerToast("Signed out. This browser's data stays saved here.");
                });
            };

            // Once we know someone's signed in: either pull their existing cloud
            // data down (replacing what's currently shown), or — first-ever
            // sign-in, no cloud document yet — publish what's currently in this
            // browser as the starting point for their account.
            useEffect(() => {
                if (!cloudAuthReady || !cloudUser || !window.FB) return;
                const { db, doc, getDoc, collection, getDocs, writeBatch } = window.FB;
                const metaRef = doc(db, 'users', cloudUser.uid);
                setCloudSyncStatus('loading');
                getDoc(metaRef).then((snap) => {
                    if (snap.exists()) {
                        const cloud = snap.data() || {};
                        return getDocs(collection(db, 'users', cloudUser.uid, 'bookWords')).then((chunkSnaps) => {
                            const { allWords, idSet } = assembleAllWordsFromCloudChunks(chunkSnaps);
                            applyingCloudDataRef.current = true;
                            if (Array.isArray(cloud.books)) setBooks(cloud.books);
                            setAllWords(allWords);
                            if (cloud.allFamiliarity && typeof cloud.allFamiliarity === 'object') setAllFamiliarity(cloud.allFamiliarity);
                            if (cloud.allTrash && typeof cloud.allTrash === 'object') setAllTrash(cloud.allTrash);
                            if (typeof cloud.userXP === 'number') setUserXP(cloud.userXP);
                            cloudChunkIdsRef.current = idSet;
                            setTimeout(() => { applyingCloudDataRef.current = false; }, 0);
                            cloudPulledRef.current = true;
                            setCloudSyncStatus('saved');
                            triggerToast(`Welcome back${(nickname.trim() || cloudUser.displayName) ? ', ' + (nickname.trim() || cloudUser.displayName).split(' ')[0] : ''}! Your cloud data is loaded.`);
                        });
                    } else {
                        // First-ever sign-in: publish this browser's current data (split
                        // into per-book word chunks) as the starting point for the account.
                        const desiredChunks = splitWordsIntoCloudChunks(allWords);
                        const desiredIds = new Set(desiredChunks.map((c) => c.docId));
                        const batch = writeBatch(db);
                        batch.set(metaRef, { books, allFamiliarity, allTrash, userXP, updatedAt: Date.now() });
                        desiredChunks.forEach((c) => {
                            batch.set(doc(db, 'users', cloudUser.uid, 'bookWords', c.docId), { bookId: c.bookId, chunkIndex: c.chunkIndex, words: c.words });
                        });
                        return batch.commit().then(() => {
                            cloudChunkIdsRef.current = desiredIds;
                            cloudPulledRef.current = true;
                            setCloudSyncStatus('saved');
                            triggerToast("Account created — this browser's data is now backed up to your account.");
                        });
                    }
                }).catch((err) => {
                    console.error(err);
                    setCloudSyncStatus('error');
                    triggerToast('Could not reach the cloud database — check your connection.');
                });
                // Intentionally only re-runs when the signed-in user changes, not on
                // every local data edit (those are handled by the save-effect below).
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [cloudUser, cloudAuthReady]);

            // Push any local change up to Firestore while signed in — debounced so a
            // flurry of quick edits (e.g. clicking through familiarity levels) collapses
            // into one write instead of many.
            useEffect(() => {
                if (!cloudUser || !window.FB) return;
                if (!cloudPulledRef.current) return;      // initial load/create hasn't finished yet — don't race it
                if (applyingCloudDataRef.current) return; // this change just came FROM the cloud — don't bounce it back up
                const { db, doc, collection, writeBatch } = window.FB;
                setCloudSyncStatus('saving');
                const handle = setTimeout(() => {
                    const metaRef = doc(db, 'users', cloudUser.uid);
                    const desiredChunks = splitWordsIntoCloudChunks(allWords);
                    const desiredIds = new Set(desiredChunks.map((c) => c.docId));
                    // Any chunk doc that existed before but isn't needed anymore (a book
                    // got shorter, or was deleted) has to be explicitly deleted — Firestore
                    // doesn't do this for you just because you stopped writing to it.
                    const staleIds = Array.from(cloudChunkIdsRef.current).filter((id) => !desiredIds.has(id));

                    const batch = writeBatch(db);
                    batch.set(metaRef, { books, allFamiliarity, allTrash, userXP, updatedAt: Date.now() });
                    desiredChunks.forEach((c) => {
                        batch.set(doc(db, 'users', cloudUser.uid, 'bookWords', c.docId), { bookId: c.bookId, chunkIndex: c.chunkIndex, words: c.words });
                    });
                    staleIds.forEach((id) => {
                        batch.delete(doc(db, 'users', cloudUser.uid, 'bookWords', id));
                    });

                    batch.commit().then(() => {
                        cloudChunkIdsRef.current = desiredIds;
                        setCloudSyncStatus('saved');
                    }).catch((err) => { console.error(err); setCloudSyncStatus('error'); });
                }, 1500);
                return () => clearTimeout(handle);
            }, [books, allWords, allFamiliarity, allTrash, userXP, cloudUser]);

            // Helper Toast Trigger
            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage(null);
                }, 3200);
            };

            const addXP = (amount) => {
                setUserXP(prev => prev + amount);
                logActivity(amount, 0);
            };

            // ACTIVE BOOK COMPUTATION
            const activeBook = useMemo(() => {
                return books.find(b => b.id === selectedBookId) || books[0] || { id: 'ws1', name: 'Vocabulation', targetCount: 500 };
            }, [books, selectedBookId]);

            // CURRENT BOOK'S WORD DATA
            const currentWords = allWords[activeBook.id] || [];

            const currentFamiliarityMap = allFamiliarity[activeBook.id] || {};
            const currentTrash = allTrash[activeBook.id] || [];

            const familiarityCounts = useMemo(() => {
                let unfamiliar = 0;
                let semi = 0;
                let familiar = 0;
                currentWords.forEach(w => {
                    const level = getWordFamiliarityLevel(currentFamiliarityMap, w.id);
                    if (level === 'familiar') familiar++;
                    else if (level === 'semi') semi++;
                    else unfamiliar++;
                });
                return { unfamiliar, semi, familiar };
            }, [currentWords, currentFamiliarityMap]);

            // STREAK CALCULATION (from activityLog)
            const activeDateSet = useMemo(() => {
                return new Set(Object.keys(activityLog).filter(d => (activityLog[d].xp || 0) > 0 || (activityLog[d].learned || 0) > 0));
            }, [activityLog]);

            const { currentStreak, bestStreak } = useMemo(() => {
                const dates = Array.from(activeDateSet).sort();
                if (dates.length === 0) return { currentStreak: 0, bestStreak: 0 };
                let best = 1, run = 1;
                for (let i = 1; i < dates.length; i++) {
                    const diff = Math.round((new Date(dates[i]) - new Date(dates[i - 1])) / 86400000);
                    run = diff === 1 ? run + 1 : 1;
                    if (run > best) best = run;
                }
                const walkBack = (startDate) => {
                    let count = 0;
                    let cursor = new Date(startDate);
                    while (activeDateSet.has(localDateKey(cursor))) {
                        count++;
                        cursor.setDate(cursor.getDate() - 1);
                    }
                    return count;
                };
                let cur = walkBack(new Date());
                if (cur === 0) {
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    cur = walkBack(yesterday);
                }
                return { currentStreak: cur, bestStreak: best };
            }, [activeDateSet]);

            const todaysActivity = activityLog[todayKey()] || { xp: 0, learned: 0 };

            // Last 7 / 30 days totals + a per-day list, for the Stats tab
            const periodStats = useMemo(() => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const days = [];
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(today);
                    d.setDate(today.getDate() - i);
                    const key = localDateKey(d);
                    const e = activityLog[key] || {};
                    days.push({ key, date: d, learned: e.learned || 0, xp: e.xp || 0 });
                }
                const sum = (arr, f) => arr.reduce((a, x) => a + x[f], 0);
                const week = days.slice(-7);
                return { week, weekLearned: sum(week, 'learned'), weekXp: sum(week, 'xp'), monthLearned: sum(days, 'learned'), monthXp: sum(days, 'xp') };
            }, [activityLog]);
            const [statsSelectedDate, setStatsSelectedDate] = useState(() => localDateKey());

            // STUDY CALENDAR (month grid)
            const [statsCalendarOffset, setStatsCalendarOffset] = useState(0);
            const statsCalendarData = useMemo(() => {
                const base = new Date();
                base.setDate(1);
                base.setMonth(base.getMonth() + statsCalendarOffset);
                const year = base.getFullYear();
                const month = base.getMonth();
                const firstDow = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const cells = [];
                for (let i = 0; i < firstDow; i++) cells.push(null);
                for (let d = 1; d <= daysInMonth; d++) cells.push(d);
                const label = base.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                return { year, month, cells, label };
            }, [statsCalendarOffset]);

            // LAST 14 WEEKS HEATMAP
            const activityHeatmap = useMemo(() => {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const thisSunday = new Date(today);
                thisSunday.setDate(today.getDate() - today.getDay());
                const startSunday = new Date(thisSunday);
                startSunday.setDate(thisSunday.getDate() - 13 * 7);
                const weeks = [];
                for (let w = 0; w < 14; w++) {
                    const days = [];
                    for (let d = 0; d < 7; d++) {
                        const dt = new Date(startSunday);
                        dt.setDate(startSunday.getDate() + w * 7 + d);
                        const key = localDateKey(dt);
                        const entry = activityLog[key];
                        const score = entry ? (entry.xp || 0) + (entry.learned || 0) * 10 : 0;
                        const level = score <= 0 ? 0 : score < 20 ? 1 : score < 50 ? 2 : score < 100 ? 3 : 4;
                        days.push({ key, date: dt, level, future: dt > today });
                    }
                    weeks.push(days);
                }
                const activeDaysTotal = Object.keys(activityLog).filter(d => activeDateSet.has(d)).length;
                return { weeks, activeDaysTotal };
            }, [activityLog, activeDateSet]);

            const getFamiliarity = (wordId) => getWordFamiliarityLevel(currentFamiliarityMap, wordId);

            const setCurrentWords = (updater) => {
                setAllWords(prev => {
                    const current = prev[activeBook.id] || [];
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            const setCurrentFamiliarityMap = (updater) => {
                setAllFamiliarity(prev => {
                    const current = prev[activeBook.id] || {};
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            const setCurrentTrash = (updater) => {
                setAllTrash(prev => {
                    const current = prev[activeBook.id] || [];
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            // ADD NEW PAGE / BOOK HANDLER
            const handleAddPage = (e) => {
                e.preventDefault();
                if (!newPageName.trim()) return;
                const newId = 'page_' + Date.now();
                const newBook = {
                    id: newId,
                    name: newPageName.trim(),
                    targetCount: parseInt(newPageTarget) || 500
                };

                setBooks(prev => [...prev, newBook]);
                setAllWords(prev => ({ ...prev, [newId]: [] }));
                setAllFamiliarity(prev => ({ ...prev, [newId]: {} }));
                setAllTrash(prev => ({ ...prev, [newId]: [] }));

                setSelectedBookId(newId);
                setShowAddPageModal(false);
                setNewPageName('');
                setNewPageTarget(500);
                triggerToast(`Created new page "${newBook.name}"!`);
            };

            // EDIT PAGE NAME & TARGET HANDLER
            const handleSavePageEdit = (e) => {
                e.preventDefault();
                if (!editingPageObj || !editingPageObj.name.trim()) return;
                setBooks(prev => prev.map(b => b.id === editingPageObj.id ? {
                    ...b,
                    name: editingPageObj.name.trim(),
                    targetCount: parseInt(editingPageObj.targetCount) || 500
                } : b));
                triggerToast(`Updated page details to "${editingPageObj.name}"!`);
                setEditingPageObj(null);
            };

            // DELETE PAGE HANDLER
            const handleDeletePage = (pageId) => {
                if (books.length <= 1) {
                    triggerToast("You must keep at least one vocabulary page!");
                    return;
                }
                const target = books.find(b => b.id === pageId);
                setBooks(prev => prev.filter(b => b.id !== pageId));
                if (selectedBookId === pageId) {
                    const remaining = books.filter(b => b.id !== pageId);
                    setSelectedBookId(remaining[0].id);
                }
                triggerToast(`Deleted page "${target?.name || 'Page'}".`);
            };

            // ADD NEW WORD HANDLER
            const handleAddWord = (e) => {
                e.preventDefault();
                if (!newWordData.word.trim() || !newWordData.meaning_en.trim()) {
                    triggerToast("Word and English Meaning are required!");
                    return;
                }
                const cleanRelated = (list) => (list || [])
                    .filter(x => x && x.word && x.word.trim())
                    .slice(0, 3)
                    .map(x => ({
                        id: x.id || genRelatedId(),
                        word: x.word.trim(),
                        phonetics: (x.phonetics || '').trim(),
                        meaning_bn: (x.meaning_bn || '').trim(),
                        meaning_en: (x.meaning_en || '').trim(),
                        context: (x.context || '').trim(),
                        sentence: (x.sentence || '').trim(),
                        note: (x.note || '').trim()
                    }));

                const meaningEn = newWordData.meaning_en.trim();
                const meaningBn = newWordData.meaning_bn.trim();
                const exampleMain = newWordData.example_main.trim();

                const created = {
                    id: generateUniqueWordId(),
                    word: newWordData.word.trim(),
                    phonetics: newWordData.phonetics.trim(),
                    meaning_en: meaningEn,
                    meaning_bn: meaningBn,
                    meaning_en_detailed: newWordData.meaning_en_detailed.trim(),
                    context_main: newWordData.context_main.trim(),
                    example_main: exampleMain,
                    synonyms: cleanRelated(newWordData.synonyms),
                    antonyms: cleanRelated(newWordData.antonyms),
                    // Legacy mirror fields so existing Word List / Flashcard / Game rendering
                    // (not yet updated to the new schema) keeps working without changes.
                    meaning: meaningEn,
                    bangla: meaningBn,
                    sentence: exampleMain
                };
                setCurrentWords(prev => {
                    const { words, promotedCount } = promoteRelatedWords(
                        [created, ...prev],
                        [...created.synonyms, ...created.antonyms]
                    );
                    if (promotedCount > 0) {
                        addXP(promotedCount * 5);
                        setTimeout(() => triggerToast(`Also added ${promotedCount} synonym/antonym word${promotedCount > 1 ? 's' : ''} to your list!`), 1600);
                    }
                    return words;
                });
                setShowAddWordModal(false);
                setNewWordData({ word: '', phonetics: '', meaning_bn: '', meaning_en: '', meaning_en_detailed: '', context_main: '', example_main: '', synonyms: [], antonyms: [] });
                addXP(10);
                triggerToast(`Added "${created.word}" (+10 XP)!`);
            };

            const setWordFamiliarity = (id, level) => {
                setCurrentFamiliarityMap(prev => {
                    const next = { ...prev };
                    if (level === 'unfamiliar') {
                        delete next[id];
                    } else {
                        next[id] = level;
                    }
                    return next;
                });
                if (level === 'familiar' && !familiarXpGiven.includes(id)) {
                    addXP(20);
                    setFamiliarXpGiven(prev2 => [...prev2, id]);
                    logActivity(0, 1);
                }
            };

            // Soft-delete word (Move to Trash)
            const handleSoftDelete = (id) => {
                const target = currentWords.find(w => w.id === id);
                if (target) {
                    setCurrentWords(prev => prev.filter(w => w.id !== id));
                    setCurrentTrash(prev => [target, ...prev]);
                    setCurrentFamiliarityMap(prev => {
                        const next = { ...prev };
                        delete next[id];
                        // Also clear familiarity for this word's nested synonym/antonym
                        // entries, so trashing a word fully resets it (same behavior as
                        // the main word itself) instead of leaving orphaned map entries.
                        (target.synonyms || []).forEach((s, i) => delete next[getRelatedEntryId(id, 'syn', i, s)]);
                        (target.antonyms || []).forEach((a, i) => delete next[getRelatedEntryId(id, 'ant', i, a)]);
                        return next;
                    });
                    triggerToast(`Moved "${target.word}" to Trash Bin.`);
                }
                setDeleteTargetId(null);
            };

            // Save word edit changes
            const handleSaveEdit = (updatedWord) => {
                const cleanRelated = (list) => (list || [])
                    .filter(x => x && x.word && x.word.trim())
                    .slice(0, 3)
                    .map(x => ({
                        id: x.id || genRelatedId(),
                        word: x.word.trim(),
                        phonetics: (x.phonetics || '').trim(),
                        meaning_bn: (x.meaning_bn || '').trim(),
                        meaning_en: (x.meaning_en || '').trim(),
                        context: (x.context || '').trim(),
                        sentence: (x.sentence || '').trim(),
                        note: (x.note || '').trim()
                    }));

                const meaningEn = (updatedWord.meaning_en || '').trim();
                const meaningBn = (updatedWord.meaning_bn || '').trim();
                const exampleMain = (updatedWord.example_main || '').trim();

                const finalWord = {
                    ...updatedWord,
                    word: updatedWord.word.trim(),
                    phonetics: (updatedWord.phonetics || '').trim(),
                    meaning_en: meaningEn,
                    meaning_bn: meaningBn,
                    meaning_en_detailed: (updatedWord.meaning_en_detailed || '').trim(),
                    context_main: (updatedWord.context_main || '').trim(),
                    example_main: exampleMain,
                    synonyms: cleanRelated(updatedWord.synonyms),
                    antonyms: cleanRelated(updatedWord.antonyms),
                    // legacy mirrors kept in sync
                    meaning: meaningEn,
                    bangla: meaningBn,
                    sentence: exampleMain
                };
                setCurrentWords(prev => {
                    const updatedList = prev.map(w => w.id === finalWord.id ? finalWord : w);
                    const { words, promotedCount } = promoteRelatedWords(
                        updatedList,
                        [...finalWord.synonyms, ...finalWord.antonyms]
                    );
                    if (promotedCount > 0) {
                        addXP(promotedCount * 5);
                        setTimeout(() => triggerToast(`Also added ${promotedCount} synonym/antonym word${promotedCount > 1 ? 's' : ''} to your list!`), 1600);
                    }
                    return words;
                });
                // Clean up familiarity data for any synonym/antonym rows that were
                // removed during this edit, so it doesn't linger orphaned forever.
                const previousWord = currentWords.find(w => w.id === finalWord.id);
                if (previousWord) {
                    const keptIds = new Set([
                        ...finalWord.synonyms.map((s, i) => getRelatedEntryId(finalWord.id, 'syn', i, s)),
                        ...finalWord.antonyms.map((a, i) => getRelatedEntryId(finalWord.id, 'ant', i, a))
                    ]);
                    const removedIds = [
                        ...(previousWord.synonyms || []).map((s, i) => getRelatedEntryId(finalWord.id, 'syn', i, s)),
                        ...(previousWord.antonyms || []).map((a, i) => getRelatedEntryId(finalWord.id, 'ant', i, a))
                    ].filter(id => !keptIds.has(id));
                    if (removedIds.length) {
                        setCurrentFamiliarityMap(prev => {
                            const next = { ...prev };
                            removedIds.forEach(id => delete next[id]);
                            return next;
                        });
                    }
                }
                setEditingWord(null);
                triggerToast(`Successfully updated "${finalWord.word}"!`);
            };

            // Add/update/remove a synonym or antonym row while editing an existing word
            const addEditRelatedRow = (field) => {
                setEditingWord(prev => {
                    if (!prev) return prev;
                    const list = prev[field] || [];
                    if (list.length >= 3) return prev;
                    return { ...prev, [field]: [...list, { id: genRelatedId(), word: '', context: '', sentence: '' }] };
                });
            };
            const updateEditRelatedRow = (field, idx, key, value) => {
                setEditingWord(prev => {
                    if (!prev) return prev;
                    const list = [...(prev[field] || [])];
                    list[idx] = { ...list[idx], [key]: value };
                    return { ...prev, [field]: list };
                });
            };
            const removeEditRelatedRow = (field, idx) => {
                setEditingWord(prev => {
                    if (!prev) return prev;
                    return { ...prev, [field]: (prev[field] || []).filter((_, i) => i !== idx) };
                });
            };

            // Restore word from Trash
            const restoreFromTrash = (id) => {
                const target = currentTrash.find(w => w.id === id);
                if (target) {
                    setCurrentTrash(prev => prev.filter(w => w.id !== id));
                    setCurrentWords(prev => [...prev, target]);
                    triggerToast(`Restored "${target.word}" to active list!`);
                }
            };

            // Permanently delete single word from Trash
            const purgeFromTrash = (id) => {
                const target = currentTrash.find(w => w.id === id);
                setCurrentTrash(prev => prev.filter(w => w.id !== id));
                triggerToast(`Permanently removed "${target ? target.word : 'Word'}".`);
            };

            // Restore All Trash
            const restoreAllTrash = () => {
                if (currentTrash.length === 0) return;
                setCurrentWords(prev => [...prev, ...currentTrash]);
                setCurrentTrash([]);
                triggerToast("Restored all deleted words back to list!");
            };

            // Words sorted A→Z — used as the basis for chunk boundaries so chunk 1
            // always starts at "A", chunk 2 picks up right after it alphabetically,
            // and so on, regardless of the order words were originally added in or
            // whatever the "Sort by" dropdown is currently set to.
            const alphabeticalWords = useMemo(() => {
                return [...currentWords].sort((a, b) => (a?.word || '').localeCompare(b?.word || ''));
            }, [currentWords]);

            // Chunks calculation
            const chunksList = useMemo(() => {
                const total = currentWords.length;
                if (total === 0) return [];
                const count = Math.ceil(total / CHUNK_SIZE);
                return Array.from({ length: count }, (_, i) => {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, total);
                    return {
                        index: i,
                        label: `Chunk ${i + 1} (${start + 1}–${end})`
                    };
                });
            }, [currentWords.length, CHUNK_SIZE]);

            // Progress stats for the Chunk + Status filters. Counts include each word's
            // synonym/antonym entries (when those fields are visible), same as the
            // quiz/game pool, and use each entry's own familiarity level.
            const tallyWords = (words) => {
                let total = 0, familiar = 0, semi = 0;
                const count = (id) => {
                    total++;
                    const lvl = getWordFamiliarityLevel(currentFamiliarityMap, id);
                    if (lvl === 'familiar') familiar++;
                    else if (lvl === 'semi') semi++;
                };
                words.forEach(w => {
                    count(w.id);
                    if (fieldVisibility.synonyms) (w.synonyms || []).forEach((r, i) => count(getRelatedEntryId(w.id, 'syn', i, r)));
                    if (fieldVisibility.antonyms) (w.antonyms || []).forEach((r, i) => count(getRelatedEntryId(w.id, 'ant', i, r)));
                });
                return { total, familiar, semi, unfamiliar: total - familiar - semi };
            };
            const chunkStats = useMemo(() => {
                const chunks = chunksList.map(c => tallyWords(alphabeticalWords.slice(c.index * CHUNK_SIZE, (c.index + 1) * CHUNK_SIZE)));
                return { all: tallyWords(currentWords), chunks };
            }, [chunksList, alphabeticalWords, currentWords, currentFamiliarityMap, fieldVisibility.synonyms, fieldVisibility.antonyms, CHUNK_SIZE]);
            // Status counts follow whichever chunk is selected, so the numbers match what you'd see.
            const statusStats = useMemo(() => {
                const picked = selectedChunks.filter(i => chunkStats.chunks[i]);
                if (!picked.length) return chunkStats.all;
                return picked.reduce((acc, i) => {
                    const c = chunkStats.chunks[i];
                    return { total: acc.total + c.total, familiar: acc.familiar + c.familiar, semi: acc.semi + c.semi, unfamiliar: acc.unfamiliar + c.unfamiliar };
                }, { total: 0, familiar: 0, semi: 0, unfamiliar: 0 });
            }, [chunkStats, selectedChunks]);

            // Alphabet list generator
            const alphabet = useMemo(() => {
                const letters = new Set(
                    currentWords
                        .map(w => getWordInitial(w?.word))
                        .filter(letter => letter !== '#')
                );
                return ['ALL', ...Array.from(letters).sort()];
            }, [currentWords]);

            // Filtered Words calculation
            const filteredWords = useMemo(() => {
                // Chunk mode slices from the A→Z-sorted list (not raw import order)
                // so each chunk is a contiguous alphabetical range starting at "A".
                // With several chunks ticked, their words are joined in chunk order.
                const pickedChunks = selectedChunks.filter(i => Number.isInteger(i) && i >= 0).sort((a, b) => a - b);
                let list = pickedChunks.length === 0
                    ? [...currentWords]
                    : pickedChunks.flatMap(i => alphabeticalWords.slice(i * CHUNK_SIZE, (i + 1) * CHUNK_SIZE));

                if (searchQuery) {
                    const q = normalizeText(searchQuery);
                    list = list.filter(w => {
                        // Also search inside each synonym/antonym entry (the word itself and
                        // its meanings), so a word that only exists in someone's synonym or
                        // antonym list still brings up the main word it belongs to.
                        const relatedText = [...(w?.synonyms || []), ...(w?.antonyms || [])]
                            .map(r => [r?.word, r?.meaning_en, r?.meaning_bn, r?.meaning, r?.bangla].filter(Boolean).join(' '))
                            .join(' ');
                        const searchable = [
                            w?.word,
                            w?.meaning,
                            w?.bangla,
                            w?.meaning_en,
                            w?.meaning_bn,
                            w?.context_main,
                            relatedText
                        ].filter(Boolean).join(' ');
                        return normalizeText(searchable).includes(q);
                    });
                }

                if (filterFamiliarities.length > 0) {
                    list = list.filter(w => filterFamiliarities.includes(getWordFamiliarityLevel(currentFamiliarityMap, w.id)));
                }

                if (selectedLetter !== 'ALL') {
                    list = list.filter(w => getWordInitial(w?.word) === selectedLetter);
                }

                if (isShuffled) {
                    list = [...list].sort(() => 0.5 - Math.random());
                } else if (sortBy !== 'default') {
                    list = [...list].sort((a, b) => {
                        switch (sortBy) {
                            case 'name-asc':
                                return (a?.word || '').localeCompare(b?.word || '');
                            case 'name-desc':
                                return (b?.word || '').localeCompare(a?.word || '');
                            case 'date-newest':
                                return (b?.id || 0) - (a?.id || 0);
                            case 'date-oldest':
                                return (a?.id || 0) - (b?.id || 0);
                            default:
                                return 0;
                        }
                    });
                }

                return list;
            }, [currentWords, alphabeticalWords, selectedChunks, CHUNK_SIZE, searchQuery, filterFamiliarities, selectedLetter, currentFamiliarityMap, showBangla, isShuffled, shuffleSeed, sortBy]);

            // Playable pool: same as filteredWords, but with each word's synonyms/antonyms
            // flattened in as their own standalone playable items (so they can show up in
            // Flashcards, Practice Quiz, and Word Quest, not just as nested display text in
            // the Word List). Each related entry keeps its own id (getRelatedEntryId) so its
            // familiarity status tracks independently, same system as main words.
            const playablePool = useMemo(() => {
                const out = [];
                filteredWords.forEach(w => {
                    out.push(w);
                    if (fieldVisibility.synonyms) {
                        (w.synonyms || []).forEach((s, i) => {
                            const entryId = getRelatedEntryId(w.id, 'syn', i, s);
                            out.push({
                                ...s,
                                id: entryId,
                                meaning_en: s.meaning_en,
                                meaning_bn: s.meaning_bn,
                                context_main: s.context,
                                example_main: s.sentence,
                                synonyms: [],
                                antonyms: [],
                                relatedTo: w.word,
                                relatedTone: 'syn',
                                // Keep a reference to the main word this came from, so the
                                // "second dropdown" (full word family) can show its actual
                                // family (main word + all its synonyms/antonyms) instead of
                                // this flattened entry's own (always empty) syn/ant arrays.
                                familyOf: w
                            });
                        });
                    }
                    if (fieldVisibility.antonyms) {
                        (w.antonyms || []).forEach((a, i) => {
                            const entryId = getRelatedEntryId(w.id, 'ant', i, a);
                            out.push({
                                ...a,
                                id: entryId,
                                meaning_en: a.meaning_en,
                                meaning_bn: a.meaning_bn,
                                context_main: a.context,
                                example_main: a.sentence,
                                synonyms: [],
                                antonyms: [],
                                relatedTo: w.word,
                                relatedTone: 'ant',
                                familyOf: w
                            });
                        });
                    }
                });
                return out;
            }, [filteredWords, fieldVisibility.synonyms, fieldVisibility.antonyms]);

            // WORD QUEST — review mode pool: the mistaken words themselves, padded
            // with a handful of unique extra words (never duplicated — Word Match
            // samples cards directly from this array, so repeats would create
            // duplicate tiles) so every mode has enough distinct options to build
            // multiple-choice distractors and 6-card match rounds from.
            const buildGameReviewPool = (words) => {
                const uniqueIds = new Set(words.map(w => w.id));
                const need = Math.max(0, 6 - uniqueIds.size);
                const filler = playablePool.filter(w => !uniqueIds.has(w.id)).sort(() => 0.5 - Math.random()).slice(0, need);
                return [...words, ...filler];
            };
            const [gameReviewPool, setGameReviewPoolState] = useState(null); // live word-pool array used by the game, or null
            const [gameReviewCount, setGameReviewCount] = useState(0); // how many distinct words are being reviewed
            const startGameReview = (words) => {
                if (!words || !words.length) return;
                setGameReviewPoolState(buildGameReviewPool(words));
                setGameReviewCount(words.length);
            };
            const exitGameReview = () => { setGameReviewPoolState(null); setGameReviewCount(0); };
            const gameWordPool = gameReviewPool && gameReviewPool.length ? gameReviewPool : playablePool;

            const handleGameFinished = ({ mode, score, questionsAnswered, missedWords, maxCombo, isReview }) => {
                recordMistakes(setGameMistakes, missedWords);
                setGameHistory(prev => [
                    {
                        id: Date.now(),
                        date: Date.now(),
                        mode,
                        score,
                        questionsAnswered,
                        missed: (missedWords || []).length,
                        maxCombo,
                        isReview: !!isReview,
                        bookTitle: books.find(b => b.id === selectedBookId)?.title || 'Book',
                    },
                    ...prev,
                ].slice(0, 50));
            };

            const itemsPerPage = 30;
            const totalPages = Math.ceil(filteredWords.length / itemsPerPage);
            const startIndex = (currentPage - 1) * itemsPerPage;
            const pagedWords = filteredWords.slice(startIndex, startIndex + itemsPerPage);
            const startItem = filteredWords.length === 0 ? 0 : startIndex + 1;
            const endItem = Math.min(startIndex + itemsPerPage, filteredWords.length);

            // Selecting a word from the master list: on mobile / narrow-window
            // layouts (below Tailwind's lg breakpoint, 1024px) the detail
            // ("Family") card sits BELOW the word list in the stacked layout,
            // so nudge the view down to it after the click. Desktop/wide
            // layout keeps both panes side-by-side already, so no scroll there.
            const selectWordFromList = (id) => {
                setSelectedWordId(id);
                if (window.innerWidth < 1024) {
                    setTimeout(() => {
                        document.getElementById('word-detail-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 60);
                }
            };

            const goToPage = (page) => {
                if (page < 1 || page > totalPages) return;
                setCurrentPage(page);
                setTimeout(() => {
                    document.getElementById('word-list-top')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 60);
            };

            useEffect(() => {
                if (pagedWords.length === 0) return;
                if (!pagedWords.some(w => w.id === selectedWordId)) {
                    setSelectedWordId(pagedWords[0].id);
                }
            }, [pagedWords]);

            useEffect(() => {
                setCurrentPage(1);
            }, [searchQuery, selectedLetter, selectedChunks, filterFamiliarities, activeTab, activeBook.id]);

            useEffect(() => {
                if (selectedChunks.some(i => i >= chunksList.length)) {
                    setSelectedChunks(prev => prev.filter(i => i < chunksList.length));
                }
            }, [chunksList.length, selectedChunks]);

            useEffect(() => {
                if (selectedLetter !== 'ALL' && !alphabet.includes(selectedLetter)) {
                    setSelectedLetter('ALL');
                }
            }, [alphabet, selectedLetter]);

            useEffect(() => {
                resetListFilters();
            }, [activeBook.id, importRefreshToken, resetListFilters]);

            // ===== QUIZ QUESTION GENERATORS (Step 6) =====
            const genQuizQuestion = (pool, allWords) => {
                const target = pool[Math.floor(Math.random() * pool.length)];
                const distractors = allWords.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const options = [...distractors, target].sort(() => 0.5 - Math.random());
                return { qType: 'quiz', target, options };
            };
            // REVERSE: show the meaning, pick the word.
            const genReverseQuestion = (pool, allWords) => {
                const withMeaning = pool.filter(w => w.meaning_en || w.meaning);
                const source = withMeaning.length ? withMeaning : pool;
                const target = source[Math.floor(Math.random() * source.length)];
                const distractors = allWords.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const options = [...distractors.map(w => ({ id: w.id, word: w.word })), { id: target.id, word: target.word }].sort(() => 0.5 - Math.random());
                return { qType: 'reverse', target, options };
            };
            const genFillinQuestion = (pool, allWords) => {
                const withSentence = pool.filter(w => {
                    const s = w.example_main || w.sentence || '';
                    return s && s.toLowerCase().includes(String(w.word || '').toLowerCase());
                });
                const source = withSentence.length ? withSentence : pool;
                const target = source[Math.floor(Math.random() * source.length)];
                const exampleText = target.example_main || target.sentence || '';
                const blankedSentence = exampleText
                    ? exampleText.replace(new RegExp(String(target.word).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '_____')
                    : `What is the meaning of "${target.word}"?`;
                const distractors = allWords.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const options = [...distractors.map(w => ({ id: w.id, word: w.word })), { id: target.id, word: target.word }].sort(() => 0.5 - Math.random());
                return { qType: 'fillin', target, sentence: blankedSentence, options };
            };
            const genRelatedQuestion = (pool, allWords, kind) => {
                const field = kind === 'synonym' ? 'synonyms' : 'antonyms';
                const eligible = pool.filter(w => w[field] && w[field].length);
                if (!eligible.length) return null;
                const target = eligible[Math.floor(Math.random() * eligible.length)];
                const list = target[field];
                const correctEntry = list[Math.floor(Math.random() * list.length)];
                const usedWords = new Set([String(target.word).toLowerCase(), String(correctEntry.word).toLowerCase()]);
                const distractorPool = allWords.filter(w => !usedWords.has(String(w.word).toLowerCase()));
                const distractors = distractorPool.sort(() => 0.5 - Math.random()).slice(0, 3).map(w => ({ id: w.id, word: w.word }));
                const correctOption = { id: `correct-${target.id}-${kind}`, word: correctEntry.word };
                const options = [...distractors, correctOption].sort(() => 0.5 - Math.random());
                return { qType: kind, target, correctEntry, correctId: correctOption.id, options };
            };
            const genTrueFalseQuestion = (pool) => {
                const target = pool[Math.floor(Math.random() * pool.length)];
                const isTrue = Math.random() > 0.45;
                let shownMeaning = target.meaning_en || target.meaning;
                if (!isTrue) {
                    const other = pool.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random())[0];
                    shownMeaning = (other && (other.meaning_en || other.meaning)) || shownMeaning;
                }
                return { qType: 'truefalse', target, shownMeaning, isTrue };
            };
            const buildQuizQuestions = (pool, allWords, types, count) => {
                const generatorsByType = {
                    quiz: () => genQuizQuestion(pool, allWords),
                    reverse: () => genReverseQuestion(pool, allWords),
                    fillin: () => genFillinQuestion(pool, allWords),
                    synonym: () => genRelatedQuestion(pool, allWords, 'synonym'),
                    antonym: () => genRelatedQuestion(pool, allWords, 'antonym'),
                    truefalse: () => genTrueFalseQuestion(pool),
                };
                const activeTypes = (types && types.length ? types : ['quiz']).filter(t => generatorsByType[t]);
                const questions = [];
                let attempts = 0;
                while (questions.length < count && attempts < count * 10) {
                    attempts++;
                    const t = activeTypes[Math.floor(Math.random() * activeTypes.length)];
                    const q = generatorsByType[t]();
                    if (q) questions.push(q);
                }
                return questions;
            };

            // Build questions from current settings and enter play mode.
            // When reviewPoolOverride is given (Review Mistakes), questions are
            // drawn ONLY from those words, but wrong-answer options still pull
            // from the whole book, so even a single mistaken word works fine.
            const buildAndStartQuiz = (reviewPoolOverride) => {
                // Always respect the active Status filter (familiar/semi/unfamiliar) — previously this
                // silently fell back to the entire unfiltered book when the filtered set was small,
                // which made the Status filter appear broken.
                const isReview = Array.isArray(reviewPoolOverride) && reviewPoolOverride.length > 0;
                const pool = isReview ? reviewPoolOverride : playablePool;
                const distractorSource = isReview ? currentWords : pool;
                setQuizReviewPool(isReview ? reviewPoolOverride : null);
                if (!isReview && pool.length < 4) {
                    const filterNote = filterFamiliarities.length > 0
                        ? ` (currently filtered to ${filterFamiliarities.join(' + ')} — try a different filter or add more words to those statuses)`
                        : '';
                    triggerToast(`Please ensure you have at least 4 words in the selected list to generate a quiz!${filterNote}`);
                    return;
                }
                if (isReview && distractorSource.length < 4) {
                    triggerToast('Need at least 4 words in this book to generate multiple-choice options.');
                    return;
                }
                const countNum = isReview
                    ? Math.max(1, Math.min(pool.length * 2, 30))
                    : quizQuestionCount === 'all'
                        ? Math.min(pool.length, 50)
                        : Math.max(1, Math.min(Number(quizQuestionCount) || 10, 100));
                // Pass `pool` as the question source and `distractorSource` as the
                // wrong-answer source, so every question comes from the selected
                // chunk/review set while options still pull from the full book.
                const questions = buildQuizQuestions(pool, distractorSource, quizTypes, countNum);
                if (!questions.length) {
                    triggerToast("Couldn't generate that question type — try selecting more types, or add synonym/antonym data to your words first!");
                    return;
                }

                // Timer setup
                if (quizTimerMode === 'perQuestion' && quizTimerMinutes > 0) {
                    setQuizPerQuestionSeconds(Math.max(3, Math.round((quizTimerMinutes * 60) / questions.length)));
                    setQuizOverallTimeLeft(null);
                } else if (quizTimerMode === 'overall' && quizTimerMinutes > 0) {
                    setQuizPerQuestionSeconds(0);
                    setQuizOverallTimeLeft(Math.round(quizTimerMinutes * 60));
                } else {
                    setQuizPerQuestionSeconds(0);
                    setQuizOverallTimeLeft(null);
                }

                setQuizQuestions(questions);
                setQuizQuestionIndex(0);
                setQuizAnswers({});
                setQuizTimeLeft(null);
                setQuizPhase('playing');
            };

            // Select an answer for the current question (only while unsubmitted)
            const selectQuizAnswer = (answerId) => {
                setQuizAnswers(prev => {
                    const existing = prev[quizQuestionIndex] || {};
                    if (existing.submitted) return prev;
                    return { ...prev, [quizQuestionIndex]: { ...existing, answerId } };
                });
            };

            // Force-submit whatever is currently selected (used when the timer hits 0)
            const submitCurrentQuizAnswer = () => {
                setQuizAnswers(prev => {
                    const existing = prev[quizQuestionIndex] || {};
                    if (existing.submitted) return prev;
                    const q = quizQuestions[quizQuestionIndex];
                    const isCorrect = isQuizAnswerCorrect(q, existing.answerId ?? null);
                    // SoundEngine's enabled flag is a single shared switch (also used by Word
                    // Quest, which has its own separate sound toggle). Set it from this
                    // screen's own toggle right before playing, instead of relying on Word
                    // Quest's effect to have already turned it on — otherwise Practice Quiz
                    // stays silent until Word Quest happens to be opened first.
                    if (typeof SoundEngine !== 'undefined' && SoundEngine.setEnabled) SoundEngine.setEnabled(quizSoundOn);
                    if (isCorrect) {
                        addXP(15);
                        if (typeof SoundEngine !== 'undefined' && SoundEngine.correct) SoundEngine.correct();
                    } else if (typeof SoundEngine !== 'undefined' && SoundEngine.wrong) {
                        SoundEngine.wrong();
                    }
                    return { ...prev, [quizQuestionIndex]: { ...existing, submitted: true } };
                });
            };

            // Called whenever a quiz attempt ends: records which words were
