    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const DEFAULT_SHORTCUTS = {

        };

        // INITIAL VOCABULARY DATA WITH DUAL-MODE (STANDARD + VARIANT)
        const INITIAL_WS1_WORDS = [
            { id: 1, word: "Abase", phonetics: "uh-BAYS", meaning: "to humiliate", bangla: "অপমান করা / নীচু করা", sentence: "The king tried to abase his enemies by parading them through the streets.", variantMeaning: "to degrade or lower in status", variantBangla: "মর্যাদা হানিকর করা", variantSentence: "His harsh public criticism served only to abase his team." },
            { id: 2, word: "Abash", phonetics: "uh-BASH", meaning: "to embarrass", bangla: "বিব্রত করা / লজ্জিত করা", sentence: "She was abashed when she forgot her speech on stage.", variantMeaning: "to make someone feel ashamed or uncomfortable", variantBangla: "লজ্জিত বা অস্বস্তিতে ফেলা", variantSentence: "The unexpected question seemed to abash the presenter for a second." },
            { id: 3, word: "Abate", phonetics: "uh-BAYT", meaning: "to reduce", bangla: "হ্রাস করা / কমানো", sentence: "The storm finally abated after three days.", variantMeaning: "to become less intense or widespread", variantBangla: "তীব্রতা কমানো", variantSentence: "We waited inside until the heavy rain began to abate." },
            { id: 4, word: "Abdicate", phonetics: "AB-dih-kayt", meaning: "to step down from a position of power", bangla: "ক্ষমতা ছেড়ে দেওয়া / পদত্যাগ করা", sentence: "The king abdicated his throne to marry a commoner.", variantMeaning: "to formally give up a responsibility or duty", variantBangla: "দায়িত্ব বা পদ পরিহার করা", variantSentence: "The CEO decided to abdicate his duties following the financial crisis." },
            { id: 5, word: "Aberration", phonetics: "ab-uh-RAY-shun", meaning: "something not typical", bangla: "স্বাভাবিকের ব্যতিক্রম / বিচ্যুতি", sentence: "His rude behavior was an aberration from his usual kindness.", variantMeaning: "a departure from what is normal or expected", variantBangla: "স্বাভাবিকতার ব্যাঘাত", variantSentence: "The system glitch was merely a temporary aberration in performance." },
            { id: 6, word: "Abet", phonetics: "uh-BET", meaning: "to support or encourage someone who has done wrong", bangla: "অপকর্মে সহায়তা করা", sentence: "He was jailed for abetting the criminal.", variantMeaning: "to assist or encourage in an activity", variantBangla: "সাহায্য প্রদান করা", variantSentence: "Ignoring safety protocols will only abet potential accidents." },
            { id: 7, word: "Abeyance", phonetics: "uh-BAY-unce", meaning: "suspension", bangla: "স্থগিত অবস্থা / বিরতি", sentence: "The project was held in abeyance until funds arrived.", variantMeaning: "a state of temporary disuse or inactivity", variantBangla: "সাময়িক স্থগিতাদেশ", variantSentence: "Contract negotiations were kept in abeyance pending further review." },
            { id: 8, word: "Abhor", phonetics: "ab-HOR", meaning: "to hate", bangla: "ঘৃণা করা / বিদ্বেষ পোষণ করা", sentence: "She abhors any form of cruelty to animals.", variantMeaning: "to regard with disgust and hatred", variantBangla: "তীব্র অপছন্দ করা", variantSentence: "Honest leaders abhor dishonesty in public office." },
            { id: 9, word: "Abject", phonetics: "AB-jekt", meaning: "hopeless", bangla: "চরম হতাশ / দুর্দশাগ্রস্ত", sentence: "The refugees lived in abject poverty.", variantMeaning: "extremely unpleasant, degraded, or miserable", variantBangla: "অত্যন্ত করুণ বা শোচনীয়", variantSentence: "They expressed abject regret for the error made during the event." },
            { id: 10, word: "Abjure", phonetics: "ab-JOOR", meaning: "to refrain from", bangla: "ত্যাগ করা / পরিহার করা", sentence: "He abjured violence and chose a peaceful path.", variantMeaning: "to solemnly renounce or give up a belief", variantBangla: "আনুষ্ঠানিকভাবে বর্জন করা", variantSentence: "The candidate abjured his previous claims during the debate." },
            { id: 11, word: "Abnegate", phonetics: "AB-nih-gayt", meaning: "to reject", bangla: "প্রত্যাখ্যান করা / অস্বীকার করা", sentence: "She abnegated her personal desires to serve others.", variantMeaning: "to surrender or deny oneself something beneficial", variantBangla: "আত্মত্যাগ করা", variantSentence: "He chose to abnegate luxury in favor of a simpler lifestyle." },
            { id: 12, word: "Abomination", phonetics: "uh-bom-ih-NAY-shun", meaning: "extreme hatred", bangla: "চরম ঘৃণা / ঘৃণ্য বস্তু", sentence: "War is an abomination that destroys lives.", variantMeaning: "a thing that causes disgust or hatred", variantBangla: "ঘৃণ্য কর্ম বা বস্তু", variantSentence: "Cheating in fair academic pursuits is considered an abomination." }
        ];

        const DEFAULT_BOOKS = [
            { id: 'ws1', name: 'WordSmart I', targetCount: 850 },
            { id: 'ws2', name: 'WordSmart II', targetCount: 829 }
        ];

        // SPEECH SYNTHESIS ENGINE
        const VOICE_PREFS_KEY = 'wordsmart_voice_prefs';
        const FEMALE_VOICE_HINTS = ['female', 'sonia', 'jenny', 'zira', 'aria', 'libby', 'serena', 'samantha', 'hazel', 'susan', 'kate', 'emma', 'michelle', 'ana', 'natasha', 'emily', 'linda', 'karen', 'moira', 'fiona', 'tessa', 'veena', 'raveena'];
        const MALE_VOICE_HINTS = ['male', 'david', 'mark', 'guy', 'james', 'george', 'ryan', 'christopher', 'eric', 'steffan', 'andrew', 'brian', 'thomas', 'daniel', 'oliver', 'arthur', 'fred', 'alex', 'tom', 'richard', 'aaron'];
        const QUALITY_VOICE_HINTS = ['google', 'microsoft', 'natural', 'neural', 'enhanced', 'premium', 'samantha', 'daniel', 'karen', 'moira', 'tessa', 'fiona', 'alex'];

        const SpeechEngine = (() => {
            let voicesCache = [];

            const loadVoicePrefs = () => {
                try {
                    const raw = localStorage.getItem(VOICE_PREFS_KEY);
                    if (!raw) return { usVoiceURI: null, ukVoiceURI: null };
                    const parsed = JSON.parse(raw);
                    return {
                        usVoiceURI: parsed.usVoiceURI || null,
                        ukVoiceURI: parsed.ukVoiceURI || null
                    };
                } catch (e) {
                    return { usVoiceURI: null, ukVoiceURI: null };
                }
            };

            let voicePrefs = loadVoicePrefs();

            const refreshVoices = () => {
                if ('speechSynthesis' in window) {
                    voicesCache = window.speechSynthesis.getVoices() || [];
                }
                return voicesCache;
            };

            const getSpeechVoices = () => (voicesCache.length ? voicesCache : refreshVoices());

            const langForAccent = (accent) => (accent === 'uk' ? 'en-GB' : 'en-US');

            const detectProvider = (name) => {
                const n = (name || '').toLowerCase();
                if (n.includes('google')) return 'Google';
                if (n.includes('microsoft')) return 'Microsoft';
                if (n.includes('apple') || n.includes('samantha') || n.includes('alex') || n.includes('daniel') || n.includes('karen') || n.includes('moira') || n.includes('tessa') || n.includes('fiona') || n.includes('rishi') || n.includes('veena')) return 'Apple';
                if (n.includes('amazon') || n.includes('polly')) return 'Amazon';
                if (n.includes('samsung')) return 'Samsung';
                return 'System';
            };

            const detectGender = (name) => {
                const n = (name || '').toLowerCase();
                if (FEMALE_VOICE_HINTS.some(h => n.includes(h))) return 'Female';
                if (MALE_VOICE_HINTS.some(h => n.includes(h))) return 'Male';
                // Chrome's "Google US English" / "Google UK English Female" naming
                if (n.includes('english female') || n.endsWith(' female')) return 'Female';
                if (n.includes('english male') || n.endsWith(' male')) return 'Male';
                return '';
            };

            const formatVoiceLabel = (voice) => {
                if (!voice) return '';
                const provider = detectProvider(voice.name);
                const gender = detectGender(voice.name);
                const accent = voice.lang && voice.lang.toLowerCase().includes('gb') ? 'UK' : (voice.lang && voice.lang.toLowerCase().includes('us') ? 'US' : voice.lang);
                const bits = [provider, accent, gender].filter(Boolean);
                return `${voice.name}${bits.length ? ` — ${bits.join(' · ')}` : ''}`;
            };

            const rankVoice = (voice, langPrefix, preferFemale = true) => {
                if (!voice || !voice.lang || !voice.lang.startsWith(langPrefix)) return -1;
                const n = voice.name.toLowerCase();
                let score = 10;
                if (n.includes('google')) score += 140;
                if (n.includes('microsoft')) score += 110;
                if (n.includes('natural') || n.includes('neural') || n.includes('enhanced')) score += 30;
                if (QUALITY_VOICE_HINTS.some(h => n.includes(h))) score += 12;
                if (langPrefix === 'en-US' && (n.includes(' us ') || n.includes(' u.s.') || n.includes('us english') || n.includes('american'))) score += 25;
                if (langPrefix === 'en-GB' && (n.includes(' uk ') || n.includes(' british') || n.includes(' u.k.') || n.includes('uk english'))) score += 25;
                const gender = detectGender(voice.name);
                if (preferFemale) {
                    if (gender === 'Female') score += 35;
                    if (gender === 'Male') score += 5; // keep male Google/Microsoft selectable & ranked, not buried
                }
                // Prefer distinct Google US/UK entries when present
                if (n.includes('google') && langPrefix === 'en-US' && (n.includes('male') || gender === 'Male')) score += 20;
                if (n.includes('google') && langPrefix === 'en-US' && (n.includes('female') || gender === 'Female')) score += 15;
                return score;
            };

            const voicesForLang = (langPrefix) => {
                return getSpeechVoices()
                    .filter(v => v.lang && (v.lang.startsWith(langPrefix) || (langPrefix === 'en-US' && /^en(-|$)/i.test(v.lang) && !v.lang.toLowerCase().includes('gb') && !v.lang.toLowerCase().includes('au') && !v.lang.toLowerCase().includes('in'))))
                    .sort((a, b) => rankVoice(b, langPrefix) - rankVoice(a, langPrefix));
            };

            const resolveVoice = (accent, preferredVoiceURI) => {
                const lang = langForAccent(accent);
                const voices = getSpeechVoices();
                if (preferredVoiceURI) {
                    const picked = voices.find(v => v.voiceURI === preferredVoiceURI);
                    if (picked && (picked.lang.startsWith(lang) || picked.lang.startsWith('en'))) return picked;
                }
                const ranked = voicesForLang(lang);
                return ranked[0] || voices.find(v => v.lang.startsWith(lang)) || voices[0] || null;
            };

            const setVoicePrefs = (next) => {
                voicePrefs = { ...voicePrefs, ...next };
                localStorage.setItem(VOICE_PREFS_KEY, JSON.stringify(voicePrefs));
            };

            const getVoicePrefs = () => ({ ...voicePrefs });

            const speakText = (text, accent = 'us', notify, options = {}) => {
                if (!text || !String(text).trim()) return;
                if (!('speechSynthesis' in window)) {
                    if (notify) notify("Speech synthesis is not supported in this browser.");
                    return;
                }
                window.speechSynthesis.cancel();
                const prefs = loadVoicePrefs();
                voicePrefs = prefs;
                const lang = langForAccent(accent);
                const uri = accent === 'uk' ? prefs.ukVoiceURI : prefs.usVoiceURI;
                const selectedVoice = resolveVoice(accent, uri);
                const utterance = new SpeechSynthesisUtterance(text);
                const isSentence = options.isSentence || String(text).length > 40;
                utterance.rate = isSentence ? 0.88 : 0.9;
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.lang = lang;
                window.speechSynthesis.speak(utterance);
            };

            if ('speechSynthesis' in window) {
                refreshVoices();
                window.speechSynthesis.onvoiceschanged = () => refreshVoices();
            }

            return {
                refreshVoices,
                getSpeechVoices,
                voicesForLang,
                rankVoice,
                resolveVoice,
                setVoicePrefs,
                getVoicePrefs,
                loadVoicePrefs,
                speakText,
                langForAccent,
                formatVoiceLabel,
                detectProvider,
                detectGender
            };
        })();

        const speakWord = (text, accent, notify, options) => SpeechEngine.speakText(text, accent, notify, options);

        const SpeakIcon = ({ accent, onClick, className = '', variant = 'default', primaryAudioBtn = false }) => {
            const isUs = accent === 'us';
            const base = variant === 'onDark'
                ? (isUs ? 'bg-white/20 hover:bg-white/30 text-white border-white/30' : 'bg-white/15 hover:bg-white/25 text-white border-white/30')
                : (isUs ? 'bg-blue-50 hover:bg-blue-100 text-blue-700 border-blue-200' : 'bg-purple-50 hover:bg-purple-100 text-purple-700 border-purple-200');
            return (
                <button
                    type="button"
                    {...(primaryAudioBtn && isUs ? { 'data-audio-btn': true } : {})}
                    onClick={(e) => { e.stopPropagation(); onClick?.(); }}
                    title={isUs ? 'US pronunciation' : 'UK pronunciation'}
                    className={`inline-flex items-center justify-center gap-0.5 min-w-[2rem] min-h-[2rem] px-1.5 py-1 text-[10px] font-bold rounded-lg border transition-colors ${base} ${className}`}
                >
                    <span aria-hidden="true">🔊</span>
                    <span>{isUs ? 'US' : 'UK'}</span>
                </button>
            );
        };

        const SpeakPair = ({ text, notify, variant = 'default', className = '', isSentence = false, primaryAudioBtn = false }) => {
            if (!text || !String(text).trim()) return null;

                <div className={`inline-flex items-center gap-1 ${className}`} onClick={(e) => e.stopPropagation()}>
                    <SpeakIcon accent="us" variant={variant} primaryAudioBtn={primaryAudioBtn} onClick={() => speakWord(text, 'us', notify, opts)} />
                    <SpeakIcon accent="uk" variant={variant} onClick={() => speakWord(text, 'uk', notify, opts)} />
                </div>
            );
        };

        const migrateMasteredToFamiliarity = (allMastered) => {
            const result = {};
            if (!allMastered || typeof allMastered !== 'object') return result;
            for (const bookId of Object.keys(allMastered)) {
                result[bookId] = {};
                (allMastered[bookId] || []).forEach((id) => {
                    result[bookId][id] = 'familiar';
                });
            }
            return result;
        };

        const getWordFamiliarityLevel = (bookMap, wordId) => {
            const v = bookMap && bookMap[wordId];
            if (v === 'semi' || v === 'familiar') return v;
            return 'unfamiliar';
        };

        const FamiliarityPicker = ({ level, onSet, compact = false }) => {
            const isNightMode = document.documentElement?.getAttribute('data-theme') === 'midnight';
            const items = [
                {
                    id: 'unfamiliar',
                    icon: '○',

                },
                {
                    id: 'semi',
                    icon: '◐',
                    title: 'Semi-familiar',
                    active: isNightMode
                        ? 'bg-amber-500/25 text-amber-200 border-amber-400 shadow-sm keep-accent'
                        : 'bg-amber-100 text-amber-800 border-amber-400 shadow-sm'
                },
                {
                    id: 'familiar',
                    icon: '●',
                    title: 'Familiar',
                    active: isNightMode
                        ? 'bg-emerald-500/25 text-emerald-200 border-emerald-400 shadow-sm keep-accent'

        const familiarityCardBorder = (level) => {
            if (level === 'familiar') return 'border-emerald-200 bg-emerald-50/40 border-l-4 border-l-emerald-500';
            if (level === 'semi') return 'border-amber-200 bg-amber-50/35 border-l-4 border-l-amber-400';
            return 'border-slate-200 border-l-4 border-l-slate-300';
        };

        // Sound engine using Web Audio API
        const SoundEngine = (() => {
            let ctx = null;
            let enabled = false;
            const getCtx = () => {
                if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
                return ctx;
            };
            const playTone = (freq, type, duration, vol=0.18) => {
                if (!enabled) return;
                try {
                    const ac = getCtx();
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.connect(gain); gain.connect(ac.destination);
                    osc.type = type; osc.frequency.setValueAtTime(freq, ac.currentTime);
                    gain.gain.setValueAtTime(vol, ac.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
                    osc.start(ac.currentTime); osc.stop(ac.currentTime + duration);
                } catch(e){}
            };
            return {
                setEnabled: (v) => { enabled = v; },
                correct: () => { playTone(523,  'sine', 0.12); setTimeout(()=>playTone(659,'sine',0.15),80); setTimeout(()=>playTone(784,'sine',0.2),160); },
                // Gentle descending "try again" cue instead of a harsh buzzer/rumble
                wrong:   () => { playTone(392, 'triangle', 0.14, 0.12); setTimeout(()=>playTone(311, 'triangle', 0.18, 0.1), 90); },
                combo:   () => { playTone(880, 'sine', 0.08, 0.12); setTimeout(()=>playTone(1046,'sine',0.12,0.15),60); },
                levelUp: () => { [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,'sine',0.18,0.18),i*90)); },
                tick:    () => { playTone(440, 'square', 0.05, 0.05); }
            };
        })();

        function ModernVocabGame({ wordPool, showBangla, triggerToast, onVictoryXP, isVariantMode, appTheme, onThemeChange, shortcuts }) {
            const [gameMode, setGameMode] = useState('menu'); // 'menu','classic','speed','match','fillin','truefalse','scramble'
            const [gameState, setGameState] = useState('idle'); // 'idle','playing','summary','paused'
            const [score, setScore] = useState(0);
            const [combo, setCombo] = useState(0);
            const [maxCombo, setMaxCombo] = useState(0);
            const [lives, setLives] = useState(5);
            const [currentQuestion, setCurrentQuestion] = useState(null);
            const [options, setOptions] = useState([]);
            const [selectedAnswer, setSelectedAnswer] = useState(null);
            const [feedbackType, setFeedbackType] = useState(null); // 'correct','wrong'
            const [xpEarned, setXpEarned] = useState(0);
            const [missedWords, setMissedWords] = useState([]);
            const [questionsAnswered, setQuestionsAnswered] = useState(0);
            const [isImmersive, setIsImmersive] = useState(false);
            const [gameTheme, setGameTheme] = useState(appTheme || 'midnight');
            const [soundOn, setSoundOn] = useState(false);
            const [showLevelUp, setShowLevelUp] = useState(false);
            const [xpPopVal, setXpPopVal] = useState(null);
            const [shakeWrong, setShakeWrong] = useState(false);

            // Speed Round
            const [timeLeft, setTimeLeft] = useState(60);
            const timerRef = useRef(null);

            // Word Match
            const [matchWords, setMatchWords] = useState([]);
            const [matchMeanings, setMatchMeanings] = useState([]);
            const [selectedMatchWord, setSelectedMatchWord] = useState(null);
            const [selectedMatchMeaning, setSelectedMatchMeaning] = useState(null);
            const [matchedPairs, setMatchedPairs] = useState([]);
            const [matchWrongPair, setMatchWrongPair] = useState(null);

            // Fill in blank
            const [fillOptions, setFillOptions] = useState([]);
            const [fillQuestion, setFillQuestion] = useState(null);

            // True / False
            const [tfQuestion, setTfQuestion] = useState(null);

            // Scramble
            const [scrambleQuestion, setScrambleQuestion] = useState(null);
            const [scrambleOptions, setScrambleOptions] = useState([]);

            const containerRef = useRef(null);

            useEffect(() => { SoundEngine.setEnabled(soundOn); }, [soundOn]);
            useEffect(() => { if (appTheme) setGameTheme(appTheme); }, [appTheme]);

            const getPool = useCallback(() => {
                if (!wordPool || wordPool.length < 4) return [];
                return wordPool;
            }, [wordPool]);

            const makeQuestion = useCallback((pool) => {
                if (!pool || pool.length < 4) return null;
                const target = pool[Math.floor(Math.random() * pool.length)];
                const distractors = pool.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                return { target, options: [...distractors, target].sort(() => 0.5 - Math.random()) };
            }, []);

            const scrambleWord = (word) => {
                const chars = String(word || '').split('');
                if (chars.length < 2) return chars.join('');
                let out = chars.slice();
                for (let i = 0; i < 12; i++) {
                    out = out.sort(() => 0.5 - Math.random());
                    if (out.join('').toLowerCase() !== String(word).toLowerCase()) break;
                }
                return out.join('');
            };

            const startMatchRound = (pool) => {
                const sample = (pool || getPool()).sort(() => 0.5 - Math.random()).slice(0, 6);
                setMatchWords(sample.sort(() => 0.5 - Math.random()));
                setMatchMeanings(sample.map(w=>({id:w.id, meaning:w.meaning})).sort(() => 0.5 - Math.random()));
                setMatchedPairs([]); setSelectedMatchWord(null); setSelectedMatchMeaning(null); setMatchWrongPair(null);
            };

            const startFillIn = (pool) => {
                const p = pool || getPool();
                const withSentence = p.filter(w => w.sentence && w.sentence.toLowerCase().includes(String(w.word || '').toLowerCase()));
                const target = (withSentence.length ? withSentence : p)[Math.floor(Math.random() * (withSentence.length || p.length))];
                const distractors = p.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                const blankedSentence = target.sentence
                    ? target.sentence.replace(new RegExp(target.word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '_____')
                    : `What is the meaning of "${target.word}"?`;
                setFillQuestion({ target, sentence: blankedSentence });
                setFillOptions([...distractors.map(w=>({id:w.id, word:w.word})), {id:target.id, word:target.word}].sort(()=>0.5-Math.random()));
                setSelectedAnswer(null); setFeedbackType(null);
            };

            const startTrueFalse = (pool) => {
                const p = pool || getPool();
                const target = p[Math.floor(Math.random() * p.length)];
                const isTrue = Math.random() > 0.45;
                let shownMeaning = target.meaning;
                if (!isTrue) {
                    const other = p.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random())[0];
                    shownMeaning = other?.meaning || target.meaning;
                }
                setTfQuestion({ target, shownMeaning, isTrue });
                setSelectedAnswer(null); setFeedbackType(null);
            };

            const startScramble = (pool) => {
                const p = pool || getPool();
                const eligible = p.filter(w => String(w.word || '').length >= 3);
                const target = (eligible.length ? eligible : p)[Math.floor(Math.random() * (eligible.length || p.length))];
                const distractors = p.filter(w => w.id !== target.id).sort(() => 0.5 - Math.random()).slice(0, 3);
                setScrambleQuestion({ target, scrambled: scrambleWord(target.word) });
                setScrambleOptions([...distractors, target].sort(() => 0.5 - Math.random()));
                setSelectedAnswer(null); setFeedbackType(null);
            };

            const startGame = (mode) => {
                const pool = getPool();
                if (!pool.length) { triggerToast("Need at least 4 words to play!"); return; }
                setGameMode(mode);
                setGameState('playing');
                setScore(0); setCombo(0); setMaxCombo(0); setXpEarned(0);
                setMissedWords([]); setQuestionsAnswered(0);
                setSelectedAnswer(null); setFeedbackType(null);

                if (mode === 'classic') {
                    setLives(5);
                    const q = makeQuestion(pool);
                    setCurrentQuestion(q.target); setOptions(q.options);
                } else if (mode === 'speed') {
                    setLives(999); setTimeLeft(60);
                    const q = makeQuestion(pool);
                    setCurrentQuestion(q.target); setOptions(q.options);
                } else if (mode === 'match') {
                    startMatchRound(pool);
                } else if (mode === 'fillin') {
                    setLives(5);
                    startFillIn(pool);
                } else if (mode === 'truefalse') {
                    setLives(5);
                    startTrueFalse(pool);
                } else if (mode === 'scramble') {
                    setLives(5);
                    startScramble(pool);
                }
            };

            // Speed timer
            useEffect(() => {
                if (gameMode === 'speed' && gameState === 'playing') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) { clearInterval(timerRef.current); endGame(); return 0; }
                            if (prev <= 10) SoundEngine.tick();
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [gameMode, gameState]);

            const endGame = () => {
                setGameState('summary');
                clearInterval(timerRef.current);
            };

            const awardXP = (amount) => {
                setXpEarned(prev => prev + amount);
                setXpPopVal('+' + amount + ' XP');
                if (onVictoryXP) onVictoryXP(amount);
                setTimeout(() => setXpPopVal(null), 900);
            };

            const handleAnswer = (chosenOpt) => {
                if (selectedAnswer !== null) return;
                setSelectedAnswer(chosenOpt.id);
                const pool = getPool();
                const isCorrect = chosenOpt.id === currentQuestion.id;

                if (isCorrect) {
                    setFeedbackType('correct');
                    SoundEngine.correct();
                    const newCombo = combo + 1;
                    setCombo(newCombo);
                    if (newCombo > maxCombo) setMaxCombo(newCombo);
                    if (newCombo > 0 && newCombo % 3 === 0) SoundEngine.combo();
                    const xp = 10 + (newCombo >= 3 ? newCombo * 3 : 0);
                    awardXP(xp);
                    setScore(prev => prev + xp);
                    setQuestionsAnswered(prev => prev + 1);
                    if (gameMode === 'classic' && questionsAnswered + 1 >= 10) {
                        setTimeout(() => endGame(), 1200);
                    } else {
                        setTimeout(() => {
                            const q = makeQuestion(pool);
                            if (q) { setCurrentQuestion(q.target); setOptions(q.options); }
                            setSelectedAnswer(null); setFeedbackType(null);
                        }, 1000);
                    }
                } else {
                    setFeedbackType('wrong');
                    setShakeWrong(true);
                    setTimeout(() => setShakeWrong(false), 500);
                    SoundEngine.wrong();
                    setCombo(0);
                    setMissedWords(prev => [...prev, currentQuestion]);
                    setQuestionsAnswered(prev => prev + 1);
                    const newLives = lives - 1;
                    setLives(newLives);
                    if (newLives <= 0 || (gameMode === 'classic' && questionsAnswered + 1 >= 10)) {
                        setTimeout(() => endGame(), 1200);
                    } else {
                        setTimeout(() => {
                            const q = makeQuestion(pool);
                            if (q) { setCurrentQuestion(q.target); setOptions(q.options); }
                            setSelectedAnswer(null); setFeedbackType(null);
                        }, 1100);
                    }
                }
            };

            const handleFillAnswer = (chosenOpt) => {
                if (selectedAnswer !== null) return;
                setSelectedAnswer(chosenOpt.id);
                const isCorrect = chosenOpt.id === fillQuestion.target.id;
                if (isCorrect) {
                    setFeedbackType('correct'); SoundEngine.correct();
                    const newCombo = combo + 1; setCombo(newCombo);
                    if (newCombo > maxCombo) setMaxCombo(newCombo);
                    awardXP(12 + (newCombo >= 3 ? newCombo * 3 : 0));
                    setScore(prev => prev + 12); setQuestionsAnswered(prev => prev + 1);
                } else {
                    setFeedbackType('wrong'); SoundEngine.wrong();
                    setCombo(0); setMissedWords(prev => [...prev, fillQuestion.target]);
                    setQuestionsAnswered(prev => prev + 1);
                    const newLives = lives - 1; setLives(newLives);
                    if (newLives <= 0) { setTimeout(()=>endGame(), 900); }
                }
            };

            const continueFillIn = () => {
                if (lives <= 0) { endGame(); return; }
                startFillIn(getPool());
            };

            const handleTfAnswer = (guessTrue) => {
                if (selectedAnswer !== null || !tfQuestion) return;
                setSelectedAnswer(guessTrue ? 'true' : 'false');
                const isCorrect = guessTrue === tfQuestion.isTrue;
                const pool = getPool();
                if (isCorrect) {
                    setFeedbackType('correct'); SoundEngine.correct();
                    const newCombo = combo + 1; setCombo(newCombo);
                    if (newCombo > maxCombo) setMaxCombo(newCombo);
                    awardXP(10 + (newCombo >= 3 ? newCombo * 2 : 0));
                    setScore(prev => prev + 10); setQuestionsAnswered(prev => prev + 1);
                    setTimeout(() => startTrueFalse(pool), 1000);
                } else {
                    setFeedbackType('wrong'); SoundEngine.wrong();
                    setCombo(0); setMissedWords(prev => [...prev, tfQuestion.target]);
                    setQuestionsAnswered(prev => prev + 1);
                    const newLives = lives - 1; setLives(newLives);
                    if (newLives <= 0) setTimeout(() => endGame(), 1100);
                    else setTimeout(() => startTrueFalse(pool), 1100);
                }
            };

            const handleScrambleAnswer = (chosen) => {
                if (selectedAnswer !== null || !scrambleQuestion) return;
                setSelectedAnswer(chosen.id);
                const isCorrect = chosen.id === scrambleQuestion.target.id;
                const pool = getPool();
                if (isCorrect) {
                    setFeedbackType('correct'); SoundEngine.correct();
                    const newCombo = combo + 1; setCombo(newCombo);
                    if (newCombo > maxCombo) setMaxCombo(newCombo);
                    awardXP(12 + (newCombo >= 3 ? newCombo * 3 : 0));
                    setScore(prev => prev + 12); setQuestionsAnswered(prev => prev + 1);
                    setTimeout(() => startScramble(pool), 1000);
                } else {
                    setFeedbackType('wrong'); SoundEngine.wrong();
                    setCombo(0); setMissedWords(prev => [...prev, scrambleQuestion.target]);
                    setQuestionsAnswered(prev => prev + 1);
                    const newLives = lives - 1; setLives(newLives);
                    if (newLives <= 0) setTimeout(() => endGame(), 1100);
                    else setTimeout(() => startScramble(pool), 1100);
                }
            };

            // Word Match logic
            const handleMatchWord = (w) => {
                if (matchedPairs.includes(w.id)) return;
                setSelectedMatchWord(w);
                if (selectedMatchMeaning) checkMatchPair(w, selectedMatchMeaning);
            };
            const handleMatchMeaning = (m) => {
                if (matchedPairs.includes(m.id)) return;
                setSelectedMatchMeaning(m);
                if (selectedMatchWord) checkMatchPair(selectedMatchWord, m);
            };
            const checkMatchPair = (word, meaning) => {
                if (word.id === meaning.id) {
                    SoundEngine.correct();
                    const newPairs = [...matchedPairs, word.id];
                    setMatchedPairs(newPairs);
                    awardXP(15); setScore(prev => prev + 15); setCombo(prev => { const n=prev+1; if(n>maxCombo)setMaxCombo(n); return n; });
                    setSelectedMatchWord(null); setSelectedMatchMeaning(null);
                    if (newPairs.length === matchWords.length) {
                        setTimeout(() => {
                            SoundEngine.levelUp();
                            const pool = getPool();
                            startMatchRound(pool);
                        }, 800);
                    }
                } else {
                    SoundEngine.wrong();
                    setMatchWrongPair({ word: word.id, meaning: meaning.id });
                    setCombo(0);
                    setTimeout(() => { setMatchWrongPair(null); setSelectedMatchWord(null); setSelectedMatchMeaning(null); }, 700);
                }
            };

            const toggleFocusMode = () => {
                setIsImmersive(prev => !prev);
            };
            useEffect(() => {
                const keys = shortcuts || DEFAULT_SHORTCUTS;
                const matches = (e, combo) => {
                    if (!combo) return false;
                    const parts = combo.split('+').map(p => p.trim());
                    const keyPart = parts[parts.length - 1];
                    const wantCtrl = parts.includes('Ctrl');
                    const wantShift = parts.includes('Shift');
                    const wantAlt = parts.includes('Alt');
                    if (wantCtrl !== e.ctrlKey || wantShift !== e.shiftKey || wantAlt !== e.altKey) return false;
                    if (keyPart === 'Space') return e.code === 'Space';
                    return e.key === keyPart;
                };
                const handleKeyDown = (e) => {
                    const tag = document.activeElement?.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                    if (matches(e, keys.exit) && isImmersive) setIsImmersive(false);
                    if (matches(e, keys.submit)) { const btn = document.querySelector('[data-submit-btn]'); btn?.click(); }
                    if (matches(e, keys.replay)) { e.preventDefault(); const btn = document.querySelector('[data-audio-btn]'); btn?.click(); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isImmersive, shortcuts]);

            const activeTheme = {
                shell: 'focus-overlay text-[color:var(--text-primary)]',
                card: 'bg-[color:var(--surface-0)] border-[color:var(--border-c)] text-[color:var(--text-primary)]',
                button: 'bg-[color:var(--surface-2)] text-[color:var(--text-primary)] border-[color:var(--border-c)] hover:opacity-80',
                muted: 'text-[color:var(--text-muted)]'
            };

            const wrapClass = isImmersive
                ? `fixed inset-0 z-[60] overflow-auto p-4 sm:p-8 ${activeTheme.shell} transition-all ease-in-out duration-200`
                : '';

            const SoundToggle = ({ className = '' }) => (
                <button
                    type="button"
                    title={soundOn ? 'Sound on' : 'Sound off'}
                    onClick={() => setSoundOn(s => !s)}
                    className={`w-9 h-9 inline-flex items-center justify-center rounded-xl text-sm border transition-all ${soundOn ? 'bg-amber-100 text-amber-700 border-amber-300' : 'bg-slate-100 text-slate-500 border-slate-200'} ${className}`}
                >
                    <span aria-hidden="true">{soundOn ? '🔊' : '🔇'}</span>
                </button>
            );

            const ThemeMini = () => (
                <div className={`flex items-center gap-1 rounded-xl border p-1 ${isImmersive ? 'border-white/20 bg-white/10' : 'border-slate-300 bg-slate-50 shadow-sm'}`}>
                    {['midnight','light'].map((themeId) => (
                        <button key={themeId} onClick={() => { setGameTheme(themeId); onThemeChange?.(themeId); }} className={`px-2 py-1 rounded-lg text-[10px] font-bold capitalize ${gameTheme === themeId ? 'bg-indigo-600 text-white' : isImmersive ? 'text-slate-200 hover:bg-white/10' : 'text-slate-600 hover:bg-slate-100'}`}>
                            {themeId === 'midnight' ? '🌙' : '☀️'}
                        </button>
                    ))}
                </div>
            );

            const FocusControls = () => (
                <div className="flex items-center gap-2 flex-wrap">
                    <SoundToggle />
                    <ThemeMini />
                    <button
                        type="button"
                        onClick={toggleFocusMode}
                        title={isImmersive ? 'Exit focus' : 'Focus mode'}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold border transition-all ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 hover:bg-slate-200 text-slate-600 border-slate-200'}`}
                    >
                        {isImmersive ? '🧘 Focus' : '🖥️ Focus'}
                    </button>
                    {isImmersive && (
                        <button
                            type="button"
                            onClick={() => setIsImmersive(false)}
                            className="px-3 py-1.5 rounded-xl text-xs font-bold border bg-white/90 text-slate-800 border-slate-200 shadow-sm hover:bg-white"
                        >
                            ✕ Exit
                        </button>
                    )}
                </div>
            );

            const LivesBar = ({count}) => (
                <div className="flex gap-1 items-center">
                    {Array.from({length:5}).map((_,i) => (
                        <span key={i} className={`text-lg transition-all ${i < count ? 'opacity-100' : 'opacity-20 grayscale'}`}>❤️</span>
                    ))}
                </div>
            );

            const ComboBar = () => combo >= 2 ? (
                <div className={`flex items-center justify-center gap-2 py-1 px-3 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 text-xs font-black ${combo>=3?'combo-flash':''}`}>
                    🔥 {combo}x COMBO {combo>=5?'🔥':''}
                </div>
            ) : null;

            const FocusShell = ({ children, className = '' }) => (
                <div ref={containerRef} className={`${wrapClass} ${className}`}>
                    {isImmersive ? (
                        <div className="focus-stage space-y-4 py-2">
                            <div className="flex items-center justify-between gap-3 flex-wrap pb-2 border-b border-slate-200/40">
                                <div className="flex items-center gap-3 flex-wrap">
                                    <div className="text-sm font-black opacity-80">Word Quest · Focus</div>
                                    {gameState === 'playing' && (
                                        <div className="flex items-center gap-2 text-xs font-bold">
                                            <span className="px-2 py-1 rounded-lg bg-amber-50 text-amber-700 border border-amber-200">⭐ {score}</span>
                                            {gameMode !== 'match' && gameMode !== 'speed' && lives < 900 && (
                                                <span className="px-2 py-1 rounded-lg bg-rose-50 text-rose-700 border border-rose-200">❤️ {lives}</span>
                                            )}
                                            {gameMode === 'speed' && (
                                                <span className={`px-2 py-1 rounded-lg border ${timeLeft<=10?'bg-red-50 text-red-600 border-red-300':'bg-sky-50 text-sky-700 border-sky-200'}`}>⏱ {timeLeft}s</span>
                                            )}
                                        </div>
                                    )}
                                </div>
                                <div className="flex items-center gap-2">
                                    <FocusControls />
                                    <button
                                        type="button"
                                        onClick={() => { setIsImmersive(false); setGameState('idle'); setGameMode('menu'); clearInterval(timerRef.current); }}
                                        className="px-3 py-1.5 rounded-xl text-xs font-bold border bg-slate-900 text-white border-slate-700 hover:opacity-90"
                                    >
                                        ☰ Menu
                                    </button>
                                </div>
                            </div>
                            {children}
                        </div>
                    ) : children}
                </div>
            );

            // MENU
            if (gameState === 'idle') return (
                <FocusShell className={!isImmersive ? 'space-y-6 tab-panel-enter' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-3">
                            <h2 className={`text-xl font-black flex items-center gap-2 ${appTheme === 'light' ? 'text-slate-800' : 'text-white'}`}>🎮 Word Quest</h2>
                            <FocusControls />
                        </div>
                    )}
                    {isImmersive && (
                        <h2 className="text-2xl font-black text-center mb-2">🎮 Choose a challenge</h2>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        {[
                            { mode:'classic', icon:'⚔️', title:'Classic Battle', desc:'Answer 10 questions with 5 lives. Combo for bonus XP!', color:'from-indigo-600 to-blue-700' },
                            { mode:'speed', icon:'⚡', title:'Speed Round', desc:'Answer as many as you can in 60 seconds!', color:'from-sky-600 to-indigo-700' },
                            { mode:'match', icon:'🔗', title:'Word Match', desc:'Match words to their meanings, Quizlet style!', color:'from-emerald-600 to-teal-700' },
                            { mode:'fillin', icon:'✏️', title:'Fill in the Blank', desc:'A sentence appears — pick the missing word!', color:'from-purple-600 to-violet-700' },
                            { mode:'truefalse', icon:'✅', title:'True or False', desc:'Decide if the meaning shown for a word is correct!', color:'from-rose-600 to-orange-600' },
                            { mode:'scramble', icon:'🔤', title:'Word Scramble', desc:'Unscramble the letters and pick the right word!', color:'from-cyan-600 to-blue-700' },
                        ].map(m => (
                            <button key={m.mode} onClick={()=>startGame(m.mode)} className={`bg-gradient-to-br ${m.color} text-white rounded-2xl p-5 text-left shadow-lg hover:scale-[1.02] active:scale-95 transition-all space-y-1`}>
                                <div className="text-2xl">{m.icon}</div>
                                <div className="font-black text-base">{m.title}</div>
                                <div className="text-xs opacity-80">{m.desc}</div>
                            </button>
                        ))}
                    </div>
                    {wordPool && wordPool.length < 4 && (
                        <div className="text-center py-6 bg-amber-50 rounded-xl border border-amber-200 text-amber-700 text-sm font-semibold">⚠️ Add at least 4 words to start playing!</div>
                    )}
                </FocusShell>
            );

            // SUMMARY SCREEN
            if (gameState === 'summary') return (
                <FocusShell className={!isImmersive ? 'space-y-6 tab-panel-enter max-w-lg mx-auto' : 'tab-panel-enter'}>
                    <div className="bg-gradient-to-br from-indigo-900 to-slate-900 rounded-2xl p-8 text-white text-center space-y-4 shadow-xl">
                        <div className="text-5xl victory-bounce inline-block">🎉</div>
                        <h2 className="text-2xl font-black">Round Complete!</h2>
                        <div className="grid grid-cols-3 gap-3 text-center">
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-amber-300">{score}</div><div className="text-xs opacity-70">Score</div></div>
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-emerald-300">{xpEarned}</div><div className="text-xs opacity-70">XP Earned</div></div>
                            <div className="bg-white/10 rounded-xl p-3"><div className="text-2xl font-black text-purple-300">{maxCombo}x</div><div className="text-xs opacity-70">Best Combo</div></div>
                        </div>
                        <div className="bg-white/10 rounded-xl p-3 text-left space-y-1">
                            <div className="text-xs font-bold uppercase tracking-wider opacity-60 mb-2">Session Stats</div>
                            <div className="flex justify-between text-sm"><span>Questions Answered</span><span className="font-bold">{questionsAnswered}</span></div>
                            <div className="flex justify-between text-sm"><span>Words Missed</span><span className={`font-bold ${missedWords.length>0?'text-red-300':'text-emerald-300'}`}>{missedWords.length}</span></div>
                            <div className="flex justify-between text-sm"><span>Accuracy</span><span className="font-bold">{questionsAnswered>0?Math.round(((questionsAnswered-missedWords.length)/questionsAnswered)*100):0}%</span></div>
                        </div>
                        {missedWords.length > 0 && (
                            <div className="bg-red-900/30 rounded-xl p-3 text-left border border-red-500/20">
                                <div className="text-xs font-bold text-red-300 mb-2">📝 Review These Words:</div>
                                <div className="flex flex-wrap gap-1">{missedWords.slice(0,8).map(w=><span key={w.id} className="text-xs bg-red-800/40 text-red-200 px-2 py-0.5 rounded-full">{w.word}</span>)}</div>
                            </div>
                        )}
                    </div>
                    <div className="flex gap-3">
                        <button onClick={()=>startGame(gameMode)} className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-xl shadow transition-all">🔄 Play Again</button>
                        <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl border border-slate-200 transition-all">🏠 Main Menu</button>
                    </div>
                </FocusShell>
            );

            // WORD MATCH MODE
            if (gameMode === 'match' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-4 tab-panel-enter' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <div className="flex items-center gap-3">
                                <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                                <span className="text-sm font-black text-emerald-700">🔗 Word Match</span>
                            </div>
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score} pts</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}
                    <p className="text-xs text-center text-slate-500 font-medium">Tap a word, then tap its matching meaning</p>
                    <div className="grid grid-cols-2 gap-3">
                        <div className="space-y-2">
                            <div className="text-xs font-bold text-emerald-600 uppercase tracking-wider text-center">Words</div>
                            {matchWords.map(w => {
                                const isMatched = matchedPairs.includes(w.id);
                                const isSelected = selectedMatchWord?.id === w.id;
                                const isWrong = matchWrongPair?.word === w.id;
                                return (
                                    <button key={w.id} disabled={isMatched} onClick={()=>handleMatchWord(w)}
                                        className={`match-tile w-full p-3 rounded-xl text-sm font-bold border transition-all text-left ${isMatched?'bg-emerald-100 text-emerald-700 border-emerald-300 opacity-70':isWrong?'bg-red-100 text-red-700 border-red-300 wrong-shake':isSelected?'bg-emerald-600 text-white border-emerald-400 shadow-lg':'bg-gradient-to-r from-emerald-50 to-teal-50 text-emerald-900 border-emerald-200 hover:border-emerald-400 hover:from-emerald-100 hover:to-teal-100'}`}>
                                        <span className="line-clamp-2">{isMatched?'✓ ':''}{w.word}</span>
                                    </button>
                                );
                            })}
                        </div>
                        <div className="space-y-2">
                            <div className="text-xs font-bold text-teal-600 uppercase tracking-wider text-center">Meanings</div>
                            {matchMeanings.map(m => {
                                const isMatched = matchedPairs.includes(m.id);
                                const isSelected = selectedMatchMeaning?.id === m.id;
                                const isWrong = matchWrongPair?.meaning === m.id;
                                return (
                                    <button key={m.id} disabled={isMatched} onClick={()=>handleMatchMeaning(m)}
                                        className={`match-tile w-full p-3 rounded-xl text-xs border transition-all text-left ${isMatched?'bg-emerald-100 text-emerald-700 border-emerald-300 opacity-70':isWrong?'bg-red-100 text-red-700 border-red-300 wrong-shake':isSelected?'bg-teal-600 text-white border-teal-400 shadow-lg':'bg-gradient-to-r from-teal-50 to-emerald-50 text-slate-700 border-teal-200 hover:border-teal-400 hover:from-teal-100 hover:to-emerald-100'}`}>
                                        <span className="line-clamp-3">{isMatched?'✓ ':''}{m.meaning}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    {xpPopVal && <div className="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // FILL IN THE BLANK MODE
            if (gameMode === 'fillin' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 tab-panel-enter max-w-xl mx-auto' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}
                    {fillQuestion && (
                        <div className="space-y-4">
                            <div className={`bg-gradient-to-br from-purple-600 to-violet-700 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl ${shakeWrong?'wrong-shake':''}`}>
                                <div className="text-xs font-bold text-purple-100 uppercase tracking-wider">Fill in the blank:</div>
                                <p className="text-lg font-bold text-white leading-relaxed italic">"{fillQuestion.sentence}"</p>
                                {selectedAnswer !== null && (
                                    <div className="flex justify-center pt-1">
                                        <SpeakPair text={fillQuestion.target.sentence || fillQuestion.target.word} notify={triggerToast} variant="onDark" isSentence={!!fillQuestion.target.sentence} primaryAudioBtn />
                                    </div>
                                )}
                                {feedbackType === 'correct' && <div className="text-emerald-200 font-black text-sm">✅ Correct!</div>}
                                {feedbackType === 'wrong' && <div className="text-red-200 font-black text-sm">❌ Answer: <span className="underline">{fillQuestion.target.word}</span></div>}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {fillOptions.map((opt,i) => {
                                    const isSelected = selectedAnswer === opt.id;
                                    const isCorrect = opt.id === fillQuestion.target.id;
                                    let style = 'bg-white text-slate-700 border-slate-200 hover:border-purple-400 hover:bg-purple-50';
                                    if (selectedAnswer !== null) {
                                        if (isCorrect) style = 'bg-emerald-600 text-white border-emerald-400 font-bold ring-2 ring-emerald-300';
                                        else if (isSelected) style = 'bg-red-600 text-white border-red-400';
                                    }
                                    return <button key={i} disabled={selectedAnswer!==null} onClick={()=>handleFillAnswer(opt)} className={`p-3.5 rounded-xl border text-sm font-semibold transition-all ${style}`}>{opt.word}</button>;
                                })}
                            </div>
                            {selectedAnswer !== null && lives > 0 && (
                                <button type="button" onClick={continueFillIn} className="w-full py-3 bg-purple-600 hover:bg-purple-700 text-white font-bold rounded-xl shadow transition-all">
                                    Continue →
                                </button>
                            )}
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // TRUE OR FALSE
            if (gameMode === 'truefalse' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 tab-panel-enter max-w-xl mx-auto' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border bg-slate-100 text-slate-500 border-slate-200`}>🖥️</button>
                            </div>
                        </div>
                    )}
                    {tfQuestion && (
                        <div className="space-y-4">
                            <div className={`bg-gradient-to-br from-rose-600 to-orange-600 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl ${shakeWrong?'wrong-shake':''}`}>
                                <div className="text-xs font-bold text-rose-100 uppercase tracking-wider">True or False?</div>
                                <h2 className="text-3xl font-black">{tfQuestion.target.word}</h2>
                                <p className="text-base font-medium bg-white/15 rounded-xl px-4 py-3 border border-white/20">means: “{tfQuestion.shownMeaning}”</p>
                                {feedbackType === 'wrong' && <div className="text-sm font-bold text-rose-100">Correct meaning: {tfQuestion.target.meaning}</div>}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {[
                                    { id: true, label: 'True', style: 'from-emerald-500 to-emerald-600' },
                                    { id: false, label: 'False', style: 'from-red-500 to-rose-600' }
                                ].map(opt => {
                                    const picked = selectedAnswer !== null && ((selectedAnswer === 'true') === opt.id);
                                    const reveal = selectedAnswer !== null;
                                    const correctPick = opt.id === tfQuestion.isTrue;
                                    let cls = `bg-gradient-to-br ${opt.style} text-white border-transparent`;
                                    if (reveal) {
                                        if (correctPick) cls = 'bg-emerald-600 text-white border-emerald-400 ring-2 ring-emerald-300';
                                        else if (picked) cls = 'bg-red-600 text-white border-red-400';
                                        else cls = 'bg-slate-100 text-slate-400 border-slate-200';
                                    }
                                    return (
                                        <button key={String(opt.id)} disabled={selectedAnswer!==null} onClick={() => handleTfAnswer(opt.id)} className={`py-4 rounded-xl border text-base font-black transition-all ${cls}`}>
                                            {opt.label}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // WORD SCRAMBLE
            if (gameMode === 'scramble' && gameState === 'playing') return (
                <FocusShell className={!isImmersive ? 'space-y-5 tab-panel-enter max-w-xl mx-auto' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                <LivesBar count={lives}/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <ComboBar/>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border bg-slate-100 text-slate-500 border-slate-200`}>🖥️</button>
                            </div>
                        </div>
                    )}
                    {scrambleQuestion && (
                        <div className="space-y-4">
                            <div className={`bg-gradient-to-br from-cyan-600 to-blue-700 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl ${shakeWrong?'wrong-shake':''}`}>
                                <div className="text-xs font-bold text-cyan-100 uppercase tracking-wider">Unscramble the word</div>
                                <h2 className="text-3xl font-black tracking-[0.2em] uppercase">{scrambleQuestion.scrambled}</h2>
                                <p className="text-sm text-cyan-50/90 bg-white/10 rounded-xl px-3 py-2 border border-white/15">{scrambleQuestion.target.meaning}</p>
                                {feedbackType === 'wrong' && <div className="text-sm font-bold">Answer: {scrambleQuestion.target.word}</div>}
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                {scrambleOptions.map((opt,i) => {
                                    const isSelected = selectedAnswer === opt.id;
                                    const isCorrect = opt.id === scrambleQuestion.target.id;
                                    let style = 'bg-white text-slate-700 border-slate-200 hover:border-cyan-400 hover:bg-cyan-50';
                                    if (selectedAnswer !== null) {
                                        if (isCorrect) style = 'bg-emerald-600 text-white border-emerald-400 font-bold ring-2 ring-emerald-300';
                                        else if (isSelected) style = 'bg-red-600 text-white border-red-400';
                                    }
                                    return <button key={i} disabled={selectedAnswer!==null} onClick={()=>handleScrambleAnswer(opt)} className={`p-3.5 rounded-xl border text-sm font-semibold transition-all ${style}`}>{opt.word}</button>;
                                })}
                            </div>
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );

            // CLASSIC & SPEED ROUND PLAYING
            return (
                <FocusShell className={!isImmersive ? 'space-y-4 tab-panel-enter max-w-2xl mx-auto' : 'tab-panel-enter'}>
                    {!isImmersive && (
                        <div className="flex items-center justify-between flex-wrap gap-2">
                            <button onClick={()=>{setGameState('idle');setGameMode('menu');clearInterval(timerRef.current);}} className="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 border border-slate-200">← Menu</button>
                            <div className="flex items-center gap-2 flex-wrap">
                                {gameMode === 'classic' && <LivesBar count={lives}/>}
                                {gameMode === 'speed' && (
                                    <div className={`flex items-center gap-1 text-sm font-black px-3 py-1 rounded-xl border ${timeLeft<=10?'bg-red-50 text-red-600 border-red-300 timer-urgent':'bg-amber-50 text-amber-700 border-amber-200'}`}>
                                        ⏱ {timeLeft}s
                                    </div>
                                )}
                                <ComboBar/>
                                <span className="text-xs font-bold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">⭐ {score}</span>
                                <SoundToggle />
                                <ThemeMini />
                                <button onClick={toggleFocusMode} className={`px-2 py-1 rounded-lg text-xs border ${isImmersive ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-100 text-slate-500 border-slate-200'}`}>{isImmersive ? '🧘' : '🖥️'}</button>
                            </div>
                        </div>
                    )}

                    {gameMode === 'speed' && (
                        <div className="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                            <div className={`h-2 rounded-full transition-all duration-1000 ${timeLeft<=10?'bg-red-500':'bg-sky-500'}`} style={{width:`${(timeLeft/60)*100}%`}}></div>
                        </div>
                    )}

                    {currentQuestion && (
                        <div className={`bg-gradient-to-br from-indigo-900 to-slate-900 rounded-2xl p-6 text-white text-center space-y-3 shadow-xl ${shakeWrong?'wrong-shake':''}`}>
                            <div className="text-xs font-bold text-indigo-300 uppercase tracking-widest">
                                {gameMode === 'classic' ? `⚔️ Classic Battle — Q${questionsAnswered+1}/10` : '⚡ Speed Round — What does this mean?'}
                            </div>
                            <h2 className="text-3xl md:text-4xl font-black tracking-wide">{currentQuestion.word}</h2>
                            {currentQuestion.phonetics && (
                                <p className="text-indigo-300 font-mono text-sm bg-indigo-950/40 px-3 py-1 rounded-full border border-indigo-400/30 inline-block">[{currentQuestion.phonetics}]</p>
                            )}
                            <div className="flex justify-center">
                                <SpeakPair text={currentQuestion.word} notify={triggerToast} variant="onDark" primaryAudioBtn />
                            </div>
                            {feedbackType === 'correct' && <div className="text-emerald-300 font-black text-sm animate-bounce">✅ Correct! {combo>=3?`🔥 ${combo}x Combo!`:''}</div>}
                            {feedbackType === 'wrong' && <div className="text-red-300 font-black text-sm">❌ Missed! The answer was: <span className="underline">{currentQuestion.meaning}</span></div>}
                        </div>
                    )}

                    {currentQuestion && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                            {options.map((opt, idx) => {
                                const isSelected = selectedAnswer === opt.id;
                                const isCorrect = opt.id === currentQuestion.id;
                                let style = 'bg-white text-slate-700 border-slate-200 hover:border-indigo-400 hover:bg-indigo-50';
                                if (selectedAnswer !== null) {
                                    if (isCorrect) style = 'bg-emerald-600 text-white border-emerald-400 font-bold ring-2 ring-emerald-300';
                                    else if (isSelected) style = 'bg-red-600 text-white border-red-400';
                                }
                                return (
                                    <button key={idx} disabled={selectedAnswer !== null} onClick={() => handleAnswer(opt)}
                                        className={`p-4 rounded-xl border text-sm text-left transition-all flex flex-col gap-1 ${style}`}>
                                        <span className="font-semibold">{opt.meaning}</span>
                                        {showBangla && opt.bangla && <span className="text-xs opacity-75 font-medium">{opt.bangla}</span>}
                                    </button>
                                );
                            })}
                        </div>
                    )}
                    {xpPopVal && <div className="fixed top-1/3 left-1/2 transform -translate-x-1/2 text-2xl font-black text-emerald-400 xp-pop pointer-events-none z-50">{xpPopVal}</div>}
                </FocusShell>
            );
        }

        function App() {
            // BOOKS LIST STATE
            const [books, setBooks] = useState(() => {
                const saved = localStorage.getItem('wordsmart_custom_books_list');
                return saved ? JSON.parse(saved) : DEFAULT_BOOKS;
            });

            // ACTIVE SELECTED BOOK ID
            const [selectedBookId, setSelectedBookId] = useState(() => {
                return localStorage.getItem('wordsmart_active_book_id') || 'ws1';
            });

            // ALL WORDS STORED BY BOOK ID
            const [allWords, setAllWords] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_words_map');
                if (saved) return JSON.parse(saved);

                const savedWS1 = localStorage.getItem('wordsmart_data_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_data_ws2');
                return {
                    ws1: savedWS1 ? JSON.parse(savedWS1) : INITIAL_WS1_WORDS,
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                };
            });

            // One-time repair: earlier bulk imports could have created duplicate IDs,
            // which broke filtering/rendering for large word lists. Fix any leftover
            // duplicates in already-saved data, once, on load.
            useEffect(() => {
                setAllWords(prev => {
                    let changed = false;
                    const repaired = {};
                    for (const bookId in prev) {
                        const seen = new Set();
                        repaired[bookId] = (prev[bookId] || []).map((w, idx) => {
                            if (w.id == null || seen.has(w.id)) {
                                changed = true;
                                const newId = Date.now() * 10000 + idx + Math.floor(Math.random() * 10000);
                                seen.add(newId);
                                return { ...w, id: newId };
                            }
                            seen.add(w.id);
                            return w;
                        });
                    }
                    return changed ? repaired : prev;
                });
            }, []);

            const [allFamiliarity, setAllFamiliarity] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_familiarity_map');
                if (saved) return JSON.parse(saved);

                const savedMastered = localStorage.getItem('wordsmart_all_mastered_map');
                if (savedMastered) return migrateMasteredToFamiliarity(JSON.parse(savedMastered));

                const savedWS1 = localStorage.getItem('wordsmart_mastered_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_mastered_ws2');
                return migrateMasteredToFamiliarity({
                    ws1: savedWS1 ? JSON.parse(savedWS1) : [],
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                });
            });

            // TRASH BIN STORED BY BOOK ID
            const [allTrash, setAllTrash] = useState(() => {
                const saved = localStorage.getItem('wordsmart_all_trash_map');
                if (saved) return JSON.parse(saved);

                const savedWS1 = localStorage.getItem('wordsmart_trash_ws1');
                const savedWS2 = localStorage.getItem('wordsmart_trash_ws2');
                return {
                    ws1: savedWS1 ? JSON.parse(savedWS1) : [],
                    ws2: savedWS2 ? JSON.parse(savedWS2) : []
                };
            });

            // BANGLA TOGGLE SWITCH
            const [showBangla, setShowBangla] = useState(() => {
                const saved = localStorage.getItem('wordsmart_show_bangla');
                return saved !== null ? JSON.parse(saved) : true;
            });

            const [appTheme, setAppTheme] = useState(() => {
                const saved = localStorage.getItem('wordsmart_app_theme');
                return (saved && saved !== 'aurora') ? saved : 'light';
            });

            const [shortcuts, setShortcuts] = useState(() => {
                const saved = localStorage.getItem('wordsmart_shortcuts');
                return saved ? { ...DEFAULT_SHORTCUTS, ...JSON.parse(saved) } : DEFAULT_SHORTCUTS;
            });
            const [listeningForShortcut, setListeningForShortcut] = useState(null); // 'submit' | 'replay' | 'exit' | null
            useEffect(() => { localStorage.setItem('wordsmart_shortcuts', JSON.stringify(shortcuts)); }, [shortcuts]);
            useEffect(() => {
                if (!listeningForShortcut) return;
                const capture = (e) => {
                    e.preventDefault();
                    let combo = e.code === 'Space' ? 'Space' : (e.key.length === 1 ? e.key.toUpperCase() : e.key);
                    if (e.ctrlKey && combo !== 'Control') combo = 'Ctrl+' + combo;
                    if (e.shiftKey && combo !== 'Shift') combo = 'Shift+' + combo;
                    if (e.altKey && combo !== 'Alt') combo = 'Alt+' + combo;
                    setShortcuts(prev => ({ ...prev, [listeningForShortcut]: combo }));
                    setListeningForShortcut(null);
                };
                window.addEventListener('keydown', capture, { once: true });
                return () => window.removeEventListener('keydown', capture);
            }, [listeningForShortcut]);

            // Global shortcut handling for screens outside the Game tab
            // (flashcard flip in Study, submit in Quiz). Game-tab shortcuts
            // (submit/replay/exit while in Focus Mode) are handled inside
            // ModernVocabGame itself since that's where the relevant buttons live.
            useEffect(() => {
                const matches = (e, combo) => {
                    if (!combo) return false;
                    const parts = combo.split('+').map(p => p.trim());
                    const keyPart = parts[parts.length - 1];
                    const wantCtrl = parts.includes('Ctrl');
                    const wantShift = parts.includes('Shift');
                    const wantAlt = parts.includes('Alt');
                    if (wantCtrl !== e.ctrlKey || wantShift !== e.shiftKey || wantAlt !== e.altKey) return false;
                    if (keyPart === 'Space') return e.code === 'Space';
                    return e.key === keyPart;
                };
                const handleGlobalKeyDown = (e) => {
                    if (listeningForShortcut) return; // don't fire shortcuts while rebinding
                    const tag = document.activeElement?.tagName;
                    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                    if (matches(e, shortcuts.replay)) {
