    <!-- FIREBASE (Google Sign-In + Firestore cloud sync).
         Loaded as a real ES module (Firebase's modern SDK is module-only), then the
         pieces we need are hung off `window.FB` so the React app below — which runs
         inside a plain <script type="text/babel"> tag, not a module — can reach them.
         The React app never assumes this has finished yet: it waits for either
         `window.FB` to already exist, or the 'fb-ready' event if it hasn't loaded yet. -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import {
            getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc, collection, getDocs, writeBatch
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import {
            getDatabase, ref as dbRef, set as dbSet, update as dbUpdate, remove as dbRemove,
            onValue as dbOnValue, get as dbGet, onDisconnect as dbOnDisconnect
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBJDyyE1hE-hpnjvQ6bdaXt2byKcHCy1G8",
            authDomain: "vocab-app-7c6dd.firebaseapp.com",
            projectId: "vocab-app-7c6dd",
            storageBucket: "vocab-app-7c6dd.firebasestorage.app",
            messagingSenderId: "1008183025206",
            appId: "1:1008183025206:web:68f6b2fa74a4e0e54fc297"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const provider = new GoogleAuthProvider();
        const db = getFirestore(fbApp);

        // Realtime Database — used ONLY by the Multiplayer tab (live rooms).
        // If your Realtime Database lives in a non-default region, Firebase
        // console > Realtime Database shows its exact URL; paste it here.
        const RTDB_URL = "https://vocab-app-7c6dd-default-rtdb.firebaseio.com";
        let rtdb = null;
        try { rtdb = getDatabase(fbApp, RTDB_URL); } catch (e) { console.error('Realtime Database unavailable:', e); }

        window.FB = {
            auth, provider, db, signInWithPopup, signOut, onAuthStateChanged, doc, getDoc, setDoc, collection, getDocs, writeBatch,
            rtdb, dbRef, dbSet, dbUpdate, dbRemove, dbOnValue, dbGet, dbOnDisconnect
        };
        window.dispatchEvent(new Event('fb-ready'));
    </script>

        /* ===================== THEME SYSTEM ===================== */
        /* Single source of truth for colors. The same variables/rules apply
           everywhere — normal screens, settings, AND the Focus Mode overlay —
           so nothing ever looks different between them. */
        html[data-theme="light"] {
            --surface-0: #FFFFFF;
            --surface-1: #F8FAFC;
            --surface-2: #F1F5F9;
            --border-c: #E2E8F0;
            --text-primary: #1E293B;
            --text-muted: #64748B;
        }
        html[data-theme="midnight"] {
            --surface-0: #21232B;
            --surface-1: #2A2D38;
            --surface-2: #313543;
            --border-c: #3D3F5C;
            --text-primary: #E2E8F0;
            --text-muted: #94A3B8;
        }
        html[data-theme="aurora"] {
            --surface-0: #1F1435;
            --surface-1: #281B44;
            --surface-2: #32224F;
            --border-c: #4A3468;
            --text-primary: #E9D5FF;
            --text-muted: #C084FC;
        }
        html[data-theme] body {
            background-color: var(--surface-1);
            color: var(--text-primary);
        }
        /* Smooth theme transitions (kept short so large word grids stay snappy) */
        html[data-theme] body {
            transition: background-color 0.35s ease, color 0.35s ease;
        }
        html[data-theme] [class*="bg-"],
        html[data-theme] [class*="border-"],
        html[data-theme] [class*="text-"] {
            transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease;
        }
        /* Word list grid can hold hundreds of cards; animating all of them on
           theme switch causes jank, so make that grid's theme change instant. */
        .instant-theme, .instant-theme * {
            transition: none !important;

           quiz, manage, game, and the focus-mode overlay) shares one palette. */
        html[data-theme="midnight"] .bg-white:not(.keep-white),

        /* Word List (master-detail) row hover — Tailwind's hover: variants aren't
           covered by the general dark-theme remaps below (those only re-skin base
           classes), so hover would otherwise fall back to Tailwind's raw near-white
           color even in dark themes. This keeps hover the same tone as "selected". */
        /* Word List (master-detail) row hover — applies to the WHOLE box (a word plus
           its synonyms/antonyms together), not each line individually, and uses the
           exact same color as the "selected" state (bg-slate-100) so hover and
           selected never look like two different colors. Implemented as a plain CSS
           :hover rule (not a Tailwind hover: utility class) because this app's
           dark-theme system re-skins colors by matching substrings anywhere in an
           element's class attribute; a static "hover:bg-slate-100" class would match
           that substring check and get recolored PERMANENTLY, not just on hover. */
        .word-list-row-group:hover {

</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const DEFAULT_SHORTCUTS = {
            submit: 'Enter',
            replay: 'Space',
            exit: 'Escape',
            soundToggle: 'm',
            flashNext: 'ArrowRight',
            flashPrev: 'ArrowLeft'
        };

        // INITIAL VOCABULARY DATA WITH DUAL-MODE (STANDARD + VARIANT)
        const INITIAL_WS1_WORDS = [
            { id: 1, word: "Abase", phonetics: "uh-BAYS", meaning: "to humiliate", bangla: "অপমান করা / নীচু করা", sentence: "The king tried to abase his enemies by parading them through the streets.", variantMeaning: "to degrade or lower in status", variantBangla: "মর্যাদা হানিকর করা", variantSentence: "His harsh public criticism served only to abase his team." },
            { id: 2, word: "Abash", phonetics: "uh-BASH", meaning: "to embarrass", bangla: "বিব্রত করা / লজ্জিত করা", sentence: "She was abashed when she forgot her speech on stage.", variantMeaning: "to make someone feel ashamed or uncomfortable", variantBangla: "লজ্জিত বা অস্বস্তিতে ফেলা", variantSentence: "The unexpected question seemed to abash the presenter for a second." },
            { id: 3, word: "Abate", phonetics: "uh-BAYT", meaning: "to reduce", bangla: "হ্রাস করা / কমানো", sentence: "The storm finally abated after three days.", variantMeaning: "to become less intense or widespread", variantBangla: "তীব্রতা কমানো", variantSentence: "We waited inside until the heavy rain began to abate." },
            { id: 4, word: "Abdicate", phonetics: "AB-dih-kayt", meaning: "to step down from a position of power", bangla: "ক্ষমতা ছেড়ে দেওয়া / পদত্যাগ করা", sentence: "The king abdicated his throne to marry a commoner.", variantMeaning: "to formally give up a responsibility or duty", variantBangla: "দায়িত্ব বা পদ পরিহার করা", variantSentence: "The CEO decided to abdicate his duties following the financial crisis." },
            { id: 5, word: "Aberration", phonetics: "ab-uh-RAY-shun", meaning: "something not typical", bangla: "স্বাভাবিকের ব্যতিক্রম / বিচ্যুতি", sentence: "His rude behavior was an aberration from his usual kindness.", variantMeaning: "a departure from what is normal or expected", variantBangla: "স্বাভাবিকতার ব্যাঘাত", variantSentence: "The system glitch was merely a temporary aberration in performance." },
            { id: 6, word: "Abet", phonetics: "uh-BET", meaning: "to support or encourage someone who has done wrong", bangla: "অপকর্মে সহায়তা করা", sentence: "He was jailed for abetting the criminal.", variantMeaning: "to assist or encourage in an activity", variantBangla: "সাহায্য প্রদান করা", variantSentence: "Ignoring safety protocols will only abet potential accidents." },
            { id: 7, word: "Abeyance", phonetics: "uh-BAY-unce", meaning: "suspension", bangla: "স্থগিত অবস্থা / বিরতি", sentence: "The project was held in abeyance until funds arrived.", variantMeaning: "a state of temporary disuse or inactivity", variantBangla: "সাময়িক স্থগিতাদেশ", variantSentence: "Contract negotiations were kept in abeyance pending further review." },
            { id: 8, word: "Abhor", phonetics: "ab-HOR", meaning: "to hate", bangla: "ঘৃণা করা / বিদ্বেষ পোষণ করা", sentence: "She abhors any form of cruelty to animals.", variantMeaning: "to regard with disgust and hatred", variantBangla: "তীব্র অপছন্দ করা", variantSentence: "Honest leaders abhor dishonesty in public office." },
            { id: 9, word: "Abject", phonetics: "AB-jekt", meaning: "hopeless", bangla: "চরম হতাশ / দুর্দশাগ্রস্ত", sentence: "The refugees lived in abject poverty.", variantMeaning: "extremely unpleasant, degraded, or miserable", variantBangla: "অত্যন্ত করুণ বা শোচনীয়", variantSentence: "They expressed abject regret for the error made during the event." },
            { id: 10, word: "Abjure", phonetics: "ab-JOOR", meaning: "to refrain from", bangla: "ত্যাগ করা / পরিহার করা", sentence: "He abjured violence and chose a peaceful path.", variantMeaning: "to solemnly renounce or give up a belief", variantBangla: "আনুষ্ঠানিকভাবে বর্জন করা", variantSentence: "The candidate abjured his previous claims during the debate." },
            { id: 11, word: "Abnegate", phonetics: "AB-nih-gayt", meaning: "to reject", bangla: "প্রত্যাখ্যান করা / অস্বীকার করা", sentence: "She abnegated her personal desires to serve others.", variantMeaning: "to surrender or deny oneself something beneficial", variantBangla: "আত্মত্যাগ করা", variantSentence: "He chose to abnegate luxury in favor of a simpler lifestyle." },
            { id: 12, word: "Abomination", phonetics: "uh-bom-ih-NAY-shun", meaning: "extreme hatred", bangla: "চরম ঘৃণা / ঘৃণ্য বস্তু", sentence: "War is an abomination that destroys lives.", variantMeaning: "a thing that causes disgust or hatred", variantBangla: "ঘৃণ্য কর্ম বা বস্তু", variantSentence: "Cheating in fair academic pursuits is considered an abomination." }
        ];

        const DEFAULT_BOOKS = [
            { id: 'ws1', name: 'WordSmart I', targetCount: 850 },
            { id: 'ws2', name: 'WordSmart II', targetCount: 829 }
        ];

        // SPEECH SYNTHESIS ENGINE
        const VOICE_PREFS_KEY = 'wordsmart_voice_prefs';
        const FEMALE_VOICE_HINTS = ['female', 'sonia', 'jenny', 'zira', 'aria', 'libby', 'serena', 'samantha', 'hazel', 'susan', 'kate', 'emma', 'michelle', 'ana', 'natasha', 'emily', 'linda', 'karen', 'moira', 'fiona', 'tessa', 'veena', 'raveena'];
        const MALE_VOICE_HINTS = ['male', 'david', 'mark', 'guy', 'james', 'george', 'ryan', 'christopher', 'eric', 'steffan', 'andrew', 'brian', 'thomas', 'daniel', 'oliver', 'arthur', 'fred', 'alex', 'tom', 'richard', 'aaron'];
        const QUALITY_VOICE_HINTS = ['google', 'microsoft', 'natural', 'neural', 'enhanced', 'premium', 'samantha', 'daniel', 'karen', 'moira', 'tessa', 'fiona', 'alex'];

        const SpeechEngine = (() => {
            let voicesCache = [];

            const loadVoicePrefs = () => {
                try {
                    const raw = localStorage.getItem(VOICE_PREFS_KEY);
                    if (!raw) return { usVoiceURI: null, ukVoiceURI: null };
                    const parsed = JSON.parse(raw);
                    return {
                        usVoiceURI: parsed.usVoiceURI || null,
                        ukVoiceURI: parsed.ukVoiceURI || null
                    };
                } catch (e) {
                    return { usVoiceURI: null, ukVoiceURI: null };
                }
            };

            let voicePrefs = loadVoicePrefs();

            const refreshVoices = () => {
                if ('speechSynthesis' in window) {
                    voicesCache = window.speechSynthesis.getVoices() || [];
                }
                return voicesCache;
            };

            const getSpeechVoices = () => (voicesCache.length ? voicesCache : refreshVoices());

            const langForAccent = (accent) => (accent === 'uk' ? 'en-GB' : 'en-US');

            const detectProvider = (name) => {
                const n = (name || '').toLowerCase();
                if (n.includes('google')) return 'Google';
                if (n.includes('microsoft')) return 'Microsoft';
                if (n.includes('apple') || n.includes('samantha') || n.includes('alex') || n.includes('daniel') || n.includes('karen') || n.includes('moira') || n.includes('tessa') || n.includes('fiona') || n.includes('rishi') || n.includes('veena')) return 'Apple';
                if (n.includes('amazon') || n.includes('polly')) return 'Amazon';
                if (n.includes('samsung')) return 'Samsung';
                return 'System';
            };

            const detectGender = (name) => {
                const n = (name || '').toLowerCase();
                if (FEMALE_VOICE_HINTS.some(h => n.includes(h))) return 'Female';
                if (MALE_VOICE_HINTS.some(h => n.includes(h))) return 'Male';
                // Chrome's "Google US English" / "Google UK English Female" naming
                if (n.includes('english female') || n.endsWith(' female')) return 'Female';
                if (n.includes('english male') || n.endsWith(' male')) return 'Male';
                return '';
            };

            const formatVoiceLabel = (voice) => {
                if (!voice) return '';
                const provider = detectProvider(voice.name);
                const gender = detectGender(voice.name);
                const accent = voice.lang && voice.lang.toLowerCase().includes('gb') ? 'UK' : (voice.lang && voice.lang.toLowerCase().includes('us') ? 'US' : voice.lang);
                const bits = [provider, accent, gender].filter(Boolean);
                return `${voice.name}${bits.length ? ` — ${bits.join(' · ')}` : ''}`;
            };

            const rankVoice = (voice, langPrefix, preferFemale = true) => {
                if (!voice || !voice.lang || !voice.lang.startsWith(langPrefix)) return -1;
                const n = voice.name.toLowerCase();
                let score = 10;
                if (n.includes('google')) score += 140;
                if (n.includes('microsoft')) score += 110;
                if (n.includes('natural') || n.includes('neural') || n.includes('enhanced')) score += 30;
                if (QUALITY_VOICE_HINTS.some(h => n.includes(h))) score += 12;
                if (langPrefix === 'en-US' && (n.includes(' us ') || n.includes(' u.s.') || n.includes('us english') || n.includes('american'))) score += 25;
                if (langPrefix === 'en-GB' && (n.includes(' uk ') || n.includes(' british') || n.includes(' u.k.') || n.includes('uk english'))) score += 25;
                const gender = detectGender(voice.name);
                if (preferFemale) {
                    if (gender === 'Female') score += 35;
                    if (gender === 'Male') score += 5; // keep male Google/Microsoft selectable & ranked, not buried
                }
                // Prefer distinct Google US/UK entries when present
                if (n.includes('google') && langPrefix === 'en-US' && (n.includes('male') || gender === 'Male')) score += 20;
                if (n.includes('google') && langPrefix === 'en-US' && (n.includes('female') || gender === 'Female')) score += 15;
                return score;
            };

            const voicesForLang = (langPrefix) => {
                return getSpeechVoices()
                    .filter(v => v.lang && (v.lang.startsWith(langPrefix) || (langPrefix === 'en-US' && /^en(-|$)/i.test(v.lang) && !v.lang.toLowerCase().includes('gb') && !v.lang.toLowerCase().includes('au') && !v.lang.toLowerCase().includes('in'))))
                    .sort((a, b) => rankVoice(b, langPrefix) - rankVoice(a, langPrefix));
            };

            const resolveVoice = (accent, preferredVoiceURI) => {
                const lang = langForAccent(accent);
                const voices = getSpeechVoices();
                if (preferredVoiceURI) {
                    const picked = voices.find(v => v.voiceURI === preferredVoiceURI);
                    if (picked && (picked.lang.startsWith(lang) || picked.lang.startsWith('en'))) return picked;
                }
                const ranked = voicesForLang(lang);
                return ranked[0] || voices.find(v => v.lang.startsWith(lang)) || voices[0] || null;
            };

            const setVoicePrefs = (next) => {
                voicePrefs = { ...voicePrefs, ...next };
                localStorage.setItem(VOICE_PREFS_KEY, JSON.stringify(voicePrefs));
            };

            const getVoicePrefs = () => ({ ...voicePrefs });

            const speakText = (text, accent = 'us', notify, options = {}) => {
                if (!text || !String(text).trim()) return;
                if (!('speechSynthesis' in window)) {
                    if (notify) notify("Speech synthesis is not supported in this browser.");
                    return;
                }
                window.speechSynthesis.cancel();
                const prefs = loadVoicePrefs();
                voicePrefs = prefs;
                const lang = langForAccent(accent);
                const uri = accent === 'uk' ? prefs.ukVoiceURI : prefs.usVoiceURI;
                const selectedVoice = resolveVoice(accent, uri);
                const utterance = new SpeechSynthesisUtterance(text);
                const isSentence = options.isSentence || String(text).length > 40;
                utterance.rate = isSentence ? 0.88 : 0.9;
                if (selectedVoice) utterance.voice = selectedVoice;
                utterance.lang = lang;
                window.speechSynthesis.speak(utterance);
            };

            if ('speechSynthesis' in window) {
                refreshVoices();
                window.speechSynthesis.onvoiceschanged = () => refreshVoices();
            }

            return {
                refreshVoices,
                getSpeechVoices,
                voicesForLang,
                rankVoice,
                resolveVoice,
                setVoicePrefs,
                getVoicePrefs,
                loadVoicePrefs,
                speakText,
                langForAccent,
                formatVoiceLabel,
                detectProvider,
                detectGender
            };
        })();

        const speakWord = (text, accent, notify, options) => SpeechEngine.speakText(text, accent, notify, options);

        // Calendar-day key in the user's OWN timezone (YYYY-MM-DD). toISOString() uses UTC,
        // which would flip "today" at the wrong hour for anyone outside UTC.
        const localDateKey = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        // Default field visibility — every field on, matching current behavior.
        // "word" itself has no toggle since it must always show.
        const DEFAULT_FIELD_VISIBILITY = {
            phonetics: true,
            meaning_bn: true,
            meaning_en: true,
            context_main: true,
            example_main: true,
            note: true,
            synonyms: true,
            synonyms_phonetics: true,
            synonyms_meaning_bn: true,
            synonyms_meaning_en: true,
            synonyms_context: true,
            synonyms_example: true,
            synonyms_note: true,
            antonyms: true,
            antonyms_phonetics: true,
            antonyms_meaning_bn: true,
            antonyms_meaning_en: true,
            antonyms_context: true,
            antonyms_example: true,
            antonyms_note: true
        };

        const SpeakIcon = ({ accent, onClick, className = '', variant = 'default', primaryAudioBtn = false, boxed = true }) => {
            const isUs = accent === 'us';
            const base = boxed
                ? (variant === 'onDark'
                    ? (isUs ? 'bg-white/20 hover:bg-white/30 text-white border-white/30' : 'bg-white/15 hover:bg-white/25 text-white border-white/30')
                    : (isUs ? 'bg-blue-50 hover:bg-blue-100 text-blue-600 border-blue-200' : 'bg-purple-50 hover:bg-purple-100 text-purple-600 border-purple-200'))
                : (isUs ? 'bg-transparent hover:bg-blue-50 text-blue-600 border-transparent' : 'bg-transparent hover:bg-purple-50 text-purple-600 border-transparent');
            return (
                <button
                    type="button"
                    {...(primaryAudioBtn ? { 'data-audio-btn': true } : {})}
                    onPointerDown={(e) => e.stopPropagation()}
                    onPointerUp={(e) => e.stopPropagation()}
                    onClick={(e) => { e.stopPropagation(); onClick?.(); }}
                    title={isUs ? 'US pronunciation' : 'UK pronunciation'}
                    className={`inline-flex items-center justify-center w-8 h-8 shrink-0 rounded-lg border transition-colors ${base} ${className}`}
                >
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-4 h-4" aria-hidden="true">
                        <path d="M3 9v6h4l5 5V4L7 9H3z" />
                        <path d="M16.5 12c0-1.77-.77-3.29-2-4.34v8.68c1.23-1.05 2-2.57 2-4.34z" />
                        <path d="M14.5 4.53v1.06A6.986 6.986 0 0 1 18.5 12a6.986 6.986 0 0 1-4 6.41v1.06A7.977 7.977 0 0 0 20 12a7.977 7.977 0 0 0-5.5-7.47z" />
                    </svg>
                </button>
            );
        };

        const SpeakPair = ({ text, notify, accent = 'us', variant = 'default', className = '', isSentence = false, primaryAudioBtn = false, boxed = true }) => {
            if (!text || !String(text).trim()) return null;
            const opts = { isSentence: isSentence || String(text).length > 40 };
            return (
                <div className={`inline-flex items-center ${className}`} onClick={(e) => e.stopPropagation()}>
                    <SpeakIcon accent={accent} variant={variant} primaryAudioBtn={primaryAudioBtn} boxed={boxed} onClick={() => speakWord(text, accent, notify, opts)} />
                </div>
            );
        };

        // Read-only version of the Word List card — used by the "Show full word" reveal
        // button inside games (Classic Battle, Fill-in-the-Blank, True/False, Synonym/Antonym).
        // No edit/delete/familiarity controls since games don't manage word data.
        // Small chevron icon button used to expand/collapse the synonyms & antonyms
        // section — sits top-right on every card (Word List, Games, Practice Quiz).
        // Multi-select dropdown whose rows can show a progress bar (a native <select>
        // can't do either). `values` is an array; an empty array means "no filter / all".
        // options: [{ value, label, right, segments:[{pct, cls}] }]
        const BarSelect = ({ values, onChange, options, title, closedText, allLabel = 'All', clearLabel = 'Show all' }) => {
            const [open, setOpen] = useState(false);
            const wrapRef = useRef(null);
            useEffect(() => {
                if (!open) return;
                const close = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
                const esc = (e) => { if (e.key === 'Escape') setOpen(false); };
                document.addEventListener('mousedown', close);
                document.addEventListener('touchstart', close);
                document.addEventListener('keydown', esc);
                return () => {
                    document.removeEventListener('mousedown', close);
                    document.removeEventListener('touchstart', close);
                    document.removeEventListener('keydown', esc);
                };
            }, [open]);
            const isOn = (v) => values.some(x => String(x) === String(v));
            const toggle = (v) => onChange(isOn(v) ? values.filter(x => String(x) !== String(v)) : [...values, v]);
            // Wide + bold: white "empty" track with a thick border, so the unfamiliar part reads as blank.
            const Bar = ({ segments }) => (
                <div className="flex w-full h-4 rounded-full bg-white border-2 border-slate-300 overflow-hidden shadow-inner">
                    {(segments || []).map((seg, i) => (
                        <div key={i} className={`${seg.cls} transition-all duration-500`} style={{ width: `${seg.pct}%` }} />
                    ))}
                </div>
            );
            return (
                <div className="relative" ref={wrapRef}>
                    <button
                        type="button"
                        title={title}
                        onClick={() => setOpen(o => !o)}
                        className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500 flex items-center gap-2 whitespace-nowrap"
                    >
                        <span>{closedText}</span>
                        <span className="text-[10px] text-slate-500">▾</span>
                    </button>
                    {open && (
                        <div className="absolute left-0 top-full mt-1 z-50 w-max min-w-[28rem] max-w-[94vw] max-h-96 overflow-y-auto bg-white border border-slate-200 rounded-xl shadow-xl p-1">
                            <div className="sticky top-0 z-10 bg-white flex items-center justify-between gap-2 px-2.5 py-1.5 border-b border-slate-100 mb-1">
                                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Tick one or more</span>
                                <span className="flex items-center gap-2">
                                    <button type="button" onClick={() => onChange(options.map(o => o.value))} className="text-[11px] font-bold text-indigo-600 hover:underline">{allLabel}</button>
                                    <button type="button" onClick={() => onChange([])} className="text-[11px] font-bold text-slate-500 hover:underline">{clearLabel}</button>
                                </span>
                            </div>
                            {options.map(o => {
                                const active = isOn(o.value);
                                return (
                                    <button
                                        key={String(o.value)}
                                        type="button"
                                        onClick={() => toggle(o.value)}
                                        className={`w-full text-left px-2.5 py-2 rounded-lg transition-colors flex items-center gap-3 ${active ? 'bg-indigo-50' : 'hover:bg-slate-50'}`}
                                    >
                                        <span className={`w-4 h-4 shrink-0 rounded border-2 flex items-center justify-center text-[10px] leading-none font-black ${active ? 'bg-indigo-600 border-indigo-600 text-white' : 'bg-white border-slate-300 text-transparent'}`}>✓</span>
                                        <span className="flex-1 text-xs font-bold text-indigo-900 whitespace-nowrap">{o.label}</span>
                                        <span className="text-[10px] font-bold text-slate-500 whitespace-nowrap w-16 text-right">{o.right}</span>
                                        <span className="w-44 shrink-0"><Bar segments={o.segments} /></span>
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // On/off switch (green + "ON" when enabled, grey + "OFF" when not)
        const ToggleSwitch = ({ checked, onChange, disabled = false, label }) => (
            <button
                type="button"
                role="switch"
                aria-checked={checked}
                aria-label={label}
                disabled={disabled}
                onClick={onChange}
                className={`relative shrink-0 w-[58px] h-[30px] rounded-full transition-colors duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-green-400 focus-visible:ring-offset-2 disabled:cursor-not-allowed ${checked ? 'bg-green-500' : 'bg-slate-300'}`}
            >
                <span className={`absolute top-1/2 -translate-y-1/2 text-[10px] font-extrabold tracking-wide select-none ${checked ? 'left-2.5 text-white' : 'right-2 text-slate-600'}`}>{checked ? 'ON' : 'OFF'}</span>
                <span className={`absolute top-[3px] w-6 h-6 rounded-full bg-white shadow-md transition-all duration-200 ${checked ? 'left-[31px]' : 'left-[3px]'}`} />
            </button>
        );

        // One settings line: label (+ optional hint) on the left, switch on the right.
        const ToggleRow = ({ label, hint, checked, onToggle, disabled = false, appTheme = 'light', emphasis = false }) => (
            <div
                className={`flex items-center justify-between gap-3 rounded-xl border px-3.5 py-2.5 transition-opacity ${disabled ? 'opacity-45' : ''} ${
                    appTheme === 'light' ? (emphasis ? 'bg-white border-slate-300 shadow-sm' : 'bg-white border-slate-200')
                    : appTheme === 'aurora' ? 'bg-white/10 border-white/20'
                    : 'bg-slate-900/60 border-slate-700'
                }`}
            >
                <div className="min-w-0">
                    <div className={`font-bold ${emphasis ? 'text-sm' : 'text-xs'}`}>{label}</div>
                    {hint && <div className="text-[11px] opacity-60 mt-0.5 leading-snug">{hint}</div>}
                </div>
                <ToggleSwitch checked={checked} onChange={onToggle} disabled={disabled} label={label} />
            </div>
        );

        const ExpandToggleIcon = ({ expanded, onClick, className = '' }) => (
            <button
                type="button"
                onPointerDown={(e) => e.stopPropagation()}
                onPointerUp={(e) => e.stopPropagation()}
                onClick={(e) => { e.stopPropagation(); onClick(); }}
                title={expanded ? 'Hide synonyms & antonyms' : 'Show synonyms & antonyms'}
                className={`w-8 h-8 shrink-0 rounded-lg border flex items-center justify-center transition-colors bg-slate-100 hover:bg-slate-200 text-slate-500 border-slate-200 ${className}`}
            >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={`w-4 h-4 transition-transform ${expanded ? 'rotate-180' : ''}`}>
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        );

        // tone: 'syn' (emerald), 'ant' (rose), or 'main' (indigo — used when the
        // main/root word is shown as a member of its own family list, e.g. inside
        // an expanded synonyms/antonyms panel or a reveal's "word in the question" block).
        const RELATED_TONE_STYLES = {
            syn: { title: 'text-emerald-800', meaning: 'text-emerald-700' },
            ant: { title: 'text-rose-800', meaning: 'text-rose-700' },
            main: { title: 'text-slate-900', meaning: 'text-emerald-700' }
        };

        // Splits note text on URLs (http(s):// or www.) and renders the URL portions
        // as real clickable links, leaving everything else as plain text. Trailing
        // punctuation (periods, commas, etc.) right after a URL is kept outside the link.
        const linkifyNote = (text) => {
            if (!text) return text;
            const parts = text.split(/((?:https?:\/\/|www\.)[^\s<>"']+)/g);
            return parts.map((part, i) => {
                if (i % 2 === 1) {
                    let url = part;
                    let trailing = '';
                    const trailingMatch = url.match(/[.,;:!?)\]]+$/);
                    if (trailingMatch) {
                        trailing = trailingMatch[0];
                        url = url.slice(0, -trailing.length);
                    }
                    const href = url.startsWith('http') ? url : `https://${url}`;
                    return (
                        <React.Fragment key={i}>
                            <a href={href} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline hover:text-blue-800 break-all" onClick={(e) => e.stopPropagation()} onPointerDown={(e) => e.stopPropagation()}>{url}</a>{trailing}
                        </React.Fragment>
                    );
                }
                return part;
            });
        };

        // Renders note text with **bold** segments turned into real <strong> text,
        // while still linkifying URLs inside and outside the bold parts.
        const renderNoteRich = (text) => {
            if (!text) return text;
            const boldParts = text.split(/(\*\*[^*]+\*\*)/g);
            return boldParts.map((part, i) => {
                if (part.startsWith('**') && part.endsWith('**') && part.length > 4) {
                    return <strong key={i}>{linkifyNote(part.slice(2, -2))}</strong>;
                }
                return <React.Fragment key={i}>{linkifyNote(part)}</React.Fragment>;
            });
        };

        // A plain textarea with a small Bold / Bullet toolbar, and Tab-key support
        // (inserts spaces instead of jumping focus to the next field). Bold wraps the
        // current selection in **markers**; renderNoteRich turns those into real bold
        // text wherever the note is displayed. Bullet inserts "• " at the start of the
        // current line so pressing it again on a new line continues the list.
        const NoteEditor = ({ value, onChange, placeholder = '', rows = 2, borderClass = 'border-slate-300' }) => {
            const taRef = useRef(null);

            const wrapSelection = (marker) => {
                const ta = taRef.current;
                if (!ta) return;
                const start = ta.selectionStart, end = ta.selectionEnd;
                const val = value || '';
                const selected = val.slice(start, end);
                const newVal = val.slice(0, start) + marker + selected + marker + val.slice(end);
                onChange(newVal);
                requestAnimationFrame(() => {
                    ta.focus();
                    ta.setSelectionRange(start + marker.length, start + marker.length + selected.length);
                });
            };

            const insertBullet = () => {
                const ta = taRef.current;
                if (!ta) return;
                const start = ta.selectionStart;
                const val = value || '';
                const lineStart = val.lastIndexOf('\n', start - 1) + 1;
                const newVal = val.slice(0, lineStart) + '• ' + val.slice(lineStart);
                onChange(newVal);
                requestAnimationFrame(() => {
                    ta.focus();
                    ta.setSelectionRange(start + 2, start + 2);
                });
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const ta = taRef.current;
                    const start = ta.selectionStart, end = ta.selectionEnd;
                    const val = value || '';
                    const newVal = val.slice(0, start) + '    ' + val.slice(end);
                    onChange(newVal);
                    requestAnimationFrame(() => {
                        ta.focus();
                        ta.setSelectionRange(start + 4, start + 4);
                    });
                }
            };

            return (
                <div>
                    <div className="flex items-center gap-1 mb-1">
                        <button type="button" title="Bold" onMouseDown={(e) => e.preventDefault()} onClick={() => wrapSelection('**')} className="w-6 h-6 flex items-center justify-center text-xs font-black border rounded-md bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-600">B</button>
                        <button type="button" title="Bullet point" onMouseDown={(e) => e.preventDefault()} onClick={insertBullet} className="w-6 h-6 flex items-center justify-center text-xs border rounded-md bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-600">•</button>
                    </div>
                    <textarea
                        ref={taRef}
                        rows={rows}
                        placeholder={placeholder}
                        value={value || ''}
                        onChange={(e) => onChange(e.target.value)}
                        onKeyDown={handleKeyDown}
                        className={`w-full px-3 py-1.5 bg-white border ${borderClass} rounded-lg text-xs`}
                    ></textarea>
                </div>
            );
        };

        const RelatedWordBlock = ({ entry, tone, accent, notify, show = { phonetics: true, meaning_bn: true, meaning_en: true, context: true, example: true, note: true }, famLevel = 'unfamiliar', onSetFamiliarity = null, cornerAction = null, boxPadding = 'p-5' }) => {
            const ts = RELATED_TONE_STYLES[tone] || RELATED_TONE_STYLES.syn;
            return (
            <div className={`rounded-2xl ${boxPadding} border shadow-sm hover:shadow-md transition-all text-left ${familiarityCardBorder(famLevel)}`}>
                <div className="flex justify-between items-start gap-2">
                    <div className="flex-1 min-w-0">
                        <div className="flex items-center flex-wrap gap-2">
                            <span className={`text-base font-bold leading-snug ${ts.title}`}>{entry.word}</span>
                            <SpeakPair text={entry.word} notify={notify} accent={accent} boxed={false} />
                            {show.phonetics && entry.phonetics && (
                                <span className="text-[11px] font-mono text-indigo-600">
                                    [{entry.phonetics}]
                                </span>
                            )}
                        </div>
                        <div className="mt-0.5 space-y-0.5">
                            {show.meaning_bn && entry.meaning_bn && (
                                <p className={`text-xs leading-snug font-semibold ${ts.meaning}`}>{entry.meaning_bn}</p>
                            )}
                            {show.meaning_en && entry.meaning_en && (
                                <p className="text-xs leading-snug font-medium text-slate-500">{entry.meaning_en}</p>
                            )}
                        </div>
                    </div>
                    {(onSetFamiliarity || cornerAction) && (
                        <div className="shrink-0 flex items-center gap-1.5">
                            {onSetFamiliarity && <FamiliarityPicker level={famLevel} onSet={onSetFamiliarity} compact />}
                            {cornerAction}
                        </div>
                    )}
                </div>
                {((show.context && entry.context) || (show.example && entry.sentence)) && (
                    <div className="mt-0.5 text-xs">
                        <div className="bg-slate-50 p-2 rounded-xl border border-slate-100 sentence-example space-y-0.5">
                            {show.context && entry.context && <p className="text-xs leading-snug text-slate-600">{entry.context}</p>}
                            {show.example && entry.sentence && (
                                <div className="flex items-center justify-between gap-2">
                                    <p className="flex-1 min-w-0 text-xs leading-snug italic text-slate-500">"{entry.sentence}"</p>
                                    <SpeakPair text={entry.sentence} notify={notify} accent={accent} isSentence className="shrink-0" />
                                </div>
                            )}
                        </div>
                    </div>
                )}
                {show.note && entry.note && (
                    <div className="mt-0.5 bg-amber-50 border border-amber-100 rounded-xl p-2.5 text-left">
                        <span className="text-[11px] font-bold text-amber-600 uppercase tracking-wider block mb-0.5">Note</span>
                        <p className="text-xs text-slate-600 italic whitespace-pre-line">{renderNoteRich(entry.note)}</p>
                    </div>
                )}
            </div>
            );
        };

        // Adapts a main-word item (word/meaning_en/meaning_bn/context_main/example_main...)
        // into the { word, phonetics, meaning_bn, meaning_en, context, sentence } shape
        // RelatedWordBlock expects, so the main word can be shown "in the box" alongside
        // its synonyms/antonyms using the exact same component.
        const mainWordAsEntry = (item) => ({
            id: item.id,
            word: item.word,
            phonetics: item.phonetics,
            meaning_bn: item.meaning_bn || item.bangla,
            meaning_en: item.meaning_en || item.meaning,
            context: item.context_main,
            sentence: item.example_main || item.sentence,
            note: item.meaning_en_detailed || item.note
        });

        // The single "full word" card layout — used both by the Word List (as a
        // controlled, grid-aware card) and by Games/Practice Quiz (as a standalone
        // read-only reveal). expanded/onToggleExpand are always controlled by the caller.
        const WordCardShell = ({ item, accent = 'us', notify, showBangla = true, expanded, onToggleExpand, actions = null, editDeleteActions = null, titleExtra = null, cardClassName = 'border-slate-200 bg-white', fieldVisibility = DEFAULT_FIELD_VISIBILITY, relatedFamiliarityMap = null, onSetRelatedFamiliarity = null, detailMode = false }) => {
            const [rightPanelScrolled, setRightPanelScrolled] = useState(false);
            if (!item) return null;
            const fv = fieldVisibility || DEFAULT_FIELD_VISIBILITY;
            const synonyms = fv.synonyms ? (item.synonyms || []) : [];
            const antonyms = fv.antonyms ? (item.antonyms || []) : [];
            const meaningText = item.meaning_en || item.meaning || '';
            const banglaText = item.meaning_bn || item.bangla || '';
            const exampleText = item.example_main || item.sentence || '';
            const showNote = fv.note && !!item.meaning_en_detailed;
            const hasExpandable = !!(showNote || synonyms.length || antonyms.length);
            const synShow = { phonetics: fv.synonyms_phonetics, meaning_bn: fv.synonyms_meaning_bn, meaning_en: fv.synonyms_meaning_en, context: fv.synonyms_context, example: fv.synonyms_example, note: fv.synonyms_note };
            const antShow = { phonetics: fv.antonyms_phonetics, meaning_bn: fv.antonyms_meaning_bn, meaning_en: fv.antonyms_meaning_en, context: fv.antonyms_context, example: fv.antonyms_example, note: fv.antonyms_note };

            return (
                <div className={detailMode
                    ? `rounded-2xl border shadow-sm transition-all text-left flex flex-col overflow-hidden max-h-[40rem] lg:max-h-[87.5vh] ${cardClassName}`
                    : `rounded-2xl border shadow-sm hover:shadow-md transition-all text-left p-5 ${cardClassName}`
                }>
                    {detailMode ? (
                        <React.Fragment>
                            {/* Pinned header — stays put while the content below scrolls, so the
                                "Word" label, edit/delete buttons, and the card's own rounded top
                                corner are always visible, never scrolled out of view. */}
                            <div className={`shrink-0 h-11 flex items-center justify-between gap-2 px-5 border-b border-slate-100 transition-shadow ${rightPanelScrolled ? 'shadow-[0_2px_4px_-2px_rgba(0,0,0,0.08)]' : ''}`}>
                                <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wider">Family</span>
                                <div className="flex items-center gap-1.5 shrink-0">
                                    {editDeleteActions}
                                </div>
                            </div>
                            {/* Only this region scrolls. */}
                            <div className="flex-1 min-h-0 overflow-y-auto px-5 pt-3 pb-5 space-y-3" onScroll={(e) => setRightPanelScrolled(e.currentTarget.scrollTop > 4)}>
                                <RelatedWordBlock
                                    entry={mainWordAsEntry(item)}
                                    tone="main"
                                    accent={accent}
                                    notify={notify}
                                    show={{ phonetics: fv.phonetics, meaning_bn: fv.meaning_bn, meaning_en: fv.meaning_en, context: fv.context_main, example: fv.example_main, note: fv.note }}
                                    famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, item.id)}
                                    onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(item.id, level) : null}
                                    boxPadding="p-2.5"
                                />
                                {synonyms.length > 0 && (
                                    <div>
                                        <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1.5">Synonyms</span>
                                        <div className="space-y-3">
                                            {synonyms.map((s, i) => {
                                                const entryId = getRelatedEntryId(item.id, 'syn', i, s);
                                                return (
                                                    <RelatedWordBlock
                                                        key={entryId}
                                                        entry={s}
                                                        tone="syn"
                                                        accent={accent}
                                                        notify={notify}
                                                        show={synShow}
                                                        famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, entryId)}
                                                        onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(entryId, level) : null}
                                                        boxPadding="p-2.5"
                                                    />
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                                {antonyms.length > 0 && (
                                    <div>
                                        <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider block mb-1.5">Antonyms</span>
                                        <div className="space-y-3">
                                            {antonyms.map((a, i) => {
                                                const entryId = getRelatedEntryId(item.id, 'ant', i, a);
                                                return (
                                                    <RelatedWordBlock
                                                        key={entryId}
                                                        entry={a}
                                                        tone="ant"
                                                        accent={accent}
                                                        notify={notify}
                                                        show={antShow}
                                                        famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, entryId)}
                                                        onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(entryId, level) : null}
                                                        boxPadding="p-2.5"
                                                    />
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </React.Fragment>
                    ) : (
                    <React.Fragment>
                    {!expanded ? (
                        <React.Fragment>
                            <div className="flex justify-between items-start gap-2">
                                <div className="flex-1 min-w-0">
                                    <div className="flex items-center flex-wrap gap-2">
                                        <h3 className="text-base font-bold text-slate-900 leading-snug">{item.word}</h3>
                                        <SpeakPair text={item.word} notify={notify} accent={accent} boxed={false} />
                                        {fv.phonetics && item.phonetics && (
                                            <span className="text-[11px] font-mono text-indigo-600">
                                                [{item.phonetics}]
                                            </span>
                                        )}
                                        {titleExtra}
                                    </div>
                                    <div className="mt-0.5 space-y-0.5">
                                        {fv.meaning_bn && showBangla && banglaText && (
                                            <p className="text-xs leading-snug font-semibold text-emerald-700">{banglaText}</p>
                                        )}
                                        {fv.meaning_en && (
                                            <p className="text-xs leading-snug font-medium text-slate-500">{meaningText}</p>
                                        )}
                                    </div>
                                </div>
                                <div className="flex items-center gap-1.5 shrink-0">
                                    {actions}
                                    {hasExpandable && <ExpandToggleIcon expanded={expanded} onClick={onToggleExpand} />}
                                </div>
                            </div>

                            <div className="mt-0.5 text-xs">
                                {((fv.context_main && item.context_main) || (fv.example_main && exampleText)) && (
                                    <div className="bg-slate-50 p-2 rounded-xl border border-slate-100 sentence-example space-y-0.5">
                                        {fv.context_main && item.context_main && <p className="text-xs leading-snug text-slate-600">{item.context_main}</p>}
                                        {fv.example_main && exampleText && (
                                            <div className="flex items-center justify-between gap-2">
                                                <p className="flex-1 min-w-0 text-xs leading-snug italic text-slate-500">"{exampleText}"</p>
                                                <SpeakPair text={exampleText} notify={notify} accent={accent} isSentence className="shrink-0" />
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </React.Fragment>
                    ) : hasExpandable ? null : (
                        <div className="flex items-center justify-end gap-2">
                            <div className="flex items-center gap-1.5 shrink-0">
                                {editDeleteActions}
                                <ExpandToggleIcon expanded={expanded} onClick={onToggleExpand} />
                            </div>
                        </div>
                    )}

                    {expanded && hasExpandable && (
                        <div className="space-y-3">
                            <div>
                                <div className="flex items-center justify-between gap-2 mb-1.5">
                                    <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wider">Word</span>
                                    <div className="flex items-center gap-1.5 shrink-0">
                                        {editDeleteActions}
                                        <ExpandToggleIcon expanded={expanded} onClick={onToggleExpand} />
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <RelatedWordBlock
                                        entry={mainWordAsEntry(item)}
                                        tone="main"
                                        accent={accent}
                                        notify={notify}
                                        show={{ phonetics: fv.phonetics, meaning_bn: fv.meaning_bn, meaning_en: fv.meaning_en, context: fv.context_main, example: fv.example_main, note: fv.note }}
                                        famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, item.id)}
                                        onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(item.id, level) : null}
                                        boxPadding="p-5"
                                    />
                                </div>
                            </div>
                            {synonyms.length > 0 && (
                                <div>
                                    <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1.5">Synonyms</span>
                                    <div className="space-y-3">
                                        {synonyms.map((s, i) => {
                                            const entryId = getRelatedEntryId(item.id, 'syn', i, s);
                                            return (
                                                <RelatedWordBlock
                                                    key={entryId}
                                                    entry={s}
                                                    tone="syn"
                                                    accent={accent}
                                                    notify={notify}
                                                    show={synShow}
                                                    famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, entryId)}
                                                    onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(entryId, level) : null}
                                                    boxPadding="p-5"
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            {antonyms.length > 0 && (
                                <div>
                                    <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider block mb-1.5">Antonyms</span>
                                    <div className="space-y-3">
                                        {antonyms.map((a, i) => {
                                            const entryId = getRelatedEntryId(item.id, 'ant', i, a);
                                            return (
                                                <RelatedWordBlock
                                                    key={entryId}
                                                    entry={a}
                                                    tone="ant"
                                                    accent={accent}
                                                    notify={notify}
                                                    show={antShow}
                                                    famLevel={getWordFamiliarityLevel(relatedFamiliarityMap || {}, entryId)}
                                                    onSetFamiliarity={onSetRelatedFamiliarity ? (level) => onSetRelatedFamiliarity(entryId, level) : null}
                                                    boxPadding="p-5"
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                    </React.Fragment>
                    )}
                </div>
            );
        };

        // Read-only wrapper around WordCardShell — manages its own expand state since
        // Games/Practice Quiz only ever show one card at a time (no "max 2" grid rule needed).
        const FullWordCard = ({ item, accent = 'us', notify, showBangla = true, fieldVisibility = DEFAULT_FIELD_VISIBILITY }) => {
            const [expanded, setExpanded] = useState(false);
            return (
                <WordCardShell
                    item={item}
                    accent={accent}
                    notify={notify}
                    showBangla={showBangla}
                    expanded={expanded}
                    onToggleExpand={() => setExpanded(v => !v)}
                    fieldVisibility={fieldVisibility}
                />
            );
        };

        // Just the synonyms/antonyms list (optionally prefixed with the main word),
        // used as the "level 2" reveal in Games/Practice Quiz — no outer card, no
        // repeated header, since the specific word already shown at level 1 (see
        // WordRevealContent) shouldn't be shown a second time here.
        const FamilyList = ({ item, includeMainWord = true, accent = 'us', notify, showBangla = true, fieldVisibility = DEFAULT_FIELD_VISIBILITY, famMap = null, onSetFamiliarity = null }) => {
            if (!item) return null;
            const fv = fieldVisibility || DEFAULT_FIELD_VISIBILITY;
            const synonyms = fv.synonyms ? (item.synonyms || []) : [];
            const antonyms = fv.antonyms ? (item.antonyms || []) : [];
            const synShow = { phonetics: fv.synonyms_phonetics, meaning_bn: fv.synonyms_meaning_bn, meaning_en: fv.synonyms_meaning_en, context: fv.synonyms_context, example: fv.synonyms_example, note: fv.synonyms_note };
            const antShow = { phonetics: fv.antonyms_phonetics, meaning_bn: fv.antonyms_meaning_bn, meaning_en: fv.antonyms_meaning_en, context: fv.antonyms_context, example: fv.antonyms_example, note: fv.antonyms_note };
            if (!includeMainWord && synonyms.length === 0 && antonyms.length === 0) {
                return (
                    <div className="rounded-2xl p-4 border border-dashed border-slate-200 text-center">
                        <p className="text-xs text-slate-400">No synonyms or antonyms saved for this word yet.</p>
                    </div>
                );
            }
            return (
                <div className="space-y-3">
                    {includeMainWord && (
                        <RelatedWordBlock
                            entry={mainWordAsEntry(item)}
                            tone="main"
                            accent={accent}
                            notify={notify}
                            show={{ phonetics: fv.phonetics, meaning_bn: fv.meaning_bn, meaning_en: fv.meaning_en, context: fv.context_main, example: fv.example_main, note: fv.note }}
                            famLevel={getWordFamiliarityLevel(famMap || {}, item.id)}
                            onSetFamiliarity={onSetFamiliarity ? (level) => onSetFamiliarity(item.id, level) : null}
                        />
                    )}
                    {synonyms.length > 0 && (
                        <div>
                            <span className="text-[11px] font-bold text-emerald-600 uppercase tracking-wider block mb-1.5">Synonyms</span>
                            <div className="space-y-3">
                                {synonyms.map((s, i) => {
                                    const entryId = getRelatedEntryId(item.id, 'syn', i, s);
                                    return (
                                        <RelatedWordBlock
                                            key={entryId}
                                            entry={s}
                                            tone="syn"
                                            accent={accent}
                                            notify={notify}
                                            show={synShow}
                                            famLevel={getWordFamiliarityLevel(famMap || {}, entryId)}
                                            onSetFamiliarity={onSetFamiliarity ? (level) => onSetFamiliarity(entryId, level) : null}
                                        />
                                    );
                                })}
                            </div>
                        </div>
                    )}
                    {antonyms.length > 0 && (
                        <div>
                            <span className="text-[11px] font-bold text-rose-600 uppercase tracking-wider block mb-1.5">Antonyms</span>
                            <div className="space-y-3">
                                {antonyms.map((a, i) => {
                                    const entryId = getRelatedEntryId(item.id, 'ant', i, a);
                                    return (
                                        <RelatedWordBlock
                                            key={entryId}
                                            entry={a}
                                            tone="ant"
                                            accent={accent}
                                            notify={notify}
                                            show={antShow}
                                            famLevel={getWordFamiliarityLevel(famMap || {}, entryId)}
                                            onSetFamiliarity={onSetFamiliarity ? (level) => onSetFamiliarity(entryId, level) : null}
                                        />
                                    );
                                })}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const RELATED_FV_PREFIX = { syn: 'synonyms', ant: 'antonyms' };

        // Games/Practice Quiz targets are drawn from the playable pool, which includes
        // flattened synonym/antonym entries (see playablePool) alongside main words. A
        // flattened entry has no synonyms/antonyms of its own (they live on the main word
        // it came from, referenced via familyOf). This resolves a target into the right
        // { item, focusEntry, focusTone } combo for WordRevealContent/ShowFullWordToggle,
        // so the "full word family" reveal always shows real data: the main word's family
        // when the target is a synonym/antonym, or the target's own family when it's a
        // main word itself.
        const getFamilyReveal = (target) => {
            if (target && target.relatedTone && target.familyOf) {
                return { item: target.familyOf, focusEntry: target, focusTone: target.relatedTone };
            }
            return { item: target, focusEntry: null, focusTone: 'main' };
        };

        // Two-level reveal content, shared by Games and Practice Quiz (each supplies its own
        // outer toggle button — see ShowFullWordToggle below for the games version). Level 1
        // (always shown once the caller reveals it) is just the specific word the question is
        // actually testing — main word, or the synonym/antonym word — with its own
        // phonetic/meaning/context/example, mirroring the flashcard back. Level 2 is a nested
        // dropdown (top-right corner of the level-1 box), always available, that reveals the
        // rest of the word family (main word + all its synonyms + antonyms) belonging to `item`,
        // exactly as it appears in the Word List — or a small note if that word has no
        // synonyms/antonyms saved. If level 1 already showed the main word itself, level 2 skips
        // repeating it and only lists the synonyms/antonyms — otherwise (level 1 showed a
        // synonym/antonym) level 2 leads with the main word since it hasn't been shown yet.
        //   item: the main/root word that owns the full synonyms/antonyms arrays (always required).
        //   focusEntry + focusTone: the specific word the question is about, if it differs from
        //     `item` itself — e.g. a synonym/antonym question tests `correctEntry`, not the main
        //     word shown in the question header. Omit both to just focus on `item` itself.
        const WordRevealContent = ({ item, focusEntry = null, focusTone = 'main', accent, notify, showBangla, fieldVisibility = DEFAULT_FIELD_VISIBILITY, famMap = null, onSetFamiliarity = null }) => {
            const [showFamily, setShowFamily] = useState(false);
            const familyRef = useRef(null);
            // Reset the nested level whenever the question changes so it doesn't stay
            // open across an unrelated word.
            useEffect(() => { setShowFamily(false); }, [item && item.id, focusEntry && focusEntry.word]);
            const fv = fieldVisibility || DEFAULT_FIELD_VISIBILITY;
            const entry = focusTone === 'main' ? mainWordAsEntry(item) : (focusEntry || mainWordAsEntry(item));
            const entryId = focusTone === 'main'
                ? (item && item.id)
                : (focusEntry && focusEntry.id) || (item && getRelatedEntryId(item.id, focusTone, 0, focusEntry));
            const prefix = RELATED_FV_PREFIX[focusTone];
            const show = focusTone === 'main'
                ? { phonetics: fv.phonetics, meaning_bn: fv.meaning_bn, meaning_en: fv.meaning_en, context: fv.context_main, example: fv.example_main, note: fv.note }
                : { phonetics: fv[`${prefix}_phonetics`], meaning_bn: fv[`${prefix}_meaning_bn`], meaning_en: fv[`${prefix}_meaning_en`], context: fv[`${prefix}_context`], example: fv[`${prefix}_example`], note: fv[`${prefix}_note`] };
            return (
                <div className="space-y-2">
                    <RelatedWordBlock
                        entry={entry}
                        tone={focusTone}
                        accent={accent}
                        notify={notify}
                        show={show}
                        famLevel={getWordFamiliarityLevel(famMap || {}, entryId)}
                        onSetFamiliarity={(onSetFamiliarity && entryId != null) ? (level) => onSetFamiliarity(entryId, level) : null}
                        cornerAction={item && (
                            <button
                                type="button"
                                onPointerDown={(e) => e.stopPropagation()}
                                onPointerUp={(e) => e.stopPropagation()}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    setShowFamily(v => {
                                        const next = !v;
                                        if (next) {
                                            setTimeout(() => {
                                                familyRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                                            }, 320);
                                        }
                                        return next;
                                    });
                                }}
                                title={showFamily ? 'Hide full word family' : 'Show full word family'}
                                className="w-8 h-8 rounded-lg border flex items-center justify-center bg-white hover:bg-slate-50 text-indigo-600 border-indigo-200 shadow-sm transition-colors"
                            >
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className={`w-4 h-4 transition-transform ${showFamily ? 'rotate-180' : ''}`}>
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                        )}
                    />
                    <div ref={familyRef} className={`dropdown-scroll-target grid transition-[grid-template-rows] duration-300 ease-in-out ${showFamily ? 'grid-rows-[1fr] mt-2' : 'grid-rows-[0fr]'}`}>
                        <div className="overflow-hidden">
                            {item && (
                                <FamilyList item={item} includeMainWord={focusTone !== 'main'} accent={accent} notify={notify} showBangla={showBangla} fieldVisibility={fieldVisibility} famMap={famMap} onSetFamiliarity={onSetFamiliarity} />
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // Small reusable "Show word" toggle button (top-right icon) + WordRevealContent, used in Games.
        const ShowFullWordToggle = ({ revealed, onToggle, item, focusEntry = null, focusTone = 'main', accent, notify, showBangla, fieldVisibility = DEFAULT_FIELD_VISIBILITY, famMap = null, onSetFamiliarity = null }) => {
            const containerRef = useRef(null);
            return (
            <div ref={containerRef}>
                <ExpandToggleIcon expanded={revealed} onClick={() => {
                    onToggle();
                    if (!revealed) {
                        setTimeout(() => {
                            const container = containerRef.current?.closest('.answer-card-container, .quiz-card-container');
                            (container || containerRef.current)?.scrollIntoView({ behavior: 'smooth', block: 'end' });
                        }, 380);
                    }
                }} className="!absolute top-3 right-3 !bg-white/20 !border-white/30 !text-white hover:!bg-white/30" />
                <div className={`grid transition-[grid-template-rows] duration-300 ease-in-out ${revealed ? 'grid-rows-[1fr] mt-2' : 'grid-rows-[0fr]'}`}>
                    <div className="overflow-hidden">
                        <WordRevealContent item={item} focusEntry={focusEntry} focusTone={focusTone} accent={accent} notify={notify} showBangla={showBangla} fieldVisibility={fieldVisibility} famMap={famMap} onSetFamiliarity={onSetFamiliarity} />
                    </div>
                </div>
            </div>
            );
        };

        // Firestore caps a single document at 1 MiB. A word (with its synonyms/
        // antonyms) runs ~2KB, so a book with 800+ words can already blow past that
        // on its own. To stay safely under the cap at any book size, each book's
        // words are split into fixed-size chunks and each chunk is stored as its
        // own small document, instead of one giant document holding everything.
        const CLOUD_WORDS_CHUNK_SIZE = 150;

        // allWords ({bookId: [word, word, ...]}) -> flat list of the chunk documents
        // that should exist in Firestore to represent it right now.
        const splitWordsIntoCloudChunks = (allWords) => {
            const chunks = [];
            Object.keys(allWords || {}).forEach((bookId) => {
                const words = allWords[bookId] || [];
                for (let i = 0; i < words.length; i += CLOUD_WORDS_CHUNK_SIZE) {
                    const chunkIndex = i / CLOUD_WORDS_CHUNK_SIZE;
                    chunks.push({
                        docId: `${bookId}__${chunkIndex}`,
                        bookId,
                        chunkIndex,
                        words: words.slice(i, i + CLOUD_WORDS_CHUNK_SIZE),
                    });
                }
            });
            return chunks;
        };

        // Reverse of the above: Firestore chunk-doc snapshots -> allWords shape.
        const assembleAllWordsFromCloudChunks = (chunkDocsSnapshot) => {
            const byBook = {};
            const idSet = new Set();
            chunkDocsSnapshot.forEach((chunkDoc) => {
                idSet.add(chunkDoc.id);
                const data = chunkDoc.data() || {};
                const bookId = data.bookId;
                if (!bookId) return;
                if (!byBook[bookId]) byBook[bookId] = [];
                byBook[bookId].push({ chunkIndex: data.chunkIndex || 0, words: Array.isArray(data.words) ? data.words : [] });
            });
            const allWords = {};
            Object.keys(byBook).forEach((bookId) => {
                allWords[bookId] = byBook[bookId]
                    .sort((a, b) => a.chunkIndex - b.chunkIndex)
                    .flatMap((c) => c.words);
            });
            return { allWords, idSet };
        };

        const migrateMasteredToFamiliarity = (allMastered) => {
            const result = {};
            if (!allMastered || typeof allMastered !== 'object') return result;
            for (const bookId of Object.keys(allMastered)) {
                result[bookId] = {};
                (allMastered[bookId] || []).forEach((id) => {
                    result[bookId][id] = 'familiar';
                });
            }
            return result;
        };

        const getWordFamiliarityLevel = (bookMap, wordId) => {
            const v = bookMap && bookMap[wordId];
            if (v === 'semi' || v === 'familiar') return v;
            return 'unfamiliar';
        };

        // Stable unique id for a nested synonym/antonym entry, so its own
        // Familiar/Semi-familiar/Unfamiliar state can be tracked independently of
        // its parent word (reuses the same familiarity map/storage as main words).
        let relatedIdCounter = 0;
        const genRelatedId = () => {
            relatedIdCounter += 1;
            return `rel_${Date.now()}_${relatedIdCounter}_${Math.random().toString(36).slice(2, 8)}`;
        };
        // Falls back to a composite key (parent word id + tone + index) for entries
        // saved before ids existed, so old data keeps working without migration.
        const getRelatedEntryId = (parentId, tone, index, entry) => (entry && entry.id) || `${parentId}_${tone}_${index}`;

        const FamiliarityPicker = ({ level, onSet, compact = false }) => {
            // Reading document.documentElement's data-theme attribute directly during
            // render (the old approach) reads a STALE value: theme changes update this
            // attribute inside a useEffect, which runs AFTER this component's render
            // commits, so the button briefly renders with the previous theme's colors
            // until some unrelated re-render happens to catch up. Subscribing via a
            // MutationObserver instead makes this component re-render at the exact
            // moment the attribute changes, fixing the color immediately.
            const [isNightMode, setIsNightMode] = useState(() => {
                const t = document.documentElement?.getAttribute('data-theme');
                return t === 'midnight' || t === 'aurora';
            });
            useEffect(() => {
                const html = document.documentElement;
                if (!html) return;
                const sync = () => {
                    const t = html.getAttribute('data-theme');
                    setIsNightMode(t === 'midnight' || t === 'aurora');
                };
                sync();
                const observer = new MutationObserver(sync);
                observer.observe(html, { attributes: true, attributeFilter: ['data-theme'] });
                return () => observer.disconnect();
            }, []);
            const items = [
                {
                    id: 'unfamiliar',
                    icon: '○',
                    title: 'Unfamiliar',
                    active: isNightMode
                        ? 'bg-slate-700/80 text-slate-100 border-slate-400 shadow-sm keep-accent'
                        : 'bg-slate-200 text-slate-700 border-slate-400 shadow-sm'
                },
                {
                    id: 'semi',
                    icon: '◐',
                    title: 'Semi-familiar',
                    active: isNightMode
                        ? 'bg-amber-600/15 text-amber-400 border-amber-600/70 shadow-sm keep-accent'
                        : 'bg-amber-100 text-amber-800 border-amber-400 shadow-sm'
                },
                {
                    id: 'familiar',
                    icon: '●',
                    title: 'Familiar',
                    active: isNightMode
                        ? 'bg-emerald-500/25 text-emerald-200 border-emerald-400 shadow-sm keep-accent'
                        : 'bg-emerald-100 text-emerald-800 border-emerald-400 shadow-sm'
                }
            ];
