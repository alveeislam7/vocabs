                                        <button type="button" onClick={() => updateDailyGoal(dailyGoal - 1)} disabled={dailyGoal <= MIN_DAILY_GOAL} className="w-8 h-8 shrink-0 rounded-full border border-slate-300 font-extrabold leading-none hover:bg-slate-100 hover:text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">−</button>
                                        <input type="range" min={MIN_DAILY_GOAL} max={MAX_DAILY_GOAL} step="1" value={dailyGoal} onChange={(e) => updateDailyGoal(e.target.value)} className="flex-1 accent-amber-500 cursor-pointer" aria-label="Daily word goal" />
                                        <button type="button" onClick={() => updateDailyGoal(dailyGoal + 1)} disabled={dailyGoal >= MAX_DAILY_GOAL} className="w-8 h-8 shrink-0 rounded-full border border-slate-300 font-extrabold leading-none hover:bg-slate-100 hover:text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">+</button>
                                        <div className="w-14 shrink-0 text-center">
                                            <div className="text-2xl font-extrabold leading-none text-amber-500">{dailyGoal}</div>
                                            <div className="text-[10px] font-bold uppercase tracking-wider opacity-60 mt-0.5">per day</div>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        {[5, 10, 15, 20, 30, 50].map(n => (
                                            <button key={n} type="button" onClick={() => updateDailyGoal(n)} className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-colors ${dailyGoal === n ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-300 hover:bg-slate-100 hover:text-slate-800'}`}>{n}</button>
                                        ))}
                                        <span className="text-[11px] opacity-60 ml-1">Today: {todaysActivity.learned}/{dailyGoal}</span>
                                    </div>
                                </div>

                                <div className={`rounded-2xl border shadow-sm p-4 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'} space-y-3`}>
                                    <div>
                                        <h2 className="text-lg font-extrabold flex items-center gap-2"><span>🧩</span> Chunk Size</h2>
                                        <p className="text-[11px] mt-0.5 opacity-70">Words per chunk in the Chunk filter ({MIN_CHUNK_SIZE}–{MAX_CHUNK_SIZE}). Changing it resets the filter to "All Words".</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button type="button" onClick={() => updateChunkSize(chunkSize - 1)} disabled={chunkSize <= MIN_CHUNK_SIZE} className="w-8 h-8 shrink-0 rounded-full border border-slate-300 font-extrabold leading-none hover:bg-slate-100 hover:text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">−</button>
                                        <input type="range" min={MIN_CHUNK_SIZE} max={MAX_CHUNK_SIZE} step="1" value={chunkSize} onChange={(e) => updateChunkSize(e.target.value)} className="flex-1 accent-green-500 cursor-pointer" aria-label="Words per chunk" />
                                        <button type="button" onClick={() => updateChunkSize(chunkSize + 1)} disabled={chunkSize >= MAX_CHUNK_SIZE} className="w-8 h-8 shrink-0 rounded-full border border-slate-300 font-extrabold leading-none hover:bg-slate-100 hover:text-slate-800 disabled:opacity-40 disabled:cursor-not-allowed">+</button>
                                        <div className="w-14 shrink-0 text-center">
                                            <div className="text-2xl font-extrabold leading-none text-green-600">{chunkSize}</div>
                                            <div className="text-[10px] font-bold uppercase tracking-wider opacity-60 mt-0.5">words</div>
                                        </div>
                                    </div>
                                    <div className="flex flex-wrap items-center gap-1.5">
                                        {[5, 10, 15, 20, 25, 30, 40, 50].map(n => (
                                            <button key={n} type="button" onClick={() => updateChunkSize(n)} className={`px-2.5 py-1 rounded-full text-xs font-bold border transition-colors ${chunkSize === n ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 hover:bg-slate-100 hover:text-slate-800'}`}>{n}</button>
                                        ))}
                                        <span className="text-[11px] opacity-60 ml-1">{currentWords.length} words → {chunksList.length} chunk{chunksList.length === 1 ? '' : 's'}</span>
                                    </div>
                                </div>
                            </div>

                            {/* DISPLAY SETTINGS */}
                            <div className={`rounded-2xl border shadow-sm p-4 space-y-3 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'}`}>
                                <div>
                                    <h2 className="text-lg font-extrabold flex items-center gap-2">
                                        <span>👁️</span> Display Settings
                                    </h2>
                                    <p className="text-xs mt-0.5 opacity-80">Choose what shows on every word card — applies everywhere: Word List, Flashcards, Games, and Practice Quiz. "Word" itself always shows.</p>
                                </div>

                                {(() => {
                                    const panel = appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/5 border-white/20' : 'bg-slate-800/50 border-slate-700';
                                    const grid = 'grid grid-cols-1 sm:grid-cols-2 gap-2';
                                    const Group = ({ title, dot, titleCls, children }) => (
                                        <div className={`rounded-2xl border p-3.5 space-y-2.5 ${panel}`}>
                                            <div className={`flex items-center gap-2 text-[11px] font-extrabold uppercase tracking-wider ${titleCls}`}>
                                                <span className={`w-2.5 h-2.5 rounded-full ${dot}`} />{title}
                                            </div>
                                            {children}
                                        </div>
                                    );
                                    const rowsFor = (prefix, items, enabled) => items.map(({ key, label }) => (
                                        <ToggleRow key={key} label={label} checked={!!fieldVisibility[key]} onToggle={() => toggleFieldVisibility(key)} disabled={!enabled} appTheme={appTheme} />
                                    ));
                                    const mainItems = [
                                        { key: 'phonetics', label: 'Phonetics' },
                                        { key: 'meaning_bn', label: 'Bangla Meaning' },
                                        { key: 'meaning_en', label: 'English Meaning' },
                                        { key: 'context_main', label: 'Use Context' },
                                        { key: 'example_main', label: 'Example' },
                                        { key: 'note', label: 'Note' },
                                    ];
                                    const subItems = (p) => [
                                        { key: `${p}_phonetics`, label: 'Phonetics' },
                                        { key: `${p}_meaning_bn`, label: 'Bangla Meaning' },
                                        { key: `${p}_meaning_en`, label: 'English Meaning' },
                                        { key: `${p}_context`, label: 'Use Context' },
                                        { key: `${p}_example`, label: 'Example' },
                                        { key: `${p}_note`, label: 'Note' },
                                    ];
                                    return (
                                        <React.Fragment>
                                            <ToggleRow
                                                emphasis
                                                label="Bangla Meanings (everywhere)"
                                                hint="Master switch for Bangla text across the whole app — quiz options and search included. The “Bangla Meaning” switches below only control that one field on word cards."
                                                checked={showBangla}
                                                onToggle={() => setShowBangla(!showBangla)}
                                                appTheme={appTheme}
                                            />

                                            <Group title="Main Word" dot="bg-indigo-500" titleCls="text-indigo-500">
                                                <div className={grid}>{rowsFor('main', mainItems, true)}</div>
                                            </Group>

                                            <Group title="Synonyms" dot="bg-emerald-500" titleCls="text-emerald-600">
                                                <ToggleRow emphasis label="Show Synonyms" hint="Turn off to hide synonyms everywhere." checked={!!fieldVisibility.synonyms} onToggle={() => toggleFieldVisibility('synonyms')} appTheme={appTheme} />
                                                <div className={grid}>{rowsFor('synonyms', subItems('synonyms'), !!fieldVisibility.synonyms)}</div>
                                            </Group>

                                            <Group title="Antonyms" dot="bg-rose-500" titleCls="text-rose-600">
                                                <ToggleRow emphasis label="Show Antonyms" hint="Turn off to hide antonyms everywhere." checked={!!fieldVisibility.antonyms} onToggle={() => toggleFieldVisibility('antonyms')} appTheme={appTheme} />
                                                <div className={grid}>{rowsFor('antonyms', subItems('antonyms'), !!fieldVisibility.antonyms)}</div>
                                            </Group>

                                            <button type="button" onClick={() => setFieldVisibility(DEFAULT_FIELD_VISIBILITY)} className="px-3 py-1.5 rounded-lg border border-slate-300 text-[11px] font-bold opacity-80 hover:opacity-100 hover:bg-slate-100 hover:text-slate-800 transition-all">↺ Reset all to shown</button>
                                        </React.Fragment>
                                    );
                                })()}
                            </div>

                            {/* KEYBOARD SHORTCUTS */}
                            <div className={`rounded-2xl border shadow-sm p-6 space-y-3 ${appTheme === 'light' ? 'bg-white border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20 text-slate-100' : 'bg-slate-900/70 border-slate-700 text-slate-100'}`}>
                                <div>
                                    <h2 className="text-xl font-extrabold flex items-center gap-2">
                                        <span>⌨️</span> Keyboard Shortcuts
                                    </h2>
                                    <p className="text-xs mt-0.5 opacity-80">Click a shortcut, then press the key you want to use.</p>
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    {[
                                        { key: 'submit', label: 'Submit answer (Game)' },
                                        { key: 'replay', label: 'Replay audio / flip card' },
                                        { key: 'exit', label: 'Exit focus mode (Game)' },
                                        { key: 'soundToggle', label: 'Toggle all sounds' },
                                        { key: 'flashNext', label: 'Flashcard: next card' },
                                        { key: 'flashPrev', label: 'Flashcard: previous card' },
                                    ].map(({ key, label }) => {
                                        const raw = shortcuts[key];
                                        const displayKey = raw === 'Space' ? 'Spacebar' : raw === 'ArrowRight' ? '→' : raw === 'ArrowLeft' ? '←' : raw === 'ArrowUp' ? '↑' : raw === 'ArrowDown' ? '↓' : raw;
                                        return (
                                            <div key={key} className={`rounded-xl border p-3 flex items-center justify-between gap-2 ${appTheme === 'light' ? 'bg-slate-50 border-slate-200' : appTheme === 'aurora' ? 'bg-white/10 border-white/20' : 'bg-slate-800/60 border-slate-700'}`}>
                                                <span className="text-[11px] opacity-80">{label}</span>
                                                <button
                                                    onClick={() => setListeningForShortcut(key)}
                                                    className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all shrink-0 ${listeningForShortcut === key ? 'bg-amber-500 text-white border-amber-400 animate-pulse' : appTheme === 'light' ? 'bg-white text-slate-700 border-slate-200 hover:bg-slate-100' : 'bg-slate-800/70 text-slate-100 border-slate-600 hover:bg-slate-700'}`}
                                                >
                                                    {listeningForShortcut === key ? 'Press a key…' : displayKey}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                                <button onClick={() => setShortcuts(DEFAULT_SHORTCUTS)} className="text-[11px] font-bold opacity-70 hover:opacity-100 underline">Reset to defaults</button>
                            </div>

                            {/* PAGES / BOOKS MANAGEMENT BOARD */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 border-slate-100">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <span>📚</span> Custom Pages & Books Manager
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Rename existing pages, set capacity goals, or create brand-new study lists.
                                        </p>
                                    </div>
                                    <button
                                        onClick={() => setShowAddPageModal(true)}
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                    >
                                        ➕ Add New Page
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                    {books.map(b => {
                                        const count = (allWords[b.id] || []).length;
                                        const isSelected = selectedBookId === b.id;
                                        return (
                                            <div key={b.id} className={`p-4 rounded-xl border transition-all ${isSelected ? 'border-indigo-500 bg-indigo-50/30 shadow-sm' : 'border-slate-200 bg-slate-50'}`}>
                                                <div className="flex justify-between items-start">
                                                    <div>
                                                        <h4 className="font-bold text-slate-900 text-base">{b.name}</h4>
                                                        <p className="text-xs text-slate-500 mt-0.5">{count} words ({b.targetCount ? `Goal: ${b.targetCount}` : 'Custom'})</p>
                                                    </div>
                                                    <button
                                                        onClick={() => setEditingPageObj({ ...b })}
                                                        className="p-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 border border-slate-200 rounded-lg transition-colors flex items-center justify-center"
                                                        title="Edit page name"
                                                    >
                                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                                            <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                                                        </svg>
                                                    </button>
                                                </div>

                                                <div className="mt-3 flex justify-between items-center border-t pt-2 border-slate-200/60">
                                                    <button
                                                        onClick={() => { setSelectedBookId(b.id); setActiveTab('list'); }}
                                                        className={`text-xs font-bold ${isSelected ? 'text-indigo-600' : 'text-slate-600 hover:text-indigo-600'}`}
                                                    >
                                                        {isSelected ? '✓ Currently Selected' : 'Switch to Page →'}
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* DATA MANAGEMENT — backup/restore everything, or export/import just this companion's words as JSON */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-5">
                                <div>
                                    <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                        <span>📊</span> Data Management
                                    </h2>
                                    <p className="text-xs text-slate-600 mt-1">
                                        "{activeBook.name}" is currently holding <span className="font-bold text-indigo-600">{currentWords.length}</span> active words. Paste JSON with meaning, context, example, and up to 3 synonyms/antonyms each — see the Prompt Template for the exact format.
                                    </p>
                                </div>

                                <div className="flex flex-wrap items-start gap-5">
                                    <div className="flex flex-col gap-1.5">
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Full Backup — every companion</span>
                                        <div className="flex flex-wrap gap-2">
                                            <button
                                                onClick={handleExportBackup}
                                                className="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                            >
                                                <span>💾 Export Backup</span>
                                            </button>
                                            <button
                                                onClick={() => importBackupInputRef.current?.click()}
                                                className="px-3.5 py-2 bg-slate-700 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                            >
                                                <span>📥 Import Backup</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="w-px self-stretch bg-slate-200 hidden sm:block"></div>

                                    <div className="flex flex-col gap-1.5">
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">JSON — just "{activeBook.name}"'s words</span>
                                        <div className="flex flex-wrap gap-2">
                                            <button
                                                onClick={handleExportJson}
                                                className="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                            >
                                                <span>📤 Export JSON</span>
                                            </button>
                                            <button
                                                onClick={() => importJsonInputRef.current?.click()}
                                                className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                            >
                                                <span>📄 Import JSON</span>
                                            </button>
                                        </div>
                                    </div>

                                    <div className="w-px self-stretch bg-slate-200 hidden sm:block"></div>

                                    <div className="flex flex-col gap-1.5">
                                        <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">AI Prompt</span>
                                        <button
                                            onClick={() => setShowGeminiPromptModal(true)}
                                            className="px-3.5 py-2 bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5"
                                        >
                                            <span>📋 Prompt Template</span>
                                        </button>
                                    </div>
                                </div>

                                <input
                                    ref={importBackupInputRef}
                                    type="file"
                                    accept="application/json,.json"
                                    className="hidden"
                                    onChange={handleImportBackupFile}
                                />
                                <input
                                    ref={importJsonInputRef}
                                    type="file"
                                    accept="application/json,.json"
                                    multiple
                                    className="hidden"
                                    onChange={handleImportJsonFile}
                                />

                                <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                                    <div className="flex justify-between items-center">
                                        <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">JSON Input (new format — old flat-format files still work too):</h3>
                                    </div>
                                    <textarea
                                        rows="7"
                                        value={importText}
                                        onChange={(e) => setImportText(e.target.value)}
                                        placeholder={`[\n  {\n    "word": "Abate",\n    "phonetics": "uh-BAYT",\n    "meaning_bn": "হ্রাস পাওয়া / কমানো",\n    "meaning_en": "To reduce",\n    "context_main": "Used primarily for intense forces like storms, winds, pain, or public nuisances.",\n    "example_main": "The storm finally abated after three days.",\n    "note": "",\n    "synonyms": [\n      { "word": "Subside", "phonetics": "...", "meaning_bn": "...", "meaning_en": "...", "context": "...", "sentence": "..." }\n    ],\n    "antonyms": [\n      { "word": "Intensify", "phonetics": "...", "meaning_bn": "...", "meaning_en": "...", "context": "...", "sentence": "..." }\n    ]\n  }\n]`}
                                        className="w-full font-mono text-xs p-3 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                    ></textarea>
                                    <div className="flex justify-between items-center">
                                        <button
                                            onClick={handleBulkImport}
                                            className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                        >
                                            Import / Smart-Merge into "{activeBook.name}"
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* TRASH BIN RESTORE SECTION */}
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b pb-3 border-slate-100">
                                    <div>
                                        <h2 className="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                                            <span>🗑️</span> Trash Bin for "{activeBook.name}" ({currentTrash.length})
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">
                                            Deleted words for this page are safely held here.
                                        </p>
                                    </div>

                                    {currentTrash.length > 0 && (
                                        <button
                                            onClick={restoreAllTrash}
                                            className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all"
                                        >
                                            Restore All Words
                                        </button>
                                    )}
                                </div>

                                {currentTrash.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 max-h-60 overflow-y-auto pr-1">
                                        {currentTrash.map(item => (
                                            <div key={item.id} className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex items-center justify-between gap-2">
                                                <div>
                                                    <span className="font-bold text-sm text-slate-800">{item.word}</span>
                                                    <p className="text-[11px] text-slate-500 truncate max-w-[150px]">{item.meaning}</p>
                                                </div>
                                                <div className="flex gap-1">
                                                    <button
                                                        onClick={() => restoreFromTrash(item.id)}
                                                        className="px-2 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 text-[11px] font-bold rounded-lg border border-emerald-300"
                                                        title="Restore Word"
                                                    >
                                                        ↺ Restore
                                                    </button>
                                                    <button
                                                        onClick={() => purgeFromTrash(item.id)}
                                                        className="p-1 text-slate-400 hover:text-red-600 rounded-lg text-xs"
                                                        title="Permanently Delete"
                                                    >
                                                        ❌
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200 text-xs text-slate-500">
                                        Trash bin is empty for "{activeBook.name}".
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
                <footer className="max-w-[1600px] mx-auto px-4 pb-8 pt-4 text-center">
                    <p className="text-xs font-semibold text-slate-500">Vocab Companion</p>
                    <p className="text-[11px] text-slate-400 mt-1">
                        Learn a little every day — build your vocabulary in bite-sized chunks, track it with XP, and make it a game you'll actually stick with.
                    </p>
                </footer>
                </div>
            );
        }

        ReactDOM.render(<AppErrorBoundary><App /></AppErrorBoundary>, document.getElementById('root'));
    </script>
</body>
</html>
