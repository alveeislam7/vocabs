                                            rows="2"
                                            value={editingWord.context_main || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, context_main: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Sentence Example</label>
                                        <textarea
                                            rows="2"
                                            value={editingWord.example_main || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, example_main: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>

                                    {/* SYNONYMS (0-3) */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-bold text-emerald-600 uppercase tracking-wider">Synonyms (up to 3, optional)</span>
                                            {(editingWord.synonyms || []).length < 3 && (
                                                <button
                                                    type="button"
                                                    onClick={() => addEditRelatedRow('synonyms')}
                                                    className="text-[11px] font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg"
                                                >
                                                    + Add Synonym
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            {(editingWord.synonyms || []).map((row, idx) => (
                                                <div key={idx} className="p-2 bg-emerald-50/40 border border-emerald-200 rounded-xl space-y-1.5 relative">
                                                    <button
                                                        type="button"
                                                        onClick={() => removeEditRelatedRow('synonyms', idx)}
                                                        className="absolute top-1.5 right-1.5 text-slate-400 hover:text-red-500 text-xs px-1"
                                                    >✕</button>
                                                    <input
                                                        type="text"
                                                        placeholder="Synonym word"
                                                        value={row.word}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'word', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs font-semibold pr-6"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Phonetics of this synonym"
                                                        value={row.phonetics || ''}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'phonetics', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs font-mono"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Bangla meaning of this synonym"
                                                        value={row.meaning_bn || ''}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'meaning_bn', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="English meaning of this synonym"
                                                        value={row.meaning_en || ''}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'meaning_en', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Use context of this synonym"
                                                        value={row.context}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'context', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Sentence example of this synonym"
                                                        value={row.sentence}
                                                        onChange={(e) => updateEditRelatedRow('synonyms', idx, 'sentence', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-emerald-200 rounded-lg text-xs"
                                                    />
                                                    <NoteEditor
                                                        rows={2}
                                                        placeholder="Note (your own, optional)"
                                                        value={row.note || ''}
                                                        onChange={(val) => updateEditRelatedRow('synonyms', idx, 'note', val)}
                                                        borderClass="border-emerald-200"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* ANTONYMS (0-3) */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <div className="flex items-center justify-between mb-2">
                                            <span className="text-xs font-bold text-rose-600 uppercase tracking-wider">Antonyms (up to 3, optional)</span>
                                            {(editingWord.antonyms || []).length < 3 && (
                                                <button
                                                    type="button"
                                                    onClick={() => addEditRelatedRow('antonyms')}
                                                    className="text-[11px] font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 px-2 py-1 rounded-lg"
                                                >
                                                    + Add Antonym
                                                </button>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            {(editingWord.antonyms || []).map((row, idx) => (
                                                <div key={idx} className="p-2 bg-rose-50/40 border border-rose-200 rounded-xl space-y-1.5 relative">
                                                    <button
                                                        type="button"
                                                        onClick={() => removeEditRelatedRow('antonyms', idx)}
                                                        className="absolute top-1.5 right-1.5 text-slate-400 hover:text-red-500 text-xs px-1"
                                                    >✕</button>
                                                    <input
                                                        type="text"
                                                        placeholder="Antonym word"
                                                        value={row.word}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'word', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs font-semibold pr-6"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Phonetics of this antonym"
                                                        value={row.phonetics || ''}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'phonetics', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs font-mono"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Bangla meaning of this antonym"
                                                        value={row.meaning_bn || ''}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'meaning_bn', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="English meaning of this antonym"
                                                        value={row.meaning_en || ''}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'meaning_en', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Use context of this antonym"
                                                        value={row.context}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'context', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs"
                                                    />
                                                    <input
                                                        type="text"
                                                        placeholder="Sentence example of this antonym"
                                                        value={row.sentence}
                                                        onChange={(e) => updateEditRelatedRow('antonyms', idx, 'sentence', e.target.value)}
                                                        className="w-full px-3 py-1.5 bg-white border border-rose-200 rounded-lg text-xs"
                                                    />
                                                    <NoteEditor
                                                        rows={2}
                                                        placeholder="Note (your own, optional)"
                                                        value={row.note || ''}
                                                        onChange={(val) => updateEditRelatedRow('antonyms', idx, 'note', val)}
                                                        borderClass="border-rose-200"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 pt-2 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => setEditingWord(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                    >
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* APP HEADER */}
                    <header className="bg-gradient-to-r from-indigo-900 via-blue-900 to-slate-900 rounded-2xl p-4 text-white shadow-xl mb-4">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                {/* PAGE / BOOK SWITCHER */}
                                <div className="flex flex-wrap items-center gap-2 mb-2">
                                    <div className="bg-white/10 p-1 rounded-xl border border-white/20 flex flex-wrap gap-1 items-center">
                                        {books.map(b => (
                                            <button
                                                key={b.id}
                                                onClick={() => { setSelectedBookId(b.id); setSelectedChunks([]); }}
                                                className={`px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                                                    selectedBookId === b.id
                                                        ? 'keep-white bg-white text-indigo-900 shadow-sm'
                                                        : 'text-indigo-200 hover:text-white'
                                                }`}
                                            >
                                                <span>📖 {b.name}</span>
                                                <span className="opacity-75 font-normal text-[10px]">({(allWords[b.id] || []).length}/{b.targetCount || 500})</span>
                                            </button>
                                        ))}

                                        {/* ADD PAGE BUTTON */}
                                        <button
                                            onClick={() => setShowAddPageModal(true)}
                                            className="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-500/30 hover:bg-emerald-500/50 text-emerald-100 border border-emerald-400/30 transition-all flex items-center gap-1"
                                            title="Add new custom page"
                                        >
                                            <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                            </svg>
                                        </button>
                                    </div>

                                    {/* RENAME ACTIVE PAGE */}
                                    <button
                                        onClick={() => setEditingPageObj({ ...activeBook })}
                                        className="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-indigo-100 border border-white/20 text-xs transition-all flex items-center gap-1"
                                        title="Rename active page"
                                    >
                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                                        </svg>
                                    </button>
                                </div>

                                {/* APP TITLE + WELCOME MESSAGE — grouped together with even
                                    spacing above (from the switcher row) and below (to the
                                    header's own padding), so the block doesn't look lopsided. */}
                                <div className="mt-1">
                                    <h1 className="text-xl md:text-2xl font-extrabold tracking-tight flex items-center gap-2">
                                        <span>{activeBook.name} Companion</span>
                                    </h1>
                                    <p className="text-indigo-200/80 text-xs sm:text-sm font-medium mt-1">
                                        Welcome back{(typeof displayName === 'string' && displayName && displayName !== 'Guest') ? ', ' + displayName.split(' ')[0] : ''}! Ready to grow your vocabulary today? ✨
                                    </p>
                                </div>
                            </div>

                            {/* TODAY'S GOAL + FAMILIARITY — compact, side by side */}
                            <div className="flex flex-col sm:flex-row gap-2 w-full md:w-auto">
                                <div className="bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-400/30 rounded-xl px-3 py-2 backdrop-blur-md sm:min-w-[210px]">
                                    <div className="flex items-center justify-between gap-2 text-xs font-semibold mb-1">
                                        <button type="button" onClick={() => setActiveTab('stats')} title="Open Stats & Streak" className="flex-1 flex items-center justify-between gap-2 text-left">
                                            <span>🎯 Today's goal</span>
                                            <span className="font-black text-amber-300">{todaysActivity.learned}/{dailyGoal}</span>
                                        </button>
                                        <button type="button" onClick={openDailyGoalSettings} title="Change daily goal" className="w-5 h-5 shrink-0 rounded-md bg-white/10 hover:bg-white/25 text-[11px] leading-none flex items-center justify-center">⚙</button>
                                    </div>
                                    <div className="w-full bg-slate-950/40 rounded-full h-2.5 overflow-hidden border border-amber-400/20">
                                        <div className={`h-full transition-all duration-500 ${todaysActivity.learned >= dailyGoal ? 'bg-emerald-400' : 'bg-amber-400'}`} style={{ width: `${Math.min(100, (todaysActivity.learned / dailyGoal) * 100)}%` }} />
                                    </div>
                                    <div className="flex justify-between text-[10px] text-amber-100/80 mt-1">
                                        <span>{todaysActivity.learned >= dailyGoal ? '🎉 Goal reached!' : `${dailyGoal - todaysActivity.learned} more to go`}</span>
                                        <span>🔥 {currentStreak}-day streak</span>
                                    </div>
                                </div>

                                <div className="bg-white/10 backdrop-blur-md rounded-xl px-3 py-2 border border-white/20 sm:min-w-[210px]">
                                    <div className="flex justify-between text-xs font-semibold mb-1">
                                        <span>Familiarity</span>
                                        <span>{currentWords.length > 0 ? Math.round((familiarityCounts.familiar / currentWords.length) * 100) : 0}% familiar</span>
                                    </div>
                                    <div className="w-full bg-slate-950/40 rounded-full h-2.5 overflow-hidden flex border border-indigo-400/20">
                                        {currentWords.length > 0 ? (
                                            <>
                                                <div className="h-full bg-slate-400 transition-all duration-500" style={{ width: `${(familiarityCounts.unfamiliar / currentWords.length) * 100}%` }} title="Unfamiliar" />
                                                <div className="h-full bg-amber-400 transition-all duration-500" style={{ width: `${(familiarityCounts.semi / currentWords.length) * 100}%` }} title="Semi-familiar" />
                                                <div className="h-full bg-emerald-400 transition-all duration-500" style={{ width: `${(familiarityCounts.familiar / currentWords.length) * 100}%` }} title="Familiar" />
                                            </>
                                        ) : (
                                            <div className="h-full w-full bg-slate-600/50" />
                                        )}
                                    </div>
                                    <div className="flex justify-between text-[10px] text-indigo-200 mt-1 gap-1">
                                        <button type="button" title="Show unfamiliar" onClick={() => setFilterFamiliarities(prev => prev.includes('unfamiliar') ? prev.filter(x => x !== 'unfamiliar') : [...prev, 'unfamiliar'])} className={`hover:text-white hover:no-underline no-underline transition-colors ${filterFamiliarities.includes('unfamiliar')?'text-white font-bold':''}`}>○ {familiarityCounts.unfamiliar}</button>
                                        <button type="button" title="Show semi-familiar" onClick={() => setFilterFamiliarities(prev => prev.includes('semi') ? prev.filter(x => x !== 'semi') : [...prev, 'semi'])} className={`hover:text-white hover:no-underline no-underline transition-colors ${filterFamiliarities.includes('semi')?'text-amber-200 font-bold':''}`}>◐ {familiarityCounts.semi}</button>
                                        <button type="button" title="Show familiar" onClick={() => setFilterFamiliarities(prev => prev.includes('familiar') ? prev.filter(x => x !== 'familiar') : [...prev, 'familiar'])} className={`hover:text-white hover:no-underline no-underline transition-colors inline-flex items-center gap-0.5 ${filterFamiliarities.includes('familiar')?'text-emerald-200 font-bold':''}`}><span style={{fontSize:'16px',lineHeight:1,transform:'translateY(-2px)',display:'inline-block'}}>●</span> {familiarityCounts.familiar}</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* NAVIGATION TABS + ACCOUNT */}

                            <div className="flex flex-wrap gap-2 flex-1 min-w-0">
                                {[
                                    { id: 'list', label: '📖 Word List', desc: 'Browse & Study' },
                                    { id: 'flashcards', label: '🎴 Flashcards', desc: 'Memorize & Flip' },
                                    { id: 'quiz', label: '🧠 Practice Quiz', desc: 'Test Knowledge' },
                                    { id: 'game', label: '🎮 Word Quest', desc: 'Canvas Arena & Bosses' },
                                    { id: 'multi', label: '🌐 Multiplayer', desc: 'Play with friends' },
                                    { id: 'stats', label: '📊 Stats & Streak', desc: 'Progress & Activity' },
                                    { id: 'manage', label: '⚙️ Word Manager', desc: 'Pages & Import' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex-1 min-w-[120px] py-2.5 px-3 rounded-xl text-xs font-bold transition-all duration-200 flex flex-col items-center justify-center ${
                                            activeTab === tab.id
                                                ? 'keep-white bg-white text-indigo-900 shadow-lg scale-[1.02]'
                                                : 'bg-indigo-950/40 text-indigo-100 hover:bg-indigo-800/60 border border-indigo-400/20'
                                        }`}
                                    >
                                        <span>{tab.label}</span>
                                    </button>
                                ))}
                            </div>

                            {/* NOTIFICATIONS BELL — pokes, room invites, and challenges needing
                                your attention, visible from anywhere, not just the Multiplayer
                                tab. "Open" routes you to the Multiplayer tab where the full,
                                interactive UI for that item already lives; dismissing a poke or
                                declining an invite happens right here. */}
                            {cloudUser && (
                                <div className="relative shrink-0">
                                    <button
                                        type="button"
                                        onClick={() => setShowNotifPanel(p => !p)}
                                        className="relative w-9 h-9 rounded-xl bg-white/10 hover:bg-white/20 border border-white/20 flex items-center justify-center text-base transition-colors"
                                        title="Notifications"
                                    >
                                        🔔
                                        {notifTotalCount > 0 && (
                                            <span className="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-rose-500 text-white text-[10px] font-black flex items-center justify-center">
                                                {notifTotalCount > 9 ? '9+' : notifTotalCount}
                                            </span>
                                        )}
                                    </button>
                                    {showNotifPanel && (
                                        <React.Fragment>
                                            <div className="fixed inset-0 z-40" onClick={() => setShowNotifPanel(false)} />
                                            <div className="absolute right-0 top-11 z-50 w-80 max-w-[90vw] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
                                                <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                                                    <span className="text-sm font-black text-slate-800">Notifications</span>
                                                    {notifTotalCount === 0 && <span className="text-[11px] text-slate-400">All caught up</span>}
                                                </div>
                                                <div className="max-h-96 overflow-y-auto divide-y divide-slate-100">
                                                    {Object.entries(notifInvites).map(([fromUid, inv]) => (
                                                        <div key={`inv-${fromUid}`} className="px-4 py-3 flex items-center gap-3">
                                                            {inv.photo ? (
                                                                <img src={inv.photo} alt="" className="w-8 h-8 rounded-full shrink-0" referrerPolicy="no-referrer" />
                                                            ) : (
                                                                <span className="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-xs font-bold shrink-0">{(inv.from || '?')[0].toUpperCase()}</span>
                                                            )}
                                                            <div className="flex-1 min-w-0">
                                                                <div className="text-xs font-bold text-slate-800 truncate">{inv.from} invited you to a room</div>
                                                                <div className="flex gap-2 mt-1.5">
                                                                    <button type="button" onClick={() => { setActiveTab('multi'); setShowNotifPanel(false); }} className="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-bold hover:bg-indigo-700">Open</button>
                                                                    <button type="button" onClick={() => { const F = window.FB; if (F && F.rtdb) F.dbRemove(F.dbRef(F.rtdb, `invites/${cloudUser.uid}/${fromUid}`)).catch(() => {}); }} className="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold hover:bg-slate-200">Dismiss</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    {Object.entries(notifPokes).map(([fromUid, pk]) => (
                                                        <div key={`poke-${fromUid}`} className="px-4 py-3 flex items-center gap-3">
                                                            {pk.photo ? (
                                                                <img src={pk.photo} alt="" className="w-8 h-8 rounded-full shrink-0" referrerPolicy="no-referrer" />
                                                            ) : (
                                                                <span className="w-8 h-8 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-xs font-bold shrink-0">{(pk.from || '?')[0].toUpperCase()}</span>
                                                            )}
                                                            <div className="flex-1 min-w-0">
                                                                <div className="text-xs font-bold text-slate-800 truncate">👋 {pk.from} poked you</div>
                                                                <button type="button" onClick={() => { const F = window.FB; if (F && F.rtdb) F.dbRemove(F.dbRef(F.rtdb, `pokes/${cloudUser.uid}/${fromUid}`)).catch(() => {}); }} className="mt-1.5 px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600 text-[11px] font-bold hover:bg-slate-200">Got it</button>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    {notifActionableChallengeCount > 0 && (
                                                        <div className="px-4 py-3 flex items-center gap-3">
                                                            <span className="w-8 h-8 rounded-full bg-violet-100 text-violet-700 flex items-center justify-center text-sm shrink-0">⚔️</span>
                                                            <div className="flex-1 min-w-0">
                                                                <div className="text-xs font-bold text-slate-800">{notifActionableChallengeCount} challenge{notifActionableChallengeCount > 1 ? 's' : ''} need{notifActionableChallengeCount === 1 ? 's' : ''} your attention</div>
                                                                <button type="button" onClick={() => { setActiveTab('multi'); setShowNotifPanel(false); }} className="mt-1.5 px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-bold hover:bg-indigo-700">Open Challenges</button>
                                                            </div>
                                                        </div>
                                                    )}
                                                    {notifTotalCount === 0 && (
                                                        <div className="px-4 py-6 text-center text-xs text-slate-400">Nothing new right now.</div>
                                                    )}
                                                </div>
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            )}

                            {/* ACCOUNT / CLOUD SYNC — sign in with Google to back your data up
                                and carry it to any other device; everything keeps working
                                locally exactly as before while signed out. */}
                            <div className="shrink-0">
                                {!cloudAuthReady ? (
                                    <div className="px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white/5 text-indigo-200/60 border border-white/10">
                                        Checking account…
                                    </div>
                                ) : cloudUser ? (
                                    <button
                                        type="button"
                                        onClick={() => { setNicknameDraft(nickname); setShowProfileModal(true); }}
                                        title="Open profile"
                                        className="flex items-center gap-2 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl pl-1.5 pr-2.5 py-1.5 transition-colors"
                                    >
                                        {cloudUser.photoURL ? (
                                            <img src={cloudUser.photoURL} alt="" className="w-6 h-6 rounded-full" referrerPolicy="no-referrer" />
                                        ) : (
                                            <span className="w-6 h-6 rounded-full bg-indigo-500 flex items-center justify-center text-[11px] font-bold shrink-0">
                                                {(displayName || '?')[0].toUpperCase()}
                                            </span>
                                        )}
                                        <div className="leading-tight text-left">
                                            <div className="text-[11px] font-bold truncate max-w-[110px]">{displayName}</div>
                                            <div className="text-[9px] font-semibold uppercase tracking-wider flex items-center gap-1">
                                                <span className={`w-1.5 h-1.5 rounded-full ${
                                                    cloudSyncStatus === 'error' ? 'bg-rose-400' :
                                                    (cloudSyncStatus === 'saving' || cloudSyncStatus === 'loading') ? 'bg-amber-400 animate-pulse' :
                                                    'bg-emerald-400'
                                                }`}></span>
                                                <span className="text-indigo-200/70">
                                                    {cloudSyncStatus === 'error' ? 'Sync error' : cloudSyncStatus === 'saving' ? 'Saving…' : cloudSyncStatus === 'loading' ? 'Loading…' : 'Synced'}
                                                </span>
                                            </div>
                                        </div>
                                        <span className="ml-1 text-indigo-200/50 text-[10px]">▸</span>
                                    </button>
                                ) : (
                                    <button
                                        type="button"
                                        onClick={signInWithGoogle}
                                        className="flex items-center gap-2 px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white text-indigo-900 hover:bg-indigo-50 shadow-sm transition-all"
                                    >
                                        <svg className="w-3.5 h-3.5" viewBox="0 0 48 48">
                                            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                                            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                                            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6c-2 1.5-4.6 2.4-7.7 2.4-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
                                            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.6C40.9 36.5 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                                        </svg>
                                        <span>Sign in with Google</span>
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* GLOBAL CHUNK SELECTOR & SHUFFLE BAR */}
                    {activeTab !== 'manage' && activeTab !== 'stats' && (
                        <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                                <div className="flex items-center gap-2 font-bold text-xs text-slate-500 whitespace-nowrap">
                                    <span>⭕ CHUNK:</span>
                                    <BarSelect
                                        title="Tick one or more chunks. Bar: green = familiar, yellow = semi-familiar, blank = not learned yet"
                                        values={selectedChunks}
                                        onChange={(vals) => { setSelectedChunks(vals.map(Number).sort((a, b) => a - b)); setCardIndex(0); }}
                                        allLabel="Select all"
                                        clearLabel="Show all"
                                        closedText={
                                            selectedChunks.length === 0 ? `All Words (${currentWords.length} words)`
                                            : selectedChunks.length === 1 ? (chunksList[selectedChunks[0]]?.label || 'Chunk')
                                            : `${selectedChunks.length} chunks selected`
                                        }
                                        options={chunksList.map(chunk => {
                                            const st = chunkStats.chunks[chunk.index] || { total: 0, familiar: 0, semi: 0, unfamiliar: 0 };
                                            return {
                                                value: chunk.index,
                                                label: chunk.label,
                                                right: `${st.total} words`,
                                                segments: st.total ? [
                                                    { pct: (st.familiar / st.total) * 100, cls: 'bg-emerald-500' },
                                                    { pct: (st.semi / st.total) * 100, cls: 'bg-yellow-400' }
                                                ] : []
                                            };
                                        })}
                                    />
                                </div>
                                <div className="flex items-center gap-2 font-bold text-xs text-slate-500 whitespace-nowrap">
                                    <span>○ STATUS:</span>
                                    <BarSelect
                                        title="Tick one or more statuses (applies across all study tabs). Bar = that status's share of the selected chunk(s)"
                                        values={filterFamiliarities}
                                        onChange={(vals) => setFilterFamiliarities(vals)}
                                        allLabel="Select all"
                                        clearLabel="Show all"
                                        closedText={
                                            filterFamiliarities.length === 0 ? `All words (${currentWords.length})`
                                            : filterFamiliarities.map(v => ({
                                                unfamiliar: `○ Unfamiliar (${familiarityCounts.unfamiliar})`,
                                                semi: `◐ Semi-familiar (${familiarityCounts.semi})`,
                                                familiar: `⬤ Familiar (${familiarityCounts.familiar})`
                                            }[v])).filter(Boolean).join(' + ')
                                        }
                                        options={[
                                            { value: 'unfamiliar', label: '○ Unfamiliar', right: `${statusStats.unfamiliar}`, segments: [{ pct: statusStats.total ? (statusStats.unfamiliar / statusStats.total) * 100 : 0, cls: 'bg-slate-400' }] },
                                            { value: 'semi', label: '◐ Semi-familiar', right: `${statusStats.semi}`, segments: [{ pct: statusStats.total ? (statusStats.semi / statusStats.total) * 100 : 0, cls: 'bg-yellow-400' }] },
                                            { value: 'familiar', label: '⬤ Familiar', right: `${statusStats.familiar}`, segments: [{ pct: statusStats.total ? (statusStats.familiar / statusStats.total) * 100 : 0, cls: 'bg-emerald-500' }] }
                                        ]}
                                    />
                                </div>
                                <label className="flex items-center gap-2 font-bold text-xs text-slate-500 whitespace-nowrap">
                                    <span>↕ SORT:</span>
                                    <select
                                        value={sortBy}
                                        onChange={(e) => setSortBy(e.target.value)}
                                        className="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-bold text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        title="Sort the word list"
                                    >
                                        <option value="default">Default order</option>
                                        <option value="name-asc">Name (A → Z)</option>
                                        <option value="name-desc">Name (Z → A)</option>
                                        <option value="date-newest">Date added (Newest)</option>
                                        <option value="date-oldest">Date added (Oldest)</option>
                                    </select>
                                </label>
                            </div>

                            {/* ADD WORD & SHUFFLE TOGGLE */}
                            <div className="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                                {/* GLOBAL US/UK PRONUNCIATION TOGGLE — applies everywhere audio is played */}
                                <div className="flex items-center gap-1 bg-slate-50 border border-slate-200 rounded-xl p-1" title="Pronunciation accent used everywhere">
                                    <button
                                        onClick={() => setSpeechAccent('us')}
                                        className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${
                                            speechAccent === 'us'
                                                ? 'bg-blue-50 text-blue-600 border-blue-300 shadow-sm'
                                                : 'text-slate-500 border-transparent hover:bg-slate-100'
                                        }`}
                                    >
                                        <svg viewBox="0 0 24 24" fill="currentColor" className="w-3.5 h-3.5" aria-hidden="true">
                                            <path d="M3 9v6h4l5 5V4L7 9H3z" />
                                            <path d="M16.5 12c0-1.77-.77-3.29-2-4.34v8.68c1.23-1.05 2-2.57 2-4.34z" />
                                            <path d="M14.5 4.53v1.06A6.986 6.986 0 0 1 18.5 12a6.986 6.986 0 0 1-4 6.41v1.06A7.977 7.977 0 0 0 20 12a7.977 7.977 0 0 0-5.5-7.47z" />
                                        </svg>
                                        US
                                    </button>
                                    <button
                                        onClick={() => setSpeechAccent('uk')}
                                        className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${
                                            speechAccent === 'uk'
                                                ? 'bg-purple-50 text-purple-600 border-purple-300 shadow-sm'
                                                : 'text-slate-500 border-transparent hover:bg-slate-100'
                                        }`}
                                    >
                                        <svg viewBox="0 0 24 24" fill="currentColor" className="w-3.5 h-3.5" aria-hidden="true">
                                            <path d="M3 9v6h4l5 5V4L7 9H3z" />
                                            <path d="M16.5 12c0-1.77-.77-3.29-2-4.34v8.68c1.23-1.05 2-2.57 2-4.34z" />
                                            <path d="M14.5 4.53v1.06A6.986 6.986 0 0 1 18.5 12a6.986 6.986 0 0 1-4 6.41v1.06A7.977 7.977 0 0 0 20 12a7.977 7.977 0 0 0-5.5-7.47z" />
                                        </svg>
                                        UK
                                    </button>
                                </div>

                                <button
                                    onClick={() => setShowAddWordModal(true)}
                                    className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 text-xs font-bold rounded-xl shadow-sm transition-all flex items-center gap-1.5 active:scale-95"
                                >
                                    <span className="text-current">➕</span>
                                    <span>Add Word</span>
                                </button>

                                <button
                                    onClick={() => {
                                        setIsShuffled(!isShuffled);
                                        setShuffleSeed(prev => prev + 1);
                                        triggerToast(isShuffled ? "Sorted back to original order." : "Randomized word order!");
                                    }}
                                    className={`px-3 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition-all ${
                                        isShuffled
                                            ? 'bg-indigo-100 text-indigo-700 border-indigo-200 dark:bg-indigo-950 dark:text-indigo-300'
                                            : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                    }`}
                                >
                                    <span>🔀</span>
                                    <span>{isShuffled ? 'Shuffled' : 'Shuffle'}</span>
                                </button>

                                {/* QUICK THEME TOGGLE — moved here from the header to free up space there */}
                                <button
                                    onClick={() => setAppTheme(appTheme === 'light' ? 'midnight' : 'light')}
                                    title="Toggle Light/Dark theme"
                                    className="px-3 py-2 rounded-xl text-xs font-bold border flex items-center gap-1.5 transition-all bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100"
                                >
                                    <span>{appTheme === 'light' ? '☀️' : '🌙'}</span>
                                </button>
                            </div>

                        </div>
                    )}

                    {/* MODE 1: WORD LIST VIEW */}
                    {activeTab === 'list' && (
                        <div className="space-y-4 tab-panel-enter">
                            {/* SEARCH & FILTERS */}
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                                {/* On wide screens: alphabet filter on the left (gets the
                                    remaining space to spread out), search box on the right,
                                    wide enough that typed text doesn't get clipped. */}
                                <div className="flex flex-col lg:flex-row lg:items-center gap-3">
                                    {/* ALPHABET FILTER */}
                                    <div className="flex flex-wrap gap-1 order-2 lg:order-1 pt-2 lg:pt-0 border-t lg:border-t-0 lg:border-r border-slate-100 lg:pr-3 lg:flex-1 lg:min-w-0">
                                        {alphabet.map(letter => (
                                            <button
                                                key={letter}
                                                onClick={() => setSelectedLetter(letter)}
                                                className={`px-2.5 py-1 text-xs font-semibold rounded-lg transition-colors ${
                                                    selectedLetter === letter
                                                        ? 'bg-indigo-600 text-white'
                                                        : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                                }`}
                                            >
                                                {letter}
                                            </button>
                                        ))}
                                    </div>

                                    <div className="relative w-full order-1 lg:order-2 lg:w-96 lg:max-w-[48%] lg:shrink-0">
                                        <input
                                            type="text"
                                            placeholder={showBangla ? "Search word, English meaning, or Bengali (বাংলা)..." : "Search word or English meaning..."}
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        />
                                        <svg className="w-5 h-5 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                                    </div>
                                </div>
                            </div>

                            {/* MASTER-DETAIL LAYOUT: left pane is a compact list of just word
                                names (plus their synonyms/antonyms nested underneath) — clicking
                                any of them shows that word's full card on the right. Drag the
                                handle between the panes to resize (desktop only). */}
                            <div id="word-list-top" className="flex flex-col lg:flex-row gap-4 lg:gap-0 items-start instant-theme" style={{ '--word-list-width-pct': `${wordListWidthPercent}%` }}>
                                {/* OUTER LEFT HANDLE — desktop only; drag to grow/shrink the whole
                                    width symmetrically (left pane and right pane scale together,
                                    keeping their current ratio). Different from the middle handle,
                                    which only shifts the ratio between the two panes. */}
                                <div
                                    onMouseDown={startWholeResize('left')}
                                    onTouchStart={startWholeResize('left')}
                                    className="hidden lg:flex items-center justify-center w-3 self-stretch cursor-col-resize shrink-0 group"
                                    title="Drag to widen or narrow the whole list (both sides scale together)"
                                >
                                    <div className="w-1 h-10 rounded-full bg-slate-200 group-hover:bg-indigo-300 transition-colors"></div>
                                </div>

                                {/* LEFT: word names only */}
                                <div className="word-list-pane-resizable w-full shrink-0 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col max-h-[28rem] lg:max-h-[87.5vh]" style={listPaneWidth !== null ? { '--list-pane-w': `${listPaneWidth}px` } : undefined}>
                                    <div className={`shrink-0 h-11 flex items-center px-4 border-b border-slate-100 transition-shadow ${leftPaneScrolled ? 'shadow-[0_2px_4px_-2px_rgba(0,0,0,0.08)]' : ''}`}>
                                        <span className="text-[11px] font-bold text-indigo-600 uppercase tracking-wider">Word</span>
                                    </div>
                                    <div className="flex-1 min-h-0 overflow-y-auto" onScroll={(e) => setLeftPaneScrolled(e.currentTarget.scrollTop > 4)}>
                                        {pagedWords.map((item) => {
                                            const famLevel = getFamiliarity(item.id);
                                            const isSelected = selectedWordId === item.id;
                                            const dotColor = famLevel === 'familiar' ? 'bg-emerald-500' : famLevel === 'semi' ? 'bg-amber-400' : 'bg-slate-300';
                                            return (
                                                <div key={item.id} className={`word-list-row-group border-b border-slate-200/50 last:border-b-0 transition-colors ${isSelected ? 'bg-slate-100' : ''}`}>
                                                    <button
                                                        onClick={() => selectWordFromList(item.id)}
                                                        className="w-full text-left pl-3 pr-2 py-2 flex items-center justify-between gap-2"
                                                    >
                                                        <span className={`text-sm font-bold truncate ${isSelected ? 'text-indigo-600' : 'text-slate-800'}`}>{item.word}</span>
                                                        <span className={`w-2 h-2 rounded-full shrink-0 ${dotColor}`}></span>
                                                    </button>
                                                    {((item.synonyms || []).length > 0 || (item.antonyms || []).length > 0) && (
                                                        <div className="pb-1">
                                                            {(item.synonyms || []).map((s) => (
                                                                <button
                                                                    key={s.id}
                                                                    onClick={() => selectWordFromList(item.id)}
                                                                    className="block w-full text-left pl-6 pr-2 py-1 text-xs truncate text-emerald-700"
                                                                >
                                                                    {s.word}
                                                                </button>
                                                            ))}
                                                            {(item.antonyms || []).map((a) => (
                                                                <button
                                                                    key={a.id}
                                                                    onClick={() => selectWordFromList(item.id)}
                                                                    className="block w-full text-left pl-6 pr-2 py-1 text-xs truncate text-rose-700"
                                                                >
                                                                    {a.word}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    )}
                                                </div>
                                            );
                                        })}
                                        {pagedWords.length === 0 && (
                                            <div className="px-3 py-6 text-center text-xs text-slate-400">No words on this page.</div>
                                        )}
                                    </div>
                                </div>

                                {/* DRAG HANDLE — desktop only; resizes the left pane */}
                                <div
                                    onMouseDown={startPaneDrag}
                                    onTouchStart={startPaneDrag}
                                    className="hidden lg:flex items-center justify-center w-3 self-stretch cursor-col-resize shrink-0 group"
                                    title="Drag to resize"
                                >
                                    <div className="w-1 h-10 rounded-full bg-slate-200 group-hover:bg-indigo-300 transition-colors"></div>
                                </div>

                                {/* RIGHT: full detail card for the selected word — capped at the
                                    same max height as the left pane, so it never grows past it;
                                    scroll only appears if the content actually needs more room. */}
                                <div id="word-detail-panel" className="flex-1 min-w-0 w-full">
                                    {(() => {
                                        const selectedItem = pagedWords.find(w => w.id === selectedWordId) || filteredWords.find(w => w.id === selectedWordId);
                                        if (!selectedItem) {
                                            return (
                                                <div className="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-400 text-sm">
                                                    Select a word from the list to see its details here.
                                                </div>
                                            );
                                        }
                                        const famLevel = getFamiliarity(selectedItem.id);
                                        return <WordCard item={selectedItem} famLevel={famLevel} detailMode />;
                                    })()}
                                </div>

                                {/* OUTER RIGHT HANDLE — same whole-width symmetric resize as the
                                    left edge handle, just grabbable from the other side. */}
                                <div
                                    onMouseDown={startWholeResize('right')}
                                    onTouchStart={startWholeResize('right')}
                                    className="hidden lg:flex items-center justify-center w-3 self-stretch cursor-col-resize shrink-0 group"
                                    title="Drag to widen or narrow the whole list (both sides scale together)"
                                >
                                    <div className="w-1 h-10 rounded-full bg-slate-200 group-hover:bg-indigo-300 transition-colors"></div>
                                </div>
                            </div>

                            {filteredWords.length > 0 && (
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 mt-6 py-4 border-t border-slate-200">
                                    <div className="text-sm text-slate-600 font-medium">
                                        Showing {startItem}-{endItem} of {filteredWords.length} words
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button
                                            onClick={() => goToPage(currentPage - 1)}
                                            disabled={currentPage === 1}
                                            className={`px-3 py-2 rounded-xl text-sm font-bold border transition-all ${currentPage === 1 ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}
                                        >
                                            Prev
                                        </button>
                                        <span className="px-3 py-2 rounded-xl bg-indigo-600 text-white text-sm font-bold">
                                            Page {currentPage} of {totalPages}
                                        </span>
                                        <button
                                            onClick={() => goToPage(currentPage + 1)}
                                            disabled={currentPage === totalPages || totalPages === 0}
                                            className={`px-3 py-2 rounded-xl text-sm font-bold border transition-all ${currentPage === totalPages || totalPages === 0 ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}
                                        >
                                            Next
                                        </button>
                                    </div>
                                </div>
                            )}

                            {filteredWords.length === 0 && (
                                <div className="text-center py-12 bg-white rounded-2xl border border-slate-200 space-y-2">
                            <p className="text-slate-500 text-base font-semibold">No vocabulary words found matching your selection.</p>
                                    <p className="text-xs text-slate-400">Try adding words or selecting a different chunk or page.</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* MODE 2: FLASHCARDS VIEW */}
                    {activeTab === 'flashcards' && playablePool.length > 0 && (
                        <div className="max-w-xl mx-auto space-y-6">
                            <div className="flex items-center justify-between bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-sm">
                                <div className="flex items-center gap-3">
                                    <label className="flex items-center gap-1.5 cursor-pointer text-xs font-semibold text-slate-700">
                                        <input
                                            type="checkbox"
                                            checked={autoAudio}
                                            onChange={(e) => setAutoAudio(e.target.checked)}
                                            className="rounded text-indigo-600 focus:ring-indigo-500"
                                        />
                                        Auto Audio
                                    </label>
                                </div>
                                <span className="text-xs font-semibold text-slate-500">
                                    Card {cardIndex + 1} of {playablePool.length} · click flip · drag slide
                                </span>
                            </div>

                            {/* FLIP CARD — click flips, horizontal drag goes next/prev */}
                            <div 
                                data-flip-btn
                                onClick={() => {
                                    if (flashDragRef.current.swiped) {
                                        flashDragRef.current.swiped = false;
                                        return;
                                    }
                                    setIsFlipped(!isFlipped);
                                }}
                                onPointerDown={(e) => {
                                    flashDragRef.current = { active: true, startX: e.clientX, dx: 0, swiped: false };
                                    e.currentTarget.setPointerCapture?.(e.pointerId);
                                    if (cardDragElRef.current) cardDragElRef.current.style.transition = 'none';
                                }}
                                onPointerMove={(e) => {
                                    if (!flashDragRef.current.active) return;
                                    const dx = e.clientX - flashDragRef.current.startX;
                                    flashDragRef.current.dx = dx;
                                    const el = cardDragElRef.current;
                                    if (el) {
                                        const shrink = Math.max(1 - Math.abs(dx) / 800, 0.9);
                                        const fade = Math.max(1 - Math.abs(dx) / 350, 0.35);
                                        el.style.transform = `translateX(${dx}px) scale(${shrink})`;
                                        el.style.opacity = String(fade);
                                    }
                                }}
                                onPointerUp={() => {
                                    const dx = flashDragRef.current.dx || 0;
                                    flashDragRef.current.active = false;
                                    const el = cardDragElRef.current;
                                    if (Math.abs(dx) >= 60) {
                                        flashDragRef.current.swiped = true;
                                        const dir = dx < 0 ? 'next' : 'prev';
                                        // Finish the swipe: shrink and fade the current card the rest
                                        // of the way off-screen, then swap to the next/previous card
                                        // once it's gone — which plays its own entrance animation.
                                        if (el) {
                                            el.style.transition = 'transform 0.34s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.34s ease';
                                            el.style.transform = `translateX(${dx < 0 ? -420 : 420}px) scale(0.82)`;
                                            el.style.opacity = '0';
                                        }
                                        setCardSlideDir(dir);
                                        setIsFlipped(false);
                                        setTimeout(() => {
                                            setCardIndex((prev) => dir === 'next'
                                                ? (prev < playablePool.length - 1 ? prev + 1 : 0)
                                                : (prev > 0 ? prev - 1 : playablePool.length - 1));
                                        }, 280);
                                    } else if (el) {
                                        // Didn't drag far enough — smoothly snap back to center.
                                        el.style.transition = 'transform 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease';
                                        el.style.transform = 'translateX(0) scale(1)';
                                        el.style.opacity = '1';
                                    }
                                    flashDragRef.current.dx = 0;
                                }}
                                onPointerCancel={() => {
                                    flashDragRef.current = { active: false, startX: 0, dx: 0, swiped: false };
                                    const el = cardDragElRef.current;
                                    if (el) {
                                        el.style.transition = 'transform 0.28s ease, opacity 0.28s ease';
                                        el.style.transform = 'translateX(0) scale(1)';
                                        el.style.opacity = '1';
                                    }
                                }}
                                ref={cardDragElRef}
                                key={cardIndex}
                                className={`relative w-full cursor-pointer perspective-1000 touch-pan-y select-none ${cardSlideDir === 'next' ? 'flash-slide-next' : 'flash-slide-prev'}`}
                                style={{
                                    height: `${(isFlipped && cardDetailsExpanded ? FLASHCARD_EXPANDED_HEIGHT + flashcardExtraHeight : FLASHCARD_BASE_HEIGHT)}px`,
                                    transition: 'height 0.4s cubic-bezier(0.4, 0, 0.2, 1)'
                                }}
                            >
                                <div className={`card-inner w-full h-full relative rounded-2xl shadow-xl transition-all duration-500 ${isFlipped ? 'card-flipped' : ''}`}>
                                    <div className="card-front absolute inset-0 bg-gradient-to-br from-indigo-800 to-slate-900 rounded-2xl p-8 text-white flex flex-col items-center text-center shadow-lg">
                                        <div className="w-full flex justify-between items-center text-xs opacity-80">
                                            <span>Click to flip · slide for next</span>
                                            <span>{activeBook.name}</span>
                                        </div>
                                        <div className="flex-1 flex flex-col items-center justify-center space-y-3">
                                            <h2 className="text-4xl font-extrabold tracking-wide">{playablePool[cardIndex].word}</h2>
                                            {fieldVisibility.phonetics && playablePool[cardIndex].phonetics && (
                                                <p className="text-indigo-200 font-mono text-base bg-indigo-900/40 px-3 py-1 rounded-full border border-indigo-400/30 inline-block">
                                                    [{playablePool[cardIndex].phonetics}]
                                                </p>
                                            )}
                                            <div className="flex justify-center" onClick={(e) => e.stopPropagation()}>
                                                <SpeakPair text={playablePool[cardIndex].word} notify={triggerToast} accent={speechAccent} variant="onDark" primaryAudioBtn />
                                            </div>
                                        </div>
                                    </div>

                                    <div className="card-back absolute inset-0 bg-white border-2 border-indigo-500 rounded-2xl p-8 text-slate-800 flex flex-col justify-between items-center text-center shadow-lg">
                                        <div className="w-full flex justify-between items-center text-xs text-slate-400">
                                            <span>Meaning & Usage</span>
                                            <div className="flex items-center gap-2">
                                                {fieldVisibility.meaning_bn && showBangla && <span className="text-emerald-600 font-bold">বাংলা অর্থ</span>}
                                                <ExpandToggleIcon
                                                    expanded={cardDetailsExpanded}
                                                    onClick={() => setCardDetailsExpanded(v => {
                                                        const next = !v;
                                                        if (next) {
                                                            const cardEl = document.querySelector('[data-flip-btn]');
                                                            const scrollTarget = cardEl?.parentElement || cardEl;
                                                            setTimeout(() => scrollTarget?.scrollIntoView({ behavior: 'smooth', block: 'end' }), 420);
                                                        }
                                                        return next;
                                                    })}
                                                    className="!w-6 !h-6"
                                                />
                                            </div>
                                        </div>
                                        <div className="space-y-3 w-full flex-1 min-h-0 overflow-y-auto">
                                            <div className="space-y-1">
                                                {fieldVisibility.meaning_bn && showBangla && (playablePool[cardIndex].meaning_bn || playablePool[cardIndex].bangla) && (
                                                    <p className="text-2xl font-bold text-emerald-700">{playablePool[cardIndex].meaning_bn || playablePool[cardIndex].bangla}</p>
                                                )}
                                                {fieldVisibility.meaning_en && (
                                                    <p className="text-base font-medium text-slate-500">{playablePool[cardIndex].meaning_en || playablePool[cardIndex].meaning}</p>
                                                )}
                                            </div>
                                            {/* Level 1 (always visible once flipped): phonetic (front) + bangla/English
                                                meaning + context + example — just this one word, flashcard-style. */}
                                            {((fieldVisibility.context_main && playablePool[cardIndex].context_main) || (fieldVisibility.example_main && (playablePool[cardIndex].example_main || playablePool[cardIndex].sentence))) && (
                                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 sentence-example flex items-center justify-between gap-2 text-left">
