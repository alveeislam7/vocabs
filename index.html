                        const flip = document.querySelector('[data-flip-btn]');
                        if (flip) { e.preventDefault(); flip.click(); }
                    }
                    if (matches(e, shortcuts.submit)) {
                        const submitBtn = document.querySelector('[data-submit-btn]');
                        if (submitBtn && !submitBtn.disabled) submitBtn.click();
                    }
                };
                window.addEventListener('keydown', handleGlobalKeyDown);
                return () => window.removeEventListener('keydown', handleGlobalKeyDown);
            }, [shortcuts, listeningForShortcut]);

            // VARIANT MODE TOGGLE SWITCH (REPLACED STREAM MODE)
            const [isVariantMode, setIsVariantMode] = useState(() => {
                const saved = localStorage.getItem('wordsmart_variant_mode');
                if (saved !== null) return JSON.parse(saved);
                // Backward compatibility check for stream mode
                const oldStream = localStorage.getItem('wordsmart_stream_mode');
                return oldStream !== null ? JSON.parse(oldStream) : false;
            });

            // GAMIFICATION & LEVELING STATE
            const [userXP, setUserXP] = useState(() => {
                const saved = localStorage.getItem('wordsmart_user_xp');
                return saved ? parseInt(saved, 10) : 0;
            });

            // Track which word IDs have ever given mastery XP (to prevent double-award)
            const [familiarXpGiven, setFamiliarXpGiven] = useState(() => {
                const saved = localStorage.getItem('wordsmart_familiar_xp_given') || localStorage.getItem('wordsmart_mastery_xp_given');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('wordsmart_familiar_xp_given', JSON.stringify(familiarXpGiven));
            }, [familiarXpGiven]);

            const [voicePrefs, setVoicePrefsState] = useState(() => SpeechEngine.loadVoicePrefs());
            const [voiceListTick, setVoiceListTick] = useState(0);

            useEffect(() => {
                const onVoices = () => {
                    SpeechEngine.refreshVoices();
                    setVoiceListTick(t => t + 1);
                };
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.addEventListener('voiceschanged', onVoices);
                    onVoices();
                }
                return () => {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.removeEventListener('voiceschanged', onVoices);
                    }
                };
            }, []);

            const updateVoicePrefs = (partial) => {
                SpeechEngine.setVoicePrefs(partial);
                setVoicePrefsState(SpeechEngine.getVoicePrefs());
            };

            const usVoiceOptions = useMemo(() => SpeechEngine.voicesForLang('en-US'), [voiceListTick]);
            const ukVoiceOptions = useMemo(() => SpeechEngine.voicesForLang('en-GB'), [voiceListTick]);

            // TAB & NAVIGATION STATE
            const [activeTab, setActiveTab] = useState('list');
            const [searchQuery, setSearchQuery] = useState('');
            const [filterFamiliarity, setFilterFamiliarity] = useState('all');
            const [selectedLetter, setSelectedLetter] = useState('ALL');

            // MEMORIZATION CHUNKS SYSTEM (25 words per chunk)
            const [selectedChunk, setSelectedChunk] = useState('ALL');
            const CHUNK_SIZE = 25;

            const normalizeText = (value) => {
                if (value == null) return '';
                return String(value).normalize('NFKD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
            };

            const resetListFilters = useCallback(() => {
                setSelectedChunk('ALL');
                setSelectedLetter('ALL');
                setCardIndex(0);
            }, []);

            const [importRefreshToken, setImportRefreshToken] = useState(0);
            const bumpImportRefresh = useCallback(() => {
                setImportRefreshToken(prev => prev + 1);
            }, []);

            const toSafeText = (value, fallback = '') => {
                const text = value == null ? '' : String(value).trim();
                return text || fallback;
            };

            const getWordInitial = (word) => {
                const text = toSafeText(word);
                if (!text) return '#';
                const first = text.charAt(0);
                return /[A-Za-z]/.test(first) ? first.toUpperCase() : '#';
            };

            // SHUFFLE / RANDOMIZATION STATE
            const [isShuffled, setIsShuffled] = useState(false);
            const [shuffleSeed, setShuffleSeed] = useState(0);

            // UI TOAST & MODALS
            const [toastMessage, setToastMessage] = useState(null);
            const [deleteTargetId, setDeleteTargetId] = useState(null);
            const [editingWord, setEditingWord] = useState(null);

            // PAGE / BOOK MANAGEMENT MODALS
            const [showAddPageModal, setShowAddPageModal] = useState(false);
            const [newPageName, setNewPageName] = useState('');
            const [newPageTarget, setNewPageTarget] = useState(500);
            const [editingPageObj, setEditingPageObj] = useState(null);
            const [showGeminiPromptModal, setShowGeminiPromptModal] = useState(false);
            const DEFAULT_PROMPT_TEMPLATE = `Please extract the vocabulary words from the attached document and provide a JSON array formatted exactly like this:

[
  {
    "word": "Word",
    "phonetics": "Pronunciation",
    "meaning": "Main English meaning from book",
    "bangla": "বাংলা অর্থ",
    "sentence": "Example sentence from book",
    "variantMeaning": "Alternative/simplified English meaning",
    "variantBangla": "বিকল্প সহজ বাংলা অর্থ",
    "variantSentence": "Alternative simple example sentence"
  }
]

Make sure every object includes both standard fields and variant fields.`;
            const [promptTemplate, setPromptTemplate] = useState(() => localStorage.getItem('wordsmart_prompt_template') || DEFAULT_PROMPT_TEMPLATE);
            const [isEditingPrompt, setIsEditingPrompt] = useState(false);
            useEffect(() => { localStorage.setItem('wordsmart_prompt_template', promptTemplate); }, [promptTemplate]);

            // ADD NEW WORD MODAL STATE
            const [showAddWordModal, setShowAddWordModal] = useState(false);
            const [newWordData, setNewWordData] = useState({
                word: '',
                phonetics: '',
                meaning: '',
                bangla: '',
                sentence: '',
                variantMeaning: '',
                variantBangla: '',
                variantSentence: ''
            });

            // FLASHCARD STATE
            const [cardIndex, setCardIndex] = useState(0);
            const [isFlipped, setIsFlipped] = useState(false);
            const [autoAudio, setAutoAudio] = useState(true);
            const [selectedAccent, setSelectedAccent] = useState('us');
            const flashDragRef = useRef({ active: false, startX: 0, dx: 0, swiped: false });

            // QUIZ STATE
            const [quizScore, setQuizScore] = useState(0);
            const [quizQuestionIndex, setQuizQuestionIndex] = useState(0);
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [userQuizAnswer, setUserQuizAnswer] = useState(null);
            const [quizSubmitted, setQuizSubmitted] = useState(false);
            const [showQuizSentence, setShowQuizSentence] = useState(() => {
                try {
                    const saved = localStorage.getItem('wordsmart_quiz_show_sentence');
                    return saved === null ? true : saved === 'true';
                } catch (e) { return true; }
            });
            useEffect(() => {
                localStorage.setItem('wordsmart_quiz_show_sentence', String(showQuizSentence));
            }, [showQuizSentence]);

            // IMPORT TEXT STATE
            const [importText, setImportText] = useState('');
            const importBackupInputRef = useRef(null);
            const importJsonInputRef = useRef(null);

            const importPayloadIntoActiveBook = (payload, options = {}) => {
                const { source = 'JSON' } = options;

                if (Array.isArray(payload)) {
                    let updatedCount = 0;
                    let addedCount = 0;

                    setAllWords(prev => {
                        const bookId = activeBook.id;
                        const existingWords = prev[bookId] || [];
                        const map = new Map(existingWords.map(item => [normalizeText(item.word), { ...item }]));

                        payload.forEach((item, idx) => {
                            const wordKey = normalizeText(item?.word);
                            if (!wordKey) return;

                            const variantM = toSafeText(item?.variantMeaning || item?.streamMeaning || "");
                            const variantB = toSafeText(item?.variantBangla || item?.streamBangla || "");
                            const variantS = toSafeText(item?.variantSentence || item?.streamSentence || "");

                            if (map.has(wordKey)) {
                                const existing = map.get(wordKey);
                                map.set(wordKey, {
                                    ...existing,
                                    word: toSafeText(item?.word || existing.word),
                                    meaning: toSafeText(item?.meaning || existing.meaning),
                                    bangla: toSafeText(item?.bangla || existing.bangla),
                                    sentence: toSafeText(item?.sentence || existing.sentence),
                                    phonetics: toSafeText(item?.phonetics || existing.phonetics),
                                    variantMeaning: variantM || existing.variantMeaning || "",
                                    variantBangla: variantB || existing.variantBangla || "",
                                    variantSentence: variantS || existing.variantSentence || ""
                                });
                                updatedCount++;
                            } else {
                                const newObj = {
                                    id: Date.now() * 10000 + idx,
                                    word: toSafeText(item?.word || `Word ${idx + 1}`),
                                    phonetics: toSafeText(item?.phonetics || ""),
                                    meaning: toSafeText(item?.meaning || ""),
                                    bangla: toSafeText(item?.bangla || ""),
                                    sentence: toSafeText(item?.sentence || ""),
                                    variantMeaning: variantM,
                                    variantBangla: variantB,
                                    variantSentence: variantS
                                };
                                map.set(wordKey, newObj);
                                addedCount++;
                            }
                        });

                        return { ...prev, [bookId]: Array.from(map.values()) };
                    });

                    addXP((addedCount * 10) + (updatedCount * 5));
                    bumpImportRefresh();
                    resetListFilters();
                    triggerToast(`${source} import successful! ${addedCount} added, ${updatedCount} updated.`);
                    return { addedCount, updatedCount };
                }

                if (payload && typeof payload === 'object') {
                    const looksLikeBackup = payload.books || payload.allWords || payload.allFamiliarity || payload.allMastered || payload.allTrash || typeof payload.userXP === 'number';

                    if (looksLikeBackup) {
                        const importedBooks = Array.isArray(payload.books) ? payload.books : books;
                        const importedWords = payload.allWords && typeof payload.allWords === 'object' ? payload.allWords : allWords;
                        let importedFamiliarity = payload.allFamiliarity && typeof payload.allFamiliarity === 'object'
                            ? payload.allFamiliarity
                            : allFamiliarity;
                        if (!payload.allFamiliarity && payload.allMastered && typeof payload.allMastered === 'object') {
                            importedFamiliarity = migrateMasteredToFamiliarity(payload.allMastered);
                        }
                        const importedTrash = payload.allTrash && typeof payload.allTrash === 'object' ? payload.allTrash : allTrash;
                        const importedXP = typeof payload.userXP === 'number' ? payload.userXP : userXP;

                        setBooks(importedBooks);
                        setAllWords(importedWords);
                        setAllFamiliarity(importedFamiliarity);
                        setAllTrash(importedTrash);
                        setUserXP(importedXP);

                        const fallbackBookId = importedBooks.find(b => b?.id)?.id || selectedBookId;
                        setSelectedBookId(fallbackBookId);
                        bumpImportRefresh();
                        resetListFilters();
                        setActiveTab('list');
                        triggerToast('Backup restored successfully.');
                        return { restored: true };
                    }

                    if (Array.isArray(payload.words)) {
                        return importPayloadIntoActiveBook(payload.words, { source });
                    }
                }

                throw new Error('Unsupported import payload.');
            };

            // PERSISTENCE EFFECT HOOKS
            useEffect(() => {
                localStorage.setItem('wordsmart_custom_books_list', JSON.stringify(books));
            }, [books]);

            useEffect(() => {
                localStorage.setItem('wordsmart_active_book_id', selectedBookId);
            }, [selectedBookId]);

            useEffect(() => {
                localStorage.setItem('wordsmart_all_words_map', JSON.stringify(allWords));
            }, [allWords]);

            useEffect(() => {
                localStorage.setItem('wordsmart_all_familiarity_map', JSON.stringify(allFamiliarity));
            }, [allFamiliarity]);

            useEffect(() => {
                localStorage.setItem('wordsmart_all_trash_map', JSON.stringify(allTrash));
            }, [allTrash]);

            useEffect(() => {
                localStorage.setItem('wordsmart_show_bangla', JSON.stringify(showBangla));
            }, [showBangla]);
            useEffect(() => { localStorage.setItem('wordsmart_app_theme', appTheme); }, [appTheme]);
            // Drive the global theme CSS variables from a single attribute on <html> so
            // normal screens, settings, and the Focus Mode overlay always match exactly.
            useEffect(() => { document.documentElement.setAttribute('data-theme', appTheme); }, [appTheme]);

            useEffect(() => {
                localStorage.setItem('wordsmart_variant_mode', JSON.stringify(isVariantMode));
            }, [isVariantMode]);

            useEffect(() => {
                localStorage.setItem('wordsmart_user_xp', userXP.toString());
            }, [userXP]);


            // Helper Toast Trigger
            const triggerToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => {
                    setToastMessage(null);
                }, 3200);
            };

            const addXP = (amount) => {
                setUserXP(prev => prev + amount);
            };

            // ACTIVE BOOK COMPUTATION
            const activeBook = useMemo(() => {
                return books.find(b => b.id === selectedBookId) || books[0] || { id: 'ws1', name: 'Vocabulation', targetCount: 500 };
            }, [books, selectedBookId]);

            // CURRENT BOOK'S DATA ACCESSORS WITH DUAL MODE SWITCHING (STANDARD <-> VARIANT)
            const rawCurrentWords = allWords[activeBook.id] || [];

            const currentWords = useMemo(() => {
                if (!isVariantMode) return rawCurrentWords;
                return rawCurrentWords.map(w => ({
                    ...w,
                    meaning: w.variantMeaning && w.variantMeaning.trim() !== '' ? w.variantMeaning : w.meaning,
                    bangla: w.variantBangla && w.variantBangla.trim() !== '' ? w.variantBangla : w.bangla,
                    sentence: w.variantSentence && w.variantSentence.trim() !== '' ? w.variantSentence : w.sentence
                }));
            }, [rawCurrentWords, isVariantMode]);

            const currentFamiliarityMap = allFamiliarity[activeBook.id] || {};
            const currentTrash = allTrash[activeBook.id] || [];

            const familiarityCounts = useMemo(() => {
                let unfamiliar = 0;
                let semi = 0;
                let familiar = 0;
                currentWords.forEach(w => {
                    const level = getWordFamiliarityLevel(currentFamiliarityMap, w.id);
                    if (level === 'familiar') familiar++;
                    else if (level === 'semi') semi++;
                    else unfamiliar++;
                });
                return { unfamiliar, semi, familiar };
            }, [currentWords, currentFamiliarityMap]);

            const getFamiliarity = (wordId) => getWordFamiliarityLevel(currentFamiliarityMap, wordId);

            const setCurrentWords = (updater) => {
                setAllWords(prev => {
                    const current = prev[activeBook.id] || [];
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            const setCurrentFamiliarityMap = (updater) => {
                setAllFamiliarity(prev => {
                    const current = prev[activeBook.id] || {};
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            const setCurrentTrash = (updater) => {
                setAllTrash(prev => {
                    const current = prev[activeBook.id] || [];
                    const updated = typeof updater === 'function' ? updater(current) : updater;
                    return { ...prev, [activeBook.id]: updated };
                });
            };

            // ADD NEW PAGE / BOOK HANDLER
            const handleAddPage = (e) => {
                e.preventDefault();
                if (!newPageName.trim()) return;
                const newId = 'page_' + Date.now();
                const newBook = {
                    id: newId,
                    name: newPageName.trim(),
                    targetCount: parseInt(newPageTarget) || 500
                };

                setBooks(prev => [...prev, newBook]);
                setAllWords(prev => ({ ...prev, [newId]: [] }));
                setAllFamiliarity(prev => ({ ...prev, [newId]: {} }));
                setAllTrash(prev => ({ ...prev, [newId]: [] }));

                setSelectedBookId(newId);
                setShowAddPageModal(false);
                setNewPageName('');
                setNewPageTarget(500);
                triggerToast(`Created new page "${newBook.name}"!`);
            };

            // EDIT PAGE NAME & TARGET HANDLER
            const handleSavePageEdit = (e) => {
                e.preventDefault();
                if (!editingPageObj || !editingPageObj.name.trim()) return;
                setBooks(prev => prev.map(b => b.id === editingPageObj.id ? {
                    ...b,
                    name: editingPageObj.name.trim(),
                    targetCount: parseInt(editingPageObj.targetCount) || 500
                } : b));
                triggerToast(`Updated page details to "${editingPageObj.name}"!`);
                setEditingPageObj(null);
            };

            // DELETE PAGE HANDLER
            const handleDeletePage = (pageId) => {
                if (books.length <= 1) {
                    triggerToast("You must keep at least one vocabulary page!");
                    return;
                }
                const target = books.find(b => b.id === pageId);
                setBooks(prev => prev.filter(b => b.id !== pageId));
                if (selectedBookId === pageId) {
                    const remaining = books.filter(b => b.id !== pageId);
                    setSelectedBookId(remaining[0].id);
                }
                triggerToast(`Deleted page "${target?.name || 'Page'}".`);
            };

            // ADD NEW WORD HANDLER
            const handleAddWord = (e) => {
                e.preventDefault();
                if (!newWordData.word.trim() || !newWordData.meaning.trim()) {
                    triggerToast("Word and Main English Meaning are required!");
                    return;
                }
                const created = {
                    id: Date.now(),
                    word: newWordData.word.trim(),
                    phonetics: newWordData.phonetics.trim(),
                    meaning: newWordData.meaning.trim(),
                    bangla: newWordData.bangla.trim(),
                    sentence: newWordData.sentence.trim(),
                    variantMeaning: newWordData.variantMeaning.trim(),
                    variantBangla: newWordData.variantBangla.trim(),
                    variantSentence: newWordData.variantSentence.trim()
                };
                setCurrentWords(prev => [created, ...prev]);
                setShowAddWordModal(false);
                setNewWordData({ word: '', phonetics: '', meaning: '', bangla: '', sentence: '', variantMeaning: '', variantBangla: '', variantSentence: '' });
                addXP(10);
                triggerToast(`Added "${created.word}" (+10 XP)!`);
            };

            const setWordFamiliarity = (id, level) => {
                setCurrentFamiliarityMap(prev => {
                    const next = { ...prev };
                    if (level === 'unfamiliar') {
                        delete next[id];
                    } else {
                        next[id] = level;
                    }
                    return next;
                });
                if (level === 'familiar' && !familiarXpGiven.includes(id)) {
                    addXP(20);
                    setFamiliarXpGiven(prev2 => [...prev2, id]);
                }
            };

            // Soft-delete word (Move to Trash)
            const handleSoftDelete = (id) => {
                const target = rawCurrentWords.find(w => w.id === id);
                if (target) {
                    setCurrentWords(prev => prev.filter(w => w.id !== id));
                    setCurrentTrash(prev => [target, ...prev]);
                    setCurrentFamiliarityMap(prev => {
                        const next = { ...prev };
                        delete next[id];
                        return next;
                    });
                    triggerToast(`Moved "${target.word}" to Trash Bin.`);
                }
                setDeleteTargetId(null);
            };

            // Save word edit changes
            const handleSaveEdit = (updatedWord) => {
                setCurrentWords(prev => prev.map(w => w.id === updatedWord.id ? updatedWord : w));
                setEditingWord(null);
                triggerToast(`Successfully updated "${updatedWord.word}"!`);
            };

            // Restore word from Trash
            const restoreFromTrash = (id) => {
                const target = currentTrash.find(w => w.id === id);
                if (target) {
                    setCurrentTrash(prev => prev.filter(w => w.id !== id));
                    setCurrentWords(prev => [...prev, target]);
                    triggerToast(`Restored "${target.word}" to active list!`);
                }
            };

            // Permanently delete single word from Trash
            const purgeFromTrash = (id) => {
                const target = currentTrash.find(w => w.id === id);
                setCurrentTrash(prev => prev.filter(w => w.id !== id));
                triggerToast(`Permanently removed "${target ? target.word : 'Word'}".`);
            };

            // Restore All Trash
            const restoreAllTrash = () => {
                if (currentTrash.length === 0) return;
                setCurrentWords(prev => [...prev, ...currentTrash]);
                setCurrentTrash([]);
                triggerToast("Restored all deleted words back to list!");
            };

            // Chunks calculation
            const chunksList = useMemo(() => {
                const total = currentWords.length;
                if (total === 0) return [];
                const count = Math.ceil(total / CHUNK_SIZE);
                return Array.from({ length: count }, (_, i) => {
                    const start = i * CHUNK_SIZE;
                    const end = Math.min(start + CHUNK_SIZE, total);
                    return {
                        index: i,
                        label: `Chunk ${i + 1} (${start + 1}–${end})`
                    };
                });
            }, [currentWords.length]);

            // Alphabet list generator
            const alphabet = useMemo(() => {
                const letters = new Set(
                    currentWords
                        .map(w => getWordInitial(w?.word))
                        .filter(letter => letter !== '#')
                );
                return ['ALL', ...Array.from(letters).sort()];
            }, [currentWords]);

            // Filtered Words calculation
            const filteredWords = useMemo(() => {
                let list = [...currentWords];

                const parsedChunk = Number(selectedChunk);
                if (selectedChunk !== 'ALL' && Number.isInteger(parsedChunk) && parsedChunk >= 0) {
                    const start = parsedChunk * CHUNK_SIZE;
                    const end = start + CHUNK_SIZE;
                    list = list.slice(start, end);
                }

                if (searchQuery) {
                    const q = normalizeText(searchQuery);
                    list = list.filter(w => {
                        const searchable = [
                            w?.word,
                            w?.meaning,
                            w?.bangla,
                            w?.variantMeaning,
                            w?.variantBangla
                        ].filter(Boolean).join(' ');
                        return normalizeText(searchable).includes(q);
                    });
                }

                if (filterFamiliarity !== 'all') {
                    list = list.filter(w => getWordFamiliarityLevel(currentFamiliarityMap, w.id) === filterFamiliarity);
                }

                if (selectedLetter !== 'ALL') {
                    list = list.filter(w => getWordInitial(w?.word) === selectedLetter);
                }

                if (isShuffled) {
                    list = [...list].sort(() => 0.5 - Math.random());
                }

                return list;
            }, [currentWords, selectedChunk, searchQuery, filterFamiliarity, selectedLetter, currentFamiliarityMap, showBangla, isShuffled, shuffleSeed]);

            useEffect(() => {
                if (selectedChunk !== 'ALL' && Number.isInteger(Number(selectedChunk)) && Number(selectedChunk) >= chunksList.length) {
                    setSelectedChunk('ALL');
                }
            }, [chunksList.length, selectedChunk]);

            useEffect(() => {
                if (selectedLetter !== 'ALL' && !alphabet.includes(selectedLetter)) {
                    setSelectedLetter('ALL');
                }
            }, [alphabet, selectedLetter]);

            useEffect(() => {
                resetListFilters();
            }, [activeBook.id, importRefreshToken, resetListFilters]);

            // Start quiz
            const startQuiz = () => {
                const pool = filteredWords.length >= 4 ? filteredWords : currentWords;
                if (pool.length < 4) {
                    triggerToast("Please ensure you have at least 4 words in the selected list to generate a quiz!");
                    return;
                }

                const shuffled = [...pool].sort(() => 0.5 - Math.random());
                const questionCount = Math.min(10, pool.length);
                const questions = shuffled.slice(0, questionCount).map((target) => {
                    const distractors = currentWords.filter(w => w.id !== target.id)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 3);
                    const options = [...distractors, target].sort(() => 0.5 - Math.random());
                    return { target, options };
                });

                setQuizQuestions(questions);
                setQuizQuestionIndex(0);
                setQuizScore(0);
                setUserQuizAnswer(null);
                setQuizSubmitted(false);
            };

            useEffect(() => {
                if (activeTab === 'quiz') startQuiz();
            }, [activeTab, selectedChunk, selectedBookId, isVariantMode, filterFamiliarity]);

            useEffect(() => {
                if (cardIndex >= filteredWords.length) setCardIndex(0);
            }, [filteredWords.length]);

            useEffect(() => {
                setSelectedChunk('ALL');
                setSelectedLetter('ALL');
            }, [selectedBookId]);

            useEffect(() => {
                if (activeTab === 'flashcards' && filteredWords[cardIndex] && autoAudio) {
                    speakWord(filteredWords[cardIndex].word, selectedAccent, triggerToast);
                }
                setIsFlipped(false);
            }, [cardIndex, activeTab, selectedChunk, selectedBookId, isVariantMode]);

            // Unified Bulk JSON Import supporting BOTH standard + variant fields seamlessly
            const handleBulkImport = () => {
                try {
                    const parsed = JSON.parse(importText);
                    importPayloadIntoActiveBook(parsed, { source: 'JSON' });
                    setImportText('');
                } catch (e) {
                    triggerToast("JSON syntax error! Please check formatting.");
                }
            };

            const handleImportBackupFile = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        importPayloadIntoActiveBook(parsed, { source: 'Backup file' });
                    } catch (err) {
                        triggerToast("The selected file is not a valid backup JSON file.");
                    } finally {
                        event.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            const handleImportJsonFile = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        importPayloadIntoActiveBook(parsed, { source: 'JSON file' });
                    } catch (err) {
                        triggerToast("The selected file is not valid JSON word data.");
                    } finally {
                        event.target.value = '';
                    }
                };
                reader.readAsText(file);
            };

            // Export Backup
            const handleExportBackup = () => {
                const backupObj = {
                    books,
                    allWords,
                    allFamiliarity,
                    allMastered: migrateMasteredToFamiliarity(
                        Object.fromEntries(
                            Object.entries(allFamiliarity).map(([bookId, map]) => [
                                bookId,
                                Object.entries(map || {})
                                    .filter(([, v]) => v === 'familiar')
                                    .map(([id]) => Number(id))
                            ])
                        )
                    ),
                    allTrash,
                    userXP,
                    exportDate: new Date().toISOString()
                };
                const jsonStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", jsonStr);
                downloadAnchor.setAttribute("download", `Vocabulation_Backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                triggerToast("Backup exported successfully!");
            };

            // Calculate Level from XP
            const userLevel = Math.floor(userXP / 100) + 1;

            return (
                <div className="min-h-screen">
                    <div className="max-w-6xl mx-auto px-4 py-6 relative">
                    {}
                    {toastMessage && (
                        <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl border border-slate-700 text-sm font-medium flex items-center gap-2 animate-bounce">
                            <span>💡</span>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* MODAL: GEMINI PROMPT TEMPLATE GUIDE */}
                    {showGeminiPromptModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>📋</span> Prompt Template (PDF to Vocab JSON)
                                </h3>
                                <p className="text-xs text-slate-600">
                                    Copy and paste this prompt to your AI tool along with your book PDF. It will output the exact combined JSON format you can paste straight into Vocabulation Companion! You can edit this prompt anytime.
                                </p>
                                {isEditingPrompt ? (
                                    <textarea
                                        value={promptTemplate}
                                        onChange={(e) => setPromptTemplate(e.target.value)}
                                        className="w-full bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-xl border border-slate-800 h-60"
                                    />
                                ) : (
                                    <div className="bg-slate-900 text-emerald-400 font-mono text-xs p-4 rounded-xl border border-slate-800 relative group overflow-x-auto max-h-60">
                                        <pre className="whitespace-pre-wrap">{promptTemplate}</pre>
                                    </div>
                                )}
                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                const el = document.createElement('textarea');
                                                el.value = promptTemplate;
                                                document.body.appendChild(el);
                                                el.select();
                                                document.execCommand('copy');
                                                document.body.removeChild(el);
                                                triggerToast("Prompt copied to clipboard!");
                                            }}
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl flex items-center gap-1.5"
                                        >
                                            <span>📋 Copy Prompt</span>
                                        </button>
                                        <button
                                            onClick={() => setIsEditingPrompt(v => !v)}
                                            className="px-4 py-2 bg-amber-100 hover:bg-amber-200 text-amber-800 text-xs font-bold rounded-xl flex items-center gap-1.5"
                                        >
                                            {isEditingPrompt ? '✓ Save' : '✏️ Edit'}
                                        </button>
                                        {promptTemplate !== DEFAULT_PROMPT_TEMPLATE && (
                                            <button
                                                onClick={() => setPromptTemplate(DEFAULT_PROMPT_TEMPLATE)}
                                                className="px-3 py-2 text-slate-500 hover:text-slate-700 text-xs font-semibold rounded-xl"
                                            >
                                                Reset
                                            </button>
                                        )}
                                    </div>
                                    <button
                                        onClick={() => setShowGeminiPromptModal(false)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: ADD NEW PAGE / BOOK */}
                    {showAddPageModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleAddPage} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>📄</span> Add New Vocabulary Page
                                </h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Page / Book Title</label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="e.g., GRE Verbal, WordSmart III, TOEFL..."
                                        value={newPageName}
                                        onChange={(e) => setNewPageName(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Target Word Count (Capacity Goal)</label>
                                    <input
                                        type="number"
                                        min="10"
                                        max="5000"
                                        value={newPageTarget}
                                        onChange={(e) => setNewPageTarget(e.target.value)}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div className="flex justify-end gap-2 pt-2 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => setShowAddPageModal(false)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                    >
                                        Create Page
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL: EDIT PAGE DETAILS */}
                    {editingPageObj && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form onSubmit={handleSavePageEdit} className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>✏️</span> Edit Page Details
                                </h3>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Page / Book Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={editingPageObj.name}
                                        onChange={(e) => setEditingPageObj({ ...editingPageObj, name: e.target.value })}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm font-bold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-700 mb-1">Target Word Count Goal</label>
                                    <input
                                        type="number"
                                        min="10"
                                        max="5000"
                                        value={editingPageObj.targetCount}
                                        onChange={(e) => setEditingPageObj({ ...editingPageObj, targetCount: e.target.value })}
                                        className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                    />
                                </div>
                                <div className="flex justify-between items-center pt-2 border-t border-slate-100">
                                    {books.length > 1 ? (
                                        <button
                                            type="button"
                                            onClick={() => {
                                                handleDeletePage(editingPageObj.id);
                                                setEditingPageObj(null);
                                            }}
                                            className="text-xs text-red-600 hover:underline font-semibold"
                                        >
                                            Delete Page
                                        </button>
                                    ) : <div></div>}
                                    <div className="flex gap-2">
                                        <button
                                            type="button"
                                            onClick={() => setEditingPageObj(null)}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                        >
                                            Save Changes
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MODAL: ADD NEW WORD */}
                    {showAddWordModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form 
                                onSubmit={handleAddWord}
                                className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto"
                            >
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>➕</span> Add New Word to "{activeBook.name}"
                                </h3>
                                <div className="space-y-3 text-sm">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Word *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="e.g. Ephemeral"
                                            value={newWordData.word}
                                            onChange={(e) => setNewWordData({ ...newWordData, word: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phonetics / Pronunciation</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. ih-FEM-er-ul"
                                            value={newWordData.phonetics}
                                            onChange={(e) => setNewWordData({ ...newWordData, phonetics: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-mono text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">English Meaning (Standard) *</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="e.g. lasting a very short time"
                                            value={newWordData.meaning}
                                            onChange={(e) => setNewWordData({ ...newWordData, meaning: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Bangla Meaning (বাংলা অর্থ)</label>
                                        <input
                                            type="text"
                                            placeholder="e.g. ক্ষণস্থায়ী"
                                            value={newWordData.bangla}
                                            onChange={(e) => setNewWordData({ ...newWordData, bangla: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Example Sentence</label>
                                        <textarea
                                            rows="2"
                                            placeholder="e.g. Fame in the world of pop music is often ephemeral."
                                            value={newWordData.sentence}
                                            onChange={(e) => setNewWordData({ ...newWordData, sentence: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>

                                    {/* VARIANT MODE EXTRA FIELDS */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider block mb-2">✨ Variant Version Details (Optional):</span>
                                        <div className="space-y-2">
                                            <input
                                                type="text"
                                                placeholder="Variant English Meaning"
                                                value={newWordData.variantMeaning}
                                                onChange={(e) => setNewWordData({ ...newWordData, variantMeaning: e.target.value })}
                                                className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                            />
                                            <input
                                                type="text"
                                                placeholder="Variant Bangla Meaning"
                                                value={newWordData.variantBangla}
                                                onChange={(e) => setNewWordData({ ...newWordData, variantBangla: e.target.value })}
                                                className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                            />
                                            <input
                                                type="text"
                                                placeholder="Variant Example Sentence"
                                                value={newWordData.variantSentence}
                                                onChange={(e) => setNewWordData({ ...newWordData, variantSentence: e.target.value })}
                                                className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                            />
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 pt-2 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => setShowAddWordModal(false)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                    >
                                        Add Word
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* SOFT DELETE MODAL */}
                    {deleteTargetId && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-4">
                                <h3 className="text-lg font-bold text-slate-900">Move Word to Trash?</h3>
                                <p className="text-sm text-slate-600">
                                    Are you sure you want to delete <span className="font-bold text-slate-800">"{rawCurrentWords.find(w => w.id === deleteTargetId)?.word}"</span>?
                                </p>
                                <div className="flex justify-end gap-3 pt-2">
                                    <button
                                        onClick={() => setDeleteTargetId(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => handleSoftDelete(deleteTargetId)}
                                        className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-xl"
                                    >
                                        Move to Trash
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* EDIT WORD MODAL */}
                    {editingWord && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <form 
                                onSubmit={(e) => {
                                    e.preventDefault();
                                    handleSaveEdit(editingWord);
                                }}
                                className="bg-white rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto"
                            >
                                <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                                    <span>✏️</span> Edit Word Details
                                </h3>
                                <div className="space-y-3 text-sm">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Word</label>
                                        <input
                                            type="text"
                                            required
                                            value={editingWord.word}
                                            onChange={(e) => setEditingWord({ ...editingWord, word: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-bold"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Phonetics / Pronunciation</label>
                                        <input
                                            type="text"
                                            value={editingWord.phonetics || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, phonetics: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 font-mono text-xs"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Standard English Meaning</label>
                                        <input
                                            type="text"
                                            required
                                            value={editingWord.meaning || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, meaning: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Standard Bangla Meaning</label>
                                        <input
                                            type="text"
                                            value={editingWord.bangla || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, bangla: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-700 mb-1">Standard Example Sentence</label>
                                        <textarea
                                            rows="2"
                                            value={editingWord.sentence || ''}
                                            onChange={(e) => setEditingWord({ ...editingWord, sentence: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-900 text-xs"
                                        ></textarea>
                                    </div>

                                    {/* EDIT VARIANT MODE FIELDS */}
                                    <div className="pt-2 border-t border-slate-200">
                                        <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider block mb-2">✨ Variant Mode Alternative Fields:</span>
                                        <div className="space-y-2">
                                            <div>
                                                <label className="block text-[11px] font-semibold text-slate-600">Variant Meaning</label>
                                                <input
                                                    type="text"
                                                    value={editingWord.variantMeaning || ''}
                                                    onChange={(e) => setEditingWord({ ...editingWord, variantMeaning: e.target.value })}
                                                    className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-slate-600">Variant Bangla</label>
                                                <input
                                                    type="text"
                                                    value={editingWord.variantBangla || ''}
                                                    onChange={(e) => setEditingWord({ ...editingWord, variantBangla: e.target.value })}
                                                    className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-semibold text-slate-600">Variant Sentence</label>
                                                <input
                                                    type="text"
                                                    value={editingWord.variantSentence || ''}
                                                    onChange={(e) => setEditingWord({ ...editingWord, variantSentence: e.target.value })}
                                                    className="w-full px-3 py-1.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div className="flex justify-end gap-3 pt-2 border-t border-slate-100">
                                    <button
                                        type="button"
                                        onClick={() => setEditingWord(null)}
                                        className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-sm"
                                    >
                                        Save Changes
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* APP HEADER */}
                    <header className="bg-gradient-to-r from-indigo-900 via-blue-900 to-slate-900 rounded-2xl p-6 text-white shadow-xl mb-6">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                {/* PAGE / BOOK SWITCHER */}
                                <div className="flex flex-wrap items-center gap-2 mb-3">
                                    <div className="bg-white/10 p-1 rounded-xl border border-white/20 flex flex-wrap gap-1 items-center">
                                        {books.map(b => (
                                            <button
                                                key={b.id}
                                                onClick={() => { setSelectedBookId(b.id); setSelectedChunk('ALL'); }}
                                                className={`px-3 py-1 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                                                    selectedBookId === b.id
                                                        ? 'keep-white bg-white text-indigo-900 shadow-sm'
                                                        : 'text-indigo-200 hover:text-white'
                                                }`}
                                            >
                                                <span>📖 {b.name}</span>
                                                <span className="opacity-75 font-normal text-[10px]">({(allWords[b.id] || []).length}/{b.targetCount || 500})</span>
                                            </button>
                                        ))}

                                        {/* ADD PAGE BUTTON */}
                                        <button
                                            onClick={() => setShowAddPageModal(true)}
                                            className="px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-500/30 hover:bg-emerald-500/50 text-emerald-100 border border-emerald-400/30 transition-all flex items-center gap-1"
                                            title="Add new custom page"
                                        >
                                            <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                            </svg>
                                        </button>
                                    </div>

                                    {/* RENAME ACTIVE PAGE */}
                                    <button
                                        onClick={() => setEditingPageObj({ ...activeBook })}
                                        className="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-indigo-100 border border-white/20 text-xs transition-all flex items-center gap-1"
                                        title="Rename active page"
                                    >
                                        <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487zm0 0L19.5 7.125" />
                                        </svg>
                                    </button>
                                </div>

                                {/* APP TITLE */}
                                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight flex items-center gap-2">
                                    <span>{activeBook.name} Companion</span>
                                </h1>
                                <p className="text-indigo-200 text-xs md:text-sm mt-1">
                                    Interactive Vocabulary Suite | 25-Word Chunks | Gamified XP & Level System
                                </p>
                            </div>

                            {/* MASTERY & LEVEL CONTROLS */}
                            <div className="flex flex-col sm:flex-row md:flex-col gap-3 w-full md:w-auto">
                                {/* XP LEVEL BADGE */}
                                <div className="bg-gradient-to-r from-amber-500/20 to-orange-500/20 border border-amber-400/30 rounded-xl p-2.5 flex items-center justify-between gap-3 backdrop-blur-md">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xl">🏆</span>
                                        <div>
                                            <div className="text-xs font-black text-amber-300">LEVEL {userLevel} LEARNER</div>
                                            <div className="text-[10px] text-amber-100/80">{userXP} Total XP Earned</div>
                                        </div>
                                    </div>
                                    <span className="text-xs font-bold bg-amber-400 text-slate-950 px-2 py-0.5 rounded-md">
                                        {userXP % 100}/100 XP
                                    </span>
                                </div>

                                <div className="bg-white/10 backdrop-blur-md rounded-xl p-3 border border-white/20 min-w-[240px]">
                                    <div className="flex justify-between text-xs font-semibold mb-1">
                                        <span>Familiarity</span>
                                        <span>{currentWords.length > 0 ? Math.round((familiarityCounts.familiar / currentWords.length) * 100) : 0}% familiar</span>
                                    </div>
                                    <div className="w-full bg-slate-950/40 rounded-full h-2.5 overflow-hidden flex border border-indigo-400/20">
                                        {currentWords.length > 0 ? (
                                            <>
                                                <div className="h-full bg-slate-400 transition-all duration-500" style={{ width: `${(familiarityCounts.unfamiliar / currentWords.length) * 100}%` }} title="Unfamiliar" />
                                                <div className="h-full bg-amber-400 transition-all duration-500" style={{ width: `${(familiarityCounts.semi / currentWords.length) * 100}%` }} title="Semi-familiar" />
                                                <div className="h-full bg-emerald-400 transition-all duration-500" style={{ width: `${(familiarityCounts.familiar / currentWords.length) * 100}%` }} title="Familiar" />
                                            </>
                                        ) : (
                                            <div className="h-full w-full bg-slate-600/50" />
                                        )}
                                    </div>
                                    <div className="flex justify-between text-[10px] text-indigo-200 mt-1 gap-1">
                                        <button type="button" title="Show unfamiliar" onClick={() => setFilterFamiliarity(filterFamiliarity === 'unfamiliar' ? 'all' : 'unfamiliar')} className={`hover:text-white transition-colors ${filterFamiliarity==='unfamiliar'?'text-white font-bold underline':''}`}>○ {familiarityCounts.unfamiliar}</button>
                                        <button type="button" title="Show semi-familiar" onClick={() => setFilterFamiliarity(filterFamiliarity === 'semi' ? 'all' : 'semi')} className={`hover:text-white transition-colors ${filterFamiliarity==='semi'?'text-amber-200 font-bold underline':''}`}>◐ {familiarityCounts.semi}</button>
                                        <button type="button" title="Show familiar" onClick={() => setFilterFamiliarity(filterFamiliarity === 'familiar' ? 'all' : 'familiar')} className={`hover:text-white transition-colors ${filterFamiliarity==='familiar'?'text-emerald-200 font-bold underline':''}`}>● {familiarityCounts.familiar}</button>
                                    </div>
                                </div>

                                {/* TOGGLE BUTTONS ROW: BANGLA & VARIANT MODE */}
                                <div className="flex items-center gap-2">
                                    {/* VARIANT MODE TOGGLE BUTTON */}
                                    <button
                                        onClick={() => {
                                            const next = !isVariantMode;
                                            setIsVariantMode(next);
                                            triggerToast(next ? "✨ Variant Mode ON (Alternative meanings active)" : "📖 Standard Mode ON (Main book meanings active)");
                                        }}
                                        className={`flex-1 flex items-center justify-between px-3 py-2 rounded-xl border text-xs font-bold transition-all ${
                                            isVariantMode
                                                ? 'bg-purple-500/40 text-purple-100 border-purple-400 hover:bg-purple-500/50 shadow-md ring-2 ring-purple-300/40'
                                                : 'bg-white/10 text-indigo-200 border-white/20 hover:bg-white/20'
                                        }`}
                                        title="Switch between Standard Book definitions and Variant definitions"
                                    >
                                        <span>Variant:</span>
                                        <span className={`ml-2 px-2 py-0.5 rounded-md text-[10px] font-extrabold ${isVariantMode ? 'bg-purple-300 text-purple-950' : 'bg-slate-700 text-slate-300'}`}>
                                            {isVariantMode ? 'ON' : 'OFF'}
                                        </span>
                                    </button>

                                    {/* BANGLA TOGGLE BUTTON */}
                                    <button
                                        onClick={() => setShowBangla(!showBangla)}
                                        className={`flex items-center justify-between px-3 py-2 rounded-xl border text-xs font-bold transition-all ${
                                            showBangla
                                                ? 'bg-emerald-500/30 text-emerald-100 border-emerald-400/40 hover:bg-emerald-500/40'
                                                : 'bg-white/10 text-indigo-200 border-white/20 hover:bg-white/20'
                                        }`}
                                    >
                                        <span>Bangla:</span>
                                        <span className={`ml-2 px-2 py-0.5 rounded-md text-[10px] font-extrabold ${showBangla ? 'bg-emerald-400 text-emerald-950' : 'bg-slate-700 text-slate-300'}`}>
                                            {showBangla ? 'ON' : 'OFF'}
                                        </span>
                                    </button>

                                    {/* QUICK THEME TOGGLE */}
                                    <button
                                        onClick={() => setAppTheme(appTheme === 'light' ? 'midnight' : 'light')}
                                        title="Toggle Light/Dark theme"
                                        className="flex items-center gap-1.5 px-3 py-2 rounded-xl border text-xs font-bold transition-all bg-white/10 text-indigo-200 border-white/20 hover:bg-white/20"
                                    >
                                        {appTheme === 'light' ? '☀️' : '🌙'}
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* NAVIGATION TABS */}
                        <div className="flex flex-wrap gap-2 mt-6 pt-4 border-t border-indigo-500/30">
                            {[
                                { id: 'list', label: '📖 Word List', desc: 'Browse & Study' },
                                { id: 'flashcards', label: '🎴 Flashcards', desc: 'Memorize & Flip' },
                                { id: 'quiz', label: '🧠 Practice Quiz', desc: 'Test Knowledge' },
                                { id: 'game', label: '🎮 Word Quest', desc: 'Canvas Arena & Bosses' },
                                { id: 'manage', label: '⚙️ Word Manager', desc: 'Pages & Import' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
